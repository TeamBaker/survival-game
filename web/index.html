  const was = setVoxel(i, j, lvl, m);
  const k = j * GEN_N + i;
  colDug[k] = 1;
  landTexel(k);
  landTex.needsUpdate = true;
  patchCollider(i, j);
  // A column's faces are drawn against its neighbours' tops, so an edit on a
  // chunk border changes what the chunk next door has to draw as well.
  for (let dj = -1; dj <= 1; dj++) {
    for (let di = -1; di <= 1; di++) {
      const ii = i + di, jj = j + dj;
      if (ii < 0 || jj < 0 || ii >= GEN_N || jj >= GEN_N) continue;
      dirtyChunks.add(chunkOf(ii, jj));
    }
  }
  return was;
}

function flushDirtyChunks() {
  if (!dirtyChunks.size) return;
  for (const c of dirtyChunks) { rebuildChunk(c); rebuildFilletChunk(c); }
  dirtyChunks.clear();
  blocksHudEl.textContent = worldBlocks.toLocaleString();
}

function shovelPickUp() {
  if (!shovel.on || !shovel.hit || shovel.held.length >= SHOVEL_CAP) return false;
  const { i, j, lvl } = shovel.hit;
  const m = voxelAt(i, j, lvl);
  if (m === AIR) return false;
  editBlock(i, j, lvl, AIR);
  shovel.held.push(m);            // out of the world and into your hands
  refreshShovelUI();
  return true;
}

function shovelPlace() {
  if (!shovel.on || !shovel.spot || shovel.held.length === 0) return false;
  const { i, j, lvl } = shovel.spot;
  // Re-check rather than trusting the aim from earlier in the frame. Popping a
  // block off the stack for a write that then gets rejected would destroy it.
  if (!inVoxelRange(i, j, lvl) || voxelAt(i, j, lvl) !== AIR || spotBlocked(i, j, lvl)) return false;
  editBlock(i, j, lvl, shovel.held.pop());
  refreshShovelUI();
  return true;
}

// ----- what it looks like -----
// A wire cage on the block you would take and a ghost cube in the cell you would
// fill. Without them the tool is unusable on a phone, where there is no mouse to
// hover with and the crosshair is a faint cross on a field of identical cubes.
const hlPick = new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(BLOCK * 1.05, BLOCK * 1.05, BLOCK * 1.05)),
  new THREE.LineBasicMaterial({ color: 0xfff0b4, transparent: true, opacity: 0.95, depthWrite: false })
);
const hlPlace = new THREE.Mesh(
  new THREE.BoxGeometry(BLOCK * 0.92, BLOCK * 0.92, BLOCK * 0.92),
  new THREE.MeshBasicMaterial({ color: 0x8fd8ff, transparent: true, opacity: 0.3, depthWrite: false })
);
hlPick.visible = hlPlace.visible = false;
hlPick.frustumCulled = hlPlace.frustumCulled = false;
scene.add(hlPick, hlPlace);

const cellCenter = (o, v) => v.set(colX(o.i), (o.lvl + 0.5) * BLOCK, colZ(o.j));

const shovelBtn  = document.getElementById('btn-shovel');
const pickBtn    = document.getElementById('btn-pick');
const placeBtn   = document.getElementById('btn-place');
const heldPanel  = document.getElementById('shovel-held');
const heldHudEl  = document.getElementById('held-hud');
const blocksHudEl = document.getElementById('blocks-hud');

function refreshShovelUI() {
  const n = shovel.held.length;
  const by = [0, 0, 0];
  for (const m of shovel.held) by[m]++;
  const parts = [];
  for (let m = 0; m < 3; m++) if (by[m]) parts.push(by[m] + ' ' + MAT_NAMES[m]);
  heldPanel.textContent = 'Blocks held: ' + n + (parts.length ? '  —  ' + parts.join(', ') : '');
  heldHudEl.textContent = String(n);
  shovelBtn.innerHTML = 'Shovel &mdash; ' + (shovel.on ? 'On' : 'Off');
  shovelBtn.classList.toggle('on', shovel.on);
}

// Called every frame while the shovel is out: the highlights follow the aim and
// the buttons grey out when the move they offer is not a legal one.
function updateShovel() {
  shovelAim();
  const canPick = !!shovel.hit && shovel.held.length < SHOVEL_CAP;
  const canPlace = !!shovel.spot && shovel.held.length > 0;
  hlPick.visible  = shovel.on && canPick;
  hlPlace.visible = shovel.on && canPlace;
  if (hlPick.visible)  cellCenter(shovel.hit, hlPick.position);
  if (hlPlace.visible) cellCenter(shovel.spot, hlPlace.position);
  pickBtn.classList.toggle('dim', !canPick);
  placeBtn.classList.toggle('dim', !canPlace);
}

function setShovel(on) {
  shovel.on = on;
  document.body.classList.toggle('shovel-on', on);
  if (!on) hlPick.visible = hlPlace.visible = false;
  refreshShovelUI();
  refreshModeUI();               // the crosshair and the help rows both change
}

bindTap(shovelBtn, () => setShovel(!shovel.on));
bindTap(pickBtn,   () => { if (shovel.on) shovelPickUp(); });
bindTap(placeBtn,  () => { if (shovel.on) shovelPlace(); });
refreshShovelUI();

// ---------------------------------------------------------------------------
// Resize
// ---------------------------------------------------------------------------
function resize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const aspect = w / Math.max(h, 1);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w, h, false);
  camera.aspect = aspect;
  // Original used a 90-degree vertical FOV at 16:9. Here the horizontal FOV is
  // pinned near 90 degrees and the vertical is derived, so portrait phones keep
  // a usable view instead of a keyhole.
  camera.fov = THREE.MathUtils.clamp(
    2 * Math.atan(Math.tan(45 * DEG) / aspect) / DEG, 55, 95
  );
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
resize();

// ---------------------------------------------------------------------------
// Main loop
// ---------------------------------------------------------------------------
const fpsEl = document.getElementById('fps');
const posEl = document.getElementById('pos');
// Solid blocks in the world, from the store rather than from what is drawn. It
// moves only when the shovel moves one, and always by exactly one: BLKS + HELD
// is the same number for the whole session.
blocksHudEl.textContent = worldBlocks.toLocaleString();
const clock = new THREE.Clock();
let frames = 0, fpsAccum = 0, fps = 0, hudAccum = 0;

const forward = new THREE.Vector3();
const right = new THREE.Vector3();
const move = new THREE.Vector3();
let elapsed = 0;

// The original flying camera, untouched apart from living in its own function.
function updateFreeCam(dt) {
  const sy = Math.sin(state.yaw), cy = Math.cos(state.yaw);
  forward.set(-sy, 0, -cy);   // camera looks down -Z at yaw 0
  right.set(cy, 0, -sy);

  move.set(0, 0, 0);
  if (keys.has('KeyW') || keys.has('ArrowUp'))    move.addScaledVector(forward, 1);
  if (keys.has('KeyS') || keys.has('ArrowDown'))  move.addScaledVector(forward, -1);
  if (keys.has('KeyD') || keys.has('ArrowRight')) move.addScaledVector(right, 1);
  if (keys.has('KeyA') || keys.has('ArrowLeft'))  move.addScaledVector(right, -1);
  if (keys.has('KeyE') || state.flyUp)   move.y += 1;
  if (keys.has('KeyQ') || state.flyDown) move.y -= 1;

  if (state.joyX || state.joyY) {
    move.addScaledVector(right, state.joyX);
    move.addScaledVector(forward, -state.joyY);   // finger up = forward
  }

  const len = move.length();
  if (len > 0) {
    const mag = Math.min(1, len);                 // analog on stick, full tilt on keys
    const step = MOVE_SPEED * (isSprinting() ? SPRINT_MULT : 1) * dt * mag / len;
    state.pos.addScaledVector(move, step);
  }
}

function tick() {
  const dt = Math.min(clock.getDelta(), 0.1);
  elapsed += dt;

  if (camMode === CAM.FREE) {
    updateFreeCam(dt);
    // Nobody is driving the character — park it so it does not creep away.
    playerBody.velocity.x = 0;
    playerBody.velocity.z = 0;
  } else {
    updatePlayer(dt);
  }

  // --- physics: fixed 60 Hz steps, sub-stepped to catch up with the frame ---
  world.step(PHYS_STEP, dt, 4);
  for (let i = 0; i < syncList.length; i++) {
    const s = syncList[i];
    s.mesh.position.copy(s.body.position);
    s.mesh.quaternion.copy(s.body.quaternion);
  }

  updateCamera(dt);
  // After the camera, since the aim is taken down the view direction, and before
  // the render so the highlight boxes are in the right place this frame.
  if (shovel.on) updateShovel();
  flushDirtyChunks();
  waterTime.value = elapsed;
  updateWaterVisuals();
  // After the water swap, which owns the fog when the camera is submerged — the
  // weather only repaints it while we are above the surface.
  updateWeather(dt);
  sky.position.copy(camera.position);
  // Slide the sea under the camera. The waves themselves are a function of world
  // position, so nothing moves with it — the tessellation just follows the eye,
  // and the horizon is always another 1180 units away.
  ocean.position.set(camera.position.x, 0, camera.position.z);
  sprintEl.classList.toggle('on', isSprinting() && camMode !== CAM.TOP);

  // --- HUD ---
  frames++;
  fpsAccum += dt;
  hudAccum += dt;
  if (fpsAccum >= 0.5) {
    fps = frames / fpsAccum;
    frames = 0;
    fpsAccum = 0;
  }
  if (hudAccum >= 0.1) {
    hudAccum = 0;
    fpsEl.textContent = fps.toFixed(0).padStart(3, ' ');
    const p = camMode === CAM.FREE
      ? state.pos
      : { x: playerBody.position.x, y: playerBody.position.y - centerOffset(), z: playerBody.position.z };
    posEl.textContent =
      p.x.toFixed(1).padStart(6, ' ') + ',' +
      p.y.toFixed(1).padStart(6, ' ') + ',' +
      p.z.toFixed(1).padStart(6, ' ');
    if (camMode === CAM.FREE) {
      wxCountEl.textContent = String(clouds.length);
      let nearest = null, nearestDist = Infinity;
      for (const c of clouds) {
        const d = c.mesh.position.distanceTo(p);
        if (d < nearestDist) { nearestDist = d; nearest = c; }
      }
      wxCloudInfoEl.textContent = nearest
        ? `nearest: storm ${nearest.scale.toFixed(1)} @ ${nearestDist.toFixed(0)}m`
        : 'nearest: —';
    }
  }

  // Depth prepass: render cloud silhouettes into the depth buffer first,
  // then the full scene with volumetric shading reads that depth to cull
  // interior faces that would otherwise bleed through.
  cloudGroup.visible = false;
  renderer.render(scene, camera);
  cloudGroup.visible = true;
  cloudDepthGroup.visible = false;
  renderer.render(scene, camera);
  cloudDepthGroup.visible = true;
}

// Debug handle — handy from the console / remote inspector on a phone.
window.hermes = {
  THREE, CANNON, scene, camera, renderer, state, keys, world, playerBody,
  CAM, setCamMode, cycleCamera, toggleGameMode, respawn,
  SEED, groundHeightAt, onLand,
  // The island: the block size everything is quantised to, the raw heightmap
  // behind it, and the meshes it was built into.
  BLOCK, islandHeight, terrain, SPAWN,
  stats: () => ({ worldBlocks, held: shovel.held.length, drawn: blockCount, instances: instanceCount }),
  // The fillet surface — the block outline with every corner rounded off over
  // the last half block into it. setTerrainView(0|1|2) picks smooth / cubes /
  // both, and FILLET_SUB is how many vertices a block gets across an arc.
  VIEW, setTerrainView, filletGroup, filletMat, rebuildFilletChunk, FILLET_SUB, FILLET_R,
  fillet: () => ({
    view: VIEW_NAMES[terrainView],
    chunks: filletMesh.reduce((n, m) => n + (m ? 1 : 0), 0),
    tris: filletTris.reduce((n, t) => n + t, 0),
  }),
  // The shovel. `shovel.held` is the stack of materials in your hands; moving a
  // block through it is the only way anything ever changes.
  shovel, setShovel, shovelPickUp, shovelPlace, rebuildChunk, chunkOf,
  // The voxel store — the material of every block in the volume, not just the
  // surface, which is what a digging system would work against. voxelAtWorld
  // takes metres; the rest take column indices and levels. SAND/DIRT/ROCK/AIR
  // are the material values. Editing through setVoxel changes what the world
  // *is* but not what is drawn: the meshes and the collider are baked.
  SAND, DIRT, ROCK, AIR, VOX_FLOOR, SOIL_DEPTH, voxCount,
  voxelAt, voxelAtWorld, voxelColumn, setVoxel, solidTopAt,
  colI, colJ, colX, colZ, lvlOfY,
  // The island is bare by design — these are how you put something on it from
  // the console, collider included.
  addBox, addSphere, mat, objects,
  // Weather: WX holds the live settings, spawnCloud(true) drops one in near you.
  WX, clouds, spawnCloud, clearClouds, refreshWxUI,
  weather: () => ({
    count: clouds.length,
    rate: WX.RATES[WX.rateIdx][0],
    speed: WX.SPEEDS[WX.speedIdx][0],
    gloom, rain: rainAmt,
    scales: clouds.map((c) => c.scale).sort((a, b) => a - b),
  }),
  // live read-outs of the controller internals (module-scoped `let`s)
  status: () => ({
    cam: CAM_NAMES[camMode],
    crouched,
    swimming,
    underwater,
    groundNy,
    eyeH,
    grounded: groundNy > GROUND_DOT,
    pos: playerBody.position.toArray(),
    vel: playerBody.velocity.toArray(),
  }),
};

renderer.setAnimationLoop(tick);
renderer.compile(scene, camera);
document.getElementById('loading').classList.add('hidden');
</script>

<script>
// Surface module-load failures (bad network / blocked CDN) instead of a black screen.
window.addEventListener('error', (e) => {
  const el = document.getElementById('loading');
  if (!el || el.classList.contains('hidden')) return;
  el.innerHTML = '<div id="err">Failed to start.\n' +
    String((e && (e.message || e.error)) || 'Unknown error') +
    '\n\nThree.js (unpkg.com) and cannon-es (cdn.jsdelivr.net) are loaded from CDNs — ' +
    'check the network connection.</div>';
}, true);
</script>
</body>
</html>
