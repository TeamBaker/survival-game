// ---------------------------------------------------------------------------
// Environment map for PBR reflections (procedural equirect -> PMREM)
// ---------------------------------------------------------------------------
function buildEnvTexture() {
  const W = 1024, H = 512;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');

  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0.00, '#2f6ec4');
  g.addColorStop(0.38, '#7fb0e2');
  g.addColorStop(0.49, '#cfe1f2');
  g.addColorStop(0.52, '#8fa08a');
  g.addColorStop(1.00, '#3d5236');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  const u = ((Math.atan2(SUN.x, SUN.z) / (2 * Math.PI)) + 0.5) * W;
  const v = (1 - (Math.asin(THREE.MathUtils.clamp(SUN.y, -1, 1)) / Math.PI + 0.5)) * H;
  const rg = ctx.createRadialGradient(u, v, 0, u, v, 200);
  rg.addColorStop(0.00, 'rgba(255, 248, 226, 1)');
  rg.addColorStop(0.18, 'rgba(255, 240, 205, 0.60)');
  rg.addColorStop(1.00, 'rgba(255, 238, 200, 0)');
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = rg;
  ctx.fillRect(0, 0, W, H);

  const tex = new THREE.Texture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.needsUpdate = true;
  return tex;
}

const pmrem = new THREE.PMREMGenerator(renderer);
const envSrc = buildEnvTexture();
scene.environment = pmrem.fromEquirectangular(envSrc).texture;
envSrc.dispose();
pmrem.dispose();

// ---------------------------------------------------------------------------
// Lighting
// ---------------------------------------------------------------------------
// The island is centred on the origin, so the shadow frustum is too — it is
// sized to swallow the landmass and a margin of the water around it.
const SHADOW_CENTER = new THREE.Vector3(0, 6, 0);
const SHADOW_HALF   = 132;
const SUN_DIST      = 190;

const sun = new THREE.DirectionalLight(0xfff4e0, 2.9);
sun.position.copy(SUN).multiplyScalar(SUN_DIST).add(SHADOW_CENTER);
sun.castShadow = true;
sun.shadow.mapSize.set(isTouchDevice ? 2048 : 4096, isTouchDevice ? 2048 : 4096);
// near/far hug the actual depth range of the scene along the light direction.
// The old 1..400 range meant one unit of depth bias was worth ~0.2 world units,
// which is what detached shadows from the objects casting them and left a bright
// seam at every contact point.
sun.shadow.camera.near = 30;
sun.shadow.camera.far  = 380;
sun.shadow.camera.left = -SHADOW_HALF;
sun.shadow.camera.right = SHADOW_HALF;
sun.shadow.camera.top = SHADOW_HALF;
sun.shadow.camera.bottom = -SHADOW_HALF;
// With the tight frustum the constant bias can be an order of magnitude smaller;
// the remaining acne is handled by normalBias, which offsets along the surface
// normal (~half a shadow texel) instead of along the light and so does not open
// a gap where an object meets the floor. The terrain shadows itself across the
// whole island, and gentle slopes lit near-edge-on are where acne shows up, so
// the normal offset is a good deal larger than it needed to be for boxes.
sun.shadow.bias = -0.00008;
sun.shadow.normalBias = isTouchDevice ? 0.16 : 0.10;
sun.shadow.radius = 2;
sun.target.position.copy(SHADOW_CENTER);
scene.add(sun);
scene.add(sun.target);

// Held as constants because the underwater pass dims them against these and has
// to be able to put them back exactly when you surface.
const HEMI_BASE = 0.55;
const AMB_BASE  = 0.18;
const hemiLight = new THREE.HemisphereLight(0xbcd8f5, 0x4a5a3c, HEMI_BASE);
const ambLight  = new THREE.AmbientLight(0xffffff, AMB_BASE);
scene.add(hemiLight);
scene.add(ambLight);

// ---------------------------------------------------------------------------
// Physics world (cannon-es)
// ---------------------------------------------------------------------------
const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.82, 0) });
world.broadphase = new CANNON.SAPBroadphase(world);
world.allowSleep = true;
world.solver.iterations = 10;
world.defaultContactMaterial.friction = 0.4;
world.defaultContactMaterial.restitution = 0.0;

const physWorld  = new CANNON.Material('world');
const physProp   = new CANNON.Material('prop');
const physPlayer = new CANNON.Material('player');

// The character drives its own horizontal velocity, so friction against the
// level would only fight the controller — zero it and let the code decide when
// the player sticks (walkable ground) and when they slide (steep ground).
world.addContactMaterial(new CANNON.ContactMaterial(physPlayer, physWorld, { friction: 0.0, restitution: 0.0 }));
world.addContactMaterial(new CANNON.ContactMaterial(physPlayer, physProp,  { friction: 0.0, restitution: 0.0 }));
world.addContactMaterial(new CANNON.ContactMaterial(physProp,   physWorld, { friction: 0.45, restitution: 0.06 }));
world.addContactMaterial(new CANNON.ContactMaterial(physProp,   physProp,  { friction: 0.4,  restitution: 0.06 }));

// Meshes that need to follow their body every frame (dynamic + kinematic only —
// static bodies never move, so syncing them would be pure overhead).
const syncList = [];
function linkBody(mesh, body) {
  // Body.addShape() computes the AABB while the body is still at the origin and
  // clears aabbNeedsUpdate. Only integrate() ever raises the flag again, and a
  // static body never integrates — so without this its AABB stays in local space
  // forever. Collisions still work (SAP broadphase defaults to bounding spheres),
  // but World.raycast* queries the AABBs and would miss the entire level.
  body.updateAABB();
  world.addBody(body);
  mesh.userData.body = body;
  if (body.type !== CANNON.Body.STATIC) syncList.push({ mesh, body });
  return body;
}

// ---------------------------------------------------------------------------
// Scene object helpers — shared geometry, PBR materials, matched colliders
// ---------------------------------------------------------------------------
const boxGeo    = new THREE.BoxGeometry(1, 1, 1);
const sphereGeo = new THREE.SphereGeometry(1, 32, 20);
const objects = new THREE.Group();
scene.add(objects);

// opts: { rx, ry, rz } rotation in degrees, { mass } (0 = static), { phys: false }
// to skip the collider entirely, { prop: true } to use the higher-friction
// contact material used by loose objects.
function addBox(x, y, z, sx, sy, sz, mat, opts = {}) {
  const rx = (opts.rx || 0) * DEG, ry = (opts.ry || 0) * DEG, rz = (opts.rz || 0) * DEG;
  const m = new THREE.Mesh(boxGeo, mat);
  m.position.set(x, y, z);
  m.scale.set(sx, sy, sz);
  m.rotation.set(rx, ry, rz);
  m.castShadow = true;
  m.receiveShadow = true;
  objects.add(m);
  if (opts.phys === false) return m;

  const body = new CANNON.Body({
    mass: opts.mass || 0,
    material: opts.prop ? physProp : physWorld,
    shape: new CANNON.Box(new CANNON.Vec3(sx / 2, sy / 2, sz / 2)),
    linearDamping: opts.mass ? 0.04 : 0,
    angularDamping: opts.mass ? 0.2 : 0,
  });
  body.position.set(x, y, z);
  body.quaternion.setFromEuler(rx, ry, rz);
  linkBody(m, body);
  return m;
}

function addSphere(x, y, z, r, mat, opts = {}) {
  const m = new THREE.Mesh(sphereGeo, mat);
  m.position.set(x, y, z);
  m.scale.setScalar(r);
  m.castShadow = true;
  m.receiveShadow = true;
  objects.add(m);
  if (opts.phys === false) return m;

  const body = new CANNON.Body({
    mass: opts.mass || 0,
    material: opts.prop ? physProp : physWorld,
    shape: new CANNON.Sphere(r),
    linearDamping: opts.mass ? 0.04 : 0,
    angularDamping: opts.mass ? 0.25 : 0,
  });
  body.position.set(x, y, z);
  linkBody(m, body);
  return m;
}

const mat = (color, roughness, metalness, extra = {}) => new THREE.MeshStandardMaterial(
  Object.assign({
    color, roughness, metalness, envMapIntensity: 0.85,
    // Casting from backfaces keeps depth-bias needs tiny on closed solids, which
    // is the other half of the shadow-seam fix.
    shadowSide: THREE.BackSide,
  }, extra)
);

// ---------------------------------------------------------------------------
// Island — one heightmap drives all of it: the visible mesh, its colours, the
// physics collider, where the player spawns and where the props may stand.
// ---------------------------------------------------------------------------

// Deterministic PRNG. The seed is drawn fresh on every load, so each visit gets
// a different island, but feeding the same seed back reproduces one exactly —
// it is published on window.hermes for that.
const SEED = (Math.random() * 0xffffffff) >>> 0;
function mulberry32(a) {
  return function () {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(SEED);

// Sum-of-sines noise: each octave is three plane waves pointing in random
// directions, which is what stops the result lining up with the x/z axes the way
// a sin(x) * cos(z) lattice does. Smooth by construction, so slopes can be read
// off it with plain finite differences.
//
// Waves with independent phases only rarely line up, so dividing by the total
// amplitude would leave the output cowering around a quarter of full scale and
// the island would come out a smooth dome. The extra factor puts the spread
// where the callers below assume it is: std ~0.45, peaks around 1, and the odd
// excursion past it (the terrain code clamps where that would matter).
function makeNoise(octaves, baseFreq, lacunarity = 2.07, gain = 0.5) {
  const waves = [];
  let f = baseFreq, a = 1, norm = 0;
  for (let o = 0; o < octaves; o++) {
    for (let k = 0; k < 3; k++) {
      const ang = rand() * Math.PI * 2;
      waves.push({ kx: Math.cos(ang) * f, kz: Math.sin(ang) * f, ph: rand() * Math.PI * 2, a: a / 3 });
    }
    norm += a;
    f *= lacunarity;
    a *= gain;
  }
  const inv = 1.75 / norm;
  return (x, z) => {
    let s = 0;
    for (let i = 0; i < waves.length; i++) {
      const w = waves[i];
      s += w.a * Math.sin(w.kx * x + w.kz * z + w.ph);
    }
    return s * inv;
  };
}

// The base frequencies matter more than they look: a first octave longer than
// the island itself is a constant across it — a per-seed bias that shifts the
// whole landmass up or down instead of shaping it. These start at wavelengths of
// 200-300 units, a touch wider than the island, so the coarsest octave still
// swings from one side of it to the other.
const nCoast  = makeNoise(3, 0.0200, 2.3, 0.55);   // bays and headlands
const nHills  = makeNoise(4, 0.0300);              // the broad shape of the land
const nRidge  = makeNoise(3, 0.0260);              // creases that read as ridgelines
const nDetail = makeNoise(3, 0.0520, 2.15, 0.48);  // bumps you notice on foot

const smooth = (t) => (t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t));

// The high ground is pushed off-centre, which keeps the island from reading as a
// symmetric cone and puts the spawn clearing on a shoulder rather than on top of
// the tallest thing on the map.
const SUMMIT_A = rand() * Math.PI * 2;
const SUMMIT_D = 26 + rand() * 32;
const SUMMIT_X = Math.cos(SUMMIT_A) * SUMMIT_D;
const SUMMIT_Z = Math.sin(SUMMIT_A) * SUMMIT_D;

function rawHeight(x, z) {
  // A wobbly radius, so the coast comes out as bays and points rather than a disc.
  const rr = Math.hypot(x, z) + nCoast(x, z) * 34;

  const land  = smooth((ISLAND_R - rr) / 82);       // 1 inland .. 0 at the water
  const shelf = smooth((rr - ISLAND_R + 34) / 76);  // 0 at the shore .. 1 out to sea

  // A broad rise towards the summit carries the relief that every seed is
  // guaranteed to get; the noise on top of it is what makes each one different.
  const dome = smooth((104 - Math.hypot(x - SUMMIT_X, z - SUMMIT_Z)) / 108);

  // Ridged noise (1 - |n|) creases along its zero crossings, which is what turns
  // a smooth cone into spurs with gullies between them. Both factors are floored
  // at zero: past the clamp they would dig pits rather than flatten. The mask is
  // squared over the lot, so the ground stays low and nearly flat for the last
  // stretch before the water — that band is the beach.
  const shape = Math.max(0, 0.42 + 0.58 * nHills(x, z))
              * Math.max(0, 1 - Math.abs(nRidge(x, z)));
  let h = PEAK_H * land * land * (0.42 * dome + Math.max(-0.12, 1.50 * (shape - 0.26)));
  h += land * 4.6;                                  // gentle rise out of the sand
  h += nDetail(x, z) * 1.9 * land;                  // enough to break up the slopes

  // Sea floor: away from the island it settles at a flat -SEABED_DEPTH so it
  // meets the deep-water plane without a step. The ripple is faded out at both
  // ends of the shelf for the same reason.
  h -= SEABED_DEPTH * shelf;
  h += nDetail(x * 0.7, z * 0.7) * 2.4 * shelf * (1 - shelf);

  return h;
}

// A clearing in the middle: the player has to land on solid, walkable ground, and
// a spawn dropped straight onto raw noise can be a cliff face or a puddle. The
// floor of 7 keeps the clearing well clear of the tideline even when the noise
// happens to put a hollow at the origin.
const CENTER_H = Math.max(rawHeight(0, 0), 7);
function terrainHeight(x, z) {
  const flat = smooth((34 - Math.hypot(x, z)) / 26) * 0.88;
  return rawHeight(x, z) * (1 - flat) + CENTER_H * flat;
}

// Slope as a gradient magnitude (0 = flat, 1 = 45 degrees, which is also the
// controller's limit) — used to keep the props off the cliffs.
function slopeAt(x, z) {
  const d = 1.6;
  const dx = terrainHeight(x + d, z) - terrainHeight(x - d, z);
  const dz = terrainHeight(x, z + d) - terrainHeight(x, z - d);
  return Math.hypot(dx, dz) / (2 * d);
}

const HALF = TERRAIN_SIZE / 2;
const CELL = TERRAIN_SIZE / TERRAIN_SEGS;

// Sampled once, on the lattice both the mesh and the collider use, so the two
// agree exactly — anything else and the ground you see is not the ground you
// stand on. HEIGHTS[i][j] is the height at x = -HALF + i*CELL, z = HALF - j*CELL,
// which is the layout cannon's Heightfield wants once it is rotated flat.
const HEIGHTS = [];
for (let i = 0; i <= TERRAIN_SEGS; i++) {
  const col = new Float64Array(TERRAIN_SEGS + 1);
  const x = -HALF + i * CELL;
  for (let j = 0; j <= TERRAIN_SEGS; j++) col[j] = terrainHeight(x, HALF - j * CELL);
  HEIGHTS.push(col);
}
const gridClamp = (n) => (n < 0 ? 0 : n > TERRAIN_SEGS ? TERRAIN_SEGS : n);
const gridHeight = (x, z) => HEIGHTS
  [gridClamp(Math.round((x + HALF) / CELL))]
  [gridClamp(Math.round((HALF - z) / CELL))];

// ---------------------------------------------------------------------------
// Shader library — value noise and a palette helper. The terrain and the sea
// both pull from this, which is what makes their shorelines agree: both read
// the same field, so the sand and the water meet at the same line.
// ---------------------------------------------------------------------------

// Hex literals are authored in sRGB; the shaders work in the linear space three
// converts them to, so bake the conversion in rather than doing it per pixel.
function glslColor(hex) {
  const c = new THREE.Color(hex);
  return `vec3(${c.r.toFixed(4)}, ${c.g.toFixed(4)}, ${c.b.toFixed(4)})`;
}

const NOISE_GLSL = /* glsl */`
  float hash21(vec2 p) {
    p = fract(p * vec2(127.31, 311.7));
    p += dot(p, p + 34.23);
    return fract(p.x * p.y);
  }
  // Smoothed value noise — one lattice cell per unit, so callers scale by the
  // feature size they want.
  float vnoise(vec2 p) {
    vec2 i = floor(p), f = fract(p);
    vec2 u = f * f * (3.0 - 2.0 * f);
    float a = hash21(i);
    float b = hash21(i + vec2(1.0, 0.0));
    float c = hash21(i + vec2(0.0, 1.0));
    float d = hash21(i + vec2(1.0, 1.0));
    return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
  }
  // Four octaves is the point where another one stops being visible under the
  // lighting. Output sits in 0..1 with a mean near 0.5.
  float fbm(vec2 p) {
    float s = 0.0, a = 0.5;
    for (int i = 0; i < 4; i++) { s += a * vnoise(p); p = p * 2.07 + 13.1; a *= 0.5; }
    return s;
  }
  // Octaves with independent phases rarely agree, so fbm huddles inside about
  // 0.35..0.6 and mixing on it raw comes out flat. Everything that picks a
  // colour uses this instead: same field, stretched to actually reach 0 and 1.
  float fbmC(vec2 p) { return clamp((fbm(p) - 0.47) * 2.7 + 0.5, 0.0, 1.0); }
`;

const LAND_PALETTE = /* glsl */`
  const vec3 GRASS_LIT  = ${glslColor(0x7ba33f)};   // sunlit meadow
  const vec3 GRASS_DEEP = ${glslColor(0x40702c)};   // shaded, thicker growth
  const vec3 GRASS_DRY  = ${glslColor(0x9d8f4c)};   // burnt-off patches
  const vec3 FERN       = ${glslColor(0x3a6b34)};   // damp green up the slopes
  const vec3 ROCK_LIT   = ${glslColor(0x9b9285)};
  const vec3 ROCK_DARK  = ${glslColor(0x5f5a52)};
  const vec3 PEAK       = ${glslColor(0xb4ada0)};   // bare tops
  const vec3 SAND_LIT   = ${glslColor(0xdbc999)};   // dry beach
  const vec3 SAND_DARK  = ${glslColor(0xac9469)};
  const vec3 SEABED     = ${glslColor(0x2d4a52)};   // the drop-off, well under
  const vec3 FOAM       = ${glslColor(0xf2f8fa)};
`;

const SEA_PALETTE = /* glsl */`
  const vec3 SEA_SHALLOW = ${glslColor(0x37b0ae)};  // over the sand
  const vec3 SEA_DEEP    = ${glslColor(0x0c4a76)};
  const vec3 SEA_FOAM    = ${glslColor(0xeff7fa)};
`;

// ---------------------------------------------------------------------------
// Terrain — the mesh carries height and nothing else; every bit of colour is
// mixed procedurally in the fragment shader from world position, height and
// slope, so the detail holds up with your nose against it.
// ---------------------------------------------------------------------------
const terrainGeo = new THREE.PlaneGeometry(TERRAIN_SIZE, TERRAIN_SIZE, TERRAIN_SEGS, TERRAIN_SEGS);
terrainGeo.rotateX(-Math.PI / 2);            // bake it flat: object space is world space
{
  const p = terrainGeo.attributes.position;
  for (let i = 0; i < p.count; i++) p.setY(i, gridHeight(p.getX(i), p.getZ(i)));
  p.needsUpdate = true;
  terrainGeo.computeVertexNormals();
}

const terrainMat = new THREE.MeshStandardMaterial({
  color: 0xffffff,
  roughness: 0.95,
  metalness: 0.0,
  envMapIntensity: 0.5,
  // An open surface, so the usual backface shadow trick would drop the terrain
  // out of the shadow map entirely — the faces the sun sees are the front ones.
  shadowSide: THREE.FrontSide,
});

const terrain = new THREE.Mesh(terrainGeo, terrainMat);
terrain.receiveShadow = true;
terrain.castShadow = true;                   // hills shading their own far sides
scene.add(terrain);

// The collider, off the same samples. Cannon's Heightfield runs its grid over
// local x/y with the heights along local z, so the body is laid flat the same
// way the old ground plane was and anchored at the -x / +z corner.
{
  const hfBody = new CANNON.Body({ mass: 0, material: physWorld });
  hfBody.addShape(new CANNON.Heightfield(HEIGHTS.map((c) => Array.from(c)), { elementSize: CELL }));
  hfBody.position.set(-HALF, 0, HALF);
  hfBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
  hfBody.updateAABB();
  world.addBody(hfBody);
}

// Now that there is ground, put the spawn on it — body centre 1.2 up, so the
// feet start a hand's width clear of the clearing and settle on the first step.
SPAWN.set(0, terrainHeight(0, 0) + 1.2, 0);

// A height field for the water to read. The sea shoals, breaks and foams
// against the actual coastline rather than a circle, which needs the terrain
// height at any point — so the same samples the mesh and the collider were
// built from are packed into a texture the wave shader can look up.
//
// Only the band the water cares about is stored: LAND_LO..LAND_HI around sea
// level, which puts a byte's worth of precision at under a tenth of a metre.
// Outside the heightfield the clamped edge reads as deep water, which is what
// is out there anyway.
const LAND_LO = -12, LAND_HI = 12;
const landMap = (() => {
  const N = TERRAIN_SEGS + 1;
  const data = new Uint8Array(N * N * 4);
  for (let j = 0; j < N; j++) {                 // rows run +z .. -z, as v does
    for (let i = 0; i < N; i++) {
      const t = (HEIGHTS[i][j] - LAND_LO) / (LAND_HI - LAND_LO);
      const e = Math.round(THREE.MathUtils.clamp(t, 0, 1) * 255);
      const o = (j * N + i) * 4;
      data[o] = data[o + 1] = data[o + 2] = e;
      data[o + 3] = 255;
    }
  }
  const tex = new THREE.DataTexture(data, N, N);
  tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.minFilter = tex.magFilter = THREE.LinearFilter;
  tex.needsUpdate = true;
  return tex;
})();
// Texel centres, so the lookup lands on the sample rather than between two.
const LAND_ORIGIN = HALF + CELL / 2;
const LAND_SCALE  = 1 / (TERRAIN_SIZE + CELL);

// Shared by the sea and the sand: world xz -> terrain height, in metres.
const LAND_GLSL = /* glsl */`
  uniform sampler2D uLandMap;
  float landAt(vec2 p) {
    vec2 uv = (vec2(p.x, -p.y) + ${LAND_ORIGIN.toFixed(3)}) * ${LAND_SCALE.toFixed(8)};
    return texture2D(uLandMap, clamp(uv, 0.0, 1.0)).r
      * ${(LAND_HI - LAND_LO).toFixed(1)} + ${LAND_LO.toFixed(1)};
  }
`;

// ---------------------------------------------------------------------------
// Ocean — a flat surface at sea level plus a flat deep bed under it, so the
// water still has something below it out past the edge of the heightfield.
// The pair rides with the camera on `ocean`, which is what makes the sea read
// as endless: there is never an edge to reach, and the fog closes long before
// the disc's rim. Both live directly in the scene rather than in `objects`, so
// the third-person boom raycast does not pull the camera in when you swim.
// ---------------------------------------------------------------------------
const waterTime = { value: 0 };
// The wind the water reads. Same convention as the debug slab: a normalised
// (east, north) vector pointing the way the wind comes *from*, so marching the
// noise sample point along it drags the pattern downwind. One pair of objects,
// shared by every shader that needs them, so tick() only writes them once.
const windDirU   = { value: new THREE.Vector2(-1, 0) };
const windSpeedU = { value: WORLD.windSpeed };
const ocean = new THREE.Group();
scene.add(ocean);
{
  const deep = new THREE.Mesh(
    new THREE.PlaneGeometry(DEEP_SIZE, DEEP_SIZE),
    new THREE.MeshStandardMaterial({ color: 0x2b4550, roughness: 1.0, metalness: 0.0 })
  );
  deep.rotation.x = -Math.PI / 2;
  deep.position.y = -SEABED_DEPTH - 0.6;    // just under the terrain's own sea floor
  ocean.add(deep);

  // A radial grid instead of a uniform one. Rings grow geometrically outwards,
  // so the surface under the camera is tessellated finely enough to carry the
  // surf while the horizon still costs almost nothing: at 200 units out the
  // cells are ~10 units, at 1000 they are ~50, and the swells are long enough
  // out there to survive it. Object-space Y is up, so the shader can displace
  // `transformed.y` directly.
  function buildOceanGeo() {
    const growth = Math.pow(OCEAN_R / OCEAN_R0, 1 / OCEAN_RINGS);
    const pos = [0, 0, 0];                  // the vertex directly under the camera
    for (let i = 0, r = OCEAN_R0; i <= OCEAN_RINGS; i++, r *= growth) {
      for (let s = 0; s < OCEAN_SPOKES; s++) {
        const a = (s / OCEAN_SPOKES) * Math.PI * 2;
        pos.push(Math.cos(a) * r, 0, Math.sin(a) * r);
      }
    }
    const idx = [];
    for (let s = 0; s < OCEAN_SPOKES; s++) {              // fan over the middle
      idx.push(0, 1 + ((s + 1) % OCEAN_SPOKES), 1 + s);
    }
    for (let i = 0; i < OCEAN_RINGS; i++) {               // quads between rings
      const a0 = 1 + i * OCEAN_SPOKES, b0 = a0 + OCEAN_SPOKES;
      for (let s = 0; s < OCEAN_SPOKES; s++) {
        const s1 = (s + 1) % OCEAN_SPOKES;
        idx.push(a0 + s, b0 + s1, b0 + s);
        idx.push(a0 + s, a0 + s1, b0 + s1);
      }
    }
    const nrm = new Float32Array(pos.length);
    for (let i = 1; i < nrm.length; i += 3) nrm[i] = 1;   // the shader replaces these
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.setAttribute('normal', new THREE.BufferAttribute(nrm, 3));
    geo.setIndex(idx);
    return geo;
  }

  const surfMat = new THREE.MeshPhysicalMaterial({
    color: 0xffffff,          // the shader paints it — colour and alpha both
    transparent: true,
    // No transmission out here: at this size it would cost a second full render
    // of the scene every frame. Plain alpha over the sand reads the same anyway.
    // Glossy but not a mirror: a perfect reflection of a smooth gradient sky is
    // a smooth gradient, which is exactly what flat-looking water is.
    roughness: 0.16,
    metalness: 0.0,
    clearcoat: 0.35,
    clearcoatRoughness: 0.12,
    side: THREE.DoubleSide,
    envMapIntensity: 1.6,
  });

  // The vertex stage does two things: work out how deep the water is under each
  // vertex, in world space (via modelMatrix) so the answer stays put while the
  // mesh slides along under the camera, and lift the sheet into real swells
  // driven by the same wind field the fragment shader shades with.
  surfMat.onBeforeCompile = (shader) => {
    shader.uniforms.uTime = waterTime;
    shader.uniforms.uLandMap = { value: landMap };
    shader.uniforms.uWindDir = windDirU;
    shader.uniforms.uWindSpeed = windSpeedU;

    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', /* glsl */`
        #include <common>
        uniform float uTime;
        uniform vec2  uWindDir;
        uniform float uWindSpeed;
        varying vec3 vWPos;
        varying float vCover;
        ${NOISE_GLSL}
        ${LAND_GLSL}

        // Metres of swell at a world-space point. Same slab of scrolling fbm the
        // fragment shader gates its foam with, only here it moves geometry.
        // The octaves start at amplitude 1 and halve, so the raw sum runs 0..1.875
        // (1 + 0.5 + 0.25 + 0.125) — it has to be divided back down to 0..1 before
        // the subtraction, or "half" is 0.5 out of 1.875 and the sheet spends most
        // of its time above sea level instead of straddling it.
        float waveAt(vec2 p) {
          vec2 uv = p * 0.005 + uWindDir * uTime * uWindSpeed * 0.08;
          float s = 0.0;
          float a = 1.0;
          for (int i = 0; i < 4; i++) { s += a * vnoise(uv); uv = uv * 2.07 + 13.1; a *= 0.5; }
          float windStrength = clamp(uWindSpeed / 15.0, 0.0, 1.0);
          return (s / 1.875 - 0.5) * windStrength * 4.0;
        }
      `)
      .replace('#include <beginnormal_vertex>', /* glsl */`
        #include <beginnormal_vertex>
        vec3 wpos = (modelMatrix * vec4(position, 1.0)).xyz;
        // Signed, not clamped: on dry land this goes negative, and the fragment
        // shader needs that to know where to stop drawing water.
        float depth = ${WATER.surfaceY.toFixed(2)} - landAt(wpos.xz);
        // A swell in a hand's depth of water would stand the sheet up through
        // the sand, so it settles back to flat as the bed comes up to meet it.
        float waveH = waveAt(wpos.xz) * smoothstep(0.0, 6.0, depth);
        // Displacement with a flat normal is invisible except on the horizon —
        // it is the slope that shades. Central-ish differences over a couple of
        // metres, which is well inside a swell but wider than the ripples the
        // fragment shader adds on top.
        float eps  = 2.0;
        float wdx  = waveAt(wpos.xz + vec2(eps, 0.0)) - waveAt(wpos.xz - vec2(eps, 0.0));
        float wdz  = waveAt(wpos.xz + vec2(0.0, eps)) - waveAt(wpos.xz - vec2(0.0, eps));
        objectNormal = normalize(vec3(-wdx, 2.0 * eps, -wdz));
        wpos.y += waveH;
        vWPos  = wpos;                   // the shaded position rides the swell
        vCover = depth;                  // metres of water over the bed
      `)
      // Where displacement belongs in the stock pipeline: `transformed` exists
      // by here and <project_vertex> has not run yet, so this is the last point
      // at which moving the vertex still reaches gl_Position.
      .replace('#include <displacementmap_vertex>', /* glsl */`
        #include <displacementmap_vertex>
        transformed.y += waveH;
      `);

    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', /* glsl */`
        #include <common>
        uniform float uTime;
        uniform vec2  uWindDir;
        uniform float uWindSpeed;
        varying vec3 vWPos;
        varying float vCover;
        ${NOISE_GLSL}
        ${SEA_PALETTE}

        // The wind field, per pixel — conceptually the same slab of scrolling
        // fbm the debug plane draws, just sampled in world space instead of
        // across a quad. Bright is a gust, dark is a lull, and the whole field
        // marches downwind at a rate set by the wind speed.
        float windNoise(vec2 p, float time, vec2 windDir, float windSpeed) {
          // The drift is applied in world metres, *before* the scale, so the
          // pattern travels downwind at a fixed fraction of the wind speed no
          // matter how finely the field is being sampled. Marching the sample
          // point along the "from" vector drags what you see the other way.
          // Tighter than the vertex stage's 0.005: displacement is there to carry
          // the big swells, and this field is what breaks their faces up, so it
          // wants a smaller feature size than the geometry it sits on. The fifth
          // octave is below a metre and only reads up close, which is exactly
          // where the shading normal is doing any work.
          vec2 uv = (p + windDir * time * windSpeed * 0.6) * 0.012;
          float s = 0.0;
          float a = 0.5;
          for (int i = 0; i < 5; i++) {
            s += a * vnoise(uv);
            uv = uv * 2.07 + 13.1;
            a *= 0.5;
          }
          return s;
        }
        // fbm huddles around 0.5, so thresholding it raw never fires. Same
        // stretch fbmC applies, on the wind field.
        float windNoiseC(vec2 p, float time) {
          float n = windNoise(p, time, uWindDir, uWindSpeed);
          return clamp((n - 0.47) * 2.7 + 0.5, 0.0, 1.0);
        }
        // The gust field above is a couple of hundred metres across, which is
        // the right scale for deciding *where* the water is roughened but far
        // too broad to read as ripples. Feeding it a scaled position reuses the
        // one field at ~15m, drifting downwind at about the wind's own speed.
        float windRipple(vec2 p, float time) {
          return windNoise(p * 14.0, time, uWindDir, uWindSpeed);
        }
      `)
      .replace('#include <map_fragment>', /* glsl */`
        #include <map_fragment>
        float foam = 0.0;
        {
          vec2 q = vWPos.xz;
          // Calm is glass, a gale is white over. Everything the wind drives is
          // scaled by this, so at windSpeed 0 the surface falls back to the
          // flat sheet it used to be.
          float windStrength = clamp(uWindSpeed / 15.0, 0.0, 1.0);

          // --- foam where the water meets the land ---
          // vCover crosses zero exactly where the sand does, so this edge traces
          // the coastline. The band just inside it is the broken water. The
          // lace drifts with the wind rather than on a clock of its own, so the
          // wash creeps along the shore the same way the gusts do.
          vec2 drift = uWindDir * uTime * uWindSpeed * 0.05;
          float lace = fbmC(q * 0.85 + drift);
          float edge = 1.0 - smoothstep(0.0, 0.75, vCover);
          float shoreFoam = edge * edge * smoothstep(0.15, 0.55, lace);
          // The leading centimetres are solid white however the noise falls.
          shoreFoam = max(shoreFoam, 1.0 - smoothstep(0.0, 0.18, vCover));
          // A fresh wind pushes the wash further up the sand.
          shoreFoam = max(shoreFoam, edge * fbmC(q * 0.008 + drift) * windStrength * 0.5);

          // --- whitecaps out in the open ---
          // Two gates: the broad gust field says which stretches of sea are
          // being worked on, the ripple field breaks that patch into streaks.
          // Both have to fire, so caps come in drifting bands instead of an
          // even speckle, and neither fires at all in a calm.
          float gust = windNoiseC(q, uTime);
          float caps = smoothstep(0.55, 0.88, gust)
                     * smoothstep(0.58, 0.86, windRipple(q, uTime))
                     * windStrength * windStrength;

          foam = clamp(shoreFoam + caps, 0.0, 1.0);

          float d = max(vCover, 0.0);
          vec3 water = mix(SEA_SHALLOW, SEA_DEEP, smoothstep(0.3, 9.0, d));
          diffuseColor.rgb = mix(water, SEA_FOAM, foam);

          // Thin water lets the sand through and the very edge fades out
          // completely, which is what keeps the wash from ending in a hard line.
          diffuseColor.a = mix(mix(0.40, 0.93, smoothstep(0.25, 5.0, d)), 1.0, foam)
                         * smoothstep(0.0, 0.30, vCover);
        }
      `)
      .replace('#include <roughnessmap_fragment>', /* glsl */`
        #include <roughnessmap_fragment>
        roughnessFactor = mix(roughnessFactor, 0.86, foam);   // foam is not a mirror
      `)
      // The sheet is still geometrically flat — what tilts is the shading
      // normal, driven by the slope of the wind field. That is enough to break
      // the sky reflection up into ripples without paying for displacement, and
      // it means the water roughens and settles as the wind does.
      .replace('#include <normal_fragment_begin>', /* glsl */`
        #include <normal_fragment_begin>
        {
          // Past a few hundred metres a ripple is well under a pixel, and
          // perturbing there only buys a shimmering horizon.
          float near = 1.0 - smoothstep(70.0, 420.0, distance(vWPos, cameraPosition));
          float windStrength = clamp(uWindSpeed / 15.0, 0.0, 1.0);
          if (near * windStrength > 0.001) {
            float eps = 1.0;
            float wn   = windRipple(vWPos.xz, uTime);
            float wndx = windRipple(vWPos.xz + vec2(eps, 0.0), uTime) - wn;
            float wndz = windRipple(vWPos.xz + vec2(0.0, eps), uTime) - wn;
            // Finer ripples mean steeper slopes over the same step, so the gain
            // comes down with the feature size — otherwise the extra detail
            // arrives as glitter rather than as texture.
            normal = normalize(normal + vec3(-wndx, 0.0, -wndz) * (windStrength * near * 3.0));
          }
        }
      `);
  };

  const surf = new THREE.Mesh(buildOceanGeo(), surfMat);
  surf.position.y = WATER.surfaceY;
  surf.receiveShadow = true;
  surf.castShadow = false;
  // The bounding sphere is centred on the camera and 1180 in radius, so it is
  // never out of view — culling it would only cost a test.
  surf.frustumCulled = false;
  ocean.add(surf);
}

// The ground shader. Two jobs, and they share a hook because a material only
// gets the one:
//
//   1. Colour. Nothing is painted per vertex any more — grass, rock and sand are
//      mixed per pixel out of noise and picked between by height and slope, so
//      the transitions wander instead of following the mesh, and the surface
//      still has grain with your face in it.
//   2. Caustics on everything the sea covers. Sunlight refracted through the
//      swell focuses into a moving net of bright filaments, strongest in the
//      shallows over the sand and gone by the time the shelf drops away. The
//      material is shared by the dry land as well, so the effect is masked in
//      world space — below the waterline, and only for the first few metres.
//
// Light leaves the surface along the refracted sun direction, not straight down.
// Snell at the air/water boundary turns the sun's 44 degrees from vertical into
// 31, which is 0.64 of the horizontal run per unit of depth.
const CAUST_SLANT = new THREE.Vector2(SUN.x / SUN.y, SUN.z / SUN.y).multiplyScalar(0.64);
// Swimming, the net is the only structure left in a scene the fog has flattened,
// so it is worth more down there than it is seen from the beach. Driven from
// updateWaterVisuals().
const caustBoost = { value: 1.0 };

terrainMat.onBeforeCompile = (shader) => {
  shader.uniforms.uTime       = waterTime;
  shader.uniforms.uWaterY     = { value: WATER.surfaceY };
  // Past white: the net is the brightest thing under the water and the tone map
  // pulls anything merely at 1.0 back into the surrounding blue.
  shader.uniforms.uCaustCol   = { value: new THREE.Color(0xbfeeff).multiplyScalar(1.35) };
  shader.uniforms.uCaustSlant = { value: CAUST_SLANT };
  shader.uniforms.uSunDir     = { value: SUN.clone() };
  shader.uniforms.uCaustBoost = caustBoost;

  shader.vertexShader = shader.vertexShader
    .replace('#include <common>', /* glsl */`
      #include <common>
      varying vec3 vWPos;
      varying vec3 vWNrm;
    `)
    .replace('#include <begin_vertex>', /* glsl */`
      #include <begin_vertex>
      vWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;
      vWNrm = normalize(mat3(modelMatrix) * objectNormal);
    `);

  shader.fragmentShader = shader.fragmentShader
    .replace('#include <common>', /* glsl */`
      #include <common>
      uniform float uTime;
      uniform float uWaterY;
      uniform vec3  uCaustCol;
      uniform vec3  uSunDir;
      uniform vec2  uCaustSlant;
      uniform float uCaustBoost;
      varying vec3 vWPos;
      varying vec3 vWNrm;
      ${NOISE_GLSL}
      ${LAND_PALETTE}
      // Light piles up along the zero crossings of the crossing swells; raising
      // the fold to a power is what turns those bands into thin filaments. The
      // fold width and the exponent together are the contrast: a narrower fold
      // and a harder power give a thinner, hotter filament with more dark water
      // between the strands, which is what the net actually looks like from
      // under it.
      float caustNet(vec2 p, float t) {
        float c = sin(dot(p, vec2( 0.42,  0.26) * 1.9) + t * 1.15)
                + sin(dot(p, vec2(-0.31,  0.53) * 2.3) - t * 1.55)
                + sin(dot(p, vec2( 0.95, -0.72) * 1.5) + t * 2.20);
        return pow(max(0.0, 1.0 - abs(c) * 0.62), 11.0);
      }
    `)
    .replace('#include <map_fragment>', /* glsl */`
      #include <map_fragment>
      float wetness = 0.0;
      {
        vec3 wp = vWPos;
        float h = wp.y;
        float slope = 1.0 - clamp(vWNrm.y, 0.0, 1.0);     // 0 flat .. 1 vertical

        // The finest octaves are only worth their cost within a few dozen metres
        // — further out they are sub-pixel and would sparkle. This also keeps the
        // per-pixel noise budget off the far hillsides, which cover most of the
        // screen from a boat.
        float fine = 1.0 - smoothstep(28.0, 95.0, length(wp - cameraPosition));

        // Every height threshold below is tested against a wobbled height, so
        // the bands between materials wander instead of ringing the island like
        // contour lines.
        float hb = h + (fbm(wp.xz * 0.035) - 0.47) * 5.5;

        // ---- grass: patchy, drying out in places, greener as it climbs ----
        // Two scales of patch: 60-unit meadows that read from offshore, and
        // 18-unit clumps that read from standing height.
        vec3 grass = mix(GRASS_DEEP, GRASS_LIT, fbmC(wp.xz * 0.017));
        grass = mix(grass, GRASS_LIT * 1.12, fbmC(wp.xz * 0.055 + 5.0) * 0.55);
        grass = mix(grass, GRASS_DRY, smoothstep(0.55, 0.95, fbmC(wp.xz * 0.031 + 31.0)) * 0.85);
        grass = mix(grass, FERN, smoothstep(9.0, 26.0, hb) * 0.65);
        grass *= 1.0 + (vnoise(wp.xz * 0.7) - 0.5) * 0.34 * fine;   // clumps
        grass *= 1.0 + (vnoise(wp.xz * 5.5) - 0.5) * 0.22 * fine;   // blades

        // ---- rock: mottled, with faint bedding running through it ----
        float strata = 0.5 + 0.5 * sin(h * 1.7 + fbm(wp.xz * 0.09) * 6.0);
        vec3 rock = mix(ROCK_DARK, ROCK_LIT, fbmC(wp.xz * 0.32 + h * 0.5) * 0.7 + strata * 0.3);
        rock = mix(rock, PEAK, smoothstep(22.0, 33.0, hb) * 0.55);
        rock *= 1.0 + (vnoise(wp.xz * 4.0) - 0.5) * 0.24 * fine;

        // ---- sand: grain, wind ripples up the dry beach, wet below the wash ----
        vec3 sand = mix(SAND_DARK, SAND_LIT, fbmC(wp.xz * 0.09));
        float ripple = 0.5 + 0.5 * sin(dot(wp.xz, vec2(0.86, 0.51)) * 1.9 + fbm(wp.xz * 0.3) * 6.0);
        sand = mix(sand, SAND_LIT * 1.08, ripple * 0.3 * fine);
        sand *= 1.0 + (vnoise(wp.xz * 1.7) - 0.5) * 0.14;
        sand *= 1.0 + (vnoise(wp.xz * 9.0) - 0.5) * 0.18 * fine;

        // Where the sea is: a flat sheet at sea level, so the dark line of wet
        // sand sits at a fixed height and does not move.
        float waterline = uWaterY;
        wetness = 1.0 - smoothstep(waterline - 0.05, waterline + 0.85, h);
        sand = mix(sand, sand * vec3(0.50, 0.52, 0.58), wetness);
        sand = mix(sand, SEABED, smoothstep(1.0, 9.0, -h));   // into the drop-off
        // How much water stands over this point — the terrain's own vCover.
        float cover = max(0.0, waterline - h);

        // ---- pick between them ----
        float sandM = 1.0 - smoothstep(2.6, 5.2, hb);
        // Too steep to hold soil is bare rock, at any height above the tideline.
        float rockM = smoothstep(0.34, 0.62, slope) * smoothstep(0.0, 1.2, h);
        vec3 col = mix(grass, sand, sandM);
        col = mix(col, rock, max(rockM, smoothstep(27.0, 35.0, hb) * 0.8));

        // ---- and the lace of foam the last wave left on the sand ----
        // A band of fixed height would be a hairline on a cliff and a whole
        // white sheet across a flat sand bar, so its thickness is tied to the
        // gradient of the ground: what stays roughly constant is how many metres
        // of beach it covers, not how many metres of height it spans.
        float grad = sqrt(max(0.0, 1.0 - vWNrm.y * vWNrm.y)) / max(vWNrm.y, 0.05);
        float bandH = clamp(0.05 + 1.2 * grad, 0.05, 0.45);
        float band = 1.0 - smoothstep(0.0, bandH, abs(h - waterline - bandH * 0.2));
        float lace = 0.35 + 0.65 * smoothstep(0.25, 0.7, fbmC(wp.xz * 1.1));
        col = mix(col, FOAM, clamp(band * lace, 0.0, 0.92) * sandM);

        // ---- what the water takes out on the way down ----
        // Sea water eats red first, then green, and lets blue through furthest,
        // so the bed slides teal and then dark as the shelf drops away. This is
        // the albedo, so the caustics added later ride on top of ground that is
        // already tinted, which is what stops them reading as white paint on a
        // blue floor. A little in-scatter keeps the deep from going to black.
        vec3 absorb = exp(-cover * vec3(0.088, 0.031, 0.017));
        col = mix(col * absorb, SEABED * 0.55, 1.0 - exp(-cover * 0.035));

        diffuseColor.rgb *= col;
      }
    `)
    .replace('#include <roughnessmap_fragment>', /* glsl */`
      #include <roughnessmap_fragment>
      roughnessFactor *= mix(1.0, 0.38, wetness);   // wet sand takes a sheen
    `)
    // getShadowMask() lives in a chunk the lit materials do not pull in; adding
    // it after the shadow varyings it reads keeps the caustics out of the
    // shadows the headlands lay across the shallows.
    .replace('#include <shadowmap_pars_fragment>', /* glsl */`
      #include <shadowmap_pars_fragment>
      #include <shadowmask_pars_fragment>
    `)
    .replace('#include <emissivemap_fragment>', /* glsl */`
      #include <emissivemap_fragment>
      {
        float below = uWaterY - vWPos.y;
        // Walk back up the light path to the water plane: that is the patch of
        // surface whose lensing lights this point. On the flats it only shifts
        // the pattern, but it is what makes the net climb a slope instead of
        // streaking straight down it.
        // On top of the wave phases inside caustNet, the whole net wanders: a
        // slow drift of the sample point, a few metres over half a minute, so
        // the pattern is never quite where it was without ever reading as
        // something scrolling past.
        vec2 drift = vec2(sin(uTime * 0.045), cos(uTime * 0.037)) * 4.0;
        vec2 q = vWPos.xz + uCaustSlant * below + drift;
        // Wet, and shallow enough for the surface to still focus anything. The
        // reach runs a good deal deeper than it used to: the absorption above
        // now darkens the bed on its own, so the net can follow the shelf right
        // out over the drop-off instead of being cut off while the ground is
        // still bright.
        float wet = step(0.0, below) * (1.0 - smoothstep(1.0, 24.0, below));
        // Faces turned away from the sun catch none of it.
        float facing = clamp(dot(vWNrm, uSunDir), 0.0, 1.0) * 2.2;
        // A hand's depth of water barely focuses; a couple of metres does.
        float depth = clamp(below / 2.0, 0.0, 1.0);
        // Knee-deep water throws the sharpest net there is — the sun has barely
        // any depth to defocus through — so the first few metres get a lift on
        // top of the usual falloff.
        float shallow = 1.0 + 1.2 * (1.0 - smoothstep(0.0, 3.5, below));
        // Three scales rather than two. The coarse layer is the one that widens
        // the effect: its cells are half again as big as the main net, so it
        // reaches across the stretches of bed the other two leave dark instead
        // of leaving the floor lit only in the one band of cell size.
        float caust = caustNet(q * 0.62, uTime * 0.80) * 1.15
                    + caustNet(q,        uTime       ) * 1.75
                    + caustNet(q * 1.9 + vec2(7.3, 2.1), uTime * 1.35) * 0.95;
        // Caustics are light landing on the surface, so what you see is what
        // the surface reflects: without the albedo term the dark rock lights
        // up harder than the pale sand it stands in.
        totalEmissiveRadiance += uCaustCol * diffuseColor.rgb
          * caust * wet * facing * shallow * uCaustBoost
          * (0.35 + 0.65 * depth) * getShadowMask();
      }
    `);
};

// Submerging the camera swaps the sky and the distance fog for a dense blue one
// (the sky dome is a custom shader and ignores scene.fog, so it is hidden and a
// flat background colour takes over).
//
// Below the surface it is not one look but a gradient: just under, the water is
// bright teal and you can see a long way; eighty metres down it is near-black
// blue and the fog is on top of you. Depth drives the fog colour, the fog
// density and the fill lights together, so descending dims the whole scene at
// once instead of only tinting it.
const UNDER_BG    = new THREE.Color(WATER_FOG);
const UNDER_DEPTH = 80;        // metres to the darkest, thickest water
// Shallow end: near enough the old flat WATER_FOG, so the surface still reads
// the way it did. Deep end: what is left after eighty metres of sea water.
const UNDER_SHALLOW = { r: 0.07, g: 0.32, b: 0.44, density: 0.055 };
const UNDER_DEEP    = { r: 0.01, g: 0.05, b: 0.11, density: 0.30  };
let underwater = false;
function updateWaterVisuals() {
  const c = camera.position;
  const wet = c.y < WATER.surfaceY && c.y > WATER.floorY - 2 && inWaterColumn(c.x, c.z);

  if (wet !== underwater) {
    underwater = wet;
    scene.background = wet ? UNDER_BG : null;
    sky.visible = !wet;
    document.getElementById('underwater').classList.toggle('on', wet);
    if (!wet) {
      scene.fog.color.setHex(FOG_COLOR);
      scene.fog.density = FOG_DENSITY;
      hemiLight.intensity = HEMI_BASE;
      ambLight.intensity  = AMB_BASE;
      caustBoost.value    = 1.0;
    }
  }
  if (!wet) return;

  // 0 at the surface, 1 at UNDER_DEPTH and below.
  const t = Math.min((WATER.surfaceY - c.y) / UNDER_DEPTH, 1.0);
  const r = UNDER_SHALLOW.r + (UNDER_DEEP.r - UNDER_SHALLOW.r) * t;
  const g = UNDER_SHALLOW.g + (UNDER_DEEP.g - UNDER_SHALLOW.g) * t;
  const b = UNDER_SHALLOW.b + (UNDER_DEEP.b - UNDER_SHALLOW.b) * t;
  // sRGB, because every other colour in this file is written as one.
  scene.fog.color.setRGB(r, g, b, THREE.SRGBColorSpace);
  UNDER_BG.copy(scene.fog.color);
  // The scene fog here is FogExp2, so "how far you can see" is density rather
  // than a far plane: 0.055 clears about 50 metres, 0.30 about 10.
  scene.fog.density = UNDER_SHALLOW.density + (UNDER_DEEP.density - UNDER_SHALLOW.density) * t;

  // Sunlight is what is being absorbed, so the fill has to go with it.
  hemiLight.intensity = HEMI_BASE * (1 - 0.7 * t);
  ambLight.intensity  = AMB_BASE  * (1 - 0.5 * t);
  // Brightest just under the surface, where there is still a net to see.
  caustBoost.value = 1.0 + 0.7 * (1 - t);
}

// ---------------------------------------------------------------------------
// Camera state + input
// ---------------------------------------------------------------------------
const state = {
  pos: START_POS.clone(),
  yaw: START_YAW * DEG,
  pitch: START_PITCH * DEG,
  sprint: false,
  flyUp: false,
  flyDown: false,
  joyX: 0,
  joyY: 0,
  touchActive: false,
  // character controller — touch buttons latch, keyboard equivalents are held
  jumpQueued: false,
  jumpHeld: false,          // held state too, so JUMP can drive a swim upwards
  crouchBtn: false,
  sprintBtn: false,
};
const PITCH_LIMIT = 89 * DEG;
const keys = new Set();

// ----- keyboard -----
const TRACKED = new Set([
  'KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyE', 'KeyQ', 'KeyC', 'KeyV', 'KeyG', 'KeyR',
  'ShiftLeft', 'ShiftRight', 'Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight',
]);
window.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  if (TRACKED.has(e.code)) { keys.add(e.code); e.preventDefault(); }
  if (e.code === 'KeyV') cycleCamera();
  else if (e.code === 'KeyG') toggleGameMode();
  else if (e.code === 'KeyR' && camMode !== CAM.FREE) respawn();
  else if (e.code === 'Space' && camMode !== CAM.FREE) state.jumpQueued = true;
}, { passive: false });
window.addEventListener('keyup', (e) => {
  if (TRACKED.has(e.code)) { keys.delete(e.code); e.preventDefault(); }
}, { passive: false });
window.addEventListener('blur', () => keys.clear());

// ----- pointer lock / mouse look -----
function requestLock() {
  if (isTouchDevice) return;
  const el = renderer.domElement;
  const fn = el.requestPointerLock || el.mozRequestPointerLock;
  if (fn) {
    const r = fn.call(el);
    if (r && typeof r.catch === 'function') r.catch(() => {});
  }
}
const isLocked = () => document.pointerLockElement === renderer.domElement;

renderer.domElement.addEventListener('mousedown', () => { if (!isLocked()) requestLock(); });

document.addEventListener('mousemove', (e) => {
  if (!isLocked()) return;
  state.yaw   -= (e.movementX || 0) * MOUSE_SENSITIVITY * DEG;
  state.pitch -= (e.movementY || 0) * MOUSE_SENSITIVITY * DEG;
  state.pitch = THREE.MathUtils.clamp(state.pitch, -PITCH_LIMIT, PITCH_LIMIT);
});

document.addEventListener('pointerlockchange', () => {
  if (!isLocked() && !isTouchDevice) {
    keys.clear();
    showOverlay();
  }
});

// ----- touch: left half = joystick, right half = look, 2 fingers/side = sprint -----
const stickBase = document.getElementById('stick-base');
const stickKnob = document.getElementById('stick-knob');
const STICK_R = 55;
const stickHome = { left: stickBase.style.left, bottom: stickBase.style.bottom };

const touches = new Map();   // identifier -> { zone, role }
let moveId = null;
let lookId = null;
let moveOrigin = { x: 0, y: 0 };

const zoneOf = (x) => (x < window.innerWidth * 0.5 ? 'left' : 'right');

function updateSprint() {
  let l = 0, r = 0;
  for (const t of touches.values()) (t.zone === 'left' ? l++ : r++);
  state.sprint = (l >= 2 || r >= 2);
  sprintEl.classList.toggle('on', state.sprint || keys.has('ShiftLeft') || keys.has('ShiftRight'));
}

function placeStick(x, y) {
  stickBase.style.left = (x - 66) + 'px';
  stickBase.style.top = (y - 66) + 'px';
  stickBase.style.bottom = 'auto';
}

function resetStick() {
  stickBase.classList.remove('active');
  stickBase.style.left = stickHome.left || '28px';
  stickBase.style.top = 'auto';
  stickBase.style.bottom = stickHome.bottom || 'calc(34px + env(safe-area-inset-bottom))';
  stickKnob.style.transform = 'translate(0px, 0px)';
  state.joyX = state.joyY = 0;
}

function enableTouchUI() {
  if (state.touchActive) return;
  state.touchActive = true;
  document.body.classList.add('touch');
}

function onTouchStart(e) {
  e.preventDefault();
  enableTouchUI();
  for (const t of e.changedTouches) {
    const zone = zoneOf(t.clientX);
    let role = 'extra';
    if (zone === 'left' && moveId === null) {
      role = 'move';
      moveId = t.identifier;
      moveOrigin = { x: t.clientX, y: t.clientY };
      placeStick(t.clientX, t.clientY);
      stickBase.classList.add('active');
    } else if (zone === 'right' && lookId === null) {
      role = 'look';
      lookId = t.identifier;
    }
    touches.set(t.identifier, { zone, role, x: t.clientX, y: t.clientY });
  }
  updateSprint();
}

// These two are bound on `window`, so every touch in the document passes through
// them — including the ones that landed on a HUD button. Calling preventDefault()
// on those was suppressing the click the browser would otherwise synthesise, and
// that is what made the mode button unreliable on touch. Only speak for the
// touches we actually took ownership of in onTouchStart.
function ownsAny(e) {
  for (const t of e.changedTouches) if (touches.has(t.identifier)) return true;
  return false;
}

function onTouchMove(e) {
  if (!ownsAny(e)) return;
  e.preventDefault();
  for (const t of e.changedTouches) {
    const rec = touches.get(t.identifier);
    if (!rec) continue;

    if (rec.role === 'look') {
      const dx = t.clientX - rec.x;
      const dy = t.clientY - rec.y;
      state.yaw   -= dx * MOUSE_SENSITIVITY * TOUCH_LOOK_MULT * DEG;
      state.pitch -= dy * MOUSE_SENSITIVITY * TOUCH_LOOK_MULT * DEG;
      state.pitch = THREE.MathUtils.clamp(state.pitch, -PITCH_LIMIT, PITCH_LIMIT);
    } else if (rec.role === 'move') {
      let dx = t.clientX - moveOrigin.x;
      let dy = t.clientY - moveOrigin.y;
      const len = Math.hypot(dx, dy);
      if (len > STICK_R) { dx = dx / len * STICK_R; dy = dy / len * STICK_R; }
      stickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
      state.joyX = dx / STICK_R;
      state.joyY = dy / STICK_R;
    }
    rec.x = t.clientX;
    rec.y = t.clientY;
  }
}

function onTouchEnd(e) {
  if (!ownsAny(e)) return;
  e.preventDefault();
  for (const t of e.changedTouches) {
    const rec = touches.get(t.identifier);
    if (!rec) continue;
    touches.delete(t.identifier);
    if (t.identifier === moveId) { moveId = null; resetStick(); }
    if (t.identifier === lookId) { lookId = null; }
  }
  // promote a leftover finger so control never gets stuck after a multi-touch
  if (lookId === null) {
    for (const [id, rec] of touches) {
      if (rec.role === 'extra' && rec.zone === 'right') { rec.role = 'look'; lookId = id; break; }
    }
  }
  if (moveId === null) {
    for (const [id, rec] of touches) {
      if (rec.role === 'extra' && rec.zone === 'left') {
        rec.role = 'move';
        moveId = id;
        moveOrigin = { x: rec.x, y: rec.y };
        placeStick(rec.x, rec.y);
        stickBase.classList.add('active');
        break;
      }
    }
  }
  updateSprint();
}

// The touch UI should come up on the first touch anywhere, not only on the first
// touch that happens to land on the canvas — starting the session by tapping the
// mode button used to leave the joystick and pads hidden.
window.addEventListener('touchstart', enableTouchUI, { passive: true, capture: true });
canvas.addEventListener('touchstart', onTouchStart, { passive: false });
window.addEventListener('touchmove', onTouchMove, { passive: false });
window.addEventListener('touchend', onTouchEnd, { passive: false });
window.addEventListener('touchcancel', onTouchEnd, { passive: false });

// kill browser pinch-zoom / scroll / long-press menus
for (const ev of ['gesturestart', 'gesturechange', 'gestureend']) {
  document.addEventListener(ev, (e) => e.preventDefault(), { passive: false });
}
document.addEventListener('contextmenu', (e) => e.preventDefault());
document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });

// ----- on-screen fly buttons -----
function bindHold(el, on, off) {
  const press = (e) => { e.preventDefault(); e.stopPropagation(); el.classList.add('down'); on(); };
  const release = (e) => { e.preventDefault(); e.stopPropagation(); el.classList.remove('down'); off(); };
  el.addEventListener('touchstart', press, { passive: false });
  el.addEventListener('touchend', release, { passive: false });
  el.addEventListener('touchcancel', release, { passive: false });
  el.addEventListener('mousedown', press);
  window.addEventListener('mouseup', () => { el.classList.remove('down'); off(); });
}
bindHold(document.getElementById('btn-up'),   () => state.flyUp = true,   () => state.flyUp = false);
bindHold(document.getElementById('btn-down'), () => state.flyDown = true, () => state.flyDown = false);

// A one-shot tap, for the HUD buttons that toggle something rather than being
// held. `click` alone is not enough: a touch that ends anywhere near a window
// listener calling preventDefault() never produces one, which is why the mode
// button used to work on some taps and not others. Take pointerdown when the
// browser has it and fall back to click when it does not, and never act on both
// — once a pointerdown has been seen, the compatibility click is dead to us.
function bindTap(el, fn) {
  let sawPointer = false;
  const fire = (e) => {
    e.preventDefault();
    e.stopPropagation();
    if (el.blur) el.blur();     // otherwise Space would re-press the focused button
    fn(e);
  };
  el.addEventListener('pointerdown', (e) => { sawPointer = true; fire(e); });
  el.addEventListener('click', (e) => {
    if (sawPointer) { e.preventDefault(); e.stopPropagation(); return; }
    fire(e);
  });
  // Keep the canvas / overlay handlers out of it entirely.
  el.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true });
  el.addEventListener('touchend', (e) => e.stopPropagation(), { passive: true });
}

// ----- on-screen action buttons (first / third person) -----
const btnJump   = document.getElementById('btn-jump');
const btnCrouch = document.getElementById('btn-crouch');
const btnSprint = document.getElementById('btn-sprint');

bindHold(btnJump,
  () => { state.jumpQueued = true; state.jumpHeld = true; },
  () => { state.jumpHeld = false; });
function bindToggle(el, get, set) {
  const press = (e) => {
    e.preventDefault();
    e.stopPropagation();
    set(!get());
    el.classList.toggle('down', get());
  };
  el.addEventListener('touchstart', press, { passive: false });
  el.addEventListener('mousedown', press);
}
bindToggle(btnCrouch, () => state.crouchBtn, (v) => state.crouchBtn = v);
bindToggle(btnSprint, () => state.sprintBtn, (v) => state.sprintBtn = v);

const isSprinting = () =>
  state.sprint || state.sprintBtn || keys.has('ShiftLeft') || keys.has('ShiftRight');

// ---------------------------------------------------------------------------
// Character controller — a cannon-es body whose velocity is driven by input
// rather than by forces, so the movement stays crisp and predictable.
// ---------------------------------------------------------------------------
const playerBody = new CANNON.Body({
  // Heavier than the crates on purpose. The controller sets velocity directly so
  // mass never affects how the character itself moves — it only decides how much
  // authority the body has in contact impulses, i.e. whether walking into a crate
  // shoves it or stalls against it.
  mass: 6,
  material: physPlayer,
  fixedRotation: true,
  linearDamping: 0,
  angularDamping: 1,
  allowSleep: false,
});
let crouched = false;
let swimming = false;

function setPlayerShape(crouch) {
  while (playerBody.shapes.length) playerBody.removeShape(playerBody.shapes[0]);
  const r = PLAYER.radius;
  if (crouch) {
    playerBody.addShape(new CANNON.Sphere(r));                            // 0.8 tall
  } else {
    // Three stacked spheres stand in for a 1.6-tall capsule (cannon has no
    // capsule primitive). Rounded feet ride over kerbs and up ramps without a
    // dedicated step-up hack.
    playerBody.addShape(new CANNON.Sphere(r), new CANNON.Vec3(0, -0.4, 0));
    playerBody.addShape(new CANNON.Sphere(r), new CANNON.Vec3(0,  0.0, 0));
    playerBody.addShape(new CANNON.Sphere(r), new CANNON.Vec3(0,  0.4, 0));
  }
  playerBody.updateBoundingRadius();
  playerBody.updateMassProperties();   // honours fixedRotation, keeps mass = 1
}
setPlayerShape(false);
playerBody.position.set(SPAWN.x, SPAWN.y, SPAWN.z);
playerBody.updateAABB();
world.addBody(playerBody);

// Visible body — hidden in first person, shown everywhere else.
const playerGeoStand  = new THREE.CapsuleGeometry(PLAYER.radius, 0.8, 6, 18);
const playerGeoCrouch = new THREE.CapsuleGeometry(PLAYER.radius, 0.0, 6, 18);
const playerMesh = new THREE.Mesh(
  playerGeoStand,
  mat(0x63b9ff, 0.42, 0.28, { emissive: 0x0d2c4a, emissiveIntensity: 0.55 })
);
playerMesh.castShadow = true;
playerMesh.receiveShadow = true;
const visor = new THREE.Mesh(
  new THREE.BoxGeometry(0.34, 0.12, 0.14),
  mat(0xffe6a8, 0.3, 0.1, { emissive: 0x6a4a10, emissiveIntensity: 0.9 })
);
visor.position.set(0, 0.42, -0.34);
playerMesh.add(visor);
scene.add(playerMesh);

// Steepest-upward contact normal touching the player, refreshed every substep.
// A contact whose normal is within maxSlope of straight up is walkable ground.
let groundNy = 0;
world.addEventListener('postStep', () => {
  let best = 0;
  for (const c of world.contacts) {
    let ny;
    if (c.bi === playerBody) ny = -c.ni.y;        // ni runs from bi to bj
    else if (c.bj === playerBody) ny = c.ni.y;
    else continue;
    if (ny > best) best = ny;
  }
  groundNy = best;
});

let coyote = 0;                       // grace period for late jump presses
let jumpLock = 0;                     // contacts survive a step after take-off
let eyeH = PLAYER.standEye;           // smoothed, so crouching ducks the view
let playerYaw = SPAWN_YAW * DEG;
const wishDir = new THREE.Vector3();

const centerOffset = () => (crouched ? PLAYER.crouchCenter : PLAYER.standCenter);

// Is there room to stand back up, or are we under the crouch tunnel?
function hasHeadroom() {
  const p = playerBody.position;
  const from = new CANNON.Vec3(p.x, p.y, p.z);
  const to   = new CANNON.Vec3(p.x, p.y + 1.35, p.z);
  let blocked = false;
  world.raycastAll(from, to, {}, (res) => { if (res.body !== playerBody) blocked = true; });
  return !blocked;
}

function respawn() {
  playerBody.position.set(SPAWN.x, SPAWN.y, SPAWN.z);
  playerBody.velocity.setZero();
  playerBody.wakeUp();
  state.yaw = SPAWN_YAW * DEG;
  state.pitch = 0;
}

function updatePlayer(dt) {
  const p = playerBody.position, v = playerBody.velocity;

  // --- how much of the body is under the pool surface (0 = dry, 1 = under) ---
  const bodyH = crouched ? PLAYER.crouchEye : PLAYER.standEye;
  const submerged = inWaterColumn(p.x, p.z)
    ? THREE.MathUtils.clamp((WATER.surfaceY - (p.y - centerOffset())) / bodyH, 0, 1)
    : 0;
  // Hysteresis: bobbing across a single threshold would flip between swimming and
  // walking once a frame, and every walking frame would drop the player.
  swimming = submerged > (swimming ? WATER.swimOut : WATER.swimIn);

  // --- crouch: held on desktop, latched on touch (in water C swims down) ---
  const wantCrouch = (keys.has('KeyC') || state.crouchBtn) && !swimming;
  if (wantCrouch && !crouched) {
    setPlayerShape(true);
    p.y -= PLAYER.standCenter - PLAYER.crouchCenter;   // keep the feet planted
    crouched = true;
  } else if (!wantCrouch && crouched && hasHeadroom()) {
    setPlayerShape(false);
    p.y += PLAYER.standCenter - PLAYER.crouchCenter;
    crouched = false;
  }

  jumpLock = Math.max(0, jumpLock - dt);
  const grounded = groundNy > GROUND_DOT && jumpLock === 0;
  const onSteep  = !grounded && groundNy > 0.05 && groundNy <= GROUND_DOT;
  coyote = grounded ? PLAYER.coyote : Math.max(0, coyote - dt);

  // --- wish direction ---
  const sy = Math.sin(state.yaw), cy = Math.cos(state.yaw);
  let wishY = 0;
  wishDir.set(0, 0, 0);
  if (camMode === CAM.TOP) {
    // Top-down drives the world axes directly — the camera has no heading to be
    // relative to, so W is north rather than "forward".
    if (keys.has('KeyW') || keys.has('ArrowUp'))    wishDir.z -= 1;
    if (keys.has('KeyS') || keys.has('ArrowDown'))  wishDir.z += 1;
    if (keys.has('KeyA') || keys.has('ArrowLeft'))  wishDir.x -= 1;
    if (keys.has('KeyD') || keys.has('ArrowRight')) wishDir.x += 1;
    wishDir.x += state.joyX;
    wishDir.z += state.joyY;
  } else {
    let fwd = 0, str = 0;
    if (keys.has('KeyW') || keys.has('ArrowUp'))    fwd += 1;
    if (keys.has('KeyS') || keys.has('ArrowDown'))  fwd -= 1;   // backpedal
    if (keys.has('KeyD') || keys.has('ArrowRight')) str += 1;
    if (keys.has('KeyA') || keys.has('ArrowLeft'))  str -= 1;
    fwd -= state.joyY;                                          // stick up = forward
    str += state.joyX;
    // Swimming steers with the camera pitch as well, so you dive where you look.
    const cp = swimming ? Math.cos(state.pitch) : 1;
    wishDir.set(-sy * fwd * cp + cy * str, 0, -cy * fwd * cp - sy * str);
    if (swimming) {
      if (keys.has('Space') || state.jumpHeld)     wishY += 1;
      if (keys.has('KeyC')  || state.crouchBtn)    wishY -= 1;
      wishDir.y = Math.sin(state.pitch) * fwd + wishY;
    }
  }
  const wl = wishDir.length();
  if (wl > 1) wishDir.divideScalar(wl);

  // Wading drags on you, and past the swim threshold it hands over to the (much
  // slower) swim speed at roughly the same value, so the change of gait is smooth.
  const wade = 1 - 0.42 * Math.min(1, submerged / WATER.swimIn);
  const speed = swimming
    ? PLAYER.walk * WATER.speedMult
    : (crouched ? PLAYER.crouchSpeed : PLAYER.walk * (isSprinting() ? PLAYER.sprintMult : 1)) * wade;

  // Sprint drives forward and strafe only: whatever part of the target velocity
  // points behind the camera is trimmed back to the walk speed, so you can back
  // up but never backpedal at a sprint. Top-down has no camera heading to be
  // behind, so it keeps driving the world axes as before.
  let tx = wishDir.x * speed, tz = wishDir.z * speed;
  if (camMode !== CAM.TOP) {
    const backCap = Math.min(speed, PLAYER.walk * (swimming ? 1 : wade));
    const along = tx * -sy + tz * -cy;      // + ahead of the camera, - behind it
    if (along < -backCap) {
      const over = along + backCap;         // negative — the excess to take out
      tx += sy * over;                      // i.e. t -= over * forward
      tz += cy * over;
    }
  }

  if (swimming) {
    // No ground to push off, so all three axes are driven the same way and the
    // lerp itself provides the drag.
    const k = 1 - Math.exp(-WATER.accel * dt);
    v.x += (tx - v.x) * k;
    v.z += (tz - v.z) * k;
    v.y += (wishDir.y * speed - v.y) * k;
    // Buoyancy: hand back most of the gravity the solver is about to apply.
    v.y += 9.82 * (1 - WATER.gravityScale) * dt;
    // Left alone near the top you settle at the surface and ride the swell. A
    // deliberate dive gives way — but a couple of degrees of look-down does not,
    // or you would sink every time you swam along the surface off the level.
    if (Math.abs(wishDir.y) < 0.25) {
      const bob = Math.sin(elapsed * 1.9) * 0.055 + Math.sin(elapsed * 1.07 + 2.1) * 0.035;
      const rest = WATER.surfaceY + bob - bodyH * 0.85 + centerOffset();
      const d = rest - p.y;
      if (Math.abs(d) < 1.4) {
        v.y += (THREE.MathUtils.clamp(d * 3.2, -1.2, 1.2) - v.y) * (1 - Math.exp(-6 * dt));
      }
    }
    playerBody.wakeUp();
  } else if (grounded) {
    const k = 1 - Math.exp(-PLAYER.groundAccel * dt);
    v.x += (tx - v.x) * k;
    v.z += (tz - v.z) * k;
  } else if (!onSteep) {
    // Reduced authority in the air; never scrubs speed you already carried, so a
    // sprint jump keeps its momentum even if shift is released mid-flight.
    const hs0 = Math.hypot(v.x, v.z);
    v.x += wishDir.x * PLAYER.airAccel * dt;
    v.z += wishDir.z * PLAYER.airAccel * dt;
    const hs = Math.hypot(v.x, v.z);
    const cap = Math.max(hs0, Math.hypot(tx, tz));
    if (hs > cap) { v.x = v.x / hs * cap; v.z = v.z / hs * cap; }
  }
  // Steeper than maxSlope: no input authority at all. Player/level friction is
  // zero, so gravity simply slides you back down — that is the red 55-degree lane.

  // --- jump (in water Space is the swim-up key instead) ---
  if ((state.jumpQueued || keys.has('Space')) && coyote > 0 && !crouched && !swimming) {
    v.y = PLAYER.jumpSpeed;
    coyote = 0;
    groundNy = 0;
    jumpLock = 0.15;
    playerBody.wakeUp();
  }
  state.jumpQueued = false;

  if (p.y < -25) respawn();

  // --- derived view state ---
  const targetEye = crouched ? PLAYER.crouchEye : PLAYER.standEye;
  eyeH += (targetEye - eyeH) * (1 - Math.exp(-14 * dt));

  if (camMode === CAM.TOP) {
    if (Math.hypot(v.x, v.z) > 0.4) playerYaw = Math.atan2(-v.x, -v.z);
  } else {
    playerYaw = state.yaw;
  }

  // In top-down the fly pad and E/Q become zoom controls.
  if (camMode === CAM.TOP) {
    const out = state.flyUp   || keys.has('KeyE');
    const inn = state.flyDown || keys.has('KeyQ');
    if (out) topZoom = Math.min(90, topZoom + 22 * dt);
    if (inn) topZoom = Math.max(8, topZoom - 22 * dt);
  }
}

// Camera modes
// ---------------------------------------------------------------------------
const CAM = { FIRST: 0, THIRD: 1, TOP: 2, FREE: 3 };
const CAM_NAMES = ['First Person', 'Third Person', 'Top Down', 'Free Camera'];
let camMode = CAM.FREE;               // start exactly as the old build did
let lastGameCam = CAM.FIRST;
let topZoom = 26;
let blendT = 1;                        // 1 = settled, <1 = mid transition
const BLEND_DUR = 0.42;
const blendPos = new THREE.Vector3();
const blendQuat = new THREE.Quaternion();

function setCamMode(next) {
  if (next === camMode) return;
  let snap = false;

  if (next === CAM.FREE) {
    lastGameCam = camMode;
    // Hand the flying camera the transform we are already looking through so
    // detaching from physics is seamless; yaw/pitch are shared already.
    state.pos.copy(camera.position);
  } else if (camMode === CAM.FREE) {
    snap = true;                       // re-attaching jumps straight to the body
    playerBody.wakeUp();
  }

  camMode = next;
  if (snap) {
    blendT = 1;
  } else {
    blendPos.copy(camera.position);
    blendQuat.copy(camera.quaternion);
    blendT = 0;
  }
  refreshModeUI();
}
function cycleCamera()   { setCamMode((camMode + 1) % 4); }
function toggleGameMode() { setCamMode(camMode === CAM.FREE ? lastGameCam : CAM.FREE); }

const desiredPos  = new THREE.Vector3();
const desiredQuat = new THREE.Quaternion();
const camEuler    = new THREE.Euler(0, 0, 0, 'YXZ');
const camTarget   = new THREE.Vector3();
const camBack     = new THREE.Vector3();
const boomRay     = new THREE.Raycaster();

function updateCamera(dt) {
  const p = playerBody.position;
  const feetY = p.y - centerOffset();

  if (camMode === CAM.FREE) {
    desiredPos.copy(state.pos);
    camEuler.set(state.pitch, state.yaw, 0);
  } else if (camMode === CAM.TOP) {
    desiredPos.set(p.x, feetY + topZoom, p.z);
    camEuler.set(-Math.PI / 2, 0, 0);
  } else {
    camEuler.set(state.pitch, state.yaw, 0);
    if (camMode === CAM.FIRST) {
      desiredPos.set(p.x, feetY + eyeH, p.z);
    } else {
      camTarget.set(p.x, feetY + eyeH * 0.86, p.z);
      camBack.set(0, 0, 1).applyEuler(camEuler);      // straight back along view
      let dist = THIRD_DIST;
      boomRay.set(camTarget, camBack);
      boomRay.far = dist + 0.5;
      const hit = boomRay.intersectObjects(objects.children, false)[0];
      if (hit) dist = Math.max(1.1, hit.distance - 0.35);   // pull in through trunks
      desiredPos.copy(camTarget).addScaledVector(camBack, dist);
    }
    // The boom ray only knows about the props. Terrain is a single 80k-triangle
    // mesh and raycasting it every frame is not worth it when the heightmap can
    // answer the same question directly: never let the boom leave the camera
    // inside a hillside. (Top-down needs no such guard — it sits straight above
    // the player, and a heightmap has nothing overhead.)
    // 1.2 of clearance, not a hair: terrainHeight is the smooth surface, while
    // the mesh is flat triangles across a 2-unit cell, and in a valley cell the
    // triangle can sit up to ~0.7 above the curve it is chasing.
    const floorY = terrainHeight(desiredPos.x, desiredPos.z) + 1.2;
    if (desiredPos.y < floorY) desiredPos.y = floorY;
  }
  desiredQuat.setFromEuler(camEuler);

  if (blendT < 1) {
    blendT = Math.min(1, blendT + dt / BLEND_DUR);
    const s = blendT * blendT * (3 - 2 * blendT);       // smoothstep
    camera.position.lerpVectors(blendPos, desiredPos, s);
    camera.quaternion.slerpQuaternions(blendQuat, desiredQuat, s);
  } else {
    camera.position.copy(desiredPos);
    camera.quaternion.copy(desiredQuat);
  }

  playerMesh.visible = camMode !== CAM.FIRST;
  playerMesh.geometry = crouched ? playerGeoCrouch : playerGeoStand;
  visor.position.y = crouched ? 0.10 : 0.42;
  playerMesh.position.set(p.x, p.y, p.z);
  playerMesh.rotation.y = playerYaw;
}

window.addEventListener('wheel', (e) => {
  if (camMode !== CAM.TOP) return;
  topZoom = THREE.MathUtils.clamp(topZoom + e.deltaY * 0.03, 8, 90);
  e.preventDefault();
}, { passive: false });

function resize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const aspect = w / Math.max(h, 1);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w, h, false);
  camera.aspect = aspect;
  // Original used a 90-degree vertical FOV at 16:9. Here the horizontal FOV is
  // pinned near 90 degrees and the vertical is derived, so portrait phones keep
  // a usable view instead of a keyhole.
  camera.fov = THREE.MathUtils.clamp(
    2 * Math.atan(Math.tan(45 * DEG) / aspect) / DEG, 55, 95
  );
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

// ---------------------------------------------------------------------------
// Wind noise plane (debug visualisation)
// ---------------------------------------------------------------------------
// A slab of scrolling fbm at 500m that makes the wind field visible: bright is
// strong, dark is slack, and the whole pattern drifts downwind at windSpeed.
// Hidden by default (uAlpha 0) — the Settings panel switches it on.
const windPlaneMat = new THREE.ShaderMaterial({
  transparent: true,
  side: THREE.DoubleSide,
  depthWrite: false,
  uniforms: {
    uTime:      waterTime,
    // Shared with the ocean surface, which reads the same field: normalised
    // (east, north), the meteorological "from" vector, so windDir 270 gives
    // (-1, 0) and the pattern below ends up drifting east.
    uWindDir:   windDirU,
    uWindSpeed: windSpeedU,
    uAlpha:     { value: 0.0 },                       // 0 hidden, 0.55 visible
  },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: /* glsl */`
    varying vec2 vUv;
    uniform float uTime;
    uniform vec2 uWindDir;
    uniform float uWindSpeed;
    uniform float uAlpha;

    float hash21(vec2 p) {
      p = fract(p * vec2(127.31, 311.7));
      p += dot(p, p + 34.23);
      return fract(p.x * p.y);
    }
    float vnoise(vec2 p) {
      vec2 i = floor(p), f = fract(p);
      vec2 u = f * f * (3.0 - 2.0 * f);
      return mix(
        mix(hash21(i), hash21(i + vec2(1, 0)), u.x),
        mix(hash21(i + vec2(0, 1)), hash21(i + vec2(1, 1)), u.x),
        u.y
      );
    }
    float fbm(vec2 p) {
      float s = 0.0, a = 0.5;
      for (int i = 0; i < 5; i++) {
        s += a * vnoise(p);
        p = p * 2.07 + 13.1;
        a *= 0.5;
      }
      return s;
    }
    void main() {
      // Marching the sample point along the "from" vector drags what we see the
      // opposite way, i.e. downwind: at 270 the noise streams west -> east.
      vec2 uv = vUv * 10.0 + uWindDir * uTime * uWindSpeed * 0.1;
      float n = fbm(uv);
      n = n * 0.85 + 0.075;
      gl_FragColor = vec4(vec3(n), uAlpha > 0.0 ? 1.0 : 0.0);
    }
  `,
});

const windPlane = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000), windPlaneMat);

windPlane.frustumCulled = false;
windPlane.renderOrder = 5;

  const h = Math.floor(hours);
  const m = Math.floor((hours - h) * 60);
  return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
}

// ----- sliders -----
// Sliders sit above the canvas, so their pointer events never reach the lock
// request — but if the pointer is *already* captured the browser routes
// everything to the canvas, so opening a panel hands the cursor back.
function bindSlider(id, fn) {
  const el = $(id);
  el.addEventListener('input', () => fn(parseFloat(el.value)));
  el.addEventListener('pointerdown', (e) => e.stopPropagation());
  return el;
}
