<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
<script>
// Cache-bust: if Safari serves a stale HTML, this forces a hard reload
(function(){
  var v = 3;
  var key = '__sv_game_v';
  try {
    var prev = parseInt(localStorage.getItem(key));
    if (prev && prev < v) {
      localStorage.setItem(key, v);
      location.replace(location.href.split('?')[0] + '?_=' + Date.now());
      return;
    }
    localStorage.setItem(key, v);
  } catch(e) {}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1220">
<title>Hermes 3D Engine — Web</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a56b8'/%3E%3Cpath d='M16 5l10 5.6v11L16 27 6 21.6v-11z' fill='none' stroke='%23cfe6ff' stroke-width='2.2' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    background: #0b1220;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    color: #e8eef7;
  }

  #view {
    display: block;
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  /* ---------- HUD ---------- */
  #hud {
    position: fixed;
    top: calc(10px + env(safe-area-inset-top));
    left: calc(10px + env(safe-area-inset-left));
    padding: 8px 11px;
    font-size: 13px;
    line-height: 1.5;
    letter-spacing: 0.02em;
    background: rgba(8, 14, 24, 0.5);
    border: 1px solid rgba(160, 200, 255, 0.16);
    border-radius: 8px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    pointer-events: none;
    white-space: pre;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
    z-index: 10;
  }
  #hud .k { color: #7fa8d8; }
  #hud .v { color: #eaf2ff; }

  #crosshair {
    position: fixed;
    left: 50%;
    top: 50%;
    width: 18px;
    height: 18px;
    margin: -9px 0 0 -9px;
    pointer-events: none;
    opacity: 0.55;
    z-index: 9;
  }
  #crosshair::before, #crosshair::after {
    content: "";
    position: absolute;
    background: #fff;
    box-shadow: 0 0 3px rgba(0, 0, 0, 0.9);
  }
  #crosshair::before { left: 50%; top: 0; width: 1.5px; height: 100%; margin-left: -0.75px; }
  #crosshair::after  { top: 50%; left: 0; height: 1.5px; width: 100%; margin-top: -0.75px; }
  body.touch #crosshair { opacity: 0.3; }

  #sprint {
    position: fixed;
    top: calc(12px + env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%) scale(0.9);
    padding: 5px 14px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.18em;
    border-radius: 999px;
    background: rgba(255, 168, 60, 0.18);
    border: 1px solid rgba(255, 190, 110, 0.55);
    color: #ffd7a0;
    opacity: 0;
    transition: opacity 0.12s ease, transform 0.12s ease;
    pointer-events: none;
    z-index: 10;
  }
  #sprint.on { opacity: 1; transform: translateX(-50%) scale(1); }

  /* Tint that fades in while the camera is under the water surface. */
  #underwater {
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.28s ease;
    background:
      radial-gradient(ellipse at 50% 45%, rgba(60, 170, 220, 0.10), rgba(6, 52, 84, 0.50) 76%),
      linear-gradient(180deg, rgba(70, 180, 230, 0.16), rgba(4, 34, 60, 0.40));
  }
  #underwater.on { opacity: 1; }

  /* On a narrow phone the centred pill would collide with the HUD panel. */
  @media (max-width: 620px) {
    #hud { font-size: 11px; padding: 6px 9px; }
    #sprint {
      top: auto;
      bottom: calc(26px + env(safe-area-inset-bottom));
    }
  }

  /* ---------- Touch controls ---------- */
  #touch-ui { display: none; }
  body.touch #touch-ui { display: block; }

  #stick-base {
    position: fixed;
    left: 28px;
    bottom: calc(34px + env(safe-area-inset-bottom));
    width: 132px;
    height: 132px;
    margin: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, rgba(120, 170, 230, 0.10), rgba(120, 170, 230, 0.03) 70%);
    border: 1.5px solid rgba(150, 195, 245, 0.28);
    opacity: 0.5;
    transition: opacity 0.15s ease;
    pointer-events: none;
    z-index: 8;
  }
  #stick-base.active { opacity: 0.95; transition: none; }

  #stick-knob {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 58px;
    height: 58px;
    margin: -29px 0 0 -29px;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 32%, rgba(235, 245, 255, 0.85), rgba(130, 175, 225, 0.5));
    border: 1.5px solid rgba(230, 242, 255, 0.7);
    box-shadow: 0 3px 12px rgba(0, 0, 0, 0.35);
  }

  .fly-btn {
    position: fixed;
    right: calc(26px + env(safe-area-inset-right));
    width: 76px;
    height: 76px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    line-height: 1;
    color: #dce9f8;
    background: rgba(20, 34, 54, 0.5);
    border: 1.5px solid rgba(150, 195, 245, 0.35);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    touch-action: none;
    z-index: 12;
  }
  .fly-btn.down { background: rgba(90, 160, 235, 0.55); border-color: rgba(220, 240, 255, 0.85); color: #fff; }
  #btn-up   { bottom: calc(130px + env(safe-area-inset-bottom)); }
  #btn-down { bottom: calc(40px + env(safe-area-inset-bottom)); }

  /* Fly/zoom pad only in free + top-down; action pad only in first/third. */
  #touch-ui .fly-btn { display: none; }
  #touch-ui .act-btn { display: none; }
  body.touch.pad-fly #touch-ui .fly-btn { display: flex; }
  body.touch.pad-act #touch-ui .act-btn { display: flex; }

  .act-btn {
    position: fixed;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    line-height: 1;
    color: #dce9f8;
    background: rgba(20, 34, 54, 0.5);
    border: 1.5px solid rgba(150, 195, 245, 0.35);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    touch-action: none;
    z-index: 12;
  }
  .act-btn .glyph { font-size: 20px; }
  .act-btn.down { background: rgba(90, 160, 235, 0.55); border-color: rgba(220, 240, 255, 0.85); color: #fff; }
  #btn-jump {
    right: calc(24px + env(safe-area-inset-right));
    bottom: calc(44px + env(safe-area-inset-bottom));
    width: 90px; height: 90px; font-size: 12px;
  }
  #btn-crouch {
    right: calc(124px + env(safe-area-inset-right));
    bottom: calc(40px + env(safe-area-inset-bottom));
    width: 72px; height: 72px;
  }
  #btn-sprint {
    right: calc(34px + env(safe-area-inset-right));
    bottom: calc(146px + env(safe-area-inset-bottom));
    width: 72px; height: 72px;
  }
  #btn-sprint.down { background: rgba(255, 168, 60, 0.5); border-color: rgba(255, 210, 150, 0.9); color: #fff; }

  /* ---------- Mode UI ---------- */
  #mode-btn {
    position: fixed;
    top: calc(10px + env(safe-area-inset-top));
    right: calc(10px + env(safe-area-inset-right));
    padding: 11px 18px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #06101f;
    background: linear-gradient(180deg, #cfe6ff, #7db4ee);
    border: none;
    border-radius: 999px;
    box-shadow: 0 4px 18px rgba(90, 150, 220, 0.35);
    cursor: pointer;
    touch-action: manipulation;
    /* Above the pause overlay (50): releasing the mouse pops that overlay up, and
       a mode button you cannot reach while paused is a mode button that "does not
       always work". */
    z-index: 60;
  }
  #mode-btn.game { background: linear-gradient(180deg, #ffd9a8, #f0a054); }
  #mode-btn:active { transform: translateY(1px); }

  #cam-mode {
    position: fixed;
    top: calc(62px + env(safe-area-inset-top));
    left: calc(10px + env(safe-area-inset-left));
    padding: 5px 10px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #9ecbff;
    background: rgba(8, 14, 24, 0.5);
    border: 1px solid rgba(160, 200, 255, 0.16);
    border-radius: 7px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    pointer-events: none;
    white-space: nowrap;
    z-index: 10;
  }

  #instructions {
    position: fixed;
    top: calc(58px + env(safe-area-inset-top));
    right: calc(10px + env(safe-area-inset-right));
    width: 216px;
    max-width: 46vw;
    padding: 9px 11px;
    font-size: 11px;
    line-height: 1.45;
    background: rgba(8, 14, 24, 0.5);
    border: 1px solid rgba(160, 200, 255, 0.16);
    border-radius: 8px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    pointer-events: none;
    z-index: 10;
  }
  #instructions .title {
    display: block;
    margin-bottom: 5px;
    font-size: 10px;
    letter-spacing: 0.16em;
    color: #6f92bd;
    text-transform: uppercase;
  }
  #instructions .row { display: flex; gap: 8px; justify-content: space-between; }
  #instructions b { color: #9ecbff; font-weight: 600; white-space: nowrap; }
  #instructions span { color: #b9c9dc; text-align: right; }

  @media (max-width: 620px) {
    #mode-btn { font-size: 11px; padding: 9px 14px; }
    #cam-mode { top: calc(52px + env(safe-area-inset-top)); font-size: 10px; }
    #instructions { width: 168px; font-size: 10px; padding: 7px 9px; top: calc(52px + env(safe-area-inset-top)); }
  }

  /* ---------- Weather controls (free camera only) ---------- */
  #cloud-ui {
    position: fixed;
    left: calc(10px + env(safe-area-inset-left));
    bottom: calc(22px + env(safe-area-inset-bottom));
    width: 236px;
    max-width: 62vw;
    padding: 9px 11px 10px;
    font-size: 11px;
    line-height: 1.4;
    background: rgba(8, 14, 24, 0.58);
    border: 1px solid rgba(160, 200, 255, 0.16);
    border-radius: 8px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: none;
    z-index: 60;
  }
  body.free-cam #cloud-ui { display: block; }
  /* On touch the whole left half of the screen is the fly joystick — it is placed
     wherever the thumb lands — so a panel down there eats input. Move it up under
     the camera-mode chip, well clear of where a thumb naturally rests. */
  body.touch #cloud-ui {
    top: calc(80px + env(safe-area-inset-top));
    bottom: auto;
  }

  #cloud-ui .title {
    display: block;
    margin-bottom: 6px;
    font-size: 10px;
    letter-spacing: 0.16em;
    color: #6f92bd;
    text-transform: uppercase;
  }
  .wx-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-top: 5px;
  }
  .wx-row .lbl { color: #7fa8d8; white-space: nowrap; }
  .wx-row .lbl b { color: #eaf2ff; font-weight: 700; }
  .wx-btn {
    flex: 0 0 auto;
    min-width: 82px;
    padding: 5px 10px;
    font-family: inherit;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: #eaf2ff;
    background: rgba(70, 120, 190, 0.34);
    border: 1px solid rgba(150, 195, 245, 0.42);
    border-radius: 6px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .wx-btn:active { background: rgba(110, 170, 240, 0.6); }
  .wx-btn.off { color: #93a4b8; background: rgba(60, 72, 90, 0.32); }
  #wx-foot { margin-top: 7px; color: #62819f; font-size: 10px; }
  #wx-foot b { color: #9ecbff; }
  /* A phone has no number row — on touch the buttons are the whole interface. */
  body.touch #cloud-ui .key { display: none; }

  @media (max-width: 620px) {
    /* Narrow enough to sit beside #instructions on a 390-wide phone. */
    #cloud-ui { width: 190px; font-size: 10px; padding: 7px 9px 8px; }
    .wx-btn { min-width: 66px; font-size: 10px; padding: 5px 7px; }
  }

  /* ---------- Start / pause overlay ---------- */
  #overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding: 28px;
    text-align: center;
    background: radial-gradient(ellipse at 50% 40%, rgba(24, 44, 78, 0.82), rgba(6, 10, 18, 0.94));
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
  }
  #overlay.hidden { display: none; }

  #overlay h1 {
    font-size: clamp(22px, 6vw, 36px);
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    background: linear-gradient(180deg, #ffffff, #8fc0f0);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  #overlay .sub {
    font-size: 12px;
    letter-spacing: 0.24em;
    color: #6f92bd;
    text-transform: uppercase;
    margin-top: -14px;
  }

  #keys {
    display: grid;
    grid-template-columns: auto auto;
    gap: 7px 18px;
    font-size: 13px;
    text-align: left;
    padding: 18px 22px;
    border-radius: 12px;
    background: rgba(10, 18, 32, 0.55);
    border: 1px solid rgba(140, 185, 240, 0.18);
    max-width: 100%;
  }
  #keys b { color: #9ecbff; font-weight: 600; white-space: nowrap; }
  #keys span { color: #b9c9dc; }

  #start-btn {
    padding: 14px 34px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #06101f;
    background: linear-gradient(180deg, #cfe6ff, #7db4ee);
    border: none;
    border-radius: 999px;
    box-shadow: 0 6px 24px rgba(90, 150, 220, 0.35);
    cursor: pointer;
    touch-action: manipulation;
  }
  #start-btn:active { transform: translateY(1px); }

  #loading {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0b1220;
    color: #7fa8d8;
    font-size: 13px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    z-index: 60;
  }
  #loading.hidden { display: none; }
  #err {
    padding: 24px;
    color: #ffb4b4;
    font-size: 13px;
    line-height: 1.6;
    white-space: pre-wrap;
    text-align: left;
  }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="hud"><span class="k">FPS</span> <span class="v" id="fps">--</span>
<span class="k">POS</span> <span class="v" id="pos">--</span>
<span class="k" style="color:#ff0">v21-rain</span></div>

<div id="cam-mode">Cam &mdash; Free</div>
<div id="instructions"></div>
<button id="mode-btn" class="ui-el">Game Mode</button>

<div id="cloud-ui" class="ui-el">
  <span class="title">Weather</span>
  <div class="wx-row"><span class="lbl"><b class="key">1</b> Spawn rate</span><button class="wx-btn" id="wx-rate">Medium</button></div>
  <div class="wx-row"><span class="lbl"><b class="key">2</b> Wind speed</span><button class="wx-btn" id="wx-speed">Medium</button></div>
  <div class="wx-row"><span class="lbl"><b class="key">3</b> Storminess</span><button class="wx-btn" id="wx-storm">Mixed</button></div>
  <div id="wx-foot"><span class="key"><b>3</b> storm mix &middot; <b>4</b> spawn now &middot; <b>0</b> clear &mdash; </span>sky: <span id="wx-count">0</span><br><span id="wx-cloud-info">nearest: &mdash;</span></div>
</div>

<div id="underwater"></div>
<div id="crosshair"></div>
<div id="sprint">SPRINT</div>

<div id="touch-ui">
  <div id="stick-base"><div id="stick-knob"></div></div>
  <div class="fly-btn" id="btn-up">&#9650;</div>
  <div class="fly-btn" id="btn-down">&#9660;</div>
  <div class="act-btn" id="btn-jump"><span class="glyph">&#8679;</span>JUMP</div>
  <div class="act-btn" id="btn-crouch"><span class="glyph">&#8681;</span>CROUCH</div>
  <div class="act-btn" id="btn-sprint"><span class="glyph">&#187;</span>SPRINT</div>
</div>

<div id="overlay">
  <div>
    <h1>Hermes 3D</h1>
  </div>
  <div class="sub">Engine &mdash; Web Edition</div>
  <div id="keys"></div>
  <button id="start-btn">Enter</button>
</div>

<div id="loading">Loading&hellip;</div>

<script src="lib/three.js?v=2"></script>
<script src="lib/cannon-global.js?v=2"></script>
<script type="module">
// THREE and CANNON are loaded as globals from the script tags above.

// ---------------------------------------------------------------------------
// Constants — mirrored from engine.py
// ---------------------------------------------------------------------------
const MOUSE_SENSITIVITY = 0.15;   // degrees of rotation per pixel of pointer motion
const MOVE_SPEED        = 14.0;   // world units / second
const SPRINT_MULT       = 3.0;
const TOUCH_LOOK_MULT   = 1.6;    // finger drags cover fewer pixels than a mouse
const START_POS         = new THREE.Vector3(0, 52, -168);
const START_YAW         = 180;    // degrees — faces the island (see notes below)
const START_PITCH       = -13;    // degrees

// ----- character controller -----
// Offshore until the terrain exists — the island generator moves the spawn onto
// solid ground in the middle of the landmass once it knows how high that is.
const SPAWN      = new THREE.Vector3(0, 2, 0);
const SPAWN_YAW  = 20;            // degrees
const PHYS_STEP  = 1 / 60;        // fixed physics timestep
const PLAYER = {
  radius:       0.4,
  standCenter:  0.8,              // body origin above the feet, standing
  crouchCenter: 0.4,              // ... and crouched
  standEye:     1.7,
  crouchEye:    0.72,
  walk:         4.6,
  sprintMult:   2.0,
  crouchSpeed:  2.0,
  jumpSpeed:    6.2,
  groundAccel:  18.0,
  airAccel:     7.0,
  coyote:       0.12,             // seconds of grace after leaving the ground
  maxSlope:     45,               // degrees — steeper than this and you slide
};
// A contact counts as walkable ground when its normal is within maxSlope of up.
// The threshold is nudged 1 degree past 45 so the 45-degree lane is climbable.
const GROUND_DOT = Math.cos((PLAYER.maxSlope + 1) * Math.PI / 180);
const THIRD_DIST = 5.0;           // third-person boom length

// ----- the sea -----
// There is no basin any more: the ocean is everywhere and the island rises out
// of it, so the swim tests only ever care about how deep you are, never about
// whether you are inside some footprint.
const WATER = {
  floorY: -60,          // only bounds the underwater tint; the sea floor is terrain
  surfaceY: 0.0,        // sea level, and the datum every height below is measured from
  gravityScale: 0.20,   // buoyancy — only a fifth of gravity reaches you in here
  speedMult: 0.60,      // swimming is slower than walking
  accel: 6.0,           // how fast you reach swim speed; doubles as water drag
  swimIn:  0.55,        // submerged fraction where walking becomes swimming ...
  swimOut: 0.42,        // ... and where swimming hands back to walking
};
const WATER_FOG = 0x11506f;
const inWaterColumn = () => true;

// ----- island -----
const TERRAIN_SIZE = 400;    // square heightfield, centred on the origin
const TERRAIN_SEGS = 200;    // 2-unit cells — the mesh and the collider share them
const ISLAND_R     = 116;    // mean radius of the shoreline
const PEAK_H       = 34;     // how high the hills get above sea level
const SEABED_DEPTH = 16;     // how far the sea floor drops away offshore

const SUN = new THREE.Vector3(0.45, 0.72, 0.52).normalize();
const SKY_ZENITH  = new THREE.Color(0x1a56b8);
const SKY_HORIZON = new THREE.Color(0xbdd6ec);
const SKY_GROUND  = new THREE.Color(0x64798a);
const FOG_COLOR   = 0xb8d1e8;
// Thinner than the old courtyard scene needed: the island is 200 units across
// and is meant to be legible from offshore, but the haze still has to swallow
// the ocean before its edge reaches the far plane. This one is ~97% opaque by
// 700 units, and barely touches anything inside 150.
const FOG_DENSITY = 0.0028;

const DEG = Math.PI / 180;
const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

// ----- the visible sea -----
// The surface is a disc that rides with the camera, so there is always ocean out
// to the horizon whichever way you look and however far you swim. Its rings are
// spaced geometrically: dense enough under your feet to carry the surf, coarse
// far out where the fog has already swallowed everything anyway.
const OCEAN_R      = 1180;   // radius of the surface disc — 2360 across
const OCEAN_R0     = 0.9;    // radius of the innermost ring
const OCEAN_RINGS  = isTouchDevice ? 96 : 148;
const OCEAN_SPOKES = isTouchDevice ? 128 : 192;
// Kept comfortably inside the disc so the surface is always the thing that
// draws the horizon; the bed only has to cover the gap the heightfield leaves.
const DEEP_SIZE    = 1400;   // the flat bed under the lot

// ---------------------------------------------------------------------------
// Renderer / scene / camera
// ---------------------------------------------------------------------------
const canvas = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true,
  powerPreference: 'high-performance',
  stencil: false,
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isTouchDevice ? 2 : 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(FOG_COLOR, FOG_DENSITY);

// The far plane has to swallow the weather: clouds spawn up to 1500 units out and
// are meant to be readable from there, so 1000 would have clipped them away before
// they ever appeared. Pushing near out to 0.25 at the same time leaves the depth
// range *better* conditioned than the old 0.1/1000 pair, and nothing in the scene
// ever gets within a quarter unit of the eye.
const camera = new THREE.PerspectiveCamera(75, 1, 0.25, 3200);
camera.rotation.order = 'YXZ';
camera.position.copy(START_POS);

// ---------------------------------------------------------------------------
// Gradient sky (custom shader dome that rides along with the camera)
// ---------------------------------------------------------------------------
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  depthWrite: false,
  uniforms: {
    // Cloned: the weather lerps these towards an overcast palette every frame,
    // and the constants have to survive as the fair-weather end of that mix.
    uZenith:  { value: SKY_ZENITH.clone() },
    uHorizon: { value: SKY_HORIZON.clone() },
    uGround:  { value: SKY_GROUND.clone() },
    uSunDir:  { value: SUN.clone() },
    uSunCol:  { value: new THREE.Color(0xfff0cf) },
  },
  vertexShader: /* glsl */`
    varying vec3 vDir;
    void main() {
      vDir = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: /* glsl */`
    varying vec3 vDir;
    uniform vec3 uZenith, uHorizon, uGround, uSunDir, uSunCol;
    void main() {
      vec3 d = normalize(vDir);
      float up = clamp(d.y, 0.0, 1.0);
      float dn = clamp(-d.y, 0.0, 1.0);
      vec3 col = mix(uHorizon, uZenith, pow(up, 0.48));
      col = mix(col, uGround, pow(dn, 0.30));

      float sd = max(dot(d, normalize(uSunDir)), 0.0);
      col += uSunCol * (pow(sd, 900.0) * 6.0 + pow(sd, 30.0) * 0.35 + pow(sd, 4.0) * 0.10);

      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }
  `,
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 32), skyMat);
sky.scale.setScalar(600);
sky.renderOrder = -1000;
sky.frustumCulled = false;
scene.add(sky);

// ---------------------------------------------------------------------------
// Environment map for PBR reflections (procedural equirect -> PMREM)
// ---------------------------------------------------------------------------
function buildEnvTexture() {
  const W = 1024, H = 512;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');

  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0.00, '#2f6ec4');
  g.addColorStop(0.38, '#7fb0e2');
  g.addColorStop(0.49, '#cfe1f2');
  g.addColorStop(0.52, '#8fa08a');
  g.addColorStop(1.00, '#3d5236');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  const u = ((Math.atan2(SUN.x, SUN.z) / (2 * Math.PI)) + 0.5) * W;
  const v = (1 - (Math.asin(THREE.MathUtils.clamp(SUN.y, -1, 1)) / Math.PI + 0.5)) * H;
  const rg = ctx.createRadialGradient(u, v, 0, u, v, 200);
  rg.addColorStop(0.00, 'rgba(255, 248, 226, 1)');
  rg.addColorStop(0.18, 'rgba(255, 240, 205, 0.60)');
  rg.addColorStop(1.00, 'rgba(255, 238, 200, 0)');
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = rg;
  ctx.fillRect(0, 0, W, H);

  const tex = new THREE.Texture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.needsUpdate = true;
  return tex;
}

const pmrem = new THREE.PMREMGenerator(renderer);
const envSrc = buildEnvTexture();
scene.environment = pmrem.fromEquirectangular(envSrc).texture;
envSrc.dispose();
pmrem.dispose();

// ---------------------------------------------------------------------------
// Lighting
// ---------------------------------------------------------------------------
// The island is centred on the origin, so the shadow frustum is too — it is
// sized to swallow the landmass and a margin of the water around it.
const SHADOW_CENTER = new THREE.Vector3(0, 6, 0);
const SHADOW_HALF   = 132;
const SUN_DIST      = 190;

const sun = new THREE.DirectionalLight(0xfff4e0, 2.9);
sun.position.copy(SUN).multiplyScalar(SUN_DIST).add(SHADOW_CENTER);
sun.castShadow = true;
sun.shadow.mapSize.set(isTouchDevice ? 2048 : 4096, isTouchDevice ? 2048 : 4096);
// near/far hug the actual depth range of the scene along the light direction.
// The old 1..400 range meant one unit of depth bias was worth ~0.2 world units,
// which is what detached shadows from the objects casting them and left a bright
// seam at every contact point.
sun.shadow.camera.near = 30;
sun.shadow.camera.far  = 380;
sun.shadow.camera.left = -SHADOW_HALF;
sun.shadow.camera.right = SHADOW_HALF;
sun.shadow.camera.top = SHADOW_HALF;
sun.shadow.camera.bottom = -SHADOW_HALF;
// With the tight frustum the constant bias can be an order of magnitude smaller;
// the remaining acne is handled by normalBias, which offsets along the surface
// normal (~half a shadow texel) instead of along the light and so does not open
// a gap where an object meets the floor. The terrain shadows itself across the
// whole island, and gentle slopes lit near-edge-on are where acne shows up, so
// the normal offset is a good deal larger than it needed to be for boxes.
sun.shadow.bias = -0.00008;
sun.shadow.normalBias = isTouchDevice ? 0.16 : 0.10;
sun.shadow.radius = 2;
sun.target.position.copy(SHADOW_CENTER);
scene.add(sun);
scene.add(sun.target);

// Named, because the weather drives them: heavy cloud overhead pulls the sun and
// the sky fill down, and a lightning strike briefly slams the ambient up.
const SUN_BASE = 2.9, HEMI_BASE = 0.55, AMB_BASE = 0.18;
const hemiLight = new THREE.HemisphereLight(0xbcd8f5, 0x4a5a3c, HEMI_BASE);
const ambLight  = new THREE.AmbientLight(0xffffff, AMB_BASE);
scene.add(hemiLight);
scene.add(ambLight);

// ---------------------------------------------------------------------------
// Physics world (cannon-es)
// ---------------------------------------------------------------------------
const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.82, 0) });
world.broadphase = new CANNON.SAPBroadphase(world);
world.allowSleep = true;
world.solver.iterations = 10;
world.defaultContactMaterial.friction = 0.4;
world.defaultContactMaterial.restitution = 0.0;

const physWorld  = new CANNON.Material('world');
const physProp   = new CANNON.Material('prop');
const physPlayer = new CANNON.Material('player');

// The character drives its own horizontal velocity, so friction against the
// level would only fight the controller — zero it and let the code decide when
// the player sticks (walkable ground) and when they slide (steep ground).
world.addContactMaterial(new CANNON.ContactMaterial(physPlayer, physWorld, { friction: 0.0, restitution: 0.0 }));
world.addContactMaterial(new CANNON.ContactMaterial(physPlayer, physProp,  { friction: 0.0, restitution: 0.0 }));
world.addContactMaterial(new CANNON.ContactMaterial(physProp,   physWorld, { friction: 0.45, restitution: 0.06 }));
world.addContactMaterial(new CANNON.ContactMaterial(physProp,   physProp,  { friction: 0.4,  restitution: 0.06 }));

// Meshes that need to follow their body every frame (dynamic + kinematic only —
// static bodies never move, so syncing them would be pure overhead).
const syncList = [];
function linkBody(mesh, body) {
  // Body.addShape() computes the AABB while the body is still at the origin and
  // clears aabbNeedsUpdate. Only integrate() ever raises the flag again, and a
  // static body never integrates — so without this its AABB stays in local space
  // forever. Collisions still work (SAP broadphase defaults to bounding spheres),
  // but World.raycast* queries the AABBs and would miss the entire level.
  body.updateAABB();
  world.addBody(body);
  mesh.userData.body = body;
  if (body.type !== CANNON.Body.STATIC) syncList.push({ mesh, body });
  return body;
}

// ---------------------------------------------------------------------------
// Scene object helpers — shared geometry, PBR materials, matched colliders
// ---------------------------------------------------------------------------
const boxGeo    = new THREE.BoxGeometry(1, 1, 1);
const sphereGeo = new THREE.SphereGeometry(1, 32, 20);
const objects = new THREE.Group();
scene.add(objects);

// opts: { rx, ry, rz } rotation in degrees, { mass } (0 = static), { phys: false }
// to skip the collider entirely, { prop: true } to use the higher-friction
// contact material used by loose objects.
function addBox(x, y, z, sx, sy, sz, mat, opts = {}) {
  const rx = (opts.rx || 0) * DEG, ry = (opts.ry || 0) * DEG, rz = (opts.rz || 0) * DEG;
  const m = new THREE.Mesh(boxGeo, mat);
  m.position.set(x, y, z);
  m.scale.set(sx, sy, sz);
  m.rotation.set(rx, ry, rz);
  m.castShadow = true;
  m.receiveShadow = true;
  objects.add(m);
  if (opts.phys === false) return m;

  const body = new CANNON.Body({
    mass: opts.mass || 0,
    material: opts.prop ? physProp : physWorld,
    shape: new CANNON.Box(new CANNON.Vec3(sx / 2, sy / 2, sz / 2)),
    linearDamping: opts.mass ? 0.04 : 0,
    angularDamping: opts.mass ? 0.2 : 0,
  });
  body.position.set(x, y, z);
  body.quaternion.setFromEuler(rx, ry, rz);
  linkBody(m, body);
  return m;
}

function addSphere(x, y, z, r, mat, opts = {}) {
  const m = new THREE.Mesh(sphereGeo, mat);
  m.position.set(x, y, z);
  m.scale.setScalar(r);
  m.castShadow = true;
  m.receiveShadow = true;
  objects.add(m);
  if (opts.phys === false) return m;

  const body = new CANNON.Body({
    mass: opts.mass || 0,
    material: opts.prop ? physProp : physWorld,
    shape: new CANNON.Sphere(r),
    linearDamping: opts.mass ? 0.04 : 0,
    angularDamping: opts.mass ? 0.25 : 0,
  });
  body.position.set(x, y, z);
  linkBody(m, body);
  return m;
}

const mat = (color, roughness, metalness, extra = {}) => new THREE.MeshStandardMaterial(
  Object.assign({
    color, roughness, metalness, envMapIntensity: 0.85,
    // Casting from backfaces keeps depth-bias needs tiny on closed solids, which
    // is the other half of the shadow-seam fix.
    shadowSide: THREE.BackSide,
  }, extra)
);

// ---------------------------------------------------------------------------
// Island — one heightmap drives all of it: the visible mesh, its colours, the
// physics collider, where the player spawns and where the props may stand.
// ---------------------------------------------------------------------------

// Deterministic PRNG. The seed is drawn fresh on every load, so each visit gets
// a different island, but feeding the same seed back reproduces one exactly —
// it is published on window.hermes for that.
const SEED = (Math.random() * 0xffffffff) >>> 0;
function mulberry32(a) {
  return function () {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(SEED);

// Sum-of-sines noise: each octave is three plane waves pointing in random
// directions, which is what stops the result lining up with the x/z axes the way
// a sin(x) * cos(z) lattice does. Smooth by construction, so slopes can be read
// off it with plain finite differences.
//
// Waves with independent phases only rarely line up, so dividing by the total
// amplitude would leave the output cowering around a quarter of full scale and
// the island would come out a smooth dome. The extra factor puts the spread
// where the callers below assume it is: std ~0.45, peaks around 1, and the odd
// excursion past it (the terrain code clamps where that would matter).
function makeNoise(octaves, baseFreq, lacunarity = 2.07, gain = 0.5) {
  const waves = [];
  let f = baseFreq, a = 1, norm = 0;
  for (let o = 0; o < octaves; o++) {
    for (let k = 0; k < 3; k++) {
      const ang = rand() * Math.PI * 2;
      waves.push({ kx: Math.cos(ang) * f, kz: Math.sin(ang) * f, ph: rand() * Math.PI * 2, a: a / 3 });
    }
    norm += a;
    f *= lacunarity;
    a *= gain;
  }
  const inv = 1.75 / norm;
  return (x, z) => {
    let s = 0;
    for (let i = 0; i < waves.length; i++) {
      const w = waves[i];
      s += w.a * Math.sin(w.kx * x + w.kz * z + w.ph);
    }
    return s * inv;
  };
}

// The base frequencies matter more than they look: a first octave longer than
// the island itself is a constant across it — a per-seed bias that shifts the
// whole landmass up or down instead of shaping it. These start at wavelengths of
// 200-300 units, a touch wider than the island, so the coarsest octave still
// swings from one side of it to the other.
const nCoast  = makeNoise(3, 0.0200, 2.3, 0.55);   // bays and headlands
const nHills  = makeNoise(4, 0.0300);              // the broad shape of the land
const nRidge  = makeNoise(3, 0.0260);              // creases that read as ridgelines
const nDetail = makeNoise(3, 0.0520, 2.15, 0.48);  // bumps you notice on foot

const smooth = (t) => (t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t));

// The high ground is pushed off-centre, which keeps the island from reading as a
// symmetric cone and puts the spawn clearing on a shoulder rather than on top of
// the tallest thing on the map.
const SUMMIT_A = rand() * Math.PI * 2;
const SUMMIT_D = 26 + rand() * 32;
const SUMMIT_X = Math.cos(SUMMIT_A) * SUMMIT_D;
const SUMMIT_Z = Math.sin(SUMMIT_A) * SUMMIT_D;

function rawHeight(x, z) {
  // A wobbly radius, so the coast comes out as bays and points rather than a disc.
  const rr = Math.hypot(x, z) + nCoast(x, z) * 34;

  const land  = smooth((ISLAND_R - rr) / 82);       // 1 inland .. 0 at the water
  const shelf = smooth((rr - ISLAND_R + 34) / 76);  // 0 at the shore .. 1 out to sea

  // A broad rise towards the summit carries the relief that every seed is
  // guaranteed to get; the noise on top of it is what makes each one different.
  const dome = smooth((104 - Math.hypot(x - SUMMIT_X, z - SUMMIT_Z)) / 108);

  // Ridged noise (1 - |n|) creases along its zero crossings, which is what turns
  // a smooth cone into spurs with gullies between them. Both factors are floored
  // at zero: past the clamp they would dig pits rather than flatten. The mask is
  // squared over the lot, so the ground stays low and nearly flat for the last
  // stretch before the water — that band is the beach.
  const shape = Math.max(0, 0.42 + 0.58 * nHills(x, z))
              * Math.max(0, 1 - Math.abs(nRidge(x, z)));
  let h = PEAK_H * land * land * (0.42 * dome + Math.max(-0.12, 1.50 * (shape - 0.26)));
  h += land * 4.6;                                  // gentle rise out of the sand
  h += nDetail(x, z) * 1.9 * land;                  // enough to break up the slopes

  // Sea floor: away from the island it settles at a flat -SEABED_DEPTH so it
  // meets the deep-water plane without a step. The ripple is faded out at both
  // ends of the shelf for the same reason.
  h -= SEABED_DEPTH * shelf;
  h += nDetail(x * 0.7, z * 0.7) * 2.4 * shelf * (1 - shelf);

  return h;
}

// A clearing in the middle: the player has to land on solid, walkable ground, and
// a spawn dropped straight onto raw noise can be a cliff face or a puddle. The
// floor of 7 keeps the clearing well clear of the tideline even when the noise
// happens to put a hollow at the origin.
const CENTER_H = Math.max(rawHeight(0, 0), 7);
function terrainHeight(x, z) {
  const flat = smooth((34 - Math.hypot(x, z)) / 26) * 0.88;
  return rawHeight(x, z) * (1 - flat) + CENTER_H * flat;
}

// Slope as a gradient magnitude (0 = flat, 1 = 45 degrees, which is also the
// controller's limit) — used to keep the props off the cliffs.
function slopeAt(x, z) {
  const d = 1.6;
  const dx = terrainHeight(x + d, z) - terrainHeight(x - d, z);
  const dz = terrainHeight(x, z + d) - terrainHeight(x, z - d);
  return Math.hypot(dx, dz) / (2 * d);
}

const HALF = TERRAIN_SIZE / 2;
const CELL = TERRAIN_SIZE / TERRAIN_SEGS;

// Sampled once, on the lattice both the mesh and the collider use, so the two
// agree exactly — anything else and the ground you see is not the ground you
// stand on. HEIGHTS[i][j] is the height at x = -HALF + i*CELL, z = HALF - j*CELL,
// which is the layout cannon's Heightfield wants once it is rotated flat.
const HEIGHTS = [];
for (let i = 0; i <= TERRAIN_SEGS; i++) {
  const col = new Float64Array(TERRAIN_SEGS + 1);
  const x = -HALF + i * CELL;
  for (let j = 0; j <= TERRAIN_SEGS; j++) col[j] = terrainHeight(x, HALF - j * CELL);
  HEIGHTS.push(col);
}
const gridClamp = (n) => (n < 0 ? 0 : n > TERRAIN_SEGS ? TERRAIN_SEGS : n);
const gridHeight = (x, z) => HEIGHTS
  [gridClamp(Math.round((x + HALF) / CELL))]
  [gridClamp(Math.round((HALF - z) / CELL))];

// ---------------------------------------------------------------------------
// Shader library — value noise, the shore wave, and a palette helper. The
// terrain and the sea both pull from this, which is what makes their shorelines
// agree: the sand knows where the wash is because it evaluates the same wave
// the water surface is displaced by.
// ---------------------------------------------------------------------------

// Hex literals are authored in sRGB; the shaders work in the linear space three
// converts them to, so bake the conversion in rather than doing it per pixel.
function glslColor(hex) {
  const c = new THREE.Color(hex);
  return `vec3(${c.r.toFixed(4)}, ${c.g.toFixed(4)}, ${c.b.toFixed(4)})`;
}

const NOISE_GLSL = /* glsl */`
  float hash21(vec2 p) {
    p = fract(p * vec2(127.31, 311.7));
    p += dot(p, p + 34.23);
    return fract(p.x * p.y);
  }
  // Smoothed value noise — one lattice cell per unit, so callers scale by the
  // feature size they want.
  float vnoise(vec2 p) {
    vec2 i = floor(p), f = fract(p);
    vec2 u = f * f * (3.0 - 2.0 * f);
    float a = hash21(i);
    float b = hash21(i + vec2(1.0, 0.0));
    float c = hash21(i + vec2(0.0, 1.0));
    float d = hash21(i + vec2(1.0, 1.0));
    return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
  }
  // Four octaves is the point where another one stops being visible under the
  // lighting. Output sits in 0..1 with a mean near 0.5.
  float fbm(vec2 p) {
    float s = 0.0, a = 0.5;
    for (int i = 0; i < 4; i++) { s += a * vnoise(p); p = p * 2.07 + 13.1; a *= 0.5; }
    return s;
  }
  // Octaves with independent phases rarely agree, so fbm huddles inside about
  // 0.35..0.6 and mixing on it raw comes out flat. Everything that picks a
  // colour uses this instead: same field, stretched to actually reach 0 and 1.
  float fbmC(vec2 p) { return clamp((fbm(p) - 0.47) * 2.7 + 0.5, 0.0, 1.0); }
  // One travelling sine: (height, dH/dx, dH/dz). Displacing by .x and building a
  // normal from .yz keeps the highlights riding the waves instead of sitting
  // still on a flat sheet.
  vec3 waveOct(vec2 p, vec2 k, float a, float speed, float t) {
    float ph = dot(p, k) + t * speed;
    float c = a * cos(ph);
    return vec3(a * sin(ph), c * k.x, c * k.y);
  }
  // Rollers running in at the coast, unit amplitude. Crests are rings around the
  // island, warped by a slow noise so they arrive at an angle in the bays rather
  // than as a perfect bullseye. The gradient ignores the warp — the error is a
  // few degrees of tilt and nothing reads it.
  vec3 shoreRoller(vec2 p, float t) {
    float r = max(length(p), 1.0);
    // ~39 units between crests: long enough that the mesh still resolves them
    // when the beach is a couple of hundred units away across the bay.
    float ph = -(r + fbm(p * 0.012) * 26.0) * 0.16 + t * 0.62;
    float c = cos(ph);
    vec2 g = -0.16 * (p / r) * c;
    return vec3(sin(ph), g.x, g.y);
  }
  // Height the wash reaches on the sand, in metres above sea level. The sea
  // displaces its edge by exactly this, so foam on the sand lines up with foam
  // on the water.
  const float SHORE_RUN = 0.50;
`;

const LAND_PALETTE = /* glsl */`
  const vec3 GRASS_LIT  = ${glslColor(0x7ba33f)};   // sunlit meadow
  const vec3 GRASS_DEEP = ${glslColor(0x40702c)};   // shaded, thicker growth
  const vec3 GRASS_DRY  = ${glslColor(0x9d8f4c)};   // burnt-off patches
  const vec3 FERN       = ${glslColor(0x3a6b34)};   // damp green up the slopes
  const vec3 ROCK_LIT   = ${glslColor(0x9b9285)};
  const vec3 ROCK_DARK  = ${glslColor(0x5f5a52)};
  const vec3 PEAK       = ${glslColor(0xb4ada0)};   // bare tops
  const vec3 SAND_LIT   = ${glslColor(0xdbc999)};   // dry beach
  const vec3 SAND_DARK  = ${glslColor(0xac9469)};
  const vec3 SEABED     = ${glslColor(0x2d4a52)};   // the drop-off, well under
  const vec3 FOAM       = ${glslColor(0xf2f8fa)};
`;

const SEA_PALETTE = /* glsl */`
  const vec3 SEA_SHALLOW = ${glslColor(0x37b0ae)};  // over the sand
  const vec3 SEA_DEEP    = ${glslColor(0x0c4a76)};
  const vec3 SEA_FOAM    = ${glslColor(0xeff7fa)};
`;

// ---------------------------------------------------------------------------
// Terrain — the mesh carries height and nothing else; every bit of colour is
// mixed procedurally in the fragment shader from world position, height and
// slope, so the detail holds up with your nose against it.
// ---------------------------------------------------------------------------
const terrainGeo = new THREE.PlaneGeometry(TERRAIN_SIZE, TERRAIN_SIZE, TERRAIN_SEGS, TERRAIN_SEGS);
terrainGeo.rotateX(-Math.PI / 2);            // bake it flat: object space is world space
{
  const p = terrainGeo.attributes.position;
  for (let i = 0; i < p.count; i++) p.setY(i, gridHeight(p.getX(i), p.getZ(i)));
  p.needsUpdate = true;
  terrainGeo.computeVertexNormals();
}

const terrainMat = new THREE.MeshStandardMaterial({
  color: 0xffffff,
  roughness: 0.95,
  metalness: 0.0,
  envMapIntensity: 0.5,
  // An open surface, so the usual backface shadow trick would drop the terrain
  // out of the shadow map entirely — the faces the sun sees are the front ones.
  shadowSide: THREE.FrontSide,
});

const terrain = new THREE.Mesh(terrainGeo, terrainMat);
terrain.receiveShadow = true;
terrain.castShadow = true;                   // hills shading their own far sides
scene.add(terrain);

// The collider, off the same samples. Cannon's Heightfield runs its grid over
// local x/y with the heights along local z, so the body is laid flat the same
// way the old ground plane was and anchored at the -x / +z corner.
{
  const hfBody = new CANNON.Body({ mass: 0, material: physWorld });
  hfBody.addShape(new CANNON.Heightfield(HEIGHTS.map((c) => Array.from(c)), { elementSize: CELL }));
  hfBody.position.set(-HALF, 0, HALF);
  hfBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
  hfBody.updateAABB();
  world.addBody(hfBody);
}

// Now that there is ground, put the spawn on it — body centre 1.2 up, so the
// feet start a hand's width clear of the clearing and settle on the first step.
SPAWN.set(0, terrainHeight(0, 0) + 1.2, 0);

// A height field for the water to read. The sea shoals, breaks and foams
// against the actual coastline rather than a circle, which needs the terrain
// height at any point — so the same samples the mesh and the collider were
// built from are packed into a texture the wave shader can look up.
//
// Only the band the water cares about is stored: LAND_LO..LAND_HI around sea
// level, which puts a byte's worth of precision at under a tenth of a metre.
// Outside the heightfield the clamped edge reads as deep water, which is what
// is out there anyway.
const LAND_LO = -12, LAND_HI = 12;
const landMap = (() => {
  const N = TERRAIN_SEGS + 1;
  const data = new Uint8Array(N * N * 4);
  for (let j = 0; j < N; j++) {                 // rows run +z .. -z, as v does
    for (let i = 0; i < N; i++) {
      const t = (HEIGHTS[i][j] - LAND_LO) / (LAND_HI - LAND_LO);
      const e = Math.round(THREE.MathUtils.clamp(t, 0, 1) * 255);
      const o = (j * N + i) * 4;
      data[o] = data[o + 1] = data[o + 2] = e;
      data[o + 3] = 255;
    }
  }
  const tex = new THREE.DataTexture(data, N, N);
  tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.minFilter = tex.magFilter = THREE.LinearFilter;
  tex.needsUpdate = true;
  return tex;
})();
// Texel centres, so the lookup lands on the sample rather than between two.
const LAND_ORIGIN = HALF + CELL / 2;
const LAND_SCALE  = 1 / (TERRAIN_SIZE + CELL);

// Shared by the sea and the sand: world xz -> terrain height, in metres.
const LAND_GLSL = /* glsl */`
  uniform sampler2D uLandMap;
  float landAt(vec2 p) {
    vec2 uv = (vec2(p.x, -p.y) + ${LAND_ORIGIN.toFixed(3)}) * ${LAND_SCALE.toFixed(8)};
    return texture2D(uLandMap, clamp(uv, 0.0, 1.0)).r
      * ${(LAND_HI - LAND_LO).toFixed(1)} + ${LAND_LO.toFixed(1)};
  }
`;

// ---------------------------------------------------------------------------
// Cloud shadows — the ground half of the weather system.
//
// Shadow-mapping the clouds is not an option: they sit 150-250 units up, which is
// *above* the directional light's own position, so they fall outside its frustum
// entirely. Instead the biggest clouds near the camera hand their footprint to
// the ground shaders as a short list of discs, already projected down the sun
// direction onto sea level, and the terrain and the sea both darken inside them.
// Four floats each: centre x, centre z, radius, strength.
// ---------------------------------------------------------------------------
const MAX_CLOUD_SHADOWS = 8;
const cloudShadowArr = new Float32Array(MAX_CLOUD_SHADOWS * 4);
const uCloudShadows = { value: cloudShadowArr };
// How far the shadow slides from the cloud that casts it, per unit of altitude.
const CLOUD_SHADOW_SLANT = new THREE.Vector2(SUN.x / SUN.y, SUN.z / SUN.y);

const CLOUD_SHADOW_GLSL = /* glsl */`
  uniform float uCloudShadows[${MAX_CLOUD_SHADOWS * 4}];
  // 0 in full sun .. 1 under the thickest part of a storm cell. The falloff
  // starts at a fifth of the radius rather than at 55% of it, because the cells
  // casting these are now a kilometre or more across: a solid core that wide
  // covers the whole island at a single flat value, and a shadow you cannot see
  // an edge of is not a shadow, it is just the lights going out.
  float cloudShade(vec2 p) {
    float s = 0.0;
    for (int i = 0; i < ${MAX_CLOUD_SHADOWS}; i++) {
      float r = uCloudShadows[i * 4 + 2];
      if (r <= 0.0) continue;
      float d = distance(p, vec2(uCloudShadows[i * 4], uCloudShadows[i * 4 + 1]));
      float v = uCloudShadows[i * 4 + 3] * (1.0 - smoothstep(r * 0.20, r, d));
      // Stacked rather than max()'d: two cells drifting across each other put
      // more mass between the ground and the sun than either does alone.
      s = s + v - s * v;
    }
    return clamp(s, 0.0, 1.0);
  }
`;

// ---------------------------------------------------------------------------
// Ocean — an animated surface at sea level plus a flat deep bed under it, so
// the water still has something below it out past the edge of the heightfield.
// The pair rides with the camera on `ocean`, which is what makes the sea read
// as endless: there is never an edge to reach, and the fog closes long before
// the disc's rim. Both live directly in the scene rather than in `objects`, so
// the third-person boom raycast does not pull the camera in when you swim.
// ---------------------------------------------------------------------------
const waterTime = { value: 0 };
const ocean = new THREE.Group();
scene.add(ocean);
{
  const deep = new THREE.Mesh(
    new THREE.PlaneGeometry(DEEP_SIZE, DEEP_SIZE),
    new THREE.MeshStandardMaterial({ color: 0x2b4550, roughness: 1.0, metalness: 0.0 })
  );
  deep.rotation.x = -Math.PI / 2;
  deep.position.y = -SEABED_DEPTH - 0.6;    // just under the terrain's own sea floor
  ocean.add(deep);

  // A radial grid instead of a uniform one. Rings grow geometrically outwards,
  // so the surface under the camera is tessellated finely enough to carry the
  // surf while the horizon still costs almost nothing: at 200 units out the
  // cells are ~10 units, at 1000 they are ~50, and the swells are long enough
  // out there to survive it. Object-space Y is up, so the shader can displace
  // `transformed.y` directly.
  function buildOceanGeo() {
    const growth = Math.pow(OCEAN_R / OCEAN_R0, 1 / OCEAN_RINGS);
    const pos = [0, 0, 0];                  // the vertex directly under the camera
    for (let i = 0, r = OCEAN_R0; i <= OCEAN_RINGS; i++, r *= growth) {
      for (let s = 0; s < OCEAN_SPOKES; s++) {
        const a = (s / OCEAN_SPOKES) * Math.PI * 2;
        pos.push(Math.cos(a) * r, 0, Math.sin(a) * r);
      }
    }
    const idx = [];
    for (let s = 0; s < OCEAN_SPOKES; s++) {              // fan over the middle
      idx.push(0, 1 + ((s + 1) % OCEAN_SPOKES), 1 + s);
    }
    for (let i = 0; i < OCEAN_RINGS; i++) {               // quads between rings
      const a0 = 1 + i * OCEAN_SPOKES, b0 = a0 + OCEAN_SPOKES;
      for (let s = 0; s < OCEAN_SPOKES; s++) {
        const s1 = (s + 1) % OCEAN_SPOKES;
        idx.push(a0 + s, b0 + s1, b0 + s);
        idx.push(a0 + s, a0 + s1, b0 + s1);
      }
    }
    const nrm = new Float32Array(pos.length);
    for (let i = 1; i < nrm.length; i += 3) nrm[i] = 1;   // the shader replaces these
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.setAttribute('normal', new THREE.BufferAttribute(nrm, 3));
    geo.setIndex(idx);
    return geo;
  }

  const surfMat = new THREE.MeshPhysicalMaterial({
    color: 0xffffff,          // the shader paints it — colour and alpha both
    transparent: true,
    // No transmission out here: at this size it would cost a second full render
    // of the scene every frame. Plain alpha over the sand reads the same anyway.
    // Glossy but not a mirror: a perfect reflection of a smooth gradient sky is
    // a smooth gradient, which is exactly what flat-looking water is.
    roughness: 0.16,
    metalness: 0.0,
    clearcoat: 0.35,
    clearcoatRoughness: 0.12,
    side: THREE.DoubleSide,
    envMapIntensity: 1.6,
  });

  // How the sea is built up, from the horizon in:
  //
  //   * four crossing swells, whose amplitude ramps from a hand's height near
  //     the island to a metre of open-water swell offshore, which is why the
  //     sea gets visibly heavier the further out you swim;
  //   * shoaling, which pins all of that back to nothing as the bed rises, so a
  //     two-metre swell cannot stand up in half a metre of water;
  //   * the shore rollers, which survive right up to the sand and are what
  //     actually breaks on the beach.
  //
  // Everything is evaluated in world space (via modelMatrix) so the waves stay
  // put while the mesh slides along under the camera.
  const WAVE_GLSL = /* glsl */`
    // (height, dH/dx, dH/dz) of the sea surface, plus how big the local swell is
    // and how far offshore we are — the fragment shader wants both for foam.
    vec3 seaSurface(vec2 p, float t, float depth, out float ampOut, out float openOut) {
      float open  = smoothstep(${ISLAND_R}.0, ${ISLAND_R + 380}.0, length(p));
      float shoal = smoothstep(0.0, 6.5, depth);
      float amp   = mix(0.13, 1.05, open) * shoal;

      // The rings of the mesh get coarser the further they are from the camera,
      // so the short waves have to bow out before there are too few vertices to
      // carry them — otherwise they beat against the tessellation and the sea
      // fills with a crawling diamond moire. Each octave fades at the range
      // where its own wavelength runs out of samples.
      float dc  = distance(p, cameraPosition.xz);
      float lod1 = 1.0 - smoothstep(50.0, 165.0, dc);
      float lod2 = 1.0 - smoothstep(20.0,  80.0, dc);

      vec3 w = vec3(0.0);
      w += waveOct(p, vec2( 0.0890,  0.0550), 1.00, 0.85, t);          // ~60u swell
      w += waveOct(p, vec2(-0.0420,  0.0715), 0.72, 0.72, t);          // ~76u, crossing
      w += waveOct(p, vec2( 0.2160, -0.1640), 0.34, 1.60, t) * lod1;   // ~23u chop
      w += waveOct(p, vec2( 0.3900,  0.2600), 0.16, 2.30, t) * lod2;   // ~13u ripple
      w *= amp;

      // The surf. Full height at the waterline and gone by the time the bed
      // drops past waist depth — the band where it lives is the breaker line.
      float surfA = SHORE_RUN * (1.0 - smoothstep(2.5, 9.0, depth));
      w += shoreRoller(p, t) * surfA;

      // The octave amplitudes actually in play here, so that "how close is this
      // pixel to the top of the local swing" means the same thing at every
      // range — otherwise the whitecaps thin out wherever the chop has faded.
      ampOut  = amp * (1.72 + 0.34 * lod1 + 0.16 * lod2) + surfA;
      openOut = open;
      return w;
    }
  `;

  surfMat.onBeforeCompile = (shader) => {
    shader.uniforms.uTime = waterTime;
    shader.uniforms.uLandMap = { value: landMap };
    shader.uniforms.uCloudShadows = uCloudShadows;

    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', /* glsl */`
        #include <common>
        uniform float uTime;
        varying vec3 vWPos;
        varying float vWaveH, vCover, vAmp, vOpen;
        ${NOISE_GLSL}
        ${LAND_GLSL}
        ${WAVE_GLSL}
      `)
      .replace('#include <beginnormal_vertex>', /* glsl */`
        #include <beginnormal_vertex>
        vec3 wpos = (modelMatrix * vec4(position, 1.0)).xyz;
        // Signed, not clamped: on dry land this goes negative, and the fragment
        // shader needs that to know where to stop drawing water.
        float depth = ${WATER.surfaceY.toFixed(2)} - landAt(wpos.xz);
        float amp, open;
        vec3 wave = seaSurface(wpos.xz, uTime, max(depth, 0.0), amp, open);
        objectNormal = normalize(vec3(-wave.y, 1.0, -wave.z));
        vWPos  = wpos + vec3(0.0, wave.x, 0.0);
        vWaveH = wave.x;
        vCover = depth + wave.x;         // metres of water over the bed, right now
        vAmp   = max(amp, 0.001);
        vOpen  = open;
      `)
      .replace('#include <begin_vertex>', /* glsl */`
        #include <begin_vertex>
        transformed.y += wave.x;
      `);

    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', /* glsl */`
        #include <common>
        uniform float uTime;
        varying vec3 vWPos;
        varying float vWaveH, vCover, vAmp, vOpen;
        ${NOISE_GLSL}
        ${SEA_PALETTE}
        ${CLOUD_SHADOW_GLSL}
      `)
      .replace('#include <map_fragment>', /* glsl */`
        #include <map_fragment>
        float foam = 0.0;
        {
          vec2 q = vWPos.xz;

          // --- foam where the wave meets the land ---
          // vCover crosses zero exactly where the sand does, and it carries the
          // wave displacement with it, so this edge runs up and down the beach
          // with every roller. The band just inside it is the broken water.
          float lace = fbmC(q * 0.85 + vec2(uTime * 0.5, uTime * 0.2));
          float edge = 1.0 - smoothstep(0.0, 0.75, vCover);
          float shoreFoam = edge * edge * smoothstep(0.15, 0.55, lace);
          // The leading centimetres are solid white however the noise falls.
          shoreFoam = max(shoreFoam, 1.0 - smoothstep(0.0, 0.18, vCover));

          // --- the break ---
          // In the surf zone the roller runs out of water under it, tips over
          // and goes white along its leading face. Gating on depth is what makes
          // that a line running parallel to the coast, and the line marches in
          // with the wave because vWaveH does.
          float zone = smoothstep(0.25, 0.9, vCover) * (1.0 - smoothstep(1.3, 3.2, vCover));
          // Only the top of the swing: a wider gate than this stops being a
          // breaker and becomes a bay full of milk.
          float breaker = smoothstep(0.62, 0.97, vWaveH / vAmp) * zone
                        * (0.45 + 0.55 * fbmC(q * 0.5 + vec2(uTime * 0.3, 0.0)));

          // --- whitecaps on the open-water swell ---
          // Only crests, only once the swell is big enough to break: near the
          // island the water is glassy, offshore it is speckled white.
          float crest = smoothstep(0.45, 0.88, vWaveH / vAmp);
          float caps = crest * smoothstep(0.3, 0.85, vOpen)
                     * smoothstep(0.30, 0.75, fbmC(q * 0.14 + vec2(0.0, uTime * 0.15)));

          foam = clamp(max(max(shoreFoam, breaker), caps * 0.9), 0.0, 1.0);

          float d = max(vCover, 0.0);
          vec3 water = mix(SEA_SHALLOW, SEA_DEEP, smoothstep(0.3, 9.0, d));
          diffuseColor.rgb = mix(water, SEA_FOAM, foam);
          // Cloud shadow. Water reads a squall harder than the land does — a
          // shaded patch of sea goes flat and slate-coloured.
          diffuseColor.rgb *= mix(1.0, 0.01, cloudShade(vWPos.xz));

          // Thin water lets the sand through and the very edge fades out
          // completely, which is what keeps the wash from ending in a hard line.
          diffuseColor.a = mix(mix(0.40, 0.93, smoothstep(0.25, 5.0, d)), 1.0, foam)
                         * smoothstep(0.0, 0.30, vCover);
        }
      `)
      .replace('#include <roughnessmap_fragment>', /* glsl */`
        #include <roughnessmap_fragment>
        roughnessFactor = mix(roughnessFactor, 0.86, foam);   // foam is not a mirror
      `)
      // Ripples finer than the mesh could ever carry, added straight to the
      // shading normal. This is most of what the sea looks like up close: a
      // gently sloped swell with a perfect mirror finish reads as a sheet of
      // glass, and it is the small stuff that scatters the sun into glitter.
      // Faded out with distance, where the ripples fall below a pixel and would
      // only crawl.
      .replace('#include <normal_fragment_begin>', /* glsl */`
        #include <normal_fragment_begin>
        {
          // The finest octaves fade out first: they are the ones that turn into
          // a crawling moire once a ripple no longer covers a pixel.
          float d = length(vWPos - cameraPosition);
          float closeness = 1.0 - smoothstep(25.0, 130.0, d);
          float fineness  = 1.0 - smoothstep(10.0,  45.0, d);
          if (closeness > 0.004) {
            vec2 q = vWPos.xz;
            // Amplitudes chosen for the slope they give (a * |k|), which is what
            // the shading actually reads — roughly a tenth each.
            vec3 r = waveOct(q, vec2( 0.62,  0.38), 0.150, 1.7, uTime)
                   + waveOct(q, vec2(-0.47,  0.79), 0.110, 2.1, uTime)
                   + waveOct(q, vec2( 1.35, -1.02), 0.045, 3.0, uTime) * fineness
                   + waveOct(q, vec2(-2.60,  1.90), 0.016, 4.4, uTime) * fineness;
            normal = normalize(normal + vec3(-r.y, 0.0, -r.z) * closeness * (1.0 - foam));
          }
        }
      `);
  };

  const surf = new THREE.Mesh(buildOceanGeo(), surfMat);
  surf.position.y = WATER.surfaceY;
  surf.receiveShadow = true;
  surf.castShadow = false;
  // The bounding sphere is centred on the camera and 1180 in radius, so it is
  // never out of view — culling it would only cost a test.
  surf.frustumCulled = false;
  ocean.add(surf);
}

// The ground shader. Two jobs, and they share a hook because a material only
// gets the one:
//
//   1. Colour. Nothing is painted per vertex any more — grass, rock and sand are
//      mixed per pixel out of noise and picked between by height and slope, so
//      the transitions wander instead of following the mesh, and the surface
//      still has grain with your face in it.
//   2. Caustics on everything the sea covers. Sunlight refracted through the
//      swell focuses into a moving net of bright filaments, strongest in the
//      shallows over the sand and gone by the time the shelf drops away. The
//      material is shared by the dry land as well, so the effect is masked in
//      world space — below the waterline, and only for the first few metres.
//
// Light leaves the surface along the refracted sun direction, not straight down.
// Snell at the air/water boundary turns the sun's 44 degrees from vertical into
// 31, which is 0.64 of the horizontal run per unit of depth.
const CAUST_SLANT = new THREE.Vector2(SUN.x / SUN.y, SUN.z / SUN.y).multiplyScalar(0.64);

terrainMat.onBeforeCompile = (shader) => {
  shader.uniforms.uTime       = waterTime;
  shader.uniforms.uWaterY     = { value: WATER.surfaceY };
  shader.uniforms.uCaustCol   = { value: new THREE.Color(0xa8e4ff) };
  shader.uniforms.uCaustSlant = { value: CAUST_SLANT };
  shader.uniforms.uSunDir     = { value: SUN.clone() };
  shader.uniforms.uCloudShadows = uCloudShadows;

  shader.vertexShader = shader.vertexShader
    .replace('#include <common>', /* glsl */`
      #include <common>
      varying vec3 vWPos;
      varying vec3 vWNrm;
    `)
    .replace('#include <begin_vertex>', /* glsl */`
      #include <begin_vertex>
      vWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;
      vWNrm = normalize(mat3(modelMatrix) * objectNormal);
    `);

  shader.fragmentShader = shader.fragmentShader
    .replace('#include <common>', /* glsl */`
      #include <common>
      uniform float uTime;
      uniform float uWaterY;
      uniform vec3  uCaustCol;
      uniform vec3  uSunDir;
      uniform vec2  uCaustSlant;
      varying vec3 vWPos;
      varying vec3 vWNrm;
      ${NOISE_GLSL}
      ${LAND_PALETTE}
      ${CLOUD_SHADOW_GLSL}
      // Light piles up along the zero crossings of the crossing swells; raising
      // the fold to a power is what turns those bands into thin filaments.
      float caustNet(vec2 p, float t) {
        float c = sin(dot(p, vec2( 0.42,  0.26) * 1.9) + t * 1.15)
                + sin(dot(p, vec2(-0.31,  0.53) * 2.3) - t * 1.55)
                + sin(dot(p, vec2( 0.95, -0.72) * 1.5) + t * 2.20);
        return pow(max(0.0, 1.0 - abs(c) * 0.55), 8.0);
      }
    `)
    .replace('#include <map_fragment>', /* glsl */`
      #include <map_fragment>
      float wetness = 0.0;
      {
        vec3 wp = vWPos;
        float h = wp.y;
        float slope = 1.0 - clamp(vWNrm.y, 0.0, 1.0);     // 0 flat .. 1 vertical

        // The finest octaves are only worth their cost within a few dozen metres
        // — further out they are sub-pixel and would sparkle. This also keeps the
        // per-pixel noise budget off the far hillsides, which cover most of the
        // screen from a boat.
        float fine = 1.0 - smoothstep(28.0, 95.0, length(wp - cameraPosition));

        // Every height threshold below is tested against a wobbled height, so
        // the bands between materials wander instead of ringing the island like
        // contour lines.
        float hb = h + (fbm(wp.xz * 0.035) - 0.47) * 5.5;

        // ---- grass: patchy, drying out in places, greener as it climbs ----
        // Two scales of patch: 60-unit meadows that read from offshore, and
        // 18-unit clumps that read from standing height.
        vec3 grass = mix(GRASS_DEEP, GRASS_LIT, fbmC(wp.xz * 0.017));
        grass = mix(grass, GRASS_LIT * 1.12, fbmC(wp.xz * 0.055 + 5.0) * 0.55);
        grass = mix(grass, GRASS_DRY, smoothstep(0.55, 0.95, fbmC(wp.xz * 0.031 + 31.0)) * 0.85);
        grass = mix(grass, FERN, smoothstep(9.0, 26.0, hb) * 0.65);
        grass *= 1.0 + (vnoise(wp.xz * 0.7) - 0.5) * 0.34 * fine;   // clumps
        grass *= 1.0 + (vnoise(wp.xz * 5.5) - 0.5) * 0.22 * fine;   // blades

        // ---- rock: mottled, with faint bedding running through it ----
        float strata = 0.5 + 0.5 * sin(h * 1.7 + fbm(wp.xz * 0.09) * 6.0);
        vec3 rock = mix(ROCK_DARK, ROCK_LIT, fbmC(wp.xz * 0.32 + h * 0.5) * 0.7 + strata * 0.3);
        rock = mix(rock, PEAK, smoothstep(22.0, 33.0, hb) * 0.55);
        rock *= 1.0 + (vnoise(wp.xz * 4.0) - 0.5) * 0.24 * fine;

        // ---- sand: grain, wind ripples up the dry beach, wet below the wash ----
        vec3 sand = mix(SAND_DARK, SAND_LIT, fbmC(wp.xz * 0.09));
        float ripple = 0.5 + 0.5 * sin(dot(wp.xz, vec2(0.86, 0.51)) * 1.9 + fbm(wp.xz * 0.3) * 6.0);
        sand = mix(sand, SAND_LIT * 1.08, ripple * 0.3 * fine);
        sand *= 1.0 + (vnoise(wp.xz * 1.7) - 0.5) * 0.14;
        sand *= 1.0 + (vnoise(wp.xz * 9.0) - 0.5) * 0.18 * fine;

        // Where the sea is right now: the same roller the water surface is
        // displaced by, so the dark line of wet sand tracks the actual wash.
        float waterline = shoreRoller(wp.xz, uTime).x * SHORE_RUN;
        wetness = 1.0 - smoothstep(waterline - 0.05, waterline + 0.85, h);
        sand = mix(sand, sand * vec3(0.50, 0.52, 0.58), wetness);
        sand = mix(sand, SEABED, smoothstep(1.0, 9.0, -h));   // into the drop-off

        // ---- pick between them ----
        float sandM = 1.0 - smoothstep(2.6, 5.2, hb);
        // Too steep to hold soil is bare rock, at any height above the tideline.
        float rockM = smoothstep(0.34, 0.62, slope) * smoothstep(0.0, 1.2, h);
        vec3 col = mix(grass, sand, sandM);
        col = mix(col, rock, max(rockM, smoothstep(27.0, 35.0, hb) * 0.8));

        // ---- and the lace of foam the last wave left on the sand ----
        // A band of fixed height would be a hairline on a cliff and a whole
        // white sheet across a flat sand bar, so its thickness is tied to the
        // gradient of the ground: what stays roughly constant is how many metres
        // of beach it covers, not how many metres of height it spans.
        float grad = sqrt(max(0.0, 1.0 - vWNrm.y * vWNrm.y)) / max(vWNrm.y, 0.05);
        float bandH = clamp(0.05 + 1.2 * grad, 0.05, 0.45);
        float band = 1.0 - smoothstep(0.0, bandH, abs(h - waterline - bandH * 0.2));
        float lace = 0.35 + 0.65 * smoothstep(0.25, 0.7, fbmC(wp.xz * 1.1 + vec2(uTime * 0.4, 0.0)));
        col = mix(col, FOAM, clamp(band * lace, 0.0, 0.92) * sandM);

        // ---- and whatever is between this patch of ground and the sun ----
        col *= mix(1.0, 0.005, cloudShade(wp.xz));

        diffuseColor.rgb *= col;
      }
    `)
    .replace('#include <roughnessmap_fragment>', /* glsl */`
      #include <roughnessmap_fragment>
      roughnessFactor *= mix(1.0, 0.38, wetness);   // wet sand takes a sheen
    `)
    // getShadowMask() lives in a chunk the lit materials do not pull in; adding
    // it after the shadow varyings it reads keeps the caustics out of the
    // shadows the headlands lay across the shallows.
    .replace('#include <shadowmap_pars_fragment>', /* glsl */`
      #include <shadowmap_pars_fragment>
      #include <shadowmask_pars_fragment>
    `)
    .replace('#include <emissivemap_fragment>', /* glsl */`
      #include <emissivemap_fragment>
      {
        float below = uWaterY - vWPos.y;
        // Walk back up the light path to the water plane: that is the patch of
        // surface whose lensing lights this point. On the flats it only shifts
        // the pattern, but it is what makes the net climb a slope instead of
        // streaking straight down it.
        vec2 q = vWPos.xz + uCaustSlant * below;
        // Wet, and shallow enough for the surface to still focus anything.
        float wet = step(0.0, below) * (1.0 - smoothstep(0.5, 9.0, below));
        // Faces turned away from the sun catch none of it.
        float facing = clamp(dot(vWNrm, uSunDir), 0.0, 1.0) * 2.2;
        // A hand's depth of water barely focuses; a couple of metres does.
        float depth = clamp(below / 2.0, 0.0, 1.0);
        float caust = caustNet(q, uTime) * 1.15
                    + caustNet(q * 1.9 + vec2(7.3, 2.1), uTime * 1.35) * 0.65;
        // Caustics are light landing on the surface, so what you see is what
        // the surface reflects: without the albedo term the dark rock lights
        // up harder than the pale sand it stands in.
        totalEmissiveRadiance += uCaustCol * diffuseColor.rgb
          * caust * wet * facing * (0.35 + 0.65 * depth) * getShadowMask();
      }
    `);
};

// Submerging the camera swaps the sky and the distance fog for a dense blue one
// (the sky dome is a custom shader and ignores scene.fog, so it is hidden and a
// flat background colour takes over).
const UNDER_BG = new THREE.Color(WATER_FOG);
let underwater = false;
function updateWaterVisuals() {
  const c = camera.position;
  const wet = c.y < WATER.surfaceY && c.y > WATER.floorY - 2 && inWaterColumn(c.x, c.z);
  if (wet === underwater) return;
  underwater = wet;
  scene.fog.color.setHex(wet ? WATER_FOG : FOG_COLOR);
  scene.fog.density = wet ? 0.11 : FOG_DENSITY;
  scene.background = wet ? UNDER_BG : null;
  sky.visible = !wet;
  document.getElementById('underwater').classList.toggle('on', wet);
}

const PITCH_LIMIT = 89 * DEG;
const keys = new Set();

// ----- keyboard -----

  'ShiftLeft', 'ShiftRight', 'Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight',

    else if (e.code === 'Digit3' || e.code === 'Numpad3') cycleStorm();
    else if (e.code === 'Digit4' || e.code === 'Numpad4') { spawnCloud(true); refreshWxUI(); }
    else if (e.code === 'Digit0' || e.code === 'Numpad0') clearClouds();

}, { passive: false });

// ----- pointer lock / mouse look -----
function requestLock() {
  if (isTouchDevice) return;
  const el = renderer.domElement;
  const fn = el.requestPointerLock || el.mozRequestPointerLock;
  if (fn) {
    const r = fn.call(el);
    if (r && typeof r.catch === 'function') r.catch(() => {});
  }
}
const isLocked = () => document.pointerLockElement === renderer.domElement;

renderer.domElement.addEventListener('mousedown', () => { if (!isLocked()) requestLock(); });

document.addEventListener('mousemove', (e) => {
  if (!isLocked()) return;
  state.yaw   -= (e.movementX || 0) * MOUSE_SENSITIVITY * DEG;
  state.pitch -= (e.movementY || 0) * MOUSE_SENSITIVITY * DEG;
  state.pitch = THREE.MathUtils.clamp(state.pitch, -PITCH_LIMIT, PITCH_LIMIT);
});

document.addEventListener('pointerlockchange', () => {
  if (!isLocked() && !isTouchDevice) {

// ----- touch: left half = joystick, right half = look, 2 fingers/side = sprint -----
const stickBase = document.getElementById('stick-base');
const stickKnob = document.getElementById('stick-knob');
const STICK_R = 55;
const stickHome = { left: stickBase.style.left, bottom: stickBase.style.bottom };

const touches = new Map();   // identifier -> { zone, role }
let moveId = null;
let lookId = null;
let moveOrigin = { x: 0, y: 0 };

const zoneOf = (x) => (x < window.innerWidth * 0.5 ? 'left' : 'right');

function updateSprint() {
  let l = 0, r = 0;
  for (const t of touches.values()) (t.zone === 'left' ? l++ : r++);
  state.sprint = (l >= 2 || r >= 2);
  sprintEl.classList.toggle('on', state.sprint || keys.has('ShiftLeft') || keys.has('ShiftRight'));
}

function placeStick(x, y) {
  stickBase.style.left = (x - 66) + 'px';
  stickBase.style.top = (y - 66) + 'px';
  stickBase.style.bottom = 'auto';
}

function resetStick() {
  stickBase.classList.remove('active');
  stickBase.style.left = stickHome.left || '28px';
  stickBase.style.top = 'auto';
  stickBase.style.bottom = stickHome.bottom || 'calc(34px + env(safe-area-inset-bottom))';
  stickKnob.style.transform = 'translate(0px, 0px)';
  state.joyX = state.joyY = 0;
}

function enableTouchUI() {
  if (state.touchActive) return;
  state.touchActive = true;
  document.body.classList.add('touch');
}

function onTouchStart(e) {
  e.preventDefault();
  enableTouchUI();
  for (const t of e.changedTouches) {
    const zone = zoneOf(t.clientX);
    let role = 'extra';
    if (zone === 'left' && moveId === null) {
      role = 'move';
      moveId = t.identifier;
      moveOrigin = { x: t.clientX, y: t.clientY };
      placeStick(t.clientX, t.clientY);
      stickBase.classList.add('active');
    } else if (zone === 'right' && lookId === null) {
      role = 'look';
      lookId = t.identifier;
    }
    touches.set(t.identifier, { zone, role, x: t.clientX, y: t.clientY });
  }
  updateSprint();
}

// These two are bound on `window`, so every touch in the document passes through
// them — including the ones that landed on a HUD button. Calling preventDefault()
// on those was suppressing the click the browser would otherwise synthesise, and
// that is what made the mode button unreliable on touch. Only speak for the
// touches we actually took ownership of in onTouchStart.
function ownsAny(e) {
  for (const t of e.changedTouches) if (touches.has(t.identifier)) return true;
  return false;
}

function onTouchMove(e) {
  if (!ownsAny(e)) return;
  e.preventDefault();
  for (const t of e.changedTouches) {
    const rec = touches.get(t.identifier);
    if (!rec) continue;

    if (rec.role === 'look') {
      const dx = t.clientX - rec.x;
      const dy = t.clientY - rec.y;
      state.yaw   -= dx * MOUSE_SENSITIVITY * TOUCH_LOOK_MULT * DEG;
      state.pitch -= dy * MOUSE_SENSITIVITY * TOUCH_LOOK_MULT * DEG;
      state.pitch = THREE.MathUtils.clamp(state.pitch, -PITCH_LIMIT, PITCH_LIMIT);
    } else if (rec.role === 'move') {
      let dx = t.clientX - moveOrigin.x;
      let dy = t.clientY - moveOrigin.y;
      const len = Math.hypot(dx, dy);
      if (len > STICK_R) { dx = dx / len * STICK_R; dy = dy / len * STICK_R; }
      stickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
      state.joyX = dx / STICK_R;
      state.joyY = dy / STICK_R;
    }
    rec.x = t.clientX;
    rec.y = t.clientY;
  }
}

function onTouchEnd(e) {
  if (!ownsAny(e)) return;
  e.preventDefault();
  for (const t of e.changedTouches) {
    const rec = touches.get(t.identifier);
    if (!rec) continue;
    touches.delete(t.identifier);
    if (t.identifier === moveId) { moveId = null; resetStick(); }
    if (t.identifier === lookId) { lookId = null; }
  }
  // promote a leftover finger so control never gets stuck after a multi-touch
  if (lookId === null) {
    for (const [id, rec] of touches) {
      if (rec.role === 'extra' && rec.zone === 'right') { rec.role = 'look'; lookId = id; break; }
    }
  }
  if (moveId === null) {
    for (const [id, rec] of touches) {
      if (rec.role === 'extra' && rec.zone === 'left') {
        rec.role = 'move';
        moveId = id;
        moveOrigin = { x: rec.x, y: rec.y };
        placeStick(rec.x, rec.y);
        stickBase.classList.add('active');
        break;
      }
    }
  }
  updateSprint();
}

// The touch UI should come up on the first touch anywhere, not only on the first
// touch that happens to land on the canvas — starting the session by tapping the
// mode button used to leave the joystick and pads hidden.
window.addEventListener('touchstart', enableTouchUI, { passive: true, capture: true });
canvas.addEventListener('touchstart', onTouchStart, { passive: false });
window.addEventListener('touchmove', onTouchMove, { passive: false });
window.addEventListener('touchend', onTouchEnd, { passive: false });
window.addEventListener('touchcancel', onTouchEnd, { passive: false });

// kill browser pinch-zoom / scroll / long-press menus
for (const ev of ['gesturestart', 'gesturechange', 'gestureend']) {
  document.addEventListener(ev, (e) => e.preventDefault(), { passive: false });
}
document.addEventListener('contextmenu', (e) => e.preventDefault());
document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });

// ----- on-screen fly buttons -----
function bindHold(el, on, off) {
  const press = (e) => { e.preventDefault(); e.stopPropagation(); el.classList.add('down'); on(); };
  const release = (e) => { e.preventDefault(); e.stopPropagation(); el.classList.remove('down'); off(); };
  el.addEventListener('touchstart', press, { passive: false });
  el.addEventListener('touchend', release, { passive: false });
  el.addEventListener('touchcancel', release, { passive: false });
  el.addEventListener('mousedown', press);
  window.addEventListener('mouseup', () => { el.classList.remove('down'); off(); });
}
bindHold(document.getElementById('btn-up'),   () => state.flyUp = true,   () => state.flyUp = false);
bindHold(document.getElementById('btn-down'), () => state.flyDown = true, () => state.flyDown = false);

// A one-shot tap, for the HUD buttons that toggle something rather than being
// held. `click` alone is not enough: a touch that ends anywhere near a window
// listener calling preventDefault() never produces one, which is why the mode
// button used to work on some taps and not others. Take pointerdown when the
// browser has it and fall back to click when it does not, and never act on both
// — once a pointerdown has been seen, the compatibility click is dead to us.
function bindTap(el, fn) {
  let sawPointer = false;
  const fire = (e) => {
    e.preventDefault();
    e.stopPropagation();
    if (el.blur) el.blur();     // otherwise Space would re-press the focused button
    fn(e);
  };
  el.addEventListener('pointerdown', (e) => { sawPointer = true; fire(e); });
  el.addEventListener('click', (e) => {
    if (sawPointer) { e.preventDefault(); e.stopPropagation(); return; }
    fire(e);
  });
  // Keep the canvas / overlay handlers out of it entirely.
  el.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true });
  el.addEventListener('touchend', (e) => e.stopPropagation(), { passive: true });
}

// ----- on-screen action buttons (first / third person) -----
const btnJump   = document.getElementById('btn-jump');
const btnCrouch = document.getElementById('btn-crouch');
const btnSprint = document.getElementById('btn-sprint');

bindHold(btnJump,
  () => { state.jumpQueued = true; state.jumpHeld = true; },
  () => { state.jumpHeld = false; });
function bindToggle(el, get, set) {
  const press = (e) => {
    e.preventDefault();
    e.stopPropagation();
    set(!get());
    el.classList.toggle('down', get());
  };
  el.addEventListener('touchstart', press, { passive: false });
  el.addEventListener('mousedown', press);
}
bindToggle(btnCrouch, () => state.crouchBtn, (v) => state.crouchBtn = v);
bindToggle(btnSprint, () => state.sprintBtn, (v) => state.sprintBtn = v);

const isSprinting = () =>
