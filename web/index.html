<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
<script>
// Cache-bust: if Safari serves a stale HTML, this forces a hard reload
(function(){
  var v = 5;
  var key = '__sv_game_v';
  try {
    var prev = parseInt(localStorage.getItem(key));
    if (prev && prev < v) {
      localStorage.setItem(key, v);
      location.replace(location.href.split('?')[0] + '?_=' + Date.now());
      return;
    }
    localStorage.setItem(key, v);
  } catch(e) {}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1220">
<title>Hermes 3D Engine — Web</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a56b8'/%3E%3Cpath d='M16 5l10 5.6v11L16 27 6 21.6v-11z' fill='none' stroke='%23cfe6ff' stroke-width='2.2' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    background: #0b1220;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    color: #e8eef7;
  }

  #view {
    display: block;
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  /* ---------- HUD ---------- */
  #hud {
    position: fixed;
    top: calc(10px + env(safe-area-inset-top));
    left: calc(10px + env(safe-area-inset-left));
    padding: 8px 11px;
    font-size: 13px;
    line-height: 1.5;
    letter-spacing: 0.02em;
    background: rgba(8, 14, 24, 0.5);
    border: 1px solid rgba(160, 200, 255, 0.16);
    border-radius: 8px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    pointer-events: none;
    white-space: pre;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
    z-index: 10;
  }
  #hud .k { color: #7fa8d8; }
  #hud .v { color: #eaf2ff; }

  #crosshair {
    position: fixed;
    left: 50%;
    top: 50%;
    width: 18px;
    height: 18px;
    margin: -9px 0 0 -9px;
    pointer-events: none;
    opacity: 0.55;
    z-index: 9;
  }
  #crosshair::before, #crosshair::after {
    content: "";
    position: absolute;
    background: #fff;
    box-shadow: 0 0 3px rgba(0, 0, 0, 0.9);
  }
  #crosshair::before { left: 50%; top: 0; width: 1.5px; height: 100%; margin-left: -0.75px; }
  #crosshair::after  { top: 50%; left: 0; height: 1.5px; width: 100%; margin-top: -0.75px; }
  body.touch #crosshair { opacity: 0.3; }

  #sprint {
    position: fixed;
    top: calc(12px + env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%) scale(0.9);
    padding: 5px 14px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.18em;
    border-radius: 999px;
    background: rgba(255, 168, 60, 0.18);
    border: 1px solid rgba(255, 190, 110, 0.55);
    color: #ffd7a0;
    opacity: 0;
    transition: opacity 0.12s ease, transform 0.12s ease;
    pointer-events: none;
    z-index: 10;
  }
  #sprint.on { opacity: 1; transform: translateX(-50%) scale(1); }

  /* Tint that fades in while the camera is under the water surface. */
  #underwater {
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.28s ease;
    background:
      radial-gradient(ellipse at 50% 45%, rgba(60, 170, 220, 0.10), rgba(6, 52, 84, 0.50) 76%),
      linear-gradient(180deg, rgba(70, 180, 230, 0.16), rgba(4, 34, 60, 0.40));
  }
  #underwater.on { opacity: 1; }

  /* On a narrow phone the centred pill would collide with the HUD panel. */
  @media (max-width: 620px) {
    #hud { font-size: 11px; padding: 6px 9px; }
    #sprint {
      top: auto;
      bottom: calc(26px + env(safe-area-inset-bottom));
    }
  }

  /* ---------- Touch controls ---------- */
  #touch-ui { display: none; }
  body.touch #touch-ui { display: block; }

  #stick-base {
    position: fixed;
    left: 28px;
    bottom: calc(34px + env(safe-area-inset-bottom));
    width: 132px;
    height: 132px;
    margin: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, rgba(120, 170, 230, 0.10), rgba(120, 170, 230, 0.03) 70%);
    border: 1.5px solid rgba(150, 195, 245, 0.28);
    opacity: 0.5;
    transition: opacity 0.15s ease;
    pointer-events: none;
    z-index: 8;
  }
  #stick-base.active { opacity: 0.95; transition: none; }

  #stick-knob {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 58px;
    height: 58px;
    margin: -29px 0 0 -29px;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 32%, rgba(235, 245, 255, 0.85), rgba(130, 175, 225, 0.5));
    border: 1.5px solid rgba(230, 242, 255, 0.7);
    box-shadow: 0 3px 12px rgba(0, 0, 0, 0.35);
  }

  .fly-btn {
    position: fixed;
    right: calc(26px + env(safe-area-inset-right));
    width: 76px;
    height: 76px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    line-height: 1;
    color: #dce9f8;
    background: rgba(20, 34, 54, 0.5);
    border: 1.5px solid rgba(150, 195, 245, 0.35);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    touch-action: none;
    z-index: 12;
  }
  .fly-btn.down { background: rgba(90, 160, 235, 0.55); border-color: rgba(220, 240, 255, 0.85); color: #fff; }
  #btn-up   { bottom: calc(130px + env(safe-area-inset-bottom)); }
  #btn-down { bottom: calc(40px + env(safe-area-inset-bottom)); }

  /* Fly/zoom pad only in free + top-down; action pad only in first/third. */
  #touch-ui .fly-btn { display: none; }
  #touch-ui .act-btn { display: none; }
  body.touch.pad-fly #touch-ui .fly-btn { display: flex; }
  body.touch.pad-act #touch-ui .act-btn { display: flex; }

  .act-btn {
    position: fixed;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    line-height: 1;
    color: #dce9f8;
    background: rgba(20, 34, 54, 0.5);
    border: 1.5px solid rgba(150, 195, 245, 0.35);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    touch-action: none;
    z-index: 12;
  }
  .act-btn .glyph { font-size: 20px; }
  .act-btn.down { background: rgba(90, 160, 235, 0.55); border-color: rgba(220, 240, 255, 0.85); color: #fff; }
  #btn-jump {
    right: calc(24px + env(safe-area-inset-right));
    bottom: calc(44px + env(safe-area-inset-bottom));
    width: 90px; height: 90px; font-size: 12px;
  }
  #btn-crouch {
    right: calc(124px + env(safe-area-inset-right));
    bottom: calc(40px + env(safe-area-inset-bottom));
    width: 72px; height: 72px;
  }
  #btn-sprint {
    right: calc(34px + env(safe-area-inset-right));
    bottom: calc(146px + env(safe-area-inset-bottom));
    width: 72px; height: 72px;
  }
  #btn-sprint.down { background: rgba(255, 168, 60, 0.5); border-color: rgba(255, 210, 150, 0.9); color: #fff; }

  /* ---------- Mode UI ---------- */
  #mode-btn {
    position: fixed;
    top: calc(10px + env(safe-area-inset-top));
    right: calc(10px + env(safe-area-inset-right));
    padding: 11px 18px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #06101f;
    background: linear-gradient(180deg, #cfe6ff, #7db4ee);
    border: none;
    border-radius: 999px;
    box-shadow: 0 4px 18px rgba(90, 150, 220, 0.35);
    cursor: pointer;
    touch-action: manipulation;
    /* Above the pause overlay (50): releasing the mouse pops that overlay up, and
       a mode button you cannot reach while paused is a mode button that "does not
       always work". */
    z-index: 60;
  }
  #mode-btn.game { background: linear-gradient(180deg, #ffd9a8, #f0a054); }
  #mode-btn:active { transform: translateY(1px); }

  #cam-mode {
    position: fixed;
    top: calc(62px + env(safe-area-inset-top));
    left: calc(10px + env(safe-area-inset-left));
    padding: 5px 10px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #9ecbff;
    background: rgba(8, 14, 24, 0.5);
    border: 1px solid rgba(160, 200, 255, 0.16);
    border-radius: 7px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    pointer-events: none;
    white-space: nowrap;
    z-index: 10;
  }

  #instructions {
    position: fixed;
    top: calc(58px + env(safe-area-inset-top));
    right: calc(10px + env(safe-area-inset-right));
    width: 216px;
    max-width: 46vw;
    padding: 9px 11px;
    font-size: 11px;
    line-height: 1.45;
    background: rgba(8, 14, 24, 0.5);
    border: 1px solid rgba(160, 200, 255, 0.16);
    border-radius: 8px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    pointer-events: none;
    z-index: 10;
  }
  #instructions .title {
    display: block;
    margin-bottom: 5px;
    font-size: 10px;
    letter-spacing: 0.16em;
    color: #6f92bd;
    text-transform: uppercase;
  }
  #instructions .row { display: flex; gap: 8px; justify-content: space-between; }
  #instructions b { color: #9ecbff; font-weight: 600; white-space: nowrap; }
  #instructions span { color: #b9c9dc; text-align: right; }

  @media (max-width: 620px) {
    #mode-btn { font-size: 11px; padding: 9px 14px; }
    #cam-mode { top: calc(52px + env(safe-area-inset-top)); font-size: 10px; }
    #instructions { width: 168px; font-size: 10px; padding: 7px 9px; top: calc(52px + env(safe-area-inset-top)); }
  }

  /* ---------- Weather controls (free camera only) ---------- */
  #cloud-ui {
    position: fixed;
    left: calc(10px + env(safe-area-inset-left));
    bottom: calc(22px + env(safe-area-inset-bottom));
    width: 236px;
    max-width: 62vw;
    padding: 9px 11px 10px;
    font-size: 11px;
    line-height: 1.4;
    background: rgba(8, 14, 24, 0.58);
    border: 1px solid rgba(160, 200, 255, 0.16);
    border-radius: 8px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: none;
    z-index: 60;
  }
  body.free-cam #cloud-ui { display: block; }
  /* On touch the whole left half of the screen is the fly joystick — it is placed
     wherever the thumb lands — so a panel down there eats input. Move it up under
     the camera-mode chip, well clear of where a thumb naturally rests. */
  body.touch #cloud-ui {
    top: calc(134px + env(safe-area-inset-top));
    bottom: auto;
  }

  #cloud-ui .title {
    display: block;
    margin-bottom: 6px;
    font-size: 10px;
    letter-spacing: 0.16em;
    color: #6f92bd;
    text-transform: uppercase;
  }
  .wx-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-top: 5px;
  }
  .wx-row .lbl { color: #7fa8d8; white-space: nowrap; }
  .wx-row .lbl b { color: #eaf2ff; font-weight: 700; }
  .wx-btn {
    flex: 0 0 auto;
    min-width: 82px;
    padding: 5px 10px;
    font-family: inherit;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: #eaf2ff;
    background: rgba(70, 120, 190, 0.34);
    border: 1px solid rgba(150, 195, 245, 0.42);
    border-radius: 6px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .wx-btn:active { background: rgba(110, 170, 240, 0.6); }
  .wx-btn.off { color: #93a4b8; background: rgba(60, 72, 90, 0.32); }
  #wx-foot { margin-top: 7px; color: #62819f; font-size: 10px; }
  #wx-foot b { color: #9ecbff; }
  /* A phone has no number row — on touch the buttons are the whole interface. */
  body.touch #cloud-ui .key { display: none; }

  @media (max-width: 620px) {
    /* Narrow enough to sit beside #instructions on a 390-wide phone. */
    #cloud-ui { width: 190px; font-size: 10px; padding: 7px 9px 8px; }
    .wx-btn { min-width: 66px; font-size: 10px; padding: 5px 7px; }
  }

  /* ---------- Shovel (temporary block-moving tool) ---------- */
  #btn-shovel {
    position: fixed;
    top: calc(94px + env(safe-area-inset-top));
    left: calc(10px + env(safe-area-inset-left));
    padding: 8px 14px;
    font-family: inherit;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #cfe6ff;
    background: rgba(20, 34, 54, 0.62);
    border: 1px solid rgba(150, 195, 245, 0.4);
    border-radius: 999px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    cursor: pointer;
    touch-action: manipulation;
    z-index: 14;
  }
  #btn-shovel.on {
    color: #06101f;
    background: linear-gradient(180deg, #ffe0a8, #f0b054);
    border-color: transparent;
  }

  #shovel-ui {
    position: fixed;
    left: 50%;
    bottom: calc(10px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    z-index: 13;
  }
  body.shovel-on #shovel-ui { display: flex; }

  #shovel-held {
    padding: 5px 13px;
    font-size: 12px;
    color: #eaf2ff;
    background: rgba(8, 14, 24, 0.62);
    border: 1px solid rgba(160, 200, 255, 0.2);
    border-radius: 999px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    white-space: nowrap;
  }
  #shovel-row { display: flex; gap: 12px; }

  .sv-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    width: 122px;
    height: 64px;
    font-family: inherit;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    line-height: 1;
    color: #dce9f8;
    background: rgba(20, 34, 54, 0.6);
    border: 1.5px solid rgba(150, 195, 245, 0.4);
    border-radius: 14px;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    cursor: pointer;
    touch-action: none;
  }
  .sv-btn .glyph { font-size: 19px; }
  .sv-btn:active { background: rgba(90, 160, 235, 0.6); border-color: rgba(220, 240, 255, 0.85); color: #fff; }
  /* Greyed when the move it would make is not a legal one — nothing under the
     crosshair to take, or nothing in your hands to put down. */
  .sv-btn.dim { opacity: 0.34; }

  /* The pick/place pad sits along the bottom edge, so everything else that lives
     down there steps up out of its way while the shovel is out. */
  body.shovel-on #stick-base { bottom: calc(120px + env(safe-area-inset-bottom)); }
  body.shovel-on #btn-jump   { bottom: calc(130px + env(safe-area-inset-bottom)); }
  body.shovel-on #btn-crouch { bottom: calc(126px + env(safe-area-inset-bottom)); }
  body.shovel-on #btn-sprint { bottom: calc(232px + env(safe-area-inset-bottom)); }
  body.shovel-on #btn-down   { bottom: calc(126px + env(safe-area-inset-bottom)); }
  body.shovel-on #btn-up     { bottom: calc(216px + env(safe-area-inset-bottom)); }

  @media (max-width: 620px) {
    #btn-shovel { top: calc(84px + env(safe-area-inset-top)); font-size: 10px; padding: 7px 12px; }
    .sv-btn { width: 106px; height: 58px; font-size: 10px; }
    #shovel-held { font-size: 11px; padding: 4px 11px; }
  }

  /* ---------- Start / pause overlay ---------- */
  #overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding: 28px;
    text-align: center;
    background: radial-gradient(ellipse at 50% 40%, rgba(24, 44, 78, 0.82), rgba(6, 10, 18, 0.94));
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
  }
  #overlay.hidden { display: none; }

  #overlay h1 {
    font-size: clamp(22px, 6vw, 36px);
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    background: linear-gradient(180deg, #ffffff, #8fc0f0);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  #overlay .sub {
    font-size: 12px;
    letter-spacing: 0.24em;
    color: #6f92bd;
    text-transform: uppercase;
    margin-top: -14px;
  }

  #keys {
    display: grid;
    grid-template-columns: auto auto;
    gap: 7px 18px;
    font-size: 13px;
    text-align: left;
    padding: 18px 22px;
    border-radius: 12px;
    background: rgba(10, 18, 32, 0.55);
    border: 1px solid rgba(140, 185, 240, 0.18);
    max-width: 100%;
  }
  #keys b { color: #9ecbff; font-weight: 600; white-space: nowrap; }
  #keys span { color: #b9c9dc; }

  #start-btn {
    padding: 14px 34px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #06101f;
    background: linear-gradient(180deg, #cfe6ff, #7db4ee);
    border: none;
    border-radius: 999px;
    box-shadow: 0 6px 24px rgba(90, 150, 220, 0.35);
    cursor: pointer;
    touch-action: manipulation;
  }
  #start-btn:active { transform: translateY(1px); }

  #loading {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0b1220;
    color: #7fa8d8;
    font-size: 13px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    z-index: 60;
  }
  #loading.hidden { display: none; }
  #err {
    padding: 24px;
    color: #ffb4b4;
    font-size: 13px;
    line-height: 1.6;
    white-space: pre-wrap;
    text-align: left;
  }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="hud"><span class="k">FPS</span> <span class="v" id="fps">--</span>
<span class="k">POS</span> <span class="v" id="pos">--</span>
<span class="k">BLKS</span> <span class="v" id="blocks-hud">--</span>
<span class="k">HELD</span> <span class="v" id="held-hud">0</span>
<span class="k" style="color:#ff0">v10-voxel</span></div>

<div id="cam-mode">Cam &mdash; Free</div>
<div id="instructions"></div>
<button id="mode-btn" class="ui-el">Game Mode</button>

<div id="cloud-ui" class="ui-el">
  <span class="title">Weather</span>
  <div class="wx-row"><span class="lbl"><b class="key">1</b> Spawn rate</span><button class="wx-btn" id="wx-rate">Medium</button></div>
  <div class="wx-row"><span class="lbl"><b class="key">2</b> Wind speed</span><button class="wx-btn" id="wx-speed">Medium</button></div>
  <div id="wx-foot"><span class="key"><b>4</b> spawn now &middot; <b>0</b> clear &mdash; </span>sky: <span id="wx-count">0</span><br><span id="wx-cloud-info">nearest: &mdash;</span></div>
</div>

<div id="underwater"></div>
<div id="crosshair"></div>
<div id="sprint">SPRINT</div>

<div id="touch-ui">
  <div id="stick-base"><div id="stick-knob"></div></div>
  <div class="fly-btn" id="btn-up">&#9650;</div>
  <div class="fly-btn" id="btn-down">&#9660;</div>
  <div class="act-btn" id="btn-jump"><span class="glyph">&#8679;</span>JUMP</div>
  <div class="act-btn" id="btn-crouch"><span class="glyph">&#8681;</span>CROUCH</div>
  <div class="act-btn" id="btn-sprint"><span class="glyph">&#187;</span>SPRINT</div>
</div>

<button id="btn-shovel" class="ui-el">Shovel &mdash; Off</button>
<div id="shovel-ui">
  <div id="shovel-held">Blocks held: 0</div>
  <div id="shovel-row">
    <button class="sv-btn" id="btn-pick"><span class="glyph">&#9935;</span>PICK UP</button>
    <button class="sv-btn" id="btn-place"><span class="glyph">&#9635;</span>PLACE</button>
  </div>
</div>

<div id="overlay">
  <div>
    <h1>Hermes 3D</h1>
  </div>
  <div class="sub">Engine &mdash; Web Edition</div>
  <div id="keys"></div>
  <button id="start-btn">Enter</button>
</div>

<div id="loading">Loading&hellip;</div>

<script src="lib/three.js?v=2"></script>
<script src="lib/cannon-global.js?v=2"></script>
<script type="module">
// THREE and CANNON are loaded as globals from the script tags above.

// ---------------------------------------------------------------------------
// Constants — mirrored from engine.py
// ---------------------------------------------------------------------------
const MOUSE_SENSITIVITY = 0.15;   // degrees of rotation per pixel of pointer motion
const MOVE_SPEED        = 14.0;   // world units / second
const SPRINT_MULT       = 3.0;
const TOUCH_LOOK_MULT   = 1.6;    // finger drags cover fewer pixels than a mouse
const START_POS         = new THREE.Vector3(0, 21, -62);
const START_YAW         = 180;    // degrees — looks back at the island
const START_PITCH       = -14;    // degrees

// ----- character controller -----
// Filled in once the island exists: the top of the block column at the origin,
// which is the summit region, plus enough clearance to settle onto it.
const SPAWN      = new THREE.Vector3(0, 12, 0);
const SPAWN_YAW  = 0;             // degrees
const PHYS_STEP  = 1 / 60;        // fixed physics timestep
const PLAYER = {
  radius:       0.4,
  standCenter:  0.8,              // body origin above the feet, standing
  crouchCenter: 0.4,              // ... and crouched
  standEye:     1.7,
  crouchEye:    0.72,
  walk:         4.6,
  sprintMult:   2.0,
  crouchSpeed:  2.0,
  jumpSpeed:    6.2,
  groundAccel:  18.0,
  airAccel:     7.0,
  coyote:       0.12,             // seconds of grace after leaving the ground
  maxSlope:     45,               // degrees — steeper than this and you slide
};
// A contact counts as walkable ground when its normal is within maxSlope of up.
// The threshold is nudged 1 degree past 45 so the 45-degree lane is climbable.
const GROUND_DOT = Math.cos((PLAYER.maxSlope + 1) * Math.PI / 180);
const THIRD_DIST = 5.0;           // third-person boom length

// ----- the sea -----
// The ocean is everywhere and the platform sits in the middle of it, so the swim
// tests only ever care about how deep you are, never about whether you are
// inside some footprint.
const WATER = {
  floorY: -60,          // only bounds the underwater tint; the bed is well above it
  surfaceY: 0.0,        // sea level, and the datum every height below is measured from
  gravityScale: 0.20,   // buoyancy — only a fifth of gravity reaches you in here
  speedMult: 0.60,      // swimming is slower than walking
  accel: 6.0,           // how fast you reach swim speed; doubles as water drag
  swimIn:  0.55,        // submerged fraction where walking becomes swimming ...
  swimOut: 0.42,        // ... and where swimming hands back to walking
};
const WATER_FOG = 0x11506f;
const inWaterColumn = () => true;

// ----- the island -----
// Every solid thing in the world is a cube this many metres on a side. It is the
// one number the terrain is built out of: the heightmap is quantised to it, the
// physics surface is sampled on it, and the land texture the sea reads has one
// texel per column of it.
//
// Fixed at 20 cm. Everything downstream is expressed in metres and divided by
// this, so nothing else has to be touched to keep the world the same size — but
// the constants counted in *blocks* (soil depth, skirt depths, chunk width,
// slope stencil) are all scaled to it below, and moving this without moving
// those changes the island rather than just its resolution.
const BLOCK      = 0.2;
// Nominal radius of the land mass. The shoreline is a noisy fraction of this —
// somewhere around 40-55 metres out, depending on whether you are on a headland
// or in a bay — so dry land runs a bit under a hundred metres across. That is a
// couple of minutes' walk end to end rather than a bump you can see all at once.
const ISLAND_R   = 52;
// Scale of the relief; summits land around 10 m. Back down from the 16 the
// terraced field wanted: snapping to bands rounded every summit down, so the
// peak had to be inflated to get the height back. Nothing rounds it down now, and
// at 16 the same relief comes out as steep sided hills rather than rolling ones.
const ISLAND_PEAK = 12.0;
// Half-width of the generated field, in metres. Everything inside this is cubes,
// sea floor included, so it has to reach well past the shoreline: at the rim the
// bed is already twenty metres down, which is deeper than the water is legible.
const GEN_R      = 96;
const GEN_N      = Math.round((2 * GEN_R) / BLOCK);   // columns per side (960)
const SEABED_DEPTH = 16;     // how far the sea floor drops away offshore
// How far a swell has to travel from the island before it is at full open-water
// size, so the water inshore of that stays readable. Scaled with the island, so
// the calm belt still starts just outside the surf rather than halfway inland.
const CALM_R     = 88;

const SUN = new THREE.Vector3(0.45, 0.72, 0.52).normalize();
const SKY_ZENITH  = new THREE.Color(0x1a56b8);
const SKY_HORIZON = new THREE.Color(0xbdd6ec);
const SKY_GROUND  = new THREE.Color(0x64798a);
const FOG_COLOR   = 0xb8d1e8;
// Thin enough that the platform is legible from well offshore, thick enough to
// swallow the ocean before its edge reaches the far plane. ~97% opaque by 700
// units, and it barely touches anything inside 150.
const FOG_DENSITY = 0.0028;

const DEG = Math.PI / 180;
const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

// ----- the visible sea -----
// The surface is a disc that rides with the camera, so there is always ocean out
// to the horizon whichever way you look and however far you swim. Its rings are
// spaced geometrically: dense enough under your feet to carry the surf, coarse
// far out where the fog has already swallowed everything anyway.
const OCEAN_R      = 1180;   // radius of the surface disc — 2360 across
const OCEAN_R0     = 0.9;    // radius of the innermost ring
const OCEAN_RINGS  = isTouchDevice ? 96 : 148;
const OCEAN_SPOKES = isTouchDevice ? 128 : 192;
// Kept comfortably inside the disc so the surface is always the thing that
// draws the horizon; the bed only has to cover the gap the heightfield leaves.
const DEEP_SIZE    = 1400;   // the flat bed under the lot

// ---------------------------------------------------------------------------
// Renderer / scene / camera
// ---------------------------------------------------------------------------
const canvas = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true,
  powerPreference: 'high-performance',
  stencil: false,
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isTouchDevice ? 2 : 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(FOG_COLOR, FOG_DENSITY);

// The far plane has to swallow the weather: clouds spawn up to 1500 units out and
// are meant to be readable from there, so 1000 would have clipped them away before
// they ever appeared. Pushing near out to 0.25 at the same time leaves the depth
// range *better* conditioned than the old 0.1/1000 pair, and nothing in the scene
// ever gets within a quarter unit of the eye.
const camera = new THREE.PerspectiveCamera(75, 1, 0.25, 3200);
camera.rotation.order = 'YXZ';
camera.position.copy(START_POS);

// ---------------------------------------------------------------------------
// Gradient sky (custom shader dome that rides along with the camera)
// ---------------------------------------------------------------------------
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  depthWrite: false,
  uniforms: {
    // Cloned: the weather lerps these towards an overcast palette every frame,
    // and the constants have to survive as the fair-weather end of that mix.
    uZenith:  { value: SKY_ZENITH.clone() },
    uHorizon: { value: SKY_HORIZON.clone() },
    uGround:  { value: SKY_GROUND.clone() },
    uSunDir:  { value: SUN.clone() },
    uSunCol:  { value: new THREE.Color(0xfff0cf) },
  },
  vertexShader: /* glsl */`
    varying vec3 vDir;
    void main() {
      vDir = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: /* glsl */`
    varying vec3 vDir;
    uniform vec3 uZenith, uHorizon, uGround, uSunDir, uSunCol;
    void main() {
      vec3 d = normalize(vDir);
      float up = clamp(d.y, 0.0, 1.0);
      float dn = clamp(-d.y, 0.0, 1.0);
      vec3 col = mix(uHorizon, uZenith, pow(up, 0.48));
      col = mix(col, uGround, pow(dn, 0.30));

      float sd = max(dot(d, normalize(uSunDir)), 0.0);
      col += uSunCol * (pow(sd, 900.0) * 6.0 + pow(sd, 30.0) * 0.35 + pow(sd, 4.0) * 0.10);

      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }
  `,
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 32), skyMat);
sky.scale.setScalar(600);
sky.renderOrder = -1000;
sky.frustumCulled = false;
scene.add(sky);

// ---------------------------------------------------------------------------
// Environment map for PBR reflections (procedural equirect -> PMREM)
// ---------------------------------------------------------------------------
function buildEnvTexture() {
  const W = 1024, H = 512;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');

  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0.00, '#2f6ec4');
  g.addColorStop(0.38, '#7fb0e2');
  g.addColorStop(0.49, '#cfe1f2');
  g.addColorStop(0.52, '#8fa08a');
  g.addColorStop(1.00, '#3d5236');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  const u = ((Math.atan2(SUN.x, SUN.z) / (2 * Math.PI)) + 0.5) * W;
  const v = (1 - (Math.asin(THREE.MathUtils.clamp(SUN.y, -1, 1)) / Math.PI + 0.5)) * H;
  const rg = ctx.createRadialGradient(u, v, 0, u, v, 200);
  rg.addColorStop(0.00, 'rgba(255, 248, 226, 1)');
  rg.addColorStop(0.18, 'rgba(255, 240, 205, 0.60)');
  rg.addColorStop(1.00, 'rgba(255, 238, 200, 0)');
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = rg;
  ctx.fillRect(0, 0, W, H);

  const tex = new THREE.Texture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.needsUpdate = true;
  return tex;
}

const pmrem = new THREE.PMREMGenerator(renderer);
const envSrc = buildEnvTexture();
scene.environment = pmrem.fromEquirectangular(envSrc).texture;
envSrc.dispose();
pmrem.dispose();

// ---------------------------------------------------------------------------
// Lighting
// ---------------------------------------------------------------------------
// The island is centred on the origin, so the shadow frustum is too — it is
// sized to swallow the land and a margin of the water around it. Tight, because
// the terrain is made of half-metre blocks and every metre of slack in here is
// shadow resolution the blocks do not get.
const SHADOW_CENTER = new THREE.Vector3(0, 2, 0);
const SHADOW_HALF   = 30;
const SUN_DIST      = 190;

const sun = new THREE.DirectionalLight(0xfff4e0, 2.9);
sun.position.copy(SUN).multiplyScalar(SUN_DIST).add(SHADOW_CENTER);
sun.castShadow = true;
sun.shadow.mapSize.set(isTouchDevice ? 2048 : 4096, isTouchDevice ? 2048 : 4096);
// near/far hug the actual depth range of the scene along the light direction.
// The old 1..400 range meant one unit of depth bias was worth ~0.2 world units,
// which is what detached shadows from the objects casting them and left a bright
// seam at every contact point.
sun.shadow.camera.near = 30;
sun.shadow.camera.far  = 380;
sun.shadow.camera.left = -SHADOW_HALF;
sun.shadow.camera.right = SHADOW_HALF;
sun.shadow.camera.top = SHADOW_HALF;
sun.shadow.camera.bottom = -SHADOW_HALF;
// With the tight frustum the constant bias can be an order of magnitude smaller;
// the remaining acne is handled by normalBias, which offsets along the surface
// normal (~half a shadow texel) instead of along the light and so does not open
// a gap where an object meets the floor. Everything casting now is a box on a
// flat deck, so a fraction of the old offset is plenty.
sun.shadow.bias = -0.00008;
sun.shadow.normalBias = isTouchDevice ? 0.06 : 0.04;
sun.shadow.radius = 2;
sun.target.position.copy(SHADOW_CENTER);
scene.add(sun);
scene.add(sun.target);

// Named, because the weather drives them: heavy cloud overhead pulls the sun and
// the sky fill down, and a lightning strike briefly slams the ambient up.
const SUN_BASE = 2.9, HEMI_BASE = 0.55, AMB_BASE = 0.18;
const hemiLight = new THREE.HemisphereLight(0xbcd8f5, 0x4a5a3c, HEMI_BASE);
const ambLight  = new THREE.AmbientLight(0xffffff, AMB_BASE);
scene.add(hemiLight);
scene.add(ambLight);

// ---------------------------------------------------------------------------
// Physics world (cannon-es)
// ---------------------------------------------------------------------------
const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.82, 0) });
world.broadphase = new CANNON.SAPBroadphase(world);
world.allowSleep = true;
world.solver.iterations = 10;
world.defaultContactMaterial.friction = 0.4;
world.defaultContactMaterial.restitution = 0.0;

const physWorld  = new CANNON.Material('world');
const physProp   = new CANNON.Material('prop');
const physPlayer = new CANNON.Material('player');

// The character drives its own horizontal velocity, so friction against the
// level would only fight the controller — zero it and let the code decide when
// the player sticks (walkable ground) and when they slide (steep ground).
world.addContactMaterial(new CANNON.ContactMaterial(physPlayer, physWorld, { friction: 0.0, restitution: 0.0 }));
world.addContactMaterial(new CANNON.ContactMaterial(physPlayer, physProp,  { friction: 0.0, restitution: 0.0 }));
world.addContactMaterial(new CANNON.ContactMaterial(physProp,   physWorld, { friction: 0.45, restitution: 0.06 }));
world.addContactMaterial(new CANNON.ContactMaterial(physProp,   physProp,  { friction: 0.4,  restitution: 0.06 }));

// Meshes that need to follow their body every frame (dynamic + kinematic only —
// static bodies never move, so syncing them would be pure overhead).
const syncList = [];
function linkBody(mesh, body) {
  // Body.addShape() computes the AABB while the body is still at the origin and
  // clears aabbNeedsUpdate. Only integrate() ever raises the flag again, and a
  // static body never integrates — so without this its AABB stays in local space
  // forever. Collisions still work (SAP broadphase defaults to bounding spheres),
  // but World.raycast* queries the AABBs and would miss the entire level.
  body.updateAABB();
  world.addBody(body);
  mesh.userData.body = body;
  if (body.type !== CANNON.Body.STATIC) syncList.push({ mesh, body });
  return body;
}

// ---------------------------------------------------------------------------
// Scene object helpers — shared geometry, PBR materials, matched colliders
// ---------------------------------------------------------------------------
const boxGeo    = new THREE.BoxGeometry(1, 1, 1);
const sphereGeo = new THREE.SphereGeometry(1, 32, 20);
const objects = new THREE.Group();
scene.add(objects);

// opts: { rx, ry, rz } rotation in degrees, { mass } (0 = static), { phys: false }
// to skip the collider entirely, { prop: true } to use the higher-friction
// contact material used by loose objects.
function addBox(x, y, z, sx, sy, sz, mat, opts = {}) {
  const rx = (opts.rx || 0) * DEG, ry = (opts.ry || 0) * DEG, rz = (opts.rz || 0) * DEG;
  const m = new THREE.Mesh(boxGeo, mat);
  m.position.set(x, y, z);
  m.scale.set(sx, sy, sz);
  m.rotation.set(rx, ry, rz);
  m.castShadow = true;
  m.receiveShadow = true;
  objects.add(m);
  if (opts.phys === false) return m;

  const body = new CANNON.Body({
    mass: opts.mass || 0,
    material: opts.prop ? physProp : physWorld,
    shape: new CANNON.Box(new CANNON.Vec3(sx / 2, sy / 2, sz / 2)),
    linearDamping: opts.mass ? 0.04 : 0,
    angularDamping: opts.mass ? 0.2 : 0,
  });
  body.position.set(x, y, z);
  body.quaternion.setFromEuler(rx, ry, rz);
  linkBody(m, body);
  return m;
}

function addSphere(x, y, z, r, mat, opts = {}) {
  const m = new THREE.Mesh(sphereGeo, mat);
  m.position.set(x, y, z);
  m.scale.setScalar(r);
  m.castShadow = true;
  m.receiveShadow = true;
  objects.add(m);
  if (opts.phys === false) return m;

  const body = new CANNON.Body({
    mass: opts.mass || 0,
    material: opts.prop ? physProp : physWorld,
    shape: new CANNON.Sphere(r),
    linearDamping: opts.mass ? 0.04 : 0,
    angularDamping: opts.mass ? 0.25 : 0,
  });
  body.position.set(x, y, z);
  linkBody(m, body);
  return m;
}

const mat = (color, roughness, metalness, extra = {}) => new THREE.MeshStandardMaterial(
  Object.assign({
    color, roughness, metalness, envMapIntensity: 0.85,
    // Casting from backfaces keeps depth-bias needs tiny on closed solids, which
    // is the other half of the shadow-seam fix.
    shadowSide: THREE.BackSide,
  }, extra)
);

// ---------------------------------------------------------------------------
// Randomness — the island that used to be generated here is gone, but the
// weather still wants a deterministic stream, and the seed is published on
// window.hermes so a sky can be reproduced exactly.
// ---------------------------------------------------------------------------
const SEED = (Math.random() * 0xffffffff) >>> 0;
function mulberry32(a) {
  return function () {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Hermite smoothstep on a raw ratio — used by the cloud shaping below.
const smooth = (t) => (t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t));

// ---------------------------------------------------------------------------
// Shader library — value noise, the shore wave, and a palette helper. The sea
// pulls from this, and so does anything else that needs to agree with where the
// water actually is at a given instant.
// ---------------------------------------------------------------------------

// Hex literals are authored in sRGB; the shaders work in the linear space three
// converts them to, so bake the conversion in rather than doing it per pixel.
function glslColor(hex) {
  const c = new THREE.Color(hex);
  return `vec3(${c.r.toFixed(4)}, ${c.g.toFixed(4)}, ${c.b.toFixed(4)})`;
}

const NOISE_GLSL = /* glsl */`
  float hash21(vec2 p) {
    p = fract(p * vec2(127.31, 311.7));
    p += dot(p, p + 34.23);
    return fract(p.x * p.y);
  }
  // Smoothed value noise — one lattice cell per unit, so callers scale by the
  // feature size they want.
  float vnoise(vec2 p) {
    vec2 i = floor(p), f = fract(p);
    vec2 u = f * f * (3.0 - 2.0 * f);
    float a = hash21(i);
    float b = hash21(i + vec2(1.0, 0.0));
    float c = hash21(i + vec2(0.0, 1.0));
    float d = hash21(i + vec2(1.0, 1.0));
    return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
  }
  // Four octaves is the point where another one stops being visible under the
  // lighting. Output sits in 0..1 with a mean near 0.5.
  float fbm(vec2 p) {
    float s = 0.0, a = 0.5;
    for (int i = 0; i < 4; i++) { s += a * vnoise(p); p = p * 2.07 + 13.1; a *= 0.5; }
    return s;
  }
  // Octaves with independent phases rarely agree, so fbm huddles inside about
  // 0.35..0.6 and mixing on it raw comes out flat. Everything that picks a
  // colour uses this instead: same field, stretched to actually reach 0 and 1.
  float fbmC(vec2 p) { return clamp((fbm(p) - 0.47) * 2.7 + 0.5, 0.0, 1.0); }
  // One travelling sine: (height, dH/dx, dH/dz). Displacing by .x and building a
  // normal from .yz keeps the highlights riding the waves instead of sitting
  // still on a flat sheet.
  vec3 waveOct(vec2 p, vec2 k, float a, float speed, float t) {
    float ph = dot(p, k) + t * speed;
    float c = a * cos(ph);
    return vec3(a * sin(ph), c * k.x, c * k.y);
  }
  // Rollers running in at the platform, unit amplitude. Crests are rings around
  // the origin, warped by a slow noise so they arrive at an angle rather than as
  // a perfect bullseye. The gradient ignores the warp — the error is a few
  // degrees of tilt and nothing reads it.
  vec3 shoreRoller(vec2 p, float t) {
    float r = max(length(p), 1.0);
    // ~39 units between crests: long enough that the mesh still resolves them
    // from a couple of hundred units offshore.
    float ph = -(r + fbm(p * 0.012) * 26.0) * 0.16 + t * 0.62;
    float c = cos(ph);
    vec2 g = -0.16 * (p / r) * c;
    return vec3(sin(ph), g.x, g.y);
  }
  // Height the wash reaches on the sand, in metres above sea level. The sea
  // displaces its edge by exactly this, so foam on the sand lines up with foam
  // on the water.
  const float SHORE_RUN = 0.50;
`;

const SEA_PALETTE = /* glsl */`
  const vec3 SEA_SHALLOW = ${glslColor(0x37b0ae)};  // in the shallows
  const vec3 SEA_DEEP    = ${glslColor(0x0c4a76)};
  const vec3 SEA_FOAM    = ${glslColor(0xeff7fa)};
`;

// ---------------------------------------------------------------------------
// The island — a procedural heightmap, quantised into BLOCK-sized cubes.
//
// It is built once, at load, in five passes:
//
//   1. sample islandHeight() over a GEN_N x GEN_N field of columns;
//   2. quantise each column to a block level and pick its surface material from
//      elevation and slope;
//  2b. fill the voxel store — the material of every block in the volume, not
//      just the one on top, which is what anything digging into the island will
//      read and write;
//   3. build the THREE.InstancedMeshes, per chunk and per material;
//   4. hand the same numbers to the sea (as a texture, so the water knows where
//      to shoal and break) and to cannon (as a heightfield, so you can walk).
//
// The store knows about every block; only what could actually be *seen* is
// built into a mesh — the top block of every column, plus however far its skirt
// has to reach to cover the drop to its lowest neighbour. A vertical run inside
// that skirt is one box rather than a stack of them: the cubes share their faces
// and their colour, so there is nothing on the outside of the run to tell the
// two apart. Dig a hole and the store is the thing that already knows what is in
// the walls of it; the mesh chunk and the collider column are patched from it.
//
// There is no sea-level cut-off anywhere in here. The field is cubes from the
// summit to the rim, so the island runs down into the water in blocks and the
// sea floor under it is the same blocks the beach is — which is the point of a
// voxel world, and is what a smooth bed stitched onto the bottom of one destroys.
// ---------------------------------------------------------------------------

// ----- value noise, on the seed the weather already uses -----
// Integer-only hashing, so the same seed lays down the same island on every
// device that loads it.
function nhash(ix, iy) {
  let n = (Math.imul(ix, 1619) + Math.imul(iy, 31337) + Math.imul(SEED | 0, 1013)) | 0;
  n = (n << 13) ^ n;
  n = (Math.imul(n, Math.imul(Math.imul(n, n), 15731) + 789221) + 1376312589) & 0x7fffffff;
  return 1 - n / 1073741824;                       // -1 .. 1
}
// Quintic fade rather than the cubic the sea shader uses: the material rules
// below read the *slope* of this field, and a cubic fade leaves the lattice
// visible in it as a grid of creases.
const nfade = (t) => t * t * t * (t * (t * 6 - 15) + 10);
function vnoise2(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = nfade(x - ix), fy = nfade(y - iy);
  const a = nhash(ix, iy),     b = nhash(ix + 1, iy);
  const c = nhash(ix, iy + 1), d = nhash(ix + 1, iy + 1);
  const lo = a + (b - a) * fx;
  return lo + ((c + (d - c) * fx) - lo) * fy;
}
function fbm2(x, y, oct) {
  let s = 0, a = 0.5, norm = 0;
  for (let i = 0; i < oct; i++) {
    s += a * vnoise2(x, y);
    norm += a;
    x = x * 2.03 + 17.3;
    y = y * 2.03 - 9.1;
    a *= 0.5;
  }
  return s / norm;                                 // -1 .. 1
}
const sstep = (a, b, x) => smooth((x - a) / (b - a));

// How far the land is pushed under the water as the island's mask runs out. The
// sea shader repeats both of these, so they are the numbers that decide where
// the two agree the shoreline is.
const SHORE_DROP = 0.55;
const SHELF_DROP = 3.4;
// How wide a belt the shoreline mask runs out over, in metres — the coast, in
// other words. Fixed rather than a fraction of ISLAND_R: a coast is a coast
// whatever the island behind it is, and scaling this with the radius is what
// flattens a big island into a saucer with no cliff anywhere on it.
const COAST_W = 20;
// Frequency of the radius warp, tied to the island so headlands and bays come
// out proportional to it.
const WARP_F  = 0.80 / ISLAND_R;
// How hard the relief bands are stretched about their midpoint — see islandHeight.
const RELIEF_GAIN = 1.9;

// Metres above sea level at (x, z), before quantisation. Three things stacked: a
// noisy radial mask that decides where there is land at all, the relief inside
// it, and the bed falling away outside it — and nothing else. The field is
// continuous everywhere: no snapping to height bands, no terracing, no plateaus
// with a riser between them. The only thing that makes steps out of it is the
// quantisation to block levels in pass 2, which at 20 cm a block is a grain you
// read as texture on a hillside rather than as a staircase.
function islandHeight(x, z) {
  const r = Math.hypot(x, z);
  // The shoreline. Warping the *radius* rather than the height is what turns a
  // disc into headlands and bays without ever breaking the island into pieces.
  // Two warps: the first swings the whole shoreline in and out by a quarter of
  // the island's radius, which is what makes the headlands and the bays; the
  // second is a few metres at a third of the scale, for the coves and points
  // along them. One warp on an island this size only reads as a dented disc.
  // The first one's frequency scales with the island so the bays come out the
  // same shape at any size — held fixed, a wider island would only get a more
  // crenellated edge, and the extra folding per metre would turn the whole
  // coast into cliff.
  const rr = r
    + fbm2(x * WARP_F + 11.2, z * WARP_F - 4.7, 2) * (ISLAND_R * 0.26)
    + fbm2(x * WARP_F * 2.6 - 3.3, z * WARP_F * 2.6 + 6.1, 2) * 2.6;
  // How far the mask takes to run out varies along the coast, and that variation
  // is what decides what kind of coast it is: where it is wide the land shelves
  // gently into the water and the wash lays down a beach, where it is narrow the
  // ground runs out in a few metres and the shore is a bluff with rock in its
  // face. One width for the whole island gives one or the other, never both.
  const cw = COAST_W * (1 + 0.55 * fbm2(x * WARP_F * 1.7 - 5.1, z * WARP_F * 1.7 + 8.3, 2));
  const m  = 1 - sstep(ISLAND_R * 1.02 - cw, ISLAND_R * 1.02, rr);

  // Relief in two broad bands, two octaves each. There used to be a third band at
  // 0.18 — six-metre features — with three octaves on top of it, and that band is
  // the reason the island read as noise: it put a bump every couple of metres over
  // every hillside, which after quantisation is a permanent field of one-block
  // pimples. What is left is the shape you pick out from offshore (the broad
  // band) and the shape you notice while walking over it (the hills) — two
  // wavelengths, both tens of metres long, which is what makes the ground roll
  // instead of either stepping or fidgeting.
  const broad = fbm2(x * 0.016 + 3.1, z * 0.016 - 2.4, 2) * 0.5 + 0.5;   // ~60 m
  const hills = fbm2(x * 0.045 - 8.2, z * 0.045 + 5.6, 2) * 0.5 + 0.5;   // ~22 m

  // Summed octaves of value noise cluster hard around their mean — left as they
  // come, the two bands above vary by about a metre over the whole island and it
  // comes out a mesa: a flat table with every bit of the relief in its rim.
  // Stretching them about the midpoint is what turns that into hills, and the
  // smoothstep doing the stretching also flattens the ends it pushes past 0 and
  // 1, so the summits get tops and the valleys get floors instead of points.
  const relief = smooth(0.5 + RELIEF_GAIN * (0.66 * broad + 0.34 * hills - 0.5));
  // Just under linear in the mask, so the interior is rolling ground the relief
  // can carve hills and valleys out of. Squaring it instead would make a cone,
  // and a cone has no flat anywhere to stand on.
  let h = Math.pow(m, 0.90) * ISLAND_PEAK * (0.12 + 0.88 * relief);
  // The shore: a flat drop, plus one that bites hardest where the mask has
  // already faded, so the land runs out under the water rather than at a wall.
  h -= SHORE_DROP + SHELF_DROP * (1 - m) * (1 - m);
  // ... and past that, the open sea floor.
  h -= SEABED_DEPTH * sstep(ISLAND_R, ISLAND_R * 1.95, r);
  return h;
}

// ----- pass 1: the field -----
// Column (i, j) is centred on (colX(i), colZ(j)); i runs +x and j runs +z.
const colX = (i) => -GEN_R + (i + 0.5) * BLOCK;
const colZ = (j) => -GEN_R + (j + 0.5) * BLOCK;

const hRaw = new Float32Array(GEN_N * GEN_N);
for (let j = 0; j < GEN_N; j++) {
  const z = colZ(j);
  for (let i = 0; i < GEN_N; i++) hRaw[j * GEN_N + i] = islandHeight(colX(i), z);
}
// Clamped at the rim, so the slope stencil below never falls off the field.
function fieldAt(i, j) {
  const ii = i < 0 ? 0 : (i >= GEN_N ? GEN_N - 1 : i);
  const jj = j < 0 ? 0 : (j >= GEN_N ? GEN_N - 1 : j);
  return hRaw[jj * GEN_N + ii];
}

// ----- pass 2: block levels and materials -----
const SAND = 0, DIRT = 1, ROCK = 2;
// Not a terrain material: the value the voxel store below uses for a block that
// is not there. It sorts after the three real ones so `m < AIR` means solid.
const AIR = 3;
const NO_COLUMN = -32768;
// Level k is the block filling y from k*BLOCK to (k+1)*BLOCK, so level -1 is the
// first one under water.
const topLvl = new Int16Array(GEN_N * GEN_N).fill(NO_COLUMN);
const topMat = new Uint8Array(GEN_N * GEN_N);
const tint   = new Float32Array(GEN_N * GEN_N);
// Blocks either side of a column that its slope is read over — 1.2 m, wide
// enough that the stencil reads the hillside rather than the one-block jitter
// quantisation leaves on it, narrow enough to still find the face of a bluff.
const SLOPE_STEP = 6;

// Minecraft-ish banding, except that the thresholds themselves wander: without
// that the boundary between two materials is a contour line, and nothing in a
// landscape has one of those.
//
// Three rules, and the order matters. Steep beats everything, so a cliff is bare
// rock however high or low it is; under that, low ground is beach; everything
// else — including the tops, which used to come out grey — is soil. The only
// rock you can see from above is therefore a face you could not have stood on.
function pickMaterial(h, slope, x, z) {
  // ~8 m patches, where it used to be ~3 m. Slower wander gives the material
  // boundaries the same broad scale as everything else on the island — at 3 m
  // they were a per-block speckle along every edge.
  const n = vnoise2(x * 0.12, z * 0.12);           // -1 .. 1
  if (h < -0.2) return SAND;                       // the sea floor and the wash
  if (slope > 1.05 + n * 0.30) return ROCK;        // anything you could not stand on
  if (h < 1.2 + n * 0.5) return SAND;              // the beach, up to knee height
  return DIRT;                                     // all the gentle ground above it
}

{
  const rnd = mulberry32((SEED ^ 0x9e3779b9) >>> 0);
  for (let j = 0; j < GEN_N; j++) {
    for (let i = 0; i < GEN_N; i++) {
      const k = j * GEN_N + i;
      // Per-column brightness, which is most of what keeps a field of one-colour
      // cubes from reading as a single flat surface.
      tint[k] = 0.86 + rnd() * 0.28;
      const h = hRaw[k];
      // No cut-off any more: every column in the field gets blocks, however deep
      // the water over it is. The sea floor is the same cubes as the island and
      // falls away to the deep on the same field, so there is nowhere the world
      // hands off from voxels to a smooth surface.
      topLvl[k] = Math.floor(h / BLOCK);
      // |grad h| is the tangent of the slope.
      const dx = (fieldAt(i + SLOPE_STEP, j) - fieldAt(i - SLOPE_STEP, j)) / (2 * SLOPE_STEP * BLOCK);
      const dz = (fieldAt(i, j + SLOPE_STEP) - fieldAt(i, j - SLOPE_STEP)) / (2 * SLOPE_STEP * BLOCK);
      topMat[k] = pickMaterial(h, Math.hypot(dx, dz), colX(i), colZ(j));
    }
  }
}

// ----- pass 2b: the voxel store -----
// Everything above is surface only: the top block of each column and what it is
// made of. This is the whole solid volume — the material of every block in every
// column, from bedrock up to the surface — so that something cutting into the
// island can ask what is under the block it just took out rather than guess.
// The shovel below is the thing that reads and writes it.
//
// The layout is one flat Uint8Array with a per-column offset into it, not an
// array per column: at GEN_N^2 columns that would be nine hundred thousand small
// objects, and the whole point of the store is that it stays cheap enough to
// keep resident. Every column starts at the same VOX_FLOOR, so the bottom of the
// world is flat and a level maps to an index by subtraction alone.
const VOX_FLOOR = Math.round(-24 / BLOCK);  // level -120: bedrock, under the deepest sea floor
// Levels of empty space allocated on top of every column, so a block can be
// *put back* somewhere higher than the ground was ever generated. Without this
// the store has no room above the surface and the shovel could only ever fill in
// holes it had already dug. Three metres of it: at 20 cm a block the store pays
// for this on every one of the field's columns, so it buys the stack you would
// actually build by hand and not a storey more.
const VOX_HEAD = 15;
// Blocks of surface material before it turns to rock — a metre and a half of
// soil, so a gentle hillside is dirt the whole way through anything you would dig
// by hand, and the face of a bluff shows a band of earth over stone rather than
// one brown pixel.
const SOIL_DEPTH = 8;

// The highest level column k has storage for — its generated surface plus the
// headroom. Above this is permanently air and nothing can be placed there.
const voxCap = (k) => topLvl[k] + VOX_HEAD;

// Where column k's blocks start in voxMat, or -1 where there is no column.
const voxOff = new Int32Array(GEN_N * GEN_N).fill(-1);
let voxCount = 0;
for (let k = 0; k < GEN_N * GEN_N; k++) {
  if (topLvl[k] === NO_COLUMN) continue;
  voxOff[k] = voxCount;
  voxCount += voxCap(k) - VOX_FLOOR + 1;
}
// voxMat[voxOff[k] + lvl - VOX_FLOOR] is the material of block `lvl` in column k.
const voxMat = new Uint8Array(voxCount);
// Solid blocks in the world. The shovel moves blocks between here and the
// player's hands and never anywhere else, so this plus what is held is an
// invariant of the whole session.
let worldBlocks = 0;
for (let k = 0; k < GEN_N * GEN_N; k++) {
  const top = topLvl[k];
  if (top === NO_COLUMN) continue;
  const o = voxOff[k] - VOX_FLOOR, surf = topMat[k];
  // Sand or dirt in a band under the surface, and bedrock under that whatever is
  // on top — which is what gives a sand-capped headland its grey base.
  const soilLo = Math.max(VOX_FLOOR, top - SOIL_DEPTH);
  voxMat.fill(ROCK, voxOff[k], o + soilLo);
  voxMat.fill(surf, o + soilLo, o + top + 1);
  // The headroom is empty — and AIR is 3, not the 0 a fresh Uint8Array is full
  // of, so it has to be written rather than left alone.
  voxMat.fill(AIR, o + top + 1, o + voxCap(k) + 1);
  worldBlocks += top - VOX_FLOOR + 1;
}

// The highest solid level in each column, cached rather than searched for. It
// starts equal to topLvl and only setVoxel moves it. Everything that asks where
// the ground is — the camera boom, the collider patch, the mesh rebuild, the
// player's feet — asks several times a frame, and a scan down the column each
// time is a scan nobody needs to pay for.
const sTop = new Int16Array(GEN_N * GEN_N);
sTop.set(topLvl);
// Set the first time anything edits a column. A column that is still as it was
// generated is solid from its surface down to bedrock, which is what lets the
// mesh builder stop looking as soon as it is out of sight of the neighbours.
const colDug = new Uint8Array(GEN_N * GEN_N);

// ----- reading and writing the store -----
// Levels are the ones topLvl is in: level k is the block filling y from k*BLOCK
// to (k+1)*BLOCK, so level -1 is the first one under water.
const lvlOfY = (y) => Math.floor(y / BLOCK);
const colI = (x) => Math.floor((x + GEN_R) / BLOCK);
const colJ = (z) => Math.floor((z + GEN_R) / BLOCK);

// The material at (i, j, lvl), or AIR for anything outside the solid volume —
// so a caller can walk a column off either end without bounds-checking first.
function voxelAt(i, j, lvl) {
  if (i < 0 || j < 0 || i >= GEN_N || j >= GEN_N) return AIR;
  const k = j * GEN_N + i;
  if (topLvl[k] === NO_COLUMN || lvl < VOX_FLOOR || lvl > voxCap(k)) return AIR;
  return voxMat[voxOff[k] + lvl - VOX_FLOOR];
}
const voxelAtWorld = (x, y, z) => voxelAt(colI(x), colJ(z), lvlOfY(y));

// Is (i, j, lvl) a level the store can hold a block at all — in the field, above
// bedrock and under the headroom? Air inside this range is a hole; air outside it
// is the edge of the world, and the shovel refuses to place there.
function inVoxelRange(i, j, lvl) {
  if (i < 0 || j < 0 || i >= GEN_N || j >= GEN_N) return false;
  const k = j * GEN_N + i;
  return topLvl[k] !== NO_COLUMN && lvl >= VOX_FLOOR && lvl <= voxCap(k);
}

// Writing one back. This is the whole of what the shovel needs from the data
// side; the meshes and the collider are baked, so a caller that changes a block
// still has to rebuild those before it shows up — editBlock() below does both.
// Returns what was there.
function setVoxel(i, j, lvl, m) {
  if (!inVoxelRange(i, j, lvl)) return AIR;
  const k = j * GEN_N + i;
  const p = voxOff[k] + lvl - VOX_FLOOR;
  const was = voxMat[p];
  if (was === m) return was;
  voxMat[p] = m;
  if (was === AIR) worldBlocks++;
  else if (m === AIR) worldBlocks--;
  // Keep the cached surface honest. Stacking one on top only ever raises it;
  // taking the top one off is the single case that has to look for the next one
  // down, and only ever walks as far as the block it uncovers.
  if (m !== AIR) {
    if (sTop[k] === NO_COLUMN || lvl > sTop[k]) sTop[k] = lvl;
  } else if (lvl === sTop[k]) {
    const o = voxOff[k] - VOX_FLOOR;
    let t = NO_COLUMN;
    for (let l = lvl - 1; l >= VOX_FLOOR; l--) if (voxMat[o + l] !== AIR) { t = l; break; }
    sTop[k] = t;
  }
  return was;
}

// The highest block in a column that is still there. Identical to topLvl until
// something digs the top off or stacks a block above it, which is the point of
// asking through here.
function solidTopAt(i, j) {
  if (i < 0 || j < 0 || i >= GEN_N || j >= GEN_N) return NO_COLUMN;
  return sTop[j * GEN_N + i];
}

// A whole column, for anyone who wants to read down it: a view onto the store
// running from `base` upwards, one entry per level. It aliases the store, so
// writes through setVoxel show up in a view already taken.
function voxelColumn(i, j) {
  if (i < 0 || j < 0 || i >= GEN_N || j >= GEN_N) return null;
  const k = j * GEN_N + i;
  if (topLvl[k] === NO_COLUMN) return null;
  const cap = voxCap(k);
  return { base: VOX_FLOOR, top: cap, materials: voxMat.subarray(voxOff[k], voxOff[k] + cap - VOX_FLOOR + 1) };
}

// ----- pass 3: the instanced meshes -----
const RIM_DEPTH  = 25;   // blocks of skirt on a column with nothing beside it (5 m)
const MAX_DEPTH  = 80;   // and the most any column will ever draw (16 m)

// The island is far too wide to be one mesh per material: a single instanced
// mesh has a single bounding sphere, so every block in it is submitted on every
// frame and on every shadow pass whether or not it is behind you. Splitting it
// into a grid of chunks costs a few dozen draw calls and buys back real frustum
// culling, which on the ground — where most of the island is out of shot — is
// most of the geometry. The split is also the unit the shovel rebuilds in: one
// edited block redraws its chunk and the ones its neighbours' faces reach into,
// which is fourteen thousand columns rather than nine hundred thousand.
const CHUNK   = 120;                        // columns per chunk side (24 m)
const CHUNK_N = Math.ceil(GEN_N / CHUNK);
const chunkOf = (i, j) => ((j / CHUNK) | 0) * CHUNK_N + ((i / CHUNK) | 0);

// Sand light and dry, dirt brown, rock grey. Nothing green anywhere — no grass
// on this island yet.
const TERRAIN_MATS = [
  mat(0xd8c69c, 0.97, 0.00, { envMapIntensity: 0.45 }),   // SAND
  mat(0x8a6a46, 0.98, 0.00, { envMapIntensity: 0.32 }),   // DIRT
  mat(0x8c9198, 0.90, 0.02, { envMapIntensity: 0.55 }),   // ROCK
];
const blockGeo = new THREE.BoxGeometry(BLOCK, BLOCK, BLOCK);
const terrain = new THREE.Group();
scene.add(terrain);

// Per chunk: the three instanced meshes (any of them null where the chunk has no
// block of that material), and what it contributes to the two HUD totals.
const chunkMesh   = new Array(CHUNK_N * CHUNK_N).fill(null);
const chunkBlocks = new Int32Array(CHUNK_N * CHUNK_N);
const chunkInsts  = new Int32Array(CHUNK_N * CHUNK_N);
let blockCount = 0, instanceCount = 0;

// Which of the two surfaces you are looking at. Pass 3b below builds a smooth
// mesh over the same blocks; where it covers a chunk the cubes underneath it are
// hidden, since the two occupy the same half-block of space and would otherwise
// poke through one another. Declared up here because rebuildChunk() has to know
// the answer for a chunk it has just rebuilt.
const VIEW = { SMOOTH: 0, BLOCKS: 1, BOTH: 2 };
const VIEW_NAMES = ['smooth', 'blocks', 'both'];
let terrainView = VIEW.SMOOTH;
// Filled in by pass 3b; null for a chunk too far out to have a smooth mesh, and
// those keep their cubes in every view so the far sea floor is never a hole.
const filletMesh = new Array(CHUNK_N * CHUNK_N).fill(null);

function applyChunkView(c) {
  const show = terrainView !== VIEW.SMOOTH || !filletMesh[c];
  const ms = chunkMesh[c];
  if (ms) for (const im of ms) if (im) im.visible = show;
}

// Scratch, reused by every rebuild: per material, a flat list of runs —
// x, y-centre, z, height in blocks, tint.
const runBuf = [[], [], []];
function pushRun(m, cx, cz, lo, hi, t) {
  const n = hi - lo + 1;
  if (n <= 0) return;
  runBuf[m].push(cx, (lo + n * 0.5) * BLOCK, cz, n, t);
}

// Everything of column (i, j) that could be seen from outside it, appended to
// runBuf. Returns the number of blocks it accounted for.
function collectColumn(i, j) {
  const k = j * GEN_N + i;
  const top = sTop[k];
  if (top === NO_COLUMN || topLvl[k] === NO_COLUMN) return 0;

  // How far down the exposed face has to reach: to the top of the lowest of the
  // four neighbours, since everything under that is walled in on all sides and
  // could never be seen. A missing neighbour is the rim of the field, and a
  // column there shows a lip of its own instead of a hole.
  let low = top;
  for (const v of [
    i > 0         ? sTop[k - 1]     : NO_COLUMN,
    i < GEN_N - 1 ? sTop[k + 1]     : NO_COLUMN,
    j > 0         ? sTop[k - GEN_N] : NO_COLUMN,
    j < GEN_N - 1 ? sTop[k + GEN_N] : NO_COLUMN,
  ]) {
    const vv = v === NO_COLUMN ? top - RIM_DEPTH : v;
    if (vv < low) low = vv;
  }
  const deepest = Math.max(VOX_FLOOR, top - MAX_DEPTH);
  const bottom  = Math.max(deepest, Math.min(top, low + 1));

  const t = tint[k], o = voxOff[k] - VOX_FLOOR;
  const cx = colX(i), cz = colZ(j);
  let drawn = 0;

  // Once the shovel has been in a column it can have air in the middle of it — a
  // dug hole, or a block stacked over a gap — and the floor of that hole is as
  // visible from above as the surface is, so the walk has to go all the way down
  // looking for exposed tops. A column nobody has touched is solid from its
  // surface to bedrock and there is provably nothing to find under `bottom`.
  const scanFloor = colDug[k] ? deepest : bottom;

  let lvl = top;
  while (lvl >= scanFloor) {
    const m = voxMat[o + lvl];
    if (m === AIR) { lvl--; continue; }
    // The exposed top block on its own, so its tint reads as one block from
    // above while the run under it reads as the face of the column.
    const capped = lvl === top || voxMat[o + lvl + 1] === AIR;
    if (capped) {
      pushRun(m, cx, cz, lvl, lvl, t);
      drawn++;
      lvl--;
      continue;
    }
    // Under it, the store's own column collapsed into runs: a vertical run of
    // one material is one box rather than a stack of them — the cubes share
    // their faces and their colour, so there is nothing on the outside of the
    // run to tell the two apart. The soil band is shaded a shade off the rock
    // under it even where both are rock, so a cliff still reads as a cliff.
    if (lvl < bottom) { lvl--; continue; }
    const band = top - lvl <= SOIL_DEPTH ? 1 : 0;
    let lo = lvl;
    while (lo > bottom && voxMat[o + lo - 1] === m
           && (top - lo + 1 <= SOIL_DEPTH ? 1 : 0) === band) lo--;
    pushRun(m, cx, cz, lo, lvl, t * (band ? 0.94 : 0.86));
    drawn += lvl - lo + 1;
    lvl = lo - 1;
  }
  return drawn;
}

const runMtx = new THREE.Matrix4();
const runCol = new THREE.Color();

// (Re)build one chunk's meshes from the store. Cheap enough to call from a tap:
// the whole cost is one pass over the chunk's columns plus three buffer uploads.
function rebuildChunk(c) {
  const old = chunkMesh[c];
  if (old) {
    for (const im of old) {
      if (!im) continue;
      terrain.remove(im);
      im.dispose();              // frees the instance buffers, not the shared geo
    }
  }
  runBuf[0].length = runBuf[1].length = runBuf[2].length = 0;

  const i0 = (c % CHUNK_N) * CHUNK, j0 = ((c / CHUNK_N) | 0) * CHUNK;
  const i1 = Math.min(i0 + CHUNK, GEN_N), j1 = Math.min(j0 + CHUNK, GEN_N);
  let blocks = 0;
  for (let j = j0; j < j1; j++) for (let i = i0; i < i1; i++) blocks += collectColumn(i, j);

  const meshes = [null, null, null];
  let insts = 0;
  for (let m = 0; m < 3; m++) {
    const a = runBuf[m];
    const n = a.length / 5;
    if (n === 0) continue;                       // plenty of chunks are all sand
    const im = new THREE.InstancedMesh(blockGeo, TERRAIN_MATS[m], n);
    for (let q = 0; q < n; q++) {
      const o = q * 5;
      runMtx.makeScale(1, a[o + 3], 1);          // one run, however many blocks tall
      runMtx.setPosition(a[o], a[o + 1], a[o + 2]);
      im.setMatrixAt(q, runMtx);
      runCol.setScalar(a[o + 4]);
      im.setColorAt(q, runCol);
    }
    insts += n;
    im.instanceMatrix.needsUpdate = true;
    if (im.instanceColor) im.instanceColor.needsUpdate = true;
    im.receiveShadow = true;
    // Casting is a second full pass over every block. A phone gets the sun's
    // shading and the player's shadow, but not the island shadowing itself.
    im.castShadow = !isTouchDevice;
    // The per-chunk bound is the whole reason for the split — without it three
    // quarters of the island would be drawn from behind the camera.
    if (im.computeBoundingSphere) im.computeBoundingSphere();
    terrain.add(im);
    meshes[m] = im;
  }

  chunkMesh[c] = meshes;
  applyChunkView(c);
  blockCount    += blocks - chunkBlocks[c];
  instanceCount += insts  - chunkInsts[c];
  chunkBlocks[c] = blocks;
  chunkInsts[c]  = insts;
}

for (let c = 0; c < CHUNK_N * CHUNK_N; c++) rebuildChunk(c);

// ----- pass 3b: the fillet surface -----
// The same terrain as one smooth skin instead of a field of cubes. It is not a
// different shape: it traces the outline the blocks already have, and the only
// thing it does differently is round the corners.
//
// The rule, in cross section. Walk the staircase the blocks make — along the top
// of a block, up the face of the next one, along its top. Every edge of that
// walk is one block face, BLOCK long. Leave each face at its midpoint, rejoin
// the next one at its midpoint, and put a smoothstep arc between those two
// points; the half of every face on either side of an arc stays exactly where
// the block put it. So a flat run is flat, the middle of a tall face is still
// straight up it, and the only thing that ever moves is the last half-block
// going into a corner.
//
// What makes that cheap here is where the midpoints land. The midpoint of a
// block top is the centre of a column; the midpoint of a riser is half way
// between the two column heights either side of it. So sampling the block tops
// at the column centres and interpolating between neighbours with smoothstep
// instead of a straight line *is* the rule: on a column centre the skin is on
// the block top, half way to the next column it is half way up the riser, and
// where two columns are level the interpolation is flat and the skin lies on the
// block faces exactly. Once in x and once in z is the 3D version.
//
// A riser more than one block tall cannot be smoothly filleted within the
// one-block fade budget. Those edges keep a sharp step (wx or wz stays 0)
// so towers and cliffs retain crisp vertical faces. Only single-block
// height differences get the smoothstep curve.

// Vertices per block along each axis. 4 gives two flat quads and two curve
// quads per block cycle so flat surfaces look flat and height transitions get a
// proper multi-segment arc. The smoothstep fires on edges where the height
// difference is at most one block, confining the curve to the half-block
// from column centre to boundary. Larger steps keep a sharp edge. Flat
// terrain is entirely unaffected. Every step up from here costs (sub/2)^2
// in memory.
const FILLET_SUB = 4;
// How far out from the middle of the field gets a skin, in metres. Past the
// shoreline and its wash and not much further: at a vertex every 10 cm this
// costs far more per square metre than the cubes do, and the sea floor beyond
// here is under enough water and fog that its corners were never legible. Chunks
// outside it keep their cubes in every view, so there is no hole.
const FILLET_R = 64;

const filletGroup = new THREE.Group();
scene.add(filletGroup);
// One material for all three terrain colours. The skin blends across a material
// boundary rather than stepping over it, so the colour has to ride on the
// vertices — which is also where the per-column tint goes. Roughness is split
// between the three the cubes use.
// shadowSide overrides the back-face default mat() uses for the cubes: that one
// works because a cube is a closed solid, and this is an open sheet with nothing

const filletMat = mat(0xffffff, 0.95, 0.0, {

// A chunk's skin runs centre to centre over its own columns plus one past its

const FILLET_STRIDE = CHUNK + 2;

// The top of the highest block still standing in each column of the chunk, and
// the colour of the face on top of it. Read once into a cache because the vertex
// loop below asks for every column four times over.
function filletCache(i0, j0) {
  for (let b = 0; b < FILLET_STRIDE; b++) {
    const jj = Math.min(GEN_N - 1, j0 + b);
    for (let a = 0; a < FILLET_STRIDE; a++) {
      const ii = Math.min(GEN_N - 1, i0 + a);
      const k = jj * GEN_N + ii, p = b * FILLET_STRIDE + a;
      const t = sTop[k];
      // A column dug away to nothing falls back to bedrock rather than leaving
      // the skin undefined over it.
      filletH[p] = (t === NO_COLUMN ? VOX_FLOOR : t + 1) * BLOCK;
      // Whatever is face-up now, which after a dig is not what the generator
      // left on top.
      let m = topMat[k];
      if (t !== NO_COLUMN && voxOff[k] >= 0) {

      filletRGB[p * 3 + 2] = col.b * s;

}

// Does the chunk's footprint reach inside FILLET_R? Nearest point of it to the
// middle of the field, so a chunk the circle only clips still gets a skin.
function filletCovers(i0, j0, i1, j1) {
  const x0 = colX(i0) - BLOCK * 0.5, x1 = colX(i1) + BLOCK * 0.5;
  const z0 = colZ(j0) - BLOCK * 0.5, z1 = colZ(j1) + BLOCK * 0.5;
  const nx = Math.min(Math.max(0, x0), x1), nz = Math.min(Math.max(0, z0), z1);
  return Math.hypot(nx, nz) <= FILLET_R;
}

// Corner-fillet smoothstep: the curve only fires on edges whose height
// difference is at most one block (BLOCK). Larger steps keep a sharp edge.
// The S-curve fills the half-block from column centre (fx=0) to boundary
// (fx=0.5); past the boundary it stays at the neighbour's height.
const tightSmooth4 = (t) => {
  const s = Math.max(0, Math.min(1, t * 2));
  return s * s * (3 - 2 * s);
};

function buildFilletChunk(c) {

  const i1 = Math.min(i0 + CHUNK, GEN_N - 1), j1 = Math.min(j0 + CHUNK, GEN_N - 1);
  if (i1 <= i0 || j1 <= j0 || !filletCovers(i0, j0, i1, j1)) return;

  filletCache(i0, j0);
  const nx = (i1 - i0) * FILLET_SUB + 1, nz = (j1 - j0) * FILLET_SUB + 1;
  const nv = nx * nz;

  for (let b = 0; b < nz; b++) {
    // Which cell of the grid this row is in, and how far across it — 0 on a
    // column centre, 0.5 on the boundary between two columns.
    const jq = (b / FILLET_SUB) | 0, fz = (b % FILLET_SUB) / FILLET_SUB;
    const z = colZ(j0 + jq) + fz * BLOCK;
    for (let a = 0; a < nx; a++) {
      const iq = (a / FILLET_SUB) | 0, fx = (a % FILLET_SUB) / FILLET_SUB;
      const x = colX(i0 + iq) + fx * BLOCK;

      const p00 = jq * FILLET_STRIDE + iq, p10 = p00 + 1;
      const p01 = p00 + FILLET_STRIDE,     p11 = p01 + 1;
      const h00 = filletH[p00], h10 = filletH[p10];
      const h01 = filletH[p01], h11 = filletH[p11];

      // Smoothstep only fires where the height difference is at most one
      // block.  Larger steps keep a sharp edge (w stays 0).  The curve fills
      // the half-block from column centre (fx 0) to boundary (fx 0.5).
      const sx = Math.abs(h10 - h00) <= BLOCK ? Math.max(0, Math.min(1, fx * 2)) : 0;
      const sz = Math.abs(h01 - h00) <= BLOCK ? Math.max(0, Math.min(1, fz * 2)) : 0;
      const wx = sx * sx * (3 - 2 * sx), dwx = 12 * sx * (1 - sx);
      const wz = sz * sz * (3 - 2 * sz), dwz = 12 * sz * (1 - sz);

      const hx0 = h00 + (h10 - h00) * wx, hx1 = h01 + (h11 - h01) * wx;
      const y = hx0 + (hx1 - hx0) * wz;
      // The same curve differentiated. Averaging the facet normals instead would
      // flatten the arc back out at two vertices a block.
      const dydx = ((h10 - h00) * (1 - wz) + (h11 - h01) * wz) * dwx / BLOCK;
      const dydz = (hx1 - hx0) * dwz / BLOCK;
      const inv = 1 / Math.hypot(dydx, 1, dydz);

      const v = (b * nx + a) * 3;
      pos[v] = x;           pos[v + 1] = y;   pos[v + 2] = z;
      nor[v] = -dydx * inv; nor[v + 1] = inv; nor[v + 2] = -dydz * inv;
      const q00 = p00 * 3, q10 = p10 * 3, q01 = p01 * 3, q11 = p11 * 3;
      for (let ch = 0; ch < 3; ch++) {
        const c0 = filletRGB[q00 + ch] + (filletRGB[q10 + ch] - filletRGB[q00 + ch]) * wx;
        const c1 = filletRGB[q01 + ch] + (filletRGB[q11 + ch] - filletRGB[q01 + ch]) * wx;

  let o = 0;
  for (let b = 0; b < nz - 1; b++) {
    for (let a = 0; a < nx - 1; a++) {
      const v0 = b * nx + a, v1 = v0 + 1, v2 = v0 + nx, v3 = v2 + 1;
      idx[o++] = v0; idx[o++] = v3; idx[o++] = v1;   // wound to face up
      idx[o++] = v0; idx[o++] = v2; idx[o++] = v3;
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('normal',   new THREE.BufferAttribute(nor, 3));
  geo.setAttribute('color',    new THREE.BufferAttribute(col, 3));
  geo.setIndex(new THREE.BufferAttribute(idx, 1));
  geo.computeBoundingSphere();      // per chunk, for the same culling the cubes get

  const m = new THREE.Mesh(geo, filletMat);
  m.receiveShadow = true;
  m.castShadow = !isTouchDevice;
  filletGroup.add(m);
  filletMesh[c] = m;
  filletTris[c] = quads * 2;
}

// (Re)build one chunk's skin. Same unit and same trigger as the cubes: the
// shovel dirties a chunk and both surfaces over it come back.
function rebuildFilletChunk(c) {
  const old = filletMesh[c];
  if (old) {
    filletGroup.remove(old);
    old.geometry.dispose();         // the material is shared, so it stays
    filletMesh[c] = null;
    filletTris[c] = 0;
  }
  buildFilletChunk(c);
  applyChunkView(c);                // the cubes under it hide or come back
}

// Which surface is on screen. Cycles smooth → blocks → both; `both` is a debug
// view and the two do interpenetrate in it, since the skin cuts the corner off
// every cube it runs over, which is the entire point of it.
function setTerrainView(v) {
  terrainView = ((v % 3) + 3) % 3;
  filletGroup.visible = terrainView !== VIEW.BLOCKS;
  for (let c = 0; c < CHUNK_N * CHUNK_N; c++) applyChunkView(c);
  return VIEW_NAMES[terrainView];
}

for (let c = 0; c < CHUNK_N * CHUNK_N; c++) rebuildFilletChunk(c);
setTerrainView(terrainView);

// ----- pass 4a: the land texture the sea reads -----
// One texel per column, aligned on the column centres, so the water's idea of
// where the ground is agrees with the blocks it can see. Height is packed into a
// byte over LAND_MIN .. LAND_MIN + LAND_SPAN: eight centimetres of quantisation
// near the shore, which is the only place the precision matters. Both ends of
// the range clip, and neither end minds: nine metres down is already "deep" to
// any swell, and the island's summits are ten metres clear of the water, which
// the sea reads as "dry" whether it thinks they are ten metres up or twelve.
const LAND_MIN = -10, LAND_SPAN = 20;

// smooth curve underneath it.
function landTexel(k) {
  const top = sTop[k];
  const h = top === NO_COLUMN ? LAND_MIN : (top + 1) * BLOCK;
  const e = Math.round(THREE.MathUtils.clamp((h - LAND_MIN) / LAND_SPAN, 0, 1) * 255);
  landData[k * 4] = landData[k * 4 + 1] = landData[k * 4 + 2] = e;
  landData[k * 4 + 3] = 255;
}
const landTex = (() => {

  const tex = new THREE.DataTexture(landData, GEN_N, GEN_N, THREE.RGBAFormat);
  tex.minFilter = tex.magFilter = THREE.LinearFilter;
  tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.generateMipmaps = false;
  tex.needsUpdate = true;

})();

// What the sea reads instead of a heightmap of its own. Inside the generated
// field it is the bake above; outside it the island's mask is already zero, so
// the same analytic sea floor the bake ends on simply carries on and the two
// meet without a seam.
const LAND_GLSL = /* glsl */`
  uniform sampler2D uLandTex;
  float landAt(vec2 p) {
    float deep = ${(-(SHORE_DROP + SHELF_DROP)).toFixed(2)}
      - ${SEABED_DEPTH.toFixed(1)} * smoothstep(
          ${ISLAND_R.toFixed(1)}, ${(ISLAND_R * 1.95).toFixed(1)}, length(p));

    if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) return deep;
    return texture2D(uLandTex, uv).r * ${LAND_SPAN.toFixed(1)} + ${LAND_MIN.toFixed(1)};
  }
`;

// ----- pass 4b: the collider -----
// A cannon heightfield on the same grid, its vertices sitting on the centres of
// the block tops. Between two columns one level apart it ramps rather than
// steps, but the ramp is one block long against one block of rise — 45 degrees,
// just inside maxSlope — and at 20 cm a block that ramp is well under the
// player's own radius, so a hillside climbs as a walkable slope and never
// catches on an edge. Two levels apart is 63 degrees, past maxSlope, and stays a
// cliff — which is what a dug face or a bluff is made of.
//

// heightfield only knows the top of each column, so a hole you dig lowers it and
// a block you stack raises it. That is the whole of what a heightfield can
// represent — dig sideways under a ledge and the collider will not follow you —
