  enableTouchUI();
  for (const t of e.changedTouches) {
    const zone = zoneOf(t.clientX);
    let role = 'extra';
    if (zone === 'left' && moveId === null) {
      role = 'move';
      moveId = t.identifier;
      moveOrigin = { x: t.clientX, y: t.clientY };
      placeStick(t.clientX, t.clientY);
      stickBase.classList.add('active');
    } else if (zone === 'right' && lookId === null) {
      role = 'look';
      lookId = t.identifier;
    }
    touches.set(t.identifier, { zone, role, x: t.clientX, y: t.clientY });
  }
  updateSprint();
}

// These two are bound on `window`, so every touch in the document passes through
// them — including the ones that landed on a HUD button. Calling preventDefault()
// on those was suppressing the click the browser would otherwise synthesise, and
// that is what made the mode button unreliable on touch. Only speak for the
// touches we actually took ownership of in onTouchStart.
function ownsAny(e) {
  for (const t of e.changedTouches) if (touches.has(t.identifier)) return true;
  return false;
}

function onTouchMove(e) {
  if (!ownsAny(e)) return;
  e.preventDefault();
  for (const t of e.changedTouches) {
    const rec = touches.get(t.identifier);
    if (!rec) continue;

    if (rec.role === 'look') {
      const dx = t.clientX - rec.x;
      const dy = t.clientY - rec.y;
      state.yaw   -= dx * MOUSE_SENSITIVITY * TOUCH_LOOK_MULT * DEG;
      state.pitch -= dy * MOUSE_SENSITIVITY * TOUCH_LOOK_MULT * DEG;
      state.pitch = THREE.MathUtils.clamp(state.pitch, -PITCH_LIMIT, PITCH_LIMIT);
    } else if (rec.role === 'move') {
      let dx = t.clientX - moveOrigin.x;
      let dy = t.clientY - moveOrigin.y;
      const len = Math.hypot(dx, dy);
      if (len > STICK_R) { dx = dx / len * STICK_R; dy = dy / len * STICK_R; }
      stickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
      state.joyX = dx / STICK_R;
      state.joyY = dy / STICK_R;
    }
    rec.x = t.clientX;
    rec.y = t.clientY;
  }
}

function onTouchEnd(e) {
  if (!ownsAny(e)) return;
  e.preventDefault();
  for (const t of e.changedTouches) {
    const rec = touches.get(t.identifier);
    if (!rec) continue;
    touches.delete(t.identifier);
    if (t.identifier === moveId) { moveId = null; resetStick(); }
    if (t.identifier === lookId) { lookId = null; }
  }
  // promote a leftover finger so control never gets stuck after a multi-touch
  if (lookId === null) {
    for (const [id, rec] of touches) {
      if (rec.role === 'extra' && rec.zone === 'right') { rec.role = 'look'; lookId = id; break; }
    }
  }
  if (moveId === null) {
    for (const [id, rec] of touches) {
      if (rec.role === 'extra' && rec.zone === 'left') {
        rec.role = 'move';
        moveId = id;
        moveOrigin = { x: rec.x, y: rec.y };
        placeStick(rec.x, rec.y);
        stickBase.classList.add('active');
        break;
      }
    }
  }
  updateSprint();
}

// The touch UI should come up on the first touch anywhere, not only on the first
// touch that happens to land on the canvas — starting the session by tapping the
// mode button used to leave the joystick and pads hidden.
window.addEventListener('touchstart', enableTouchUI, { passive: true, capture: true });
canvas.addEventListener('touchstart', onTouchStart, { passive: false });
window.addEventListener('touchmove', onTouchMove, { passive: false });
window.addEventListener('touchend', onTouchEnd, { passive: false });
window.addEventListener('touchcancel', onTouchEnd, { passive: false });

// kill browser pinch-zoom / scroll / long-press menus
for (const ev of ['gesturestart', 'gesturechange', 'gestureend']) {
  document.addEventListener(ev, (e) => e.preventDefault(), { passive: false });
}
document.addEventListener('contextmenu', (e) => e.preventDefault());
document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });

// ----- on-screen fly buttons -----
function bindHold(el, on, off) {
  const press = (e) => { e.preventDefault(); e.stopPropagation(); el.classList.add('down'); on(); };
  const release = (e) => { e.preventDefault(); e.stopPropagation(); el.classList.remove('down'); off(); };
  el.addEventListener('touchstart', press, { passive: false });
  el.addEventListener('touchend', release, { passive: false });
  el.addEventListener('touchcancel', release, { passive: false });
  el.addEventListener('mousedown', press);
  window.addEventListener('mouseup', () => { el.classList.remove('down'); off(); });
}
bindHold(document.getElementById('btn-up'),   () => state.flyUp = true,   () => state.flyUp = false);
bindHold(document.getElementById('btn-down'), () => state.flyDown = true, () => state.flyDown = false);

// A one-shot tap, for the HUD buttons that toggle something rather than being
// held. `click` alone is not enough: a touch that ends anywhere near a window
// listener calling preventDefault() never produces one, which is why the mode
// button used to work on some taps and not others. Take pointerdown when the
// browser has it and fall back to click when it does not, and never act on both
// — once a pointerdown has been seen, the compatibility click is dead to us.
function bindTap(el, fn) {
  let sawPointer = false;
  const fire = (e) => {
    e.preventDefault();
    e.stopPropagation();
    if (el.blur) el.blur();     // otherwise Space would re-press the focused button
    fn(e);
  };
  el.addEventListener('pointerdown', (e) => { sawPointer = true; fire(e); });
  el.addEventListener('click', (e) => {
    if (sawPointer) { e.preventDefault(); e.stopPropagation(); return; }
    fire(e);
  });
  // Keep the canvas / overlay handlers out of it entirely.
  el.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true });
  el.addEventListener('touchend', (e) => e.stopPropagation(), { passive: true });
}

// ----- on-screen action buttons (first / third person) -----
const btnJump   = document.getElementById('btn-jump');
const btnCrouch = document.getElementById('btn-crouch');
const btnSprint = document.getElementById('btn-sprint');

bindHold(btnJump,
  () => { state.jumpQueued = true; state.jumpHeld = true; },
  () => { state.jumpHeld = false; });
function bindToggle(el, get, set) {
  const press = (e) => {
    e.preventDefault();
    e.stopPropagation();
    set(!get());
    el.classList.toggle('down', get());
  };
  el.addEventListener('touchstart', press, { passive: false });
  el.addEventListener('mousedown', press);
}
bindToggle(btnCrouch, () => state.crouchBtn, (v) => state.crouchBtn = v);
bindToggle(btnSprint, () => state.sprintBtn, (v) => state.sprintBtn = v);

const isSprinting = () =>
  state.sprint || state.sprintBtn || keys.has('ShiftLeft') || keys.has('ShiftRight');

// ---------------------------------------------------------------------------
// Weather — a raymarched cloud layer, rain, and lightning
//
// There is no cloud *object* anywhere in the scene. The whole sky is one
// full-screen pass that marches a ray per pixel through a slab of procedural
// noise between CLOUD_BOT and CLOUD_TOP, in the Horizon Zero Dawn shape: a
// low-frequency coverage field decides where cloud is allowed to exist at all, a
// mid-frequency 3D field gives it billows, a height gradient flattens its base
// and rounds its top, and a high-frequency field eats the edges. Density becomes
// light through Beer-Lambert extinction along the view ray plus a short march
// back toward the sun for self-shadowing, with a dual-lobe Henyey-Greenstein
// phase and three multiple-scattering octaves so the shadowed side stays lit and
// the sunward edge silvers.
//
// The pass renders into a half-resolution float target and is composited into
// the main frame as a screen quad sitting at the far plane, which is what makes
// it affordable on a phone: the marching cost scales with that target, while the
// composite runs at full resolution and depth-tests against the scene, so an
// island in front of a cloud still occludes it exactly.
//
// The coverage field is *shared* with the ground — see CLOUD_COVERAGE_GLSL up in
// the cloud-shadow section — so a shadow crossing the sand always has a cloud
// over it, and gloom, rain and lightning are all driven by reading that same
// field on the CPU under the camera.
// ---------------------------------------------------------------------------

// The live controls, driven by the sliders in the hamburger drawer. Everything
// below reads these; nothing else writes them.
const WEATHER = {
  density: 1.0,      // 0 .. 2   coverage multiplier, 1 is a normal partly-cloudy day
  speed: 1.0,        // 0 .. 5   how fast the deck drifts
  windDir: 0,        // 0 .. 360 degrees, 0 = heading +X
  storminess: 5.0,   // 0 .. 10  thin and white .. deep, dark and electric
  rain: 0.0,         // 0 .. 10  a floor under whatever the sky would rain anyway
};
const WEATHER_DEFAULTS = Object.assign({}, WEATHER);

// Metres per second of drift at speed 1. Fast enough that the sky visibly moves
// while you stand still, slow enough that a cell takes a couple of minutes to
// cross overhead.
const WIND_UNIT = 26;

const clamp01 = (t) => (t < 0 ? 0 : t > 1 ? 1 : t);

// ----- the coverage field, on the CPU -----
// A line-for-line twin of hash21/vnoise/fbm/fbmC out of NOISE_GLSL. gloom, the
// rain trigger and the lightning all need to know how much cloud is over the
// camera, and reading that back off the GPU every frame is not something you do
// at 60 Hz. Float64 here against float32 there makes the two disagree in the
// last few digits; the answer is a smooth aggregate, so it never shows.
const fract1 = (x) => x - Math.floor(x);
function wxHash21(x, y) {
  x = fract1(x * 127.31);
  y = fract1(y * 311.7);
  const d = x * (x + 34.23) + y * (y + 34.23);
  return fract1((x + d) * (y + d));
}
function wxVnoise(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = wxHash21(ix, iy);
  const b = wxHash21(ix + 1, iy);
  const c = wxHash21(ix, iy + 1);
  const d = wxHash21(ix + 1, iy + 1);
  const lo = a + (b - a) * ux;
  const hi = c + (d - c) * ux;
  return lo + (hi - lo) * uy;
}
function wxFbm(x, y) {
  let s = 0, a = 0.5;
  for (let i = 0; i < 4; i++) {
    s += a * wxVnoise(x, y);
    x = x * 2.07 + 13.1;
    y = y * 2.07 + 13.1;
    a *= 0.5;
  }
  return s;
}
// How much cloud is overhead at a world xz, 0 clear .. 1 solid.
function coverageAt(x, z) {
  const qx = (x + uWxWind.value.x) * WX_COV_FREQ;
  const qz = (z + uWxWind.value.y) * WX_COV_FREQ;
  return clamp01(clamp01((wxFbm(qx, qz) - 0.47) * 2.7 + 0.5) * uWxCov.value);
}

// ----- the march -----
// Mobile gets fewer, longer steps and a shorter light march. The scattering
// integral below is the closed form over each step rather than a point sample,
// so a long step degrades into a slightly soft cloud instead of into banding,
// which is what makes a step count this low survivable.
const CLOUD_STEPS  = isTouchDevice ? 24 : 48;
const CLOUD_LSTEPS = isTouchDevice ? 5 : 7;
// Past this the layer is edge-on and would read as a hard wall of cloud sitting
// on the horizon, so it is faded into the sky's own horizon colour instead. At
// 26 km against a 1500 m floor the cut sits about 3 degrees up.
const CLOUD_MAXD   = 26000;
// ...but no single ray ever integrates more than this much of it. A ray that
// enters the slab near-horizontally — or one cast from a camera flying *inside*
// the layer — has tens of kilometres of volume in front of it, and spreading a
// fixed step budget over that puts the steps a third of a kilometre apart, which
// is coarser than the billows themselves and turns the per-pixel start dither
// into visible grain. Capping the span keeps the step length bounded no matter
// where the camera is, and the density is tapered out over the last of it so the
// cap is a haze rather than an edge.
const CLOUD_SPAN   = 9000;

const CLOUD_MARCH_FRAG = /* glsl */`
  varying vec3 vRay;

  uniform vec3 uCamPos;
  uniform float uTime;
  uniform float uThick;      // density multiplier — how solid the deck is
  uniform float uExt;        // extinction per unit density per metre
  uniform float uAlbedo;     // scattering albedo: lower reads as a darker cloud
  uniform float uType;       // 0 flat storm deck .. 1 puffy fair-weather cumulus
  uniform vec3 uSunDir;
  uniform vec3 uSunCol;
  uniform vec3 uSkyCol;      // ambient arriving from above
  uniform vec3 uGndCol;      // ambient bouncing up from the sea
  uniform vec3 uHazeCol;
  uniform float uFlash;      // lightning, lighting the volume from inside
  uniform float uGain;       // <1 only when the target is 8-bit and needs headroom

  ${NOISE_GLSL}
  ${CLOUD_COVERAGE_GLSL}

  const float CB    = ${CLOUD_BOT.toFixed(1)};
  const float CT    = ${CLOUD_TOP.toFixed(1)};
  const float CTHK  = ${CLOUD_THICK.toFixed(1)};
  const float MAXD  = ${CLOUD_MAXD.toFixed(1)};
  const float SPAN  = ${CLOUD_SPAN.toFixed(1)};

  // ----- 3D value noise -----
  // Procedural rather than a texture lookup: a 3D texture is a chunk of memory
  // and a chunk of bandwidth this does not have to spend on a phone, and the
  // eight taps below are pure ALU that the GPU is already good at.
  float hash31(vec3 p) {
    p = fract(p * vec3(127.31, 311.7, 74.71));
    p += dot(p, p.yzx + 34.23);
    return fract((p.x + p.y) * p.z);
  }
  float vnoise3(vec3 p) {
    vec3 i = floor(p), f = fract(p);
    vec3 u = f * f * (3.0 - 2.0 * f);
    float a = hash31(i + vec3(0.0, 0.0, 0.0));
    float b = hash31(i + vec3(1.0, 0.0, 0.0));
    float c = hash31(i + vec3(0.0, 1.0, 0.0));
    float d = hash31(i + vec3(1.0, 1.0, 0.0));
    float e = hash31(i + vec3(0.0, 0.0, 1.0));
    float g = hash31(i + vec3(1.0, 0.0, 1.0));
    float h = hash31(i + vec3(0.0, 1.0, 1.0));
    float k = hash31(i + vec3(1.0, 1.0, 1.0));
    return mix(mix(mix(a, b, u.x), mix(c, d, u.x), u.y),
               mix(mix(e, g, u.x), mix(h, k, u.x), u.y), u.z);
  }
  // Three octaves for the billows. Normalised so it actually reaches 0 and 1 —
  // the coverage threshold below subtracts against it, and an fbm huddled around
  // its own mean would put every cloud edge in the same place.
  float fbm3(vec3 p) {
    float s = 0.0, a = 0.5;
    for (int i = 0; i < 3; i++) {
      s += a * vnoise3(p);
      p = p * 2.11 + 17.3;
      a *= 0.5;
    }
    return s * ${(1 / 0.875).toFixed(6)};
  }
  // Two octaves of fine detail, only ever asked for where there is already cloud.
  float fbmDetail(vec3 p) {
    float s = 0.0, a = 0.5;
    for (int i = 0; i < 2; i++) {
      s += a * vnoise3(p);
      p = p * 2.37 + 5.7;
      a *= 0.5;
    }
    return s * ${(1 / 0.75).toFixed(6)};
  }

  // Where in the slab cloud is allowed to be. A cumulus sits low with a soft
  // rounded crown; a storm deck starts hard at the base and fills nearly all of
  // it, which is what makes the underside of one go flat and black.
  float heightGrad(float h) {
    float botEdge = mix(0.03, 0.16, uType);
    float topEdge = mix(0.55, 0.28, uType);
    return smoothstep(0.0, botEdge, h) * (1.0 - smoothstep(topEdge, 1.0, h));
  }

  // The density model. Detail is switched off for the light march, where the
  // fine erosion costs two more noise octaves and changes the shadow by nothing
  // you could see.
  float cloudDensity(vec3 p, float detail) {
    float h = (p.y - CB) / CTHK;
    if (h < 0.0 || h > 1.0) return 0.0;
    // The wind is applied to the sample point, not to any geometry: the whole
    // field slides through world space and the clouds go with it.
    vec3 wp = vec3(p.x + uWxWind.x, p.y, p.z + uWxWind.y);

    float cov = cloudCoverage(p.xz);
    if (cov <= 0.02) return 0.0;

    float shape = fbm3(wp * 0.0011) * heightGrad(h);
    // Remap against coverage: cloud only exists where the billows clear the
    // threshold the weather field sets, and the leftover is stretched back over
    // 0..1 so a thinly-covered patch still reaches full density in its middle.
    float d = shape - (1.0 - cov);
    if (d <= 0.0) return 0.0;
    d /= max(cov, 0.05);

    if (detail > 0.5) {
      // Drifts slowly on its own axis as well as with the wind, so a cloud
      // standing still overhead still boils rather than freezing into a decal.
      float det = fbmDetail(wp * 0.0062 + vec3(0.0, uTime * 0.02, 0.0));
      // Weighted to the edges: the wisps come off the outside of a cloud, and
      // eating the core at the same rate just makes the whole thing thinner.
      d -= (1.0 - det) * 0.38 * (1.0 - smoothstep(0.35, 0.9, d));
    }
    return clamp(d, 0.0, 1.0) * uThick;
  }

  // Optical depth between a sample and the sun. The steps grow as they go so a
  // handful of them still reach the far side of a kilometre-thick deck — the
  // near ones are where the contrast is anyway.
  float lightMarch(vec3 p) {
    float tau = 0.0;
    float s = 45.0;
    vec3 lp = p;
    for (int i = 0; i < ${CLOUD_LSTEPS}; i++) {
      lp += uSunDir * s;
      tau += cloudDensity(lp, 0.0) * s;
      s *= 1.7;
    }
    return tau;
  }

  // Henyey-Greenstein, normalised so isotropic is 1.0 rather than 1/4pi, which
  // keeps the radiance scale below in ordinary units.
  float hgPhase(float c, float g) {
    float g2 = g * g;
    float d = max(1.0 + g2 - 2.0 * g * c, 1e-4);
    return (1.0 - g2) / (d * sqrt(d));
  }
  // Two lobes: a strong forward one for the silver edge you get looking toward
  // the sun, and a weak backward one so the anti-sun side is not dead flat.
  float phaseAt(float c, float k) {
    return mix(hgPhase(c, 0.55 * k), hgPhase(c, -0.30 * k), 0.28);
  }

  void main() {
    if (uWxCov < 0.02) { gl_FragColor = vec4(0.0); return; }

    vec3 rd = normalize(vRay);
    vec3 ro = uCamPos;

    // --- intersect the slab ---
    float t0, t1;
    if (abs(rd.y) < 1e-4) {
      if (ro.y < CB || ro.y > CT) { gl_FragColor = vec4(0.0); return; }
      t0 = 0.0;
      t1 = MAXD;
    } else {
      float ta = (CB - ro.y) / rd.y;
      float tb = (CT - ro.y) / rd.y;
      t0 = min(ta, tb);
      t1 = max(ta, tb);
      t0 = max(t0, 0.0);
      if (t1 <= 0.0) { gl_FragColor = vec4(0.0); return; }
      t1 = min(t1, MAXD);
    }
    if (t0 >= t1) { gl_FragColor = vec4(0.0); return; }

    // Per-pixel start offset. Without it the step lattice is the same for every
    // ray and shows up as concentric shells through the cloud; with it the error
    // is per-pixel noise that the upsample out of the reduced-resolution target
    // smooths straight out. Fixed to the pixel rather than animated, so it never
    // crawls.
    //
    // Interleaved gradient noise rather than the hash21 above, and the reason is
    // precision: hash21 multiplies its input by 127.31, and a pixel coordinate
    // four digits long lands where a 32-bit float has less resolution than the
    // fract() needs — the dither collapses onto a handful of values and comes
    // back as banding. This stays inside the range floats are exact in.
    float dither = fract(52.9829189 *
                         fract(0.06711056 * gl_FragCoord.x + 0.00583715 * gl_FragCoord.y));

    float span = min(t1 - t0, SPAN);
    float stepLen = span / ${CLOUD_STEPS}.0;
    float tEnd = t0 + span;
    float t = t0 + stepLen * dither;

    float cosA = dot(rd, uSunDir);
    // The phase only depends on the view and sun directions, so all three
    // scattering octaves are worth exactly one evaluation per pixel.
    float ph0 = phaseAt(cosA, 1.0);
    float ph1 = phaseAt(cosA, 0.55);
    float ph2 = phaseAt(cosA, 0.30);

    vec3 scattered = vec3(0.0);
    float T = 1.0;

    for (int i = 0; i < ${CLOUD_STEPS}; i++) {
      if (T < 0.02 || t > tEnd) break;
      vec3 p = ro + rd * t;
      // Tapered out over the back of the span. Only ever bites when the span hit
      // the cap — a ray looking up crosses the slab in a couple of kilometres
      // and never reaches the falling edge.
      float d = cloudDensity(p, 1.0) * (1.0 - smoothstep(SPAN * 0.55, SPAN, t - t0));

      if (d > 0.002) {
        float h = clamp((p.y - CB) / CTHK, 0.0, 1.0);
        float tau = lightMarch(p);

        // Multiple scattering, the cheap way: three Beer terms with the
        // extinction and the phase anisotropy both falling off octave by octave.
        // Single scattering alone puts a cloud's interior at black; this is what
        // gives it the bright, low-contrast body a real one has.
        float sunE = exp(-tau * uExt) * ph0
                   + 0.45 * exp(-tau * uExt * 0.35) * ph1
                   + 0.20 * exp(-tau * uExt * 0.12) * ph2;
        // Powder: thin cloud in front of dense cloud darkens rather than
        // brightening, which is what carves the creases between billows.
        float powder = 1.0 - exp(-d * 6.0);
        vec3 sunS = uSunCol * sunE * mix(0.35, 1.0, powder);
        vec3 ambS = mix(uGndCol, uSkyCol, h);

        float sigmaE = d * uExt;
        float sigmaS = sigmaE * uAlbedo;
        vec3 S = (sunS + ambS + vec3(uFlash)) * sigmaS;
        float tr = exp(-sigmaE * stepLen);
        // Energy-conserving integration of the in-scattering over the whole
        // step instead of a point sample at one end of it. This is the reason
        // 24 steps hold up: the answer is exact for a constant-density step, so
        // a long step loses detail rather than gaining a band.
        scattered += T * (S - S * tr) / max(sigmaE, 1e-5);
        T *= tr;
        t += stepLen;
      } else {
        // Nothing here — take a longer stride. Empty sky is most of the volume
        // and it is not worth a full-rate sample.
        t += stepLen * 1.6;
      }
    }

    float alpha = clamp(1.0 - T, 0.0, 1.0);
    if (alpha < 0.002) { gl_FragColor = vec4(0.0); return; }

    // Fade the far end of the layer into the sky rather than letting it end.
    float far = smoothstep(MAXD * 0.5, MAXD, t0);
    alpha *= 1.0 - far;

    vec3 col = scattered / max(alpha, 1e-4);
    col = mix(col, uHazeCol, far * 0.7);

    // Straight linear radiance and coverage, un-tonemapped. The accumulator
    // above is transmittance-weighted — premultiplied, in other words — and the
    // divide on the line before undoes that, so what lands in the target is an
    // ordinary colour and an ordinary alpha for the composite to blend. The
    // tonemapping and the sRGB encode happen there, once, on the way to screen.
    gl_FragColor = vec4(col * uGain, alpha);
  }
`;

const CLOUD_QUAD_VERT = /* glsl */`
  varying vec3 vRay;
  uniform vec3 uCamRight, uCamUp, uCamFwd;
  uniform vec2 uHalfExtent;   // tan(fovY/2) scaled for x and y
  void main() {
    // The quad spans -1..1, so its own vertices are the NDC corners and the ray
    // through each is the camera basis weighted by them. Cheaper and shorter
    // than shipping an inverse view-projection down.
    vRay = uCamFwd
         + uCamRight * (position.x * uHalfExtent.x)
         + uCamUp    * (position.y * uHalfExtent.y);
    gl_Position = vec4(position.xy, 0.0, 1.0);
  }
`;

const CLOUD_SUN_COLOR = new THREE.Color(0xfff0cf);
// The ambient a cloud sits in: sky from above, sea and land bounce from below.
// Both collapse toward slate as the sky turns over, which is most of what makes
// a storm cell read as a storm cell.
const CLOUD_SKY_FAIR  = new THREE.Color(0x9fc4ea);
const CLOUD_SKY_STORM = new THREE.Color(0x44515f);
const CLOUD_GND_FAIR  = new THREE.Color(0x8399a8);
const CLOUD_GND_STORM = new THREE.Color(0x2a343f);

// ----- the half-res target the march writes into -----
// Half resolution is the single biggest reason this runs on a phone: the march
// is by far the most expensive thing in the frame and this quarters it, while
// the composite still runs per screen pixel so the edge against the terrain
// stays sharp.
const CLOUD_RES = isTouchDevice ? 0.5 : 0.75;
// Float if we can render to it, so sunlit cloud tops can go above 1.0 before
// the tonemapper sees them. If we cannot, the march scales itself down into the
// 0..1 an 8-bit target has and the composite scales it back up.
const CLOUD_FLOAT = renderer.extensions.has('EXT_color_buffer_float') ||
                    renderer.extensions.has('EXT_color_buffer_half_float');
const CLOUD_GAIN  = CLOUD_FLOAT ? 1.0 : 0.25;

const cloudRT = new THREE.WebGLRenderTarget(2, 2, {
  type: CLOUD_FLOAT ? THREE.HalfFloatType : THREE.UnsignedByteType,
  depthBuffer: false,
  stencilBuffer: false,
  minFilter: THREE.LinearFilter,
  magFilter: THREE.LinearFilter,
  wrapS: THREE.ClampToEdgeWrapping,
  wrapT: THREE.ClampToEdgeWrapping,
});

const cloudMarchMat = new THREE.ShaderMaterial({
  vertexShader: CLOUD_QUAD_VERT,
  fragmentShader: CLOUD_MARCH_FRAG,
  depthTest: false,
  depthWrite: false,
  // The march writes the target outright rather than blending into it.
  transparent: false,
  uniforms: {
    uCamPos:     { value: new THREE.Vector3() },
    uCamRight:   { value: new THREE.Vector3(1, 0, 0) },
    uCamUp:      { value: new THREE.Vector3(0, 1, 0) },
    uCamFwd:     { value: new THREE.Vector3(0, 0, -1) },
    uHalfExtent: { value: new THREE.Vector2(1, 1) },
    uTime:       { value: 0 },
    uThick:      { value: 1.0 },
    uExt:        { value: 0.012 },
    uAlbedo:     { value: 0.9 },
    uType:       { value: 0.6 },
    uSunDir:     { value: SUN.clone() },
    uSunCol:     { value: CLOUD_SUN_COLOR.clone() },
    uSkyCol:     { value: CLOUD_SKY_FAIR.clone() },
    uGndCol:     { value: CLOUD_GND_FAIR.clone() },
    uHazeCol:    { value: SKY_HORIZON.clone() },
    uFlash:      { value: 0 },
    uGain:       { value: CLOUD_GAIN },
    // Shared with the terrain and the sea, so the shadow can never drift out of
    // step with the cloud casting it.
    uWxWind:     uWxWind,
    uWxCov:      uWxCov,
  },
});

const cloudScene = new THREE.Scene();
const cloudCam   = new THREE.Camera();     // the quad ignores it; three needs one
const cloudQuad  = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), cloudMarchMat);
cloudQuad.frustumCulled = false;
cloudScene.add(cloudQuad);

// ----- and the screen quad that composites it back -----
// Parked at the far plane so the depth test does the occlusion for free: sky is
// still at the cleared depth of 1.0 and passes, anything the scene drew in front
// is nearer and rejects. Ordered to the front of the transparent queue so the
// rain, which is drawn later, falls *through* the cloud behind it.
const cloudCompMat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  depthTest: true,
  uniforms: {
    uTex:  { value: cloudRT.texture },
    uGain: { value: 1.0 / CLOUD_GAIN },
  },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = vec4(position.xy, 1.0, 1.0);
    }
  `,
  fragmentShader: /* glsl */`
    varying vec2 vUv;
    uniform sampler2D uTex;
    uniform float uGain;
    void main() {
      vec4 c = texture2D(uTex, vUv);
      float a = clamp(c.a, 0.0, 1.0);
      if (a < 0.002) discard;
      gl_FragColor = vec4(c.rgb * uGain / max(a, 1e-4), a);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }
  `,
});
const cloudComposite = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), cloudCompMat);
cloudComposite.frustumCulled = false;
cloudComposite.renderOrder = -900;
scene.add(cloudComposite);

function sizeCloudRT() {
  const pr = renderer.getPixelRatio();
  const w = Math.max(2, Math.round(window.innerWidth * pr * CLOUD_RES));
  const h = Math.max(2, Math.round(window.innerHeight * pr * CLOUD_RES));
  cloudRT.setSize(w, h);
}
sizeCloudRT();

const _wxClear = new THREE.Color();
// Called from tick() just before the scene render, so the texture the composite
// samples is this frame's.
function renderCloudLayer() {
  if (!cloudComposite.visible) return;
  const prevAlpha = renderer.getClearAlpha();
  renderer.getClearColor(_wxClear);
  renderer.setClearColor(0x000000, 0);
  renderer.setRenderTarget(cloudRT);
  renderer.render(cloudScene, cloudCam);
  renderer.setRenderTarget(null);
  renderer.setClearColor(_wxClear, prevAlpha);
}

let wxTime = 0;
let gloom = 0;                   // 0 clear sky .. 1 overcast right overhead
let rainAmt = 0;

// ----- lightning -----
// One strike at a time for the whole sky, which is all you can perceive anyway,
// and only while the deck is both stormy and actually overhead.
const boltInterval = (storm) => (storm >= 8 ? 2.5 + Math.random() * 6 : 7 + Math.random() * 15);
let boltT = -1;                  // seconds into the current flash, -1 when idle
let boltIn = boltInterval(5);
let boltDist = 0;

// The strike envelope: a fast leader, a dip, a brighter return stroke, then the
// glow rolling away. Real lightning is never a single clean flash.
function boltEnv(t) {
  if (t < 0.06) return t / 0.06;
  if (t < 0.14) return 1.0 - (t - 0.06) / 0.08 * 0.85;
  if (t < 0.20) return 0.15 + (t - 0.14) / 0.06 * 0.75;
  if (t < 0.50) return 0.90 * (1 - (t - 0.20) / 0.30);
  return 0;
}

let audioCtx = null;
function initAudio() {
  if (audioCtx) return audioCtx;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  try { audioCtx = new AC(); } catch (e) { audioCtx = null; }
  return audioCtx;
}

// Thunder, synthesised: brown noise (a random walk, which is what gives it the
// low rumble) shaped by an envelope and rolled off harder the further away the
// strike was. Close strikes get a crack on the front; distant ones are all roll.
function playThunder(vol, dist) {
  const ctx = audioCtx;
  if (!ctx || vol <= 0.02) return;
  if (ctx.state === 'suspended') ctx.resume().catch(() => {});
  try {
    const near = 1 - Math.min(1, dist / 1800);
    const sr = ctx.sampleRate;
    const n = Math.floor(sr * (1.5 + (1 - near) * 2.6));
    const buf = ctx.createBuffer(1, n, sr);
    const d = buf.getChannelData(0);
    let b = 0;
    for (let i = 0; i < n; i++) {
      b = b * 0.965 + (Math.random() * 2 - 1) * 0.035;
      const t = i / sr;
      const crack = near * Math.exp(-t * 26) * (Math.random() * 2 - 1) * 0.5;
      const roll  = Math.exp(-t * (1.0 + (1 - near) * 0.7)) * (0.6 + 0.4 * Math.sin(t * 3.1));
      d[i] = THREE.MathUtils.clamp(b * 7.5 * roll + crack, -1, 1);
    }
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 180 + near * 900;
    const g = ctx.createGain();
    g.gain.value = vol * 0.5;
    src.connect(lp); lp.connect(g); g.connect(ctx.destination);
    src.start();
  } catch (e) { /* audio is a nicety; never let it take the frame down */ }
}

function strike(storm, dist) {
  boltT = 0;
  boltDist = dist;
  boltIn = boltInterval(storm);
  const vol = THREE.MathUtils.clamp(1 - dist / 2000, 0, 1) * (0.35 + 0.065 * storm);
  if (audioCtx && vol > 0.02) {
    // Sound lags the flash by the distance over the speed of sound — the reason
    // you count the seconds between them.
    setTimeout(() => playThunder(vol, dist), Math.min(dist, 2400) / 340 * 1000);
  }
}

// ----- rain -----
// The drops belong to the deck, not to the camera. The cloud base and the ground
// under the camera give the column its live top and bottom, so a streak is born
// at the underside of the layer and dies at the dirt instead of living in a
// fixed-height box that follows you around. Only the vertical extent is
// cloud-anchored: the column's footprint still centres on the camera, because
// rain is only ever switched on while you are stood under it and a footprint the
// width of a weather system would spread the same drop budget so thin the rain
// would vanish.
//
// The fall itself is straight down in world Y (wrapped modulo the column
// height), so it never depends on which way the camera is looking — a drop is
// exactly as present when you look straight down as when you look at the
// horizon.
//
// Each drop is a screen-aligned quad — stretched along the camera's own up
// vector rather than a fixed world-space "streak" direction — so it is never
// foreshortened away. A quad built from a fixed world-space length axis goes
// edge-on and all but disappears the moment the view direction lines up with
// that axis, which is exactly what happened looking straight down at rain
// falling straight down. Billboarding fully off the camera (right *and* up)
// keeps the streak's full width and length on screen from every angle.
const RAIN_N     = isTouchDevice ? 5000 : 14000;
const RAIN_R     = 42;
const RAIN_LEN   = 6.0;
const RAIN_WIDTH = 0.04;

const rainMat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  uniforms: {
    uTime:      { value: 0 },
    uCam:       { value: new THREE.Vector3() },
    uCamRight:  { value: new THREE.Vector3(1, 0, 0) },
    uCamUp:     { value: new THREE.Vector3(0, 1, 0) },
    uIntensity: { value: 0 },
    uCol:       { value: new THREE.Color(0xb0c4de) },
    uCloudPos:  { value: new THREE.Vector3(0, 140, 0) },   // xz: where it leans to, y: the column top
    uCloudH:    { value: 100 },                            // column top down to the ground
  },
  vertexShader: /* glsl */`
    attribute vec2 aCorner;   // x: -1/+1 across the streak's width, y: 0 at the head, 1 at the wind-drawn tail
    uniform float uTime;
    uniform vec3 uCam;
    uniform vec3 uCamRight;
    uniform vec3 uCamUp;
    uniform vec3 uCloudPos;
    uniform float uCloudH;
    varying float vA;
    varying vec2 vC;
    void main() {
      vec3 p = position;      // xz: offset in the column, y: 0..1 along it
      // Per-drop fall speed, hashed off its own position so it stays put.
      float j = fract(sin(p.x * 12.9898 + p.z * 78.233) * 43758.5453);
      float span = max(uCloudH, 1.0);
      // Straight-down fall in world space, entirely independent of the camera,
      // wrapping over the live cloud-to-ground distance.
      float fall = mod(p.y * span - uTime * 26.0 * (0.8 + 0.5 * j), span);
      float h = fall / span;                      // 0 at the ground, 1 at the cloud base
      // Lean the top of the column downwind, so the streaks visibly trace back
      // up into the deck they came out of rather than to a point straight over
      // your head. Only a fraction of the way, or the far end of the column
      // would slide out of view entirely.
      vec2 lean = (uCloudPos.xz - uCam.xz) * 0.12 * h;
      vec3 w = vec3(uCam.x + p.x + lean.x, uCloudPos.y - span + fall, uCam.z + p.z + lean.y);
      w += aCorner.y * vec3(1.6, 0.0, 0.9) * 0.5;                 // gentle wind slant on the tail
      w += uCamUp * -aCorner.y * ${RAIN_LEN.toFixed(2)};          // billboarded length: never edge-on
      w += uCamRight * aCorner.x * ${RAIN_WIDTH.toFixed(3)};      // billboarded width
      // Ease the column off at both ends so drops are not cut off dead flat
      // where they leave the cloud or reach the dirt.
      vA = smoothstep(0.0, 0.05, h) * (1.0 - smoothstep(0.80, 1.0, h));
      vC = aCorner;
      gl_Position = projectionMatrix * viewMatrix * vec4(w, 1.0);
    }
  `,
  fragmentShader: /* glsl */`
    uniform float uIntensity;
    uniform vec3 uCol;
    varying float vA;
    varying vec2 vC;
    void main() {
      // A streak, not a rectangle: soft along its length (bright just behind the
      // head, tapering out at the tail) and soft across its width.
      float len  = smoothstep(0.0, 0.12, vC.y) * (1.0 - smoothstep(0.55, 1.0, vC.y));
      float wide = 1.0 - vC.x * vC.x;
      gl_FragColor = vec4(uCol, vA * len * wide * 0.95 * uIntensity);
    }
  `,
});

const rainObj = (() => {
  const pos = new Float32Array(RAIN_N * 4 * 3);
  const corner = new Float32Array(RAIN_N * 4 * 2);
  const idx = new Uint32Array(RAIN_N * 6);
  for (let i = 0; i < RAIN_N; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = Math.sqrt(Math.random()) * RAIN_R;
    // y is baked as a 0..1 fraction of the column: the shader scales it by the
    // live cloud-to-ground height, so the same buffer works for any cell.
    const x = Math.cos(a) * r, z = Math.sin(a) * r, y = Math.random();
    const corners = [[-1, 0], [1, 0], [-1, 1], [1, 1]];
    for (let v = 0; v < 4; v++) {
      const o = (i * 4 + v) * 3;
      pos[o] = x; pos[o + 1] = y; pos[o + 2] = z;
      corner[(i * 4 + v) * 2] = corners[v][0];
      corner[(i * 4 + v) * 2 + 1] = corners[v][1];
    }
    const base = i * 4, o6 = i * 6;
    idx[o6] = base; idx[o6 + 1] = base + 1; idx[o6 + 2] = base + 2;
    idx[o6 + 3] = base + 2; idx[o6 + 4] = base + 1; idx[o6 + 5] = base + 3;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aCorner', new THREE.BufferAttribute(corner, 2));
  geo.setIndex(new THREE.BufferAttribute(idx, 1));
  const o = new THREE.Mesh(geo, rainMat);
  o.frustumCulled = false;      // it is always around the camera by construction
  o.visible = false;
  scene.add(o);
  return o;
})();

// ----- overcast palettes -----
const FOG_BASE  = new THREE.Color(FOG_COLOR);
const GLOOM_FOG = new THREE.Color(0x8a97a6);
const GLOOM_Z   = new THREE.Color(0x2c3a4c);
const GLOOM_H   = new THREE.Color(0x8b98a6);

function updateWeather(dt) {
  wxTime += dt;
  // updateCamera() has moved the camera but three does not flush that into
  // matrixWorld until it renders, and both the cloud ray basis and the rain
  // billboarding read it. One frame of lag in a ray basis is a visible smear
  // while you turn, so pay for the flush here.
  camera.updateMatrixWorld();

  const storm = WEATHER.storminess;
  const st = storm / 10;

  // --- wind: the field slides, nothing else moves ---
  const wr = WEATHER.windDir * DEG;
  const wvx = Math.cos(wr), wvz = Math.sin(wr);
  const wspd = WEATHER.speed * WIND_UNIT;
  // Subtracted: a sample point p reads the field at p + offset, so walking the
  // offset backwards walks the cloud forwards.
  uWxWind.value.x -= wvx * wspd * dt;
  uWxWind.value.y -= wvz * wspd * dt;

  // --- how much sky is covered, and how it looks ---
  // Storminess widens the coverage on its own: a squall is not just darker, it
  // is a bigger piece of sky.
  uWxCov.value = WEATHER.density * (0.72 + 0.055 * storm);
  uWxShade.value = 0.40 + 0.042 * storm;

  const cu = cloudMarchMat.uniforms;
  cu.uTime.value = wxTime;
  cu.uThick.value  = 1.7 + 1.5 * st;
  cu.uExt.value    = 0.010 + 0.012 * st;
  cu.uAlbedo.value = 0.98 - 0.26 * st;
  // Fair weather builds cumulus low in the slab; a storm fills it top to bottom.
  cu.uType.value   = 1.0 - 0.85 * st;
  cu.uSunDir.value.copy(SUN);
  // Barely dimmed by the weather. A storm cloud's *top* is as brilliantly white
  // as any other cloud's — what makes it read as a storm is that it is optically
  // thick enough for its underside to go black, which is uExt's job, not this
  // one. Dimming the sun as well just made the whole sky muddy.
  cu.uSunCol.value.copy(CLOUD_SUN_COLOR).multiplyScalar(1.15 - 0.2 * st);
  cu.uSkyCol.value.copy(CLOUD_SKY_FAIR).lerp(CLOUD_SKY_STORM, st);
  cu.uGndCol.value.copy(CLOUD_GND_FAIR).lerp(CLOUD_GND_STORM, st);
  cu.uHazeCol.value.copy(skyMat.uniforms.uHorizon.value);
  cu.uCamPos.value.copy(camera.position);
  cu.uCamRight.value.setFromMatrixColumn(camera.matrixWorld, 0);
  cu.uCamUp.value.setFromMatrixColumn(camera.matrixWorld, 1);
  cu.uCamFwd.value.setFromMatrixColumn(camera.matrixWorld, 2).negate();
  const tanH = Math.tan(camera.fov * DEG * 0.5);
  cu.uHalfExtent.value.set(tanH * camera.aspect, tanH);

  // --- what the sky is doing directly above the camera ---
  const covHere = coverageAt(camera.position.x, camera.position.z);
  const cover = clamp01((covHere - 0.32) / 0.45) * (0.35 + 0.065 * storm);

  // --- lightning ---
  const canStrike = storm >= 6 && covHere > 0.40;
  if (boltT >= 0) {
    boltT += dt;
    if (boltT > 0.5) boltT = -1;
  } else if (canStrike) {
    boltIn -= dt;
    if (boltIn <= 0) strike(storm, 150 + Math.random() * 1700);
  } else {
    boltIn = boltInterval(storm);
  }
  const flash = boltT >= 0 ? boltEnv(boltT) : 0;
  const flashGlobal = flash * (1 - clamp01((boltDist - 250) / 1300));
  cu.uFlash.value = flash * 2.2;

  // --- the sky reacting to what is in it ---
  gloom += (cover - gloom) * (1 - Math.exp(-1.2 * dt));
  sun.intensity        = SUN_BASE  * (1 - 0.60 * gloom);
  hemiLight.intensity  = HEMI_BASE * (1 - 0.30 * gloom) + 0.55 * flashGlobal;
  ambLight.intensity   = AMB_BASE  * (1 - 0.25 * gloom) + 1.9 * flashGlobal;

  const g = gloom * 0.8;
  skyMat.uniforms.uZenith.value.copy(SKY_ZENITH).lerp(GLOOM_Z, g);
  skyMat.uniforms.uHorizon.value.copy(SKY_HORIZON).lerp(GLOOM_H, g);
  if (!underwater) {
    scene.fog.color.copy(FOG_BASE).lerp(GLOOM_FOG, gloom * 0.75);
  }

  // Nothing to composite from under the sea — the surface is between you and
  // the sky, and the tint over the whole frame is doing that job instead.
  cloudComposite.visible = !underwater;

  // --- rain ---
  // The slider is a floor, not an override: it can make it rain out of a clear
  // sky, and a storm overhead still rains harder than the slider asks for.
  const natural = clamp01((covHere - 0.45) / 0.35) * clamp01((storm - 3) / 5);
  let rainWant = Math.max(natural, WEATHER.rain / 10);
  // Only if we are actually underneath the deck rather than flying above it.
  if (camera.position.y > CLOUD_BOT - 6) rainWant = 0;

  rainAmt += (rainWant - rainAmt) * (1 - Math.exp(-0.9 * dt));
  rainObj.visible = rainAmt > 0.02 && !underwater;
  if (rainObj.visible) {
    const ground = terrainHeight(camera.position.x, camera.position.z);
    // Capped, and this is not cosmetic: the drop budget is fixed, so spreading
    // it over the full 1500 units the deck sits at would thin the rain out into
    // a barely-visible drizzle. The column instead fills the bottom of that gap
    // — the part you can actually see — and the streaks still lean downwind,
    // which is what sells where they came from.
    const span = Math.min(380, Math.max(20, CLOUD_BOT - ground));
    rainMat.uniforms.uCloudPos.value.set(
      camera.position.x + wvx * 260, ground + span, camera.position.z + wvz * 260);
    rainMat.uniforms.uCloudH.value = span;
    rainMat.uniforms.uTime.value = wxTime;
    rainMat.uniforms.uCam.value.copy(camera.position);
    // Columns 0 and 1 of the camera's world matrix are its right and up
    // vectors — billboarding the streak quads off both keeps them fully
    // screen-facing (and therefore visible) from any camera angle.
    rainMat.uniforms.uCamRight.value.setFromMatrixColumn(camera.matrixWorld, 0);
    rainMat.uniforms.uCamUp.value.setFromMatrixColumn(camera.matrixWorld, 1);
    // A gentle floor keeps even a light drizzle legible instead of fading to a
    // near-invisible haze, while heavier cells still read as visibly heavier.
    rainMat.uniforms.uIntensity.value = 0.35 + 0.65 * rainAmt;
  }
}

// ---------------------------------------------------------------------------
// Weather UI — the hamburger drawer
// ---------------------------------------------------------------------------
const wxToggleBtn = document.getElementById('wx-toggle');
const wxScrimEl   = document.getElementById('wx-scrim');
const wxPanelEl   = document.getElementById('wx-panel');
const wxCoverEl   = document.getElementById('wx-cover');
const wxGloomEl   = document.getElementById('wx-gloom');
const wxRainPcEl  = document.getElementById('wx-rainpc');

// id, the WEATHER key it drives, how its value reads out.
const WX_SLIDERS = [
  ['wx-density', 'density',    (v) => v.toFixed(2)],
  ['wx-speed',   'speed',      (v) => v.toFixed(1)],
  ['wx-wind',    'windDir',    (v) => v.toFixed(0) + '°'],
  ['wx-storm',   'storminess', (v) => v.toFixed(1)],
  ['wx-rain',    'rain',       (v) => v.toFixed(1)],
];

for (const [id, key, fmt] of WX_SLIDERS) {
  const el  = document.getElementById(id);
  const out = document.getElementById(id + '-v');
  const apply = () => {
    WEATHER[key] = parseFloat(el.value);
    out.textContent = fmt(WEATHER[key]);
  };
  el.addEventListener('input', apply);
  el.addEventListener('change', apply);
  // The world's look/move handlers live on the canvas and on window; a drag
  // that starts on a slider belongs to the slider and to nothing else.
  el.addEventListener('pointerdown', (e) => e.stopPropagation());
  el.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true });
  el.addEventListener('touchmove', (e) => e.stopPropagation(), { passive: true });
  apply();
}

// Pushes WEATHER back out to the sliders — for the reset button, and for
// anything driving the weather from the console.
function refreshWxUI() {
  for (const [id, key, fmt] of WX_SLIDERS) {
    const el = document.getElementById(id);
    el.value = String(WEATHER[key]);
    document.getElementById(id + '-v').textContent = fmt(WEATHER[key]);
  }
}

function setWxPanel(open) {
  document.body.classList.toggle('wx-open', open);
  wxToggleBtn.innerHTML = open ? '&times;' : '&#9776;';
}
function toggleWxPanel() {
  setWxPanel(!document.body.classList.contains('wx-open'));
}

bindTap(wxToggleBtn, () => {
  initAudio();                          // first gesture — unlock thunder
  toggleWxPanel();
});
bindTap(wxScrimEl, () => setWxPanel(false));
bindTap(document.getElementById('wx-reset'), () => {
  Object.assign(WEATHER, WEATHER_DEFAULTS);
  refreshWxUI();
});
// A drag inside the drawer is the drawer's, never the camera's.
wxPanelEl.addEventListener('pointerdown', (e) => e.stopPropagation());
wxPanelEl.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true });

// The footer readouts, refreshed off the HUD's own slow tick rather than every
// frame — they are a glance, not an instrument.
function refreshWxReadout() {
  wxCoverEl.textContent  = Math.round(coverageAt(camera.position.x, camera.position.z) * 100) + '%';
  wxGloomEl.textContent  = Math.round(gloom * 100) + '%';
  wxRainPcEl.textContent = Math.round(rainAmt * 100) + '%';
}

refreshWxUI();

// ---------------------------------------------------------------------------
// Character controller — a cannon-es body whose velocity is driven by input
// rather than by forces, so the movement stays crisp and predictable.
// ---------------------------------------------------------------------------
const playerBody = new CANNON.Body({
  // Heavier than the crates on purpose. The controller sets velocity directly so
  // mass never affects how the character itself moves — it only decides how much
  // authority the body has in contact impulses, i.e. whether walking into a crate
  // shoves it or stalls against it.
  mass: 6,
  material: physPlayer,
  fixedRotation: true,
  linearDamping: 0,
  angularDamping: 1,
  allowSleep: false,
});
let crouched = false;
let swimming = false;

function setPlayerShape(crouch) {
  while (playerBody.shapes.length) playerBody.removeShape(playerBody.shapes[0]);
  const r = PLAYER.radius;
  if (crouch) {
    playerBody.addShape(new CANNON.Sphere(r));                            // 0.8 tall
  } else {
    // Three stacked spheres stand in for a 1.6-tall capsule (cannon has no
    // capsule primitive). Rounded feet ride over kerbs and up ramps without a
    // dedicated step-up hack.
    playerBody.addShape(new CANNON.Sphere(r), new CANNON.Vec3(0, -0.4, 0));
    playerBody.addShape(new CANNON.Sphere(r), new CANNON.Vec3(0,  0.0, 0));
    playerBody.addShape(new CANNON.Sphere(r), new CANNON.Vec3(0,  0.4, 0));
  }
  playerBody.updateBoundingRadius();
  playerBody.updateMassProperties();   // honours fixedRotation, keeps mass = 1
}
setPlayerShape(false);
playerBody.position.set(SPAWN.x, SPAWN.y, SPAWN.z);
playerBody.updateAABB();
world.addBody(playerBody);

// Visible body — hidden in first person, shown everywhere else.
const playerGeoStand  = new THREE.CapsuleGeometry(PLAYER.radius, 0.8, 6, 18);
const playerGeoCrouch = new THREE.CapsuleGeometry(PLAYER.radius, 0.0, 6, 18);
const playerMesh = new THREE.Mesh(
  playerGeoStand,
  mat(0x63b9ff, 0.42, 0.28, { emissive: 0x0d2c4a, emissiveIntensity: 0.55 })
);
playerMesh.castShadow = true;
playerMesh.receiveShadow = true;
const visor = new THREE.Mesh(
  new THREE.BoxGeometry(0.34, 0.12, 0.14),
  mat(0xffe6a8, 0.3, 0.1, { emissive: 0x6a4a10, emissiveIntensity: 0.9 })
);
visor.position.set(0, 0.42, -0.34);
playerMesh.add(visor);
scene.add(playerMesh);

// Steepest-upward contact normal touching the player, refreshed every substep.
// A contact whose normal is within maxSlope of straight up is walkable ground.
let groundNy = 0;
world.addEventListener('postStep', () => {
  let best = 0;
  for (const c of world.contacts) {
    let ny;
    if (c.bi === playerBody) ny = -c.ni.y;        // ni runs from bi to bj
    else if (c.bj === playerBody) ny = c.ni.y;
    else continue;
    if (ny > best) best = ny;
  }
  groundNy = best;
});

let coyote = 0;                       // grace period for late jump presses
let jumpLock = 0;                     // contacts survive a step after take-off
let eyeH = PLAYER.standEye;           // smoothed, so crouching ducks the view
let playerYaw = SPAWN_YAW * DEG;
const wishDir = new THREE.Vector3();

const centerOffset = () => (crouched ? PLAYER.crouchCenter : PLAYER.standCenter);

// Is there room to stand back up, or are we under the crouch tunnel?
function hasHeadroom() {
  const p = playerBody.position;
  const from = new CANNON.Vec3(p.x, p.y, p.z);
  const to   = new CANNON.Vec3(p.x, p.y + 1.35, p.z);
  let blocked = false;
  world.raycastAll(from, to, {}, (res) => { if (res.body !== playerBody) blocked = true; });
  return !blocked;
}

function respawn() {
  playerBody.position.set(SPAWN.x, SPAWN.y, SPAWN.z);
  playerBody.velocity.setZero();
  playerBody.wakeUp();
  state.yaw = SPAWN_YAW * DEG;
  state.pitch = 0;
}

function updatePlayer(dt) {
  const p = playerBody.position, v = playerBody.velocity;

  // --- how much of the body is under the pool surface (0 = dry, 1 = under) ---
  const bodyH = crouched ? PLAYER.crouchEye : PLAYER.standEye;
  const submerged = inWaterColumn(p.x, p.z)
    ? THREE.MathUtils.clamp((WATER.surfaceY - (p.y - centerOffset())) / bodyH, 0, 1)
    : 0;
  // Hysteresis: bobbing across a single threshold would flip between swimming and
  // walking once a frame, and every walking frame would drop the player.
  swimming = submerged > (swimming ? WATER.swimOut : WATER.swimIn);

  // --- crouch: held on desktop, latched on touch (in water C swims down) ---
  const wantCrouch = (keys.has('KeyC') || state.crouchBtn) && !swimming;
  if (wantCrouch && !crouched) {
    setPlayerShape(true);
    p.y -= PLAYER.standCenter - PLAYER.crouchCenter;   // keep the feet planted
    crouched = true;
  } else if (!wantCrouch && crouched && hasHeadroom()) {
    setPlayerShape(false);
    p.y += PLAYER.standCenter - PLAYER.crouchCenter;
    crouched = false;
  }

  jumpLock = Math.max(0, jumpLock - dt);
  const grounded = groundNy > GROUND_DOT && jumpLock === 0;
  const onSteep  = !grounded && groundNy > 0.05 && groundNy <= GROUND_DOT;
  coyote = grounded ? PLAYER.coyote : Math.max(0, coyote - dt);

  // --- wish direction ---
  const sy = Math.sin(state.yaw), cy = Math.cos(state.yaw);
  let wishY = 0;
  wishDir.set(0, 0, 0);
  if (camMode === CAM.TOP) {
    // Top-down drives the world axes directly — the camera has no heading to be
    // relative to, so W is north rather than "forward".
    if (keys.has('KeyW') || keys.has('ArrowUp'))    wishDir.z -= 1;
    if (keys.has('KeyS') || keys.has('ArrowDown'))  wishDir.z += 1;
    if (keys.has('KeyA') || keys.has('ArrowLeft'))  wishDir.x -= 1;
    if (keys.has('KeyD') || keys.has('ArrowRight')) wishDir.x += 1;
    wishDir.x += state.joyX;
    wishDir.z += state.joyY;
  } else {
    let fwd = 0, str = 0;
    if (keys.has('KeyW') || keys.has('ArrowUp'))    fwd += 1;
    if (keys.has('KeyS') || keys.has('ArrowDown'))  fwd -= 1;   // backpedal
    if (keys.has('KeyD') || keys.has('ArrowRight')) str += 1;
    if (keys.has('KeyA') || keys.has('ArrowLeft'))  str -= 1;
    fwd -= state.joyY;                                          // stick up = forward
    str += state.joyX;
    // Swimming steers with the camera pitch as well, so you dive where you look.
    const cp = swimming ? Math.cos(state.pitch) : 1;
    wishDir.set(-sy * fwd * cp + cy * str, 0, -cy * fwd * cp - sy * str);
    if (swimming) {
      if (keys.has('Space') || state.jumpHeld)     wishY += 1;
      if (keys.has('KeyC')  || state.crouchBtn)    wishY -= 1;
      wishDir.y = Math.sin(state.pitch) * fwd + wishY;
    }
  }
  const wl = wishDir.length();
  if (wl > 1) wishDir.divideScalar(wl);

  // Wading drags on you, and past the swim threshold it hands over to the (much
  // slower) swim speed at roughly the same value, so the change of gait is smooth.
  const wade = 1 - 0.42 * Math.min(1, submerged / WATER.swimIn);
  const speed = swimming
    ? PLAYER.walk * WATER.speedMult
    : (crouched ? PLAYER.crouchSpeed : PLAYER.walk * (isSprinting() ? PLAYER.sprintMult : 1)) * wade;

  // Sprint drives forward and strafe only: whatever part of the target velocity
  // points behind the camera is trimmed back to the walk speed, so you can back
  // up but never backpedal at a sprint. Top-down has no camera heading to be
  // behind, so it keeps driving the world axes as before.
  let tx = wishDir.x * speed, tz = wishDir.z * speed;
  if (camMode !== CAM.TOP) {
    const backCap = Math.min(speed, PLAYER.walk * (swimming ? 1 : wade));
    const along = tx * -sy + tz * -cy;      // + ahead of the camera, - behind it
    if (along < -backCap) {
      const over = along + backCap;         // negative — the excess to take out
      tx += sy * over;                      // i.e. t -= over * forward
      tz += cy * over;
    }
  }

  if (swimming) {
    // No ground to push off, so all three axes are driven the same way and the
    // lerp itself provides the drag.
    const k = 1 - Math.exp(-WATER.accel * dt);
    v.x += (tx - v.x) * k;
    v.z += (tz - v.z) * k;
    v.y += (wishDir.y * speed - v.y) * k;
    // Buoyancy: hand back most of the gravity the solver is about to apply.
    v.y += 9.82 * (1 - WATER.gravityScale) * dt;
    // Left alone near the top you settle at the surface and ride the swell. A
    // deliberate dive gives way — but a couple of degrees of look-down does not,
    // or you would sink every time you swam along the surface off the level.
    if (Math.abs(wishDir.y) < 0.25) {
      const bob = Math.sin(elapsed * 1.9) * 0.055 + Math.sin(elapsed * 1.07 + 2.1) * 0.035;
      const rest = WATER.surfaceY + bob - bodyH * 0.85 + centerOffset();
      const d = rest - p.y;
      if (Math.abs(d) < 1.4) {
        v.y += (THREE.MathUtils.clamp(d * 3.2, -1.2, 1.2) - v.y) * (1 - Math.exp(-6 * dt));
      }
    }
    playerBody.wakeUp();
  } else if (grounded) {
    const k = 1 - Math.exp(-PLAYER.groundAccel * dt);
    v.x += (tx - v.x) * k;
    v.z += (tz - v.z) * k;
  } else if (!onSteep) {
    // Reduced authority in the air; never scrubs speed you already carried, so a
    // sprint jump keeps its momentum even if shift is released mid-flight.
    const hs0 = Math.hypot(v.x, v.z);
    v.x += wishDir.x * PLAYER.airAccel * dt;
    v.z += wishDir.z * PLAYER.airAccel * dt;
    const hs = Math.hypot(v.x, v.z);
    const cap = Math.max(hs0, Math.hypot(tx, tz));
    if (hs > cap) { v.x = v.x / hs * cap; v.z = v.z / hs * cap; }
  }
  // Steeper than maxSlope: no input authority at all. Player/level friction is
  // zero, so gravity simply slides you back down — that is the red 55-degree lane.

  // --- jump (in water Space is the swim-up key instead) ---
  if ((state.jumpQueued || keys.has('Space')) && coyote > 0 && !crouched && !swimming) {
    v.y = PLAYER.jumpSpeed;
    coyote = 0;
    groundNy = 0;
    jumpLock = 0.15;
    playerBody.wakeUp();
  }
  state.jumpQueued = false;

  if (p.y < -25) respawn();

  // --- derived view state ---
  const targetEye = crouched ? PLAYER.crouchEye : PLAYER.standEye;
  eyeH += (targetEye - eyeH) * (1 - Math.exp(-14 * dt));

  if (camMode === CAM.TOP) {
    if (Math.hypot(v.x, v.z) > 0.4) playerYaw = Math.atan2(-v.x, -v.z);
  } else {
    playerYaw = state.yaw;
  }

  // In top-down the fly pad and E/Q become zoom controls.
  if (camMode === CAM.TOP) {
    const out = state.flyUp   || keys.has('KeyE');
    const inn = state.flyDown || keys.has('KeyQ');
    if (out) topZoom = Math.min(90, topZoom + 22 * dt);
    if (inn) topZoom = Math.max(8, topZoom - 22 * dt);
  }
}

// ---------------------------------------------------------------------------
// Camera modes
// ---------------------------------------------------------------------------
const CAM = { FIRST: 0, THIRD: 1, TOP: 2, FREE: 3 };
const CAM_NAMES = ['First Person', 'Third Person', 'Top Down', 'Free Camera'];
let camMode = CAM.FREE;               // start exactly as the old build did
let lastGameCam = CAM.FIRST;
let topZoom = 26;
let blendT = 1;                        // 1 = settled, <1 = mid transition
const BLEND_DUR = 0.42;
const blendPos = new THREE.Vector3();
const blendQuat = new THREE.Quaternion();

function setCamMode(next) {
  if (next === camMode) return;
  let snap = false;

  if (next === CAM.FREE) {
    lastGameCam = camMode;
    // Hand the flying camera the transform we are already looking through so
    // detaching from physics is seamless; yaw/pitch are shared already.
    state.pos.copy(camera.position);
  } else if (camMode === CAM.FREE) {
    snap = true;                       // re-attaching jumps straight to the body
    playerBody.wakeUp();
  }

  camMode = next;
  if (snap) {
    blendT = 1;
  } else {
    blendPos.copy(camera.position);
    blendQuat.copy(camera.quaternion);
    blendT = 0;
  }
  refreshModeUI();
}
function cycleCamera()   { setCamMode((camMode + 1) % 4); }
function toggleGameMode() { setCamMode(camMode === CAM.FREE ? lastGameCam : CAM.FREE); }

const desiredPos  = new THREE.Vector3();
const desiredQuat = new THREE.Quaternion();
const camEuler    = new THREE.Euler(0, 0, 0, 'YXZ');
const camTarget   = new THREE.Vector3();
const camBack     = new THREE.Vector3();
const boomRay     = new THREE.Raycaster();

function updateCamera(dt) {
  const p = playerBody.position;
  const feetY = p.y - centerOffset();

  if (camMode === CAM.FREE) {
    desiredPos.copy(state.pos);
    camEuler.set(state.pitch, state.yaw, 0);
  } else if (camMode === CAM.TOP) {
    desiredPos.set(p.x, feetY + topZoom, p.z);
    camEuler.set(-Math.PI / 2, 0, 0);
  } else {
    camEuler.set(state.pitch, state.yaw, 0);
    if (camMode === CAM.FIRST) {
      desiredPos.set(p.x, feetY + eyeH, p.z);
    } else {
      camTarget.set(p.x, feetY + eyeH * 0.86, p.z);
      camBack.set(0, 0, 1).applyEuler(camEuler);      // straight back along view
      let dist = THIRD_DIST;
      boomRay.set(camTarget, camBack);
      boomRay.far = dist + 0.5;
      const hit = boomRay.intersectObjects(objects.children, false)[0];
      if (hit) dist = Math.max(1.1, hit.distance - 0.35);   // pull in through trunks
      desiredPos.copy(camTarget).addScaledVector(camBack, dist);
    }
    // The boom ray only knows about the props. Terrain is a single 80k-triangle
    // mesh and raycasting it every frame is not worth it when the heightmap can
    // answer the same question directly: never let the boom leave the camera
    // inside a hillside. (Top-down needs no such guard — it sits straight above
    // the player, and a heightmap has nothing overhead.)
    // 1.2 of clearance, not a hair: terrainHeight is the smooth surface, while
    // the mesh is flat triangles across a 2-unit cell, and in a valley cell the
    // triangle can sit up to ~0.7 above the curve it is chasing.
    const floorY = terrainHeight(desiredPos.x, desiredPos.z) + 1.2;
    if (desiredPos.y < floorY) desiredPos.y = floorY;
  }
  desiredQuat.setFromEuler(camEuler);

  if (blendT < 1) {
    blendT = Math.min(1, blendT + dt / BLEND_DUR);
    const s = blendT * blendT * (3 - 2 * blendT);       // smoothstep
    camera.position.lerpVectors(blendPos, desiredPos, s);
    camera.quaternion.slerpQuaternions(blendQuat, desiredQuat, s);
  } else {
    camera.position.copy(desiredPos);
    camera.quaternion.copy(desiredQuat);
  }

  playerMesh.visible = camMode !== CAM.FIRST;
  playerMesh.geometry = crouched ? playerGeoCrouch : playerGeoStand;
  visor.position.y = crouched ? 0.10 : 0.42;
  playerMesh.position.set(p.x, p.y, p.z);
  playerMesh.rotation.y = playerYaw;
}

window.addEventListener('wheel', (e) => {
  if (camMode !== CAM.TOP) return;
  topZoom = THREE.MathUtils.clamp(topZoom + e.deltaY * 0.03, 8, 90);
  e.preventDefault();
}, { passive: false });

// ---------------------------------------------------------------------------
// Mode UI
// ---------------------------------------------------------------------------
const camModeEl = document.getElementById('cam-mode');
const instrEl   = document.getElementById('instructions');
const modeBtn   = document.getElementById('mode-btn');

const HELP_DESKTOP = {
  [CAM.FIRST]: [['W / S', 'Walk / back'], ['A / D', 'Strafe'], ['Space', 'Jump'], ['C', 'Crouch'],
                ['Shift', 'Sprint fwd (2&times;)'], ['Mouse', 'Look'], ['Space / C', 'Swim up / down'],
                ['V', 'Next camera'], ['G', 'Free camera'], ['R', 'Respawn'],
                ['Click view', 'Capture mouse'], ['Esc', 'Free the cursor']],
  [CAM.THIRD]: [['W / S', 'Walk / back'], ['A / D', 'Strafe'], ['Space', 'Jump'], ['C', 'Crouch'],
                ['Shift', 'Sprint fwd (2&times;)'], ['Mouse', 'Orbit'], ['Space / C', 'Swim up / down'],
                ['V', 'Next camera'], ['G', 'Free camera'], ['R', 'Respawn'],
                ['Click view', 'Capture mouse'], ['Esc', 'Free the cursor']],
  [CAM.TOP]:   [['W A S D', 'Move (world axes)'], ['Space', 'Jump'], ['C', 'Crouch'],
                ['Shift', 'Sprint (2&times;)'], ['Wheel / E Q', 'Zoom'], ['V', 'Next camera'],
                ['G', 'Free camera'], ['Esc', 'Free the cursor']],
  [CAM.FREE]:  [['W A S D', 'Fly'], ['E / Q', 'Up / down'], ['Shift', 'Sprint (3&times;)'],
                ['Mouse', 'Look'], ['M / &#9776;', 'Weather panel'],
                ['V', 'Next camera'], ['G', 'Enter game'], ['Esc', 'Free the cursor']],
};
const HELP_TOUCH = {
  [CAM.FIRST]: [['Left stick', 'Move (back too)'], ['Right drag', 'Look'], ['JUMP', 'Jump / swim up'],
                ['CROUCH', 'Crouch / swim down'], ['SPRINT', 'Toggle sprint']],
  [CAM.THIRD]: [['Left stick', 'Move (back too)'], ['Right drag', 'Orbit'], ['JUMP', 'Jump / swim up'],
                ['CROUCH', 'Crouch / swim down'], ['SPRINT', 'Toggle sprint']],
  [CAM.TOP]:   [['Left stick', 'Move (world axes)'], ['&#9650; / &#9660;', 'Zoom out / in']],
  [CAM.FREE]:  [['Left half', 'Joystick &mdash; fly'], ['Right half', 'Drag to look'],
                ['&#9650; / &#9660;', 'Up / down'], ['2 fingers', 'Sprint (3&times;)'],
                ['&#9776;', 'Weather sliders']],
};

function refreshModeUI() {
  const inGame = camMode !== CAM.FREE;
  camModeEl.innerHTML = 'Cam &mdash; ' + CAM_NAMES[camMode];
  modeBtn.textContent = inGame ? 'Free Camera' : 'Game Mode';
  modeBtn.classList.toggle('game', inGame);

  const rows = (isTouchDevice ? HELP_TOUCH : HELP_DESKTOP)[camMode];
  instrEl.innerHTML = '<span class="title">' + CAM_NAMES[camMode] + '</span>' +
    rows.map(([k, v]) => `<div class="row"><b>${k}</b><span>${v}</span></div>`).join('');
  document.body.classList.toggle('free-cam', camMode === CAM.FREE);

  // Fly pad doubles as the top-down zoom pad; action pad is for on-foot modes.
  document.body.classList.toggle('pad-fly', camMode === CAM.FREE || camMode === CAM.TOP);
  document.body.classList.toggle('pad-act', camMode === CAM.FIRST || camMode === CAM.THIRD);
  document.getElementById('crosshair').style.display = (camMode === CAM.THIRD || camMode === CAM.TOP) ? 'none' : '';
}

// Deliberately does NOT grab the pointer on the way into game mode. While the
// pointer is locked the browser routes every mouse event to the locked element,
// so nothing at all reaches a DOM button — a mode button that locks the pointer
// makes itself unclickable the moment it succeeds, which is exactly why this one
// "didn't always work". Esc frees the cursor (and pops the overlay, which this
// button now sits above); a click in the world captures it again.
bindTap(modeBtn, () => {
  initAudio();                          // first gesture — unlock thunder
  toggleGameMode();
});
refreshModeUI();

// ---------------------------------------------------------------------------
// Overlay
// ---------------------------------------------------------------------------
const overlay = document.getElementById('overlay');
const sprintEl = document.getElementById('sprint');

const KEY_ROWS_DESKTOP = [
  ['W A S D', 'Fly (free camera)'],
  ['Mouse', 'Look'],
  ['E / Q', 'Fly up / down'],
  ['Shift', 'Sprint (3&times;)'],
  ['G', 'Enter game mode'],
  ['V', 'Cycle camera'],
  ['Esc', 'Release mouse'],
];
const KEY_ROWS_TOUCH = [
  ['Left half', 'Virtual joystick &mdash; move'],
  ['Right half', 'Drag to look'],
  ['2 fingers', 'Same side &rarr; sprint (3&times;)'],
  ['&#9650; / &#9660;', 'Fly up / down'],
  ['Game Mode', 'Top-right button &rarr; play on foot'],
];
document.getElementById('keys').innerHTML =
  (isTouchDevice ? KEY_ROWS_TOUCH : KEY_ROWS_DESKTOP)
    .map(([k, v]) => `<b>${k}</b><span>${v}</span>`).join('');
document.getElementById('start-btn').textContent = isTouchDevice ? 'Tap to fly' : 'Enter';

function hideOverlay() {
  overlay.classList.add('hidden');
  initAudio();                  // the gesture the browser wants before any sound
  if (!isTouchDevice) requestLock();
}
function showOverlay() { overlay.classList.remove('hidden'); }

overlay.addEventListener('pointerdown', (e) => { e.preventDefault(); hideOverlay(); }, { passive: false });
overlay.addEventListener('touchstart', (e) => { e.preventDefault(); hideOverlay(); }, { passive: false });

// ---------------------------------------------------------------------------
// Resize
// ---------------------------------------------------------------------------
function resize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const aspect = w / Math.max(h, 1);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w, h, false);
  camera.aspect = aspect;
  // Original used a 90-degree vertical FOV at 16:9. Here the horizontal FOV is
  // pinned near 90 degrees and the vertical is derived, so portrait phones keep
  // a usable view instead of a keyhole.
  camera.fov = THREE.MathUtils.clamp(
    2 * Math.atan(Math.tan(45 * DEG) / aspect) / DEG, 55, 95
  );
  camera.updateProjectionMatrix();
  // The cloud march renders at a fraction of the frame, so its target is sized
  // off the live backing-store dimensions rather than off a one-time guess.
  sizeCloudRT();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
resize();

// ---------------------------------------------------------------------------
// Main loop
// ---------------------------------------------------------------------------
const fpsEl = document.getElementById('fps');
const posEl = document.getElementById('pos');
const clock = new THREE.Clock();
let frames = 0, fpsAccum = 0, fps = 0, hudAccum = 0;

const forward = new THREE.Vector3();
const right = new THREE.Vector3();
const move = new THREE.Vector3();
let elapsed = 0;

// The original flying camera, untouched apart from living in its own function.
function updateFreeCam(dt) {
  const sy = Math.sin(state.yaw), cy = Math.cos(state.yaw);
  forward.set(-sy, 0, -cy);   // camera looks down -Z at yaw 0
  right.set(cy, 0, -sy);

  move.set(0, 0, 0);
  if (keys.has('KeyW') || keys.has('ArrowUp'))    move.addScaledVector(forward, 1);
  if (keys.has('KeyS') || keys.has('ArrowDown'))  move.addScaledVector(forward, -1);
  if (keys.has('KeyD') || keys.has('ArrowRight')) move.addScaledVector(right, 1);
  if (keys.has('KeyA') || keys.has('ArrowLeft'))  move.addScaledVector(right, -1);
  if (keys.has('KeyE') || state.flyUp)   move.y += 1;
  if (keys.has('KeyQ') || state.flyDown) move.y -= 1;

  if (state.joyX || state.joyY) {
    move.addScaledVector(right, state.joyX);
    move.addScaledVector(forward, -state.joyY);   // finger up = forward
  }

  const len = move.length();
  if (len > 0) {
    const mag = Math.min(1, len);                 // analog on stick, full tilt on keys
    const step = MOVE_SPEED * (isSprinting() ? SPRINT_MULT : 1) * dt * mag / len;
    state.pos.addScaledVector(move, step);
  }
}

function tick() {
  const dt = Math.min(clock.getDelta(), 0.1);
  elapsed += dt;

  if (camMode === CAM.FREE) {
    updateFreeCam(dt);
    // Nobody is driving the character — park it so it does not creep away.
    playerBody.velocity.x = 0;
    playerBody.velocity.z = 0;
  } else {
    updatePlayer(dt);
  }

  // --- physics: fixed 60 Hz steps, sub-stepped to catch up with the frame ---
  world.step(PHYS_STEP, dt, 4);
  for (let i = 0; i < syncList.length; i++) {
    const s = syncList[i];
    s.mesh.position.copy(s.body.position);
    s.mesh.quaternion.copy(s.body.quaternion);
  }

  updateCamera(dt);
  waterTime.value = elapsed;
  updateWaterVisuals();
  // After the water swap, which owns the fog when the camera is submerged — the
  // weather only repaints it while we are above the surface.
  updateWeather(dt);
  sky.position.copy(camera.position);
  // Slide the sea under the camera. The waves themselves are a function of world
  // position, so nothing moves with it — the tessellation just follows the eye,
  // and the horizon is always another 1180 units away.
  ocean.position.set(camera.position.x, 0, camera.position.z);
  sprintEl.classList.toggle('on', isSprinting() && camMode !== CAM.TOP);

  // --- HUD ---
  frames++;
  fpsAccum += dt;
  hudAccum += dt;
  if (fpsAccum >= 0.5) {
    fps = frames / fpsAccum;
    frames = 0;
    fpsAccum = 0;
  }
  if (hudAccum >= 0.1) {
    hudAccum = 0;
    fpsEl.textContent = fps.toFixed(0).padStart(3, ' ');
    const p = camMode === CAM.FREE
      ? state.pos
      : { x: playerBody.position.x, y: playerBody.position.y - centerOffset(), z: playerBody.position.z };
    posEl.textContent =
      p.x.toFixed(1).padStart(6, ' ') + ',' +
      p.y.toFixed(1).padStart(6, ' ') + ',' +
      p.z.toFixed(1).padStart(6, ' ');
    refreshWxReadout();
  }

  // The cloud march, into its own half-res target, before the frame that
  // composites it. It has to be its own render: it writes a different target at
  // a different resolution, and `autoClear` would wipe the scene's depth buffer
  // if the two were folded together the other way round.
  renderCloudLayer();
  renderer.render(scene, camera);
}

// Debug handle — handy from the console / remote inspector on a phone.
window.hermes = {
  THREE, CANNON, scene, camera, renderer, state, keys, world, playerBody,
  CAM, setCamMode, cycleCamera, toggleGameMode, respawn,
  SEED, terrain, terrainHeight, slopeAt,
  // The island is bare by design — these are how you put something on it from
  // the console, collider included.
  addBox, addSphere, mat, objects,
  // Weather: WEATHER holds the live slider values — set one and call
  // refreshWxUI() to pull the drawer back into line with it.
  WEATHER, refreshWxUI, setWxPanel, coverageAt,
  weather: () => ({
    ...WEATHER,
    coverAbove: coverageAt(camera.position.x, camera.position.z),
    gloom, rain: rainAmt,
    windOffset: uWxWind.value.toArray(),
    layer: [CLOUD_BOT, CLOUD_TOP],
    marchSteps: CLOUD_STEPS,
    target: [cloudRT.width, cloudRT.height, CLOUD_FLOAT ? 'half-float' : 'rgba8'],
  }),
  // live read-outs of the controller internals (module-scoped `let`s)
  status: () => ({
    cam: CAM_NAMES[camMode],
    crouched,
    swimming,
    underwater,
    groundNy,
    eyeH,
    grounded: groundNy > GROUND_DOT,
    pos: playerBody.position.toArray(),
    vel: playerBody.velocity.toArray(),
  }),
};

renderer.setAnimationLoop(tick);
renderer.compile(scene, camera);
document.getElementById('loading').classList.add('hidden');
</script>

<script>
// Surface module-load failures (bad network / blocked CDN) instead of a black screen.
window.addEventListener('error', (e) => {
  const el = document.getElementById('loading');
  if (!el || el.classList.contains('hidden')) return;
  el.innerHTML = '<div id="err">Failed to start.\n' +
    String((e && (e.message || e.error)) || 'Unknown error') +
    '\n\nThree.js (unpkg.com) and cannon-es (cdn.jsdelivr.net) are loaded from CDNs — ' +
    'check the network connection.</div>';
}, true);
</script>
</body>
</html>
