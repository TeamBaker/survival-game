  state.sprint || state.sprintBtn || keys.has('ShiftLeft') || keys.has('ShiftRight');

// ---------------------------------------------------------------------------
// Weather — clouds, rain, lightning
//
// A cloud is a cluster of 40-110 overlapping *billboard quads* — puffs — merged
// into one geometry, so a whole cell is still a single draw call. Each quad
// carries its centre in `position` and is expanded to a square in *view* space
// by the vertex shader, which means a puff can never go edge-on: from any angle
// it presents the same disc.
//
// The shape of an individual puff is not in the geometry at all — the quad is a
// bare square and the fragment shader carves the round, eroded outline out of it
// with fbm noise, then lights it off a fake spherical normal perturbed by the
// screen-space gradient of that same noise.
//
// The look these are aiming at is a *drawn* cloud, not a photographed one, and
// almost every decision below follows from that. Clusters are laid out as one of
// three named shapes so a cloud has a silhouette you could describe; the base of
// a cumulus is sliced off along a real plane; the shading is a three-step toon
// ramp between a white top and a blue-grey underside with a lit rim, in place of
// the extinction and phase-function scattering a physical model would use; and
// nothing on a cloud fades into the distance haze.
// ---------------------------------------------------------------------------

// The four bands the 1-10 scale falls into: fair, building, storm, severe.
const CLOUD_BAND = (s) => (s < 3 ? 0 : s < 5 ? 1 : s < 7 ? 2 : 3);
// `height` is the cluster's vertical extent, `base` is [min, range] for the
// altitude of the cloud base — the tops are kept under ~2500 so the tallest cell
// at the far edge of the spawn ring still fits inside the 3200 far plane.
//
// The widths are about a third off what the volumetric version used, and the
// puff counts are up to match. The two go together: a cell wide enough to fly
// *into* is the right call when the cloud is a mass you read by its density, and
// the wrong one when it is a shape you read by its outline — at that size there
// are only ever two or three of them in the sky and none of them has an outline
// you can see all of.
//
// The counts are roughly triple what a cluster of this width needs to be solid,
// because solidity is not what they buy. A puff is one bump on the outline, so
// the count *is* the resolution of the silhouette: at twenty-odd of them a cell
// has five or six lumps around its edge and reads as a few big balls stuck
// together, and only somewhere past sixty do the lumps get small enough and
// numerous enough to read as cauliflower. See PUFF_SPREAD for the other half of
// that — the count only helps if the puffs shrink to match it.
const BAND_SPEC = [
  { width: [ 560,  900], height: [170,  300], puffs: [42, 58], base: [450, 200] },
  { width: [ 900, 1340], height: [420,  620], puffs: [52, 70], base: [500, 250] },
  { width: [1340, 1790], height: [640,  860], puffs: [64, 82], base: [560, 300] },
  { width: [1570, 2020], height: [780, 1000], puffs: [74, 94], base: [600, 300] },
];

// The three archetypes a cloud can be built as. A cartoony sky reads as a set of
// distinct objects you could point at and name, and the silhouette is what does
// that — so the shape is picked per cloud and the puffs are laid out to serve it
// rather than scattered into one generic lump.
//   cumulus: flat bottom, dome of puffs, crowded lumpy crown  (the common one)
//   tower:   narrow vertical stack with a bulge at mid-height
//   sheet:   wide flat raft, barely any vertical extent
const CLOUD_SHAPES = ['cumulus', 'tower', 'sheet'];
// Per shape: how the band's nominal width and height are stretched, and how many
// extra puffs the layout needs to stay dense at that aspect ratio.
// A tower is not stretched as far as it looks like it should be: the span a
// cluster ends up with runs well past `height`, the per-cloud scale multiplies it
// again, and a band-3 cell already sits 900 up — three multipliers deep, an
// honest anvil puts its own top through the 3200 far plane and gets sliced flat.
const SHAPE_MUL = {
  cumulus: { w: 1.00, h: 1.00, n: 1.00 },
  tower:   { w: 0.55, h: 1.15, n: 1.00 },
  sheet:   { w: 1.25, h: 0.34, n: 1.20 },
};

// Pick a shape for one cloud. Cumulus dominates on purpose: it is the shape
// everyone draws when they draw a cloud, and the other two are the variation.
function rollCloudShape() {
  return Math.random() < 0.6 ? 'cumulus' : Math.random() < 0.5 ? 'tower' : 'sheet';
}

const lerpRange = (r, t) => r[0] + (r[1] - r[0]) * t;

// ----- one cloud's cluster of puffs, merged into a single quad soup -----
// Built in world units around a local origin at the centre of the cloud base:
// local y = 0 is the base, and every puff also carries its own 0..1 height
// fraction so the shader can run the top-to-bottom gradient without needing the
// cluster's extent as a uniform.
//
// The cluster is laid out in normalised space — centres inside a disc of radius
// PUFF_SPREAD, puff radii around 0.15-0.32 — and then scaled up so that the
// furthest a puff can reach, PUFF_REACH, lands on the band's half-width.
//
// Only the *ratio* of those two numbers means anything, and it is the ratio that
// decides how big a bump on the outline is: a puff ends up at (radius / reach)
// of the cloud's half-width whatever absolute values are written here. At 0.55
// spread against ~0.45 mean radius the cloud was three puffs across and every
// lump was a beach ball. Widening the spread to 0.92 against ~0.23 mean radius
// makes it eleven puffs across — each piece is a bit over half the size it was,
// which is the whole point, and the counts in BAND_SPEC went up threefold to
// keep the mass solid at that size.
//
// The one thing this cannot be allowed to do is outrun the count. Spread and
// radius trade off against each other exactly: pieces half the size need four
// times as many to cover the same silhouette, so pushing this number further
// without pushing BAND_SPEC further is what would break the cloud into a scatter
// of separate discs.
const PUFF_SPREAD = 0.92;
// Furthest a puff can reach from the cluster axis in normalised units — what the
// half-width has to be divided by to get the world scale factor. The constant is
// the largest radius any shape hands out — a cumulus base-row puff at 0.38.
const PUFF_REACH = PUFF_SPREAD + 0.38;
// How much wider than its puff each quad is built. Headroom for the fragment
// shader to push the eroded outline outward without running into the edge of
// the quad and clipping it flat.
const PUFF_QUAD = 1.40;

function buildCloudGeo(band, shape, rnd) {
  const spec   = BAND_SPEC[band];
  const mul    = SHAPE_MUL[shape];
  const width  = lerpRange(spec.width, rnd()) * mul.w;
  const height = lerpRange(spec.height, rnd()) * mul.h;
  const count  = Math.max(6, Math.round(
    lerpRange(spec.puffs, rnd()) * mul.n * (isTouchDevice ? 0.7 : 1)));
  const U      = width * 0.5 / PUFF_REACH;   // normalised cluster unit -> world

  // A cumulus is built in two parts, and this is the split between them: the
  // base row that gets its underside sliced flat, and the dome piled on top of
  // it. Distributing the whole count by one biased walk instead leaves only two
  // or three puffs down at the base — nowhere near enough to span the width, so
  // the flat bottom never appears as a line, just as a couple of clipped lumps.
  const baseN = shape === 'cumulus' ? Math.max(3, Math.round(count * 0.32)) : 0;

  const puffs = [];
  for (let k = 0; k < count; k++) {
    // Walk up the cluster rather than scattering at random: where a puff sits in
    // that walk is what the shape gets to decide, and that walk is the whole
    // difference between a heap, a column and a raft.
    const u = count > 1 ? Math.min(1, (k + rnd() * 0.8) / count) : 0;
    let t, prof, pr, flat = 0;
    if (shape === 'cumulus' && k < baseN) {
      // The base row: full width, all at the same height, all sliced flat.
      // Deliberately the coarsest puffs in the cloud. Everywhere else smaller is
      // better, but the base row is the one part read as a *surface* — from
      // underneath it is a disc, not an outline — and a disc has to be covered,
      // not just outlined. At crown size the same count of them leaves gaps you
      // can see sky through when you fly under the cell.
      t    = 0.02 + 0.05 * rnd();
      prof = 1.0;
      pr   = 0.24 + 0.14 * rnd();
      flat = 1.0;
    } else if (shape === 'cumulus') {
      // The dome on top: pinching to a crown, with the walk bent upward so the
      // puffs crowd toward the top, which is where the cauliflower lumps have to
      // be for the thing to read as puffy rather than as a mound.
      const v = (k - baseN + rnd() * 0.8) / Math.max(1, count - baseN);
      t    = 0.08 + 0.92 * Math.pow(Math.min(1, v), 0.72);
      prof = Math.sqrt(Math.max(0.10, 1.0 - t * t * 0.94));
      pr   = (0.155 + 0.13 * rnd()) * (1.0 - 0.28 * t);
    } else if (shape === 'tower') {
      t    = u;
      prof = 0.62 + 0.30 * Math.sin(t * Math.PI);   // slight bulge at mid-height
      pr   = 0.19 + 0.13 * rnd();
    } else {
      // Sheet: no walk at all, just a wide scatter kept inside the bottom half
      // of an already-shallow box. The whole raft is sliced, not just its lowest
      // puffs — a flat-bottomed layer with a few lumps hanging through it is the
      // one way this shape stops looking like a deliberate flat-bottomed layer.
      // Partial, though: a sheet's underside is a soft ceiling, not an edge.
      t    = rnd() * 0.55;
      prof = 1.0;
      pr   = 0.17 + 0.15 * rnd();
      flat = 0.6;
    }
    const a = rnd() * Math.PI * 2;
    // sqrt() spreads the puffs evenly over the disc instead of crowding them
    // into the middle of it.
    const nr = PUFF_SPREAD * prof * Math.sqrt(rnd());
    puffs.push({
      x: Math.cos(a) * nr * U,
      z: Math.sin(a) * nr * U,
      // Vertical jitter tapers to nothing at the base of a cumulus: a flat
      // bottom made of puffs at slightly different heights is not flat.
      y: t * height + (rnd() - 0.5) * height * 0.10 * (shape === 'cumulus' ? t : 1.0),
      r: pr * U,
      seed: rnd() * 64,
      lit: 1,
      flat,
      cut: -1.0,
    });
  }

  // --- where the flat bottom actually is ---
  // One plane through the whole cluster, not a fixed fraction of each puff's own
  // radius: puffs in the base row are all different sizes, and a cut measured in
  // radii lands at a different height on each of them, so the "flat" bottom comes
  // out as a row of steps. Solved once here in local units and handed to the
  // shader as a per-puff quad-space offset.
  const cutters = puffs.filter((p) => p.flat > 0);
  if (cutters.length) {
    let sy = 0, sr = 0;
    for (const p of cutters) { sy += p.y; sr += p.r; }
    const planeY = sy / cutters.length - 0.42 * (sr / cutters.length);
    for (const p of cutters) {
      // Quad space runs -1..1 over PUFF_QUAD radii, so that is the divisor. The
      // clamp keeps a small puff sitting below the plane from being erased whole.
      p.cut = Math.max(-1.0, Math.min(0.45, (planeY - p.y) / (p.r * PUFF_QUAD)));
    }
  }

  // --- how much cloud each puff sits behind, looking toward the sun ---
  // Baked once here rather than guessed at in the shader. A puff buried in the
  // middle of the cluster has the whole mass between it and the light, and that
  // one fact is most of what gives a cumulus its bright crown and its dim,
  // heavy core — a billboard has no geometry to work it out from at runtime.
  for (const p of puffs) {
    let occ = 0;
    for (const o of puffs) {
      if (o === p) continue;
      const dx = o.x - p.x, dy = o.y - p.y, dz = o.z - p.z;
      const t = dx * SUN.x + dy * SUN.y + dz * SUN.z;
      if (t <= 0) continue;                      // behind us: not in the way
      // Perpendicular distance from o's centre to the ray toward the sun.
      const ox = dx - SUN.x * t, oy = dy - SUN.y * t, oz = dz - SUN.z * t;
      const d = Math.hypot(ox, oy, oz);
      // The constant is per *hit*, so it has to track the puff size: how many
      // puffs a sun ray crosses on its way through the cluster scales with the
      // count times the radius squared, and halving the pieces while tripling
      // the count cut that by about 40%. Left at the old 0.75 the whole effect
      // washes out — mean exposure came out at 0.63 against the 0.40 it used to
      // be, which is a cloud with no dim core at all, just a uniform bright one.
      if (d < o.r) occ += (1 - d / o.r) * 1.80;
    }
    p.lit = Math.exp(-occ);
  }

  // --- vertical extent, so height fractions run 0 at the base to 1 at the top ---
  // A sliced puff stops at its cut, not at the bottom of the disc it was carved
  // from, so the gradient starts exactly at the flat base rather than somewhere
  // underneath it in empty air.
  let minY = Infinity, maxY = -Infinity;
  for (const p of puffs) {
    const low = p.flat > 0 ? p.y + p.cut * p.r * PUFF_QUAD : p.y - p.r * 0.55;
    if (low < minY) minY = low;
    if (p.y + p.r * 0.55 > maxY) maxY = p.y + p.r * 0.55;
  }
  const span = Math.max(1e-3, maxY - minY);

  // --- four corners per puff ---
  // `position` is the puff centre, repeated four times: the quad is expanded in
  // view space by the vertex shader, so the geometry itself has no width at all.
  // aCorner spans the square from (-1,-1) to (+1,+1) and everything round about
  // a puff gets carved out of that square in the fragment shader.
  const n   = puffs.length;
  const pos = new Float32Array(n * 4 * 3);
  const cor = new Float32Array(n * 4 * 2);
  const pfa = new Float32Array(n * 4 * 4);
  const flt = new Float32Array(n * 4 * 3);
  const idx = new Uint16Array(n * 6);
  const CX = [-1, 1, -1, 1], CY = [-1, -1, 1, 1];

  // How far the cluster extends, worked out before the buffers are filled
  // because the depth prepass needs it per vertex.
  let far = 0, reach = 0;
  for (const p of puffs) {
    // PUFF_QUAD oversize, then the corner of that square: 1.4 * sqrt(2).
    far   = Math.max(far, Math.hypot(p.x, p.y - minY - span * 0.5, p.z) + p.r * 2.0);
    reach = Math.max(reach, Math.hypot(p.x, p.z) + p.r);
  }
  // How far back the depth prepass shoves this cloud's depth — see
  // CLOUD_DEPTH_VERT. Two bounding radii clears the far side of the cluster from
  // any puff in it, whichever way the cloud is facing.
  const push = far * 2.0;

  for (let k = 0; k < n; k++) {
    const p  = puffs[k];
    const py = p.y - minY;
    const hf = py / span;
    for (let v = 0; v < 4; v++) {
      const i = k * 4 + v;
      pos[i * 3]     = p.x;
      pos[i * 3 + 1] = py;
      pos[i * 3 + 2] = p.z;
      cor[i * 2]     = CX[v];
      cor[i * 2 + 1] = CY[v];
      pfa[i * 4]     = p.r;      // half-width of the quad, in local units
      pfa[i * 4 + 1] = hf;       // 0 at the cloud base, 1 at the top
      pfa[i * 4 + 2] = p.seed;   // decorrelates the noise between neighbours
      pfa[i * 4 + 3] = p.lit;    // baked sun exposure
      flt[i * 3]     = p.cut;    // where the flat bottom crosses this quad
      flt[i * 3 + 1] = p.flat;   // how hard the underside is sliced there
      flt[i * 3 + 2] = push;     // depth prepass push, local units
    }
    const b = k * 4;
    idx.set([b, b + 1, b + 2, b + 2, b + 1, b + 3], k * 6);
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aCorner',  new THREE.BufferAttribute(cor, 2));
  geo.setAttribute('aPuff',    new THREE.BufferAttribute(pfa, 4));
  geo.setAttribute('aFlat',    new THREE.BufferAttribute(flt, 3));
  geo.setIndex(new THREE.BufferAttribute(idx, 1));
  // Worked out by hand: every vertex sits at a puff centre, so the automatic
  // bounding sphere would be a fraction of what the expanded quads actually
  // cover and the frustum cull would blink whole clouds out at the screen edge.
  geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, span * 0.5, 0), far);
  // Measured, not nominal: each shape uses a different fraction of the spread it
  // is allotted, and this number is what the rain and the ground shadow are
  // sized from, so it has to be the width the puffs actually cover.
  geo.userData.width  = reach * 2;
  geo.userData.height = span;
  return geo;
}

// A pool built once at load and shared: a cloud picks a cluster of the shape it
// rolled, spins it and scales it a little, and gets its own colours from its own
// weather scale.
const cloudRand = mulberry32((SEED ^ 0x9e3779b9) >>> 0);
const CLOUD_GEOS = [];
for (let band = 0; band < BAND_SPEC.length; band++) {
  const byShape = {};
  const n = isTouchDevice ? 2 : 3;
  for (const shape of CLOUD_SHAPES) {
    byShape[shape] = [];
    for (let i = 0; i < n; i++) byShape[shape].push(buildCloudGeo(band, shape, cloudRand));
  }
  CLOUD_GEOS.push(byShape);
}

// The flat bottom, shared by the colour pass and the depth prepass so both agree
// on where the cloud actually ends.
//
// A billboard has no orientation of its own, so "down" has to be imported: world
// up, taken into view space, projected onto the screen, is the direction inside
// the quad that points at the top of the puff. Everything below a cut along that
// direction is thrown away, which is what turns the bottom ring of a cumulus
// from a row of bulges into one straight edge — the single most recognisable
// thing about a drawn cloud. The cut fades out as the camera looks straight up
// or down, where that direction collapses to nothing and there is no underside
// on screen to slice anyway.
const CLOUD_FLAT_DECL = /* glsl */`
  // x: cut height in quad units, y: how hard to cut, z: depth prepass push
  attribute vec3 aFlat;
  varying vec2 vUp;
  varying vec2 vFlat;
`;
const CLOUD_FLAT_CALC = /* glsl */`
  vec3 upV = (viewMatrix * vec4(0.0, 1.0, 0.0, 0.0)).xyz;
  float upLen = length(upV.xy);
  vUp   = upLen > 1e-4 ? upV.xy / upLen : vec2(0.0, 1.0);
  vFlat = vec2(aFlat.x, aFlat.y * smoothstep(0.12, 0.40, upLen));
`;
// Applied to `density`; needs `vC` and a float called `density` in scope.
const CLOUD_FLAT_APPLY = /* glsl */`
  density *= 1.0 - vFlat.y * (1.0 - smoothstep(vFlat.x, vFlat.x + 0.10, dot(vC, vUp)));
`;

// Screen-aligned in view space, which is the entire point: the quad is built out
// of the puff centre along the view basis, so a puff presents the same disc from
// every angle and can never go edge-on the way a mesh face does.
const CLOUD_VERT = /* glsl */`
  attribute vec4 aPuff;    // x: radius, y: height fraction, z: seed, w: baked sun exposure
  attribute vec2 aCorner;  // the unit square, (-1,-1) to (+1,+1)
  ${CLOUD_FLAT_DECL}
  varying vec2  vC;
  varying float vH;
  varying float vSeed;
  varying float vLit;
  uniform float uTime;
  void main() {
    vC    = aCorner;
    vH    = aPuff.y;
    vSeed = aPuff.z;
    vLit  = aPuff.w;
    ${CLOUD_FLAT_CALC}
    vec4 wp = modelMatrix * vec4(position, 1.0);
    float r = aPuff.x * length(modelMatrix[0].xyz);
    vec4 mv = viewMatrix * wp;
    // The quad is deliberately wider than the puff it carries. The fragment
    // shader erodes the outline outward as well as inward, and a rim that lands
    // past the edge of its own quad gets clipped by it — which shows up as a
    // dead straight horizontal or vertical line across the cloud, the one
    // artifact that gives a billboard away instantly.
    mv.xy += aCorner * r * ${PUFF_QUAD.toFixed(2)};
    gl_Position = projectionMatrix * mv;
  }
`;

// Deliberately not a volumetric model. The puffs are shaded the way a cloud gets
// drawn rather than the way one works: a white top, a blue-grey underside, a
// couple of hard steps between them and a lit rim. Beer-Lambert extinction and
// phase-function scattering both went the same way — physically they are what
// gives a real cloud its soft, hazy, low-contrast body, which is exactly the
// look being traded away here for flat readable shapes.
const CLOUD_FRAG = /* glsl */`
  varying vec2  vC;
  varying float vH;
  varying float vSeed;
  varying float vLit;
  varying vec2  vUp;
  varying vec2  vFlat;
  uniform vec3  uTop, uBot, uTint, uSunDir, uSunCol;
  uniform float uTintAmt, uFlash, uTime;

  // Cheap value-noise hash. Two rounds of fract-mangling is all it is worth at
  // this fill rate — the fbm stacked on top hides the regularity.
  float hash21(vec2 p) {
    p = fract(p * vec2(123.34, 456.21));
    p += dot(p, p + 45.32);
    return fract(p.x * p.y);
  }

  float vnoise(vec2 p) {
    vec2 i = floor(p), f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    float a = hash21(i);
    float b = hash21(i + vec2(1.0, 0.0));
    float c = hash21(i + vec2(0.0, 1.0));
    float d = hash21(i + vec2(1.0, 1.0));
    return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
  }

  // Normalised to 0..1 whatever the octave count, so the erosion below moves the
  // rim by the same amount on the three-octave phone build as on the four.
  float fbm(vec2 p) {
    float v = 0.0, a = 0.5, norm = 0.0;
    for (int i = 0; i < ${isTouchDevice ? 3 : 4}; i++) {
      v += a * vnoise(p);
      norm += a;
      p = p * 2.03 + 17.0;
      a *= 0.5;
    }
    return v / norm;
  }

  void main() {
    // Trim the corners of the quad first: nothing round ever reaches them, and
    // this is the cheapest quarter of the fill there is to throw away.
    float q = dot(vC, vC);
    if (q > 1.8) discard;
    float d = sqrt(q);

    // The puff's own noise field, anchored to the quad rather than to the screen
    // so the detail sticks to the cloud as it drifts, and crawling very slowly
    // so a cell visibly churns instead of sitting frozen. The frequency is the
    // one number that decides whether a puff reads as cauliflower or as a
    // beach ball — under about three cycles across the quad the fbm is too
    // smooth to break the circle up and every puff stays a visible disc.
    // That frequency is in *quad* space, so it scales with the puff: halving the
    // pieces already doubled how fine the erosion is in world terms, and 2.2 is
    // giving some of that back. Left at the old 2.6 a cell fizzes — sixty puffs
    // each carrying five cycles of noise is static, not cauliflower, and the
    // lumps that read as lumps now are the puffs themselves.
    vec2 np = vC * 2.2 + vec2(vSeed, vSeed * 1.7) + uTime * 0.008;
    float n = fbm(np);

    // Erode the outline: the noise moves the rim in and out, so the boundary is
    // ragged all the way round rather than a circle of a wobbling radius. The
    // swing is deliberately smaller than a realistic cloud wants — a drawn cloud
    // is made of recognisable arcs, and eroding a fifth of the radius keeps the
    // lump organic while leaving the arc still readable as one.
    // Nominal radius sits at 1/PUFF_QUAD of the quad, so even the widest lump of
    // the erosion stays inside it.
    float rim = ${(1 / PUFF_QUAD).toFixed(3)} * (1.0 + 0.20 * (n * 2.0 - 1.0));
    // A hard core and a short falloff: the narrower this band, the more the puff
    // reads as a drawn shape with an outline instead of a smear of mist. It
    // cannot go to nothing, though — a step edge on a screen-facing disc aliases
    // into a crawling jagged circle the moment the cloud drifts, and the band is
    // a fraction of the radius, so halving the puffs halved how many pixels wide
    // it is. Widened from 0.80 to cover that: an interior puff's edge is now a
    // seam between two overlapping pieces rather than part of the cloud's own
    // outline, and it wants to disappear into its neighbour, not be legible.
    float density = 1.0 - smoothstep(rim * 0.72, rim, d);
    density *= mix(0.80, 1.0, n);          // the inside is nearly uniform
    ${CLOUD_FLAT_APPLY}
    if (density < 0.004) discard;

    // --- normal ---
    // The quad is screen-aligned, so quad space *is* view space: vC.x and vC.y
    // are right and up, and the z that completes them is the front of a sphere
    // sitting inside the quad. That fake sphere is what gives a puff its round
    // shading. The screen-space gradient of the noise then dents it — lightly,
    // because a heavily dented normal is what turns flat toon bands back into
    // the mottled, busy surface this shader is trying not to have.
    vec3 vn = vec3(vC * 0.9, sqrt(max(1.0 - min(q, 1.0) * 0.81, 0.05)));
    float bump = n * density;
    vec2 g = vec2(dFdx(bump), dFdy(bump)) / max(fwidth(d), 1e-4);
    vn = normalize(vn - vec3(g * 0.12, 0.0));
    // View space back to world: the view rotation is orthonormal, so its inverse
    // is its transpose, which is exactly what right-multiplying by it does.
    vec3 nrm = normalize(vn * mat3(viewMatrix));

    float up  = nrm.y * 0.5 + 0.5;
    float sun = dot(nrm, uSunDir) * 0.5 + 0.5;

    // One number for how lit a fragment is: which way it faces, how high up the
    // cloud it sits, and whether the rest of the cloud is between it and the sun
    // (vLit, baked per puff when the cluster was built).
    //
    // The per-fragment normal is deliberately *not* the dominant term. Each puff
    // carries a fake sphere, so leaning on "up" alone gives every one of them the
    // full light-to-dark sweep and the cloud reads as a heap of billiard balls.
    // The cluster-wide terms outweigh it, which keeps one gradient running up the
    // whole cloud while each lobe still shades enough to be its own lobe.
    float lit = clamp(0.32 * up + 0.24 * sun + 0.30 * vH + 0.30 * (vLit - 0.5)
                      + 0.08, 0.0, 1.0);

    // The toon ramp. Three flat tones with narrow blends between them, not a
    // gradient: the steps are what make the cloud look drawn, and a cloud is the
    // easiest possible subject for them because its own form is so simple that
    // banding reads as deliberate shading rather than as a rendering fault. The
    // blends stay ~0.08 wide so the boundaries do not crawl when the sun moves.
    float tone = smoothstep(0.34, 0.42, lit) * 0.45
               + smoothstep(0.56, 0.64, lit) * 0.55;
    vec3 col = mix(uBot, uTop, tone);

    // The specular "shine": a small hot patch facing square into the sun, the
    // one place allowed to go brighter than the top colour.
    col += uSunCol * smoothstep(0.84, 0.95, sun) * 0.26;

    // Rim light. On a billboard the rim is wherever the eroded outline ended up,
    // not where the geometry stops, so it follows every lump of the noise and
    // gives the cloud a lit contour instead of a fading edge.
    float edge = smoothstep(0.80, 1.0, d / rim);
    col += uSunCol * edge * pow(max(sun, 0.0), 1.5) * 0.55;

    // The storminess cast, over the lowest third of the cell.
    col = mix(col, uTint, uTintAmt * (1.0 - smoothstep(0.0, 0.32, vH)));
    // Lightning lights the cell from the inside, brightest low down.
    col += vec3(0.80, 0.84, 1.0) * uFlash * (1.15 - vH * 0.55);
    // No distance haze at all. These are meant to stay bright, saturated and
    // legible right out to the despawn ring — a cartoon sky does not wash its
    // clouds out toward the horizon, and the scene's own FogExp2 never touched
    // them either, since a ShaderMaterial gets no fog chunks unless asked.

    // Nearly opaque per puff: the whole point of the tighter falloff above is a
    // defined edge, and an edge you can see through is not one.
    float alpha = clamp(density * 0.98, 0.0, 1.0);
    gl_FragColor = vec4(col, alpha);
    #include <tonemapping_fragment>
    #include <colorspace_fragment>
  }
`;

// Depth prepass. The puff *cores* write depth only, and the depth they write is
// pushed a whole cloud-radius further from the eye than the puff itself.
//
// That push is not a tweak, it is the whole design. A billboard cluster has no
// interior faces to hide — every puff is a screen-facing disc — so any depth
// written at a puff's own distance cuts the puffs behind it out of the blend and
// the cloud comes apart into hard-edged circles with the sky showing through
// them. Pushed back past the far side of the cluster, the same depth rejects
// nothing inside the cloud and still throws away the fill for whatever is
// wholly behind it, which is where the overdraw on a crowded sky actually goes.
//
// The push is a *cluster* distance, baked per cloud into aFlat.z, not a multiple
// of the puff's own radius. It used to be the latter, and that only held while
// every puff in a cell was roughly the same size as every other: once the crown
// is made of pieces a third the size of the base row, scaling by aPuff.x pushes
// the small ones nowhere near far enough, and each of them punches a little
// depth-rejected hole in whatever is behind it — the cauliflower crown speckles
// with sky. One distance for the whole cluster cannot do that.
const CLOUD_DEPTH_VERT = /* glsl */`
  attribute vec4 aPuff;
  attribute vec2 aCorner;
  ${CLOUD_FLAT_DECL}
  varying vec2 vC;
  void main() {
    vC = aCorner;
    ${CLOUD_FLAT_CALC}
    vec4 wp = modelMatrix * vec4(position, 1.0);
    float s = length(modelMatrix[0].xyz);
    vec4 mv = viewMatrix * wp;
    mv.xy += aCorner * aPuff.x * s * ${PUFF_QUAD.toFixed(2)};
    mv.z -= aFlat.z * s;       // -z is forward in view space, so this is *away*
    gl_Position = projectionMatrix * mv;
  }
`;
const CLOUD_DEPTH_FRAG = /* glsl */`
  varying vec2 vC;
  varying vec2 vUp;
  varying vec2 vFlat;
  void main() {
    if (dot(vC, vC) > 0.16) discard;   // only the dense middle occludes anything
    // The sliced-off underside is sky, so it must not occlude either.
    float density = 1.0;
    ${CLOUD_FLAT_APPLY}
    if (density < 0.5) discard;
    gl_FragColor = vec4(0.0);
  }
`;

// Colour by weather scale: bright white at 1, dark storm slate by 10. Saturated
// and light on purpose — the muted, desaturated greys a photograph of a cloud
// actually contains are the first thing that stops one reading as a cartoon.
const CLOUD_KEYS = [
  { s: 1,  top: 0xffffff, bot: 0xdde8f0, tint: 0xffffff },  // bright white
  { s: 4,  top: 0xf0f4f8, bot: 0xa8b8c8, tint: 0xe8edf2 },  // light grey
  { s: 7,  top: 0xc0c8d0, bot: 0x607080, tint: 0xb0b8c0 },  // medium grey
  { s: 10, top: 0x8090a0, bot: 0x304050, tint: 0x708090 },  // dark storm
];
function cloudColors(s) {
  let i = 0;
  while (i < CLOUD_KEYS.length - 2 && s > CLOUD_KEYS[i + 1].s) i++;
  const a = CLOUD_KEYS[i], b = CLOUD_KEYS[i + 1];
  const t = THREE.MathUtils.clamp((s - a.s) / (b.s - a.s), 0, 1);
  return {
    top:  new THREE.Color(a.top).lerp(new THREE.Color(b.top), t),
    bot:  new THREE.Color(a.bot).lerp(new THREE.Color(b.bot), t),
    tint: new THREE.Color(a.tint).lerp(new THREE.Color(b.tint), t),
  };
}

const CLOUD_SUN_COLOR = new THREE.Color(0xfff0cf);

function cloudMaterial(scale) {
  const { top, bot, tint } = cloudColors(scale);
  return new THREE.ShaderMaterial({
    vertexShader: CLOUD_VERT,
    fragmentShader: CLOUD_FRAG,
    transparent: true,
    depthWrite: false,
    // Billboards have no back: the quad faces the eye by construction, but the
    // winding flips depending on which side of the cloud's own rotation it lands
    // on, so culling either face would drop puffs at random.
    side: THREE.DoubleSide,
    // The bump lighting reads screen-space derivatives. WebGL2 has them as
    // baseline; a WebGL1 fallback context needs the extension asked for by name
    // or the shader fails to compile and the whole sky goes missing.
    extensions: { derivatives: true },
    uniforms: {
      uTime:      { value: 0 },
      uTop:       { value: top },
      uBot:       { value: bot },
      uTint:      { value: tint },
      uTintAmt:   { value: smooth((scale - 4) / 5) * 0.45 },
      uSunDir:    { value: SUN.clone() },
      uSunCol:    { value: CLOUD_SUN_COLOR.clone() },
      uFlash:     { value: 0 },
    },
  });
}

// ----- the controls the free camera exposes -----
const WX = {
  rateIdx: 2,
  speedIdx: 1,
  stormIdx: 2,
  // label, seconds between spawns (0 = off)
  RATES:  [['Off', 0], ['Slow', 16], ['Medium', 7.5], ['Fast', 3]],
  // label, drift speed in units / second
  SPEEDS: [['Slow', 5], ['Medium', 13], ['Fast', 27]],
  // label, min storminess, max storminess, bias
  // bias: 0-1, low pulls the roll toward min, high pulls it toward max
  STORMS: [
    ['Calm',   1,  3, 0.1],
    ['Mild',   1,  5, 0.3],
    ['Mixed',  1, 10, 0.5],
    ['Stormy', 4, 10, 0.7],
    ['Severe', 6, 10, 0.9],
  ],
};

// Storminess is rolled per cloud rather than picked from a shared range, so a
// single setting gives a whole sky of varied cells instead of a uniform one.
// The exponent bends the uniform roll: bias 0.5 leaves it flat, below that most
// cells land mild, above it most land severe.
function rollStorminess() {
  const s = WX.STORMS[WX.stormIdx];
  const min = s[1], max = s[2], bias = s[3];
  // Floored, because the exponent goes *negative* past bias 0.75 — Severe sits
  // at 0.9 — and pow(r, -0.6) is unbounded above 1 as r approaches 0. That put
  // cells well past the top of their own range: "storm 11.9" on a 1-10 scale.
  const t = Math.pow(Math.random(), Math.max(0.15, 1 + (0.5 - bias) * 4));
  return min + t * (max - min);
}

// More cells than the huge volumetric ones needed, because each is now about a
// third narrower: the sky should read as a scattering of individual clouds you
// could count and point at, not as two or three weather systems filling it. The
// ceiling still matters — every cell adds to `gloom`, and enough of them
// overhead pins it at 1 and puts the ground in permanent shadow.
const MAX_CLOUDS    = isTouchDevice ? 10 : 16;
const CLOUD_DESPAWN = 2100;      // they are gone once they are this far behind you

const clouds = [];
const cloudGroup = new THREE.Group();
// Deliberately left at the default render order. Nothing hazes a cloud any more
// — the scene's FogExp2 never reached them (a ShaderMaterial gets no fog chunks
// unless it asks) and the shader's own distance haze is gone — so forcing them
// to the back of the transparent queue would buy nothing, and it would cost:
// a Group's renderOrder becomes the *primary* sort key for everything under it,
// which would put the clouds after the rain instead of back-to-front with it,
// and a cell overhead would then paint over the streaks falling out of it.
scene.add(cloudGroup);
// The prepass material is opaque, so three renders it in the opaque queue —
// before any of the transparent cloud quads — and the whole prepass therefore
// costs one extra pass over the puffs inside the normal frame rather than a
// second render of the entire scene.
const depthMat = new THREE.ShaderMaterial({
  vertexShader: CLOUD_DEPTH_VERT,
  fragmentShader: CLOUD_DEPTH_FRAG,
  colorWrite: false,
  side: THREE.DoubleSide,
});
const cloudDepthGroup = new THREE.Group();
scene.add(cloudDepthGroup);

const wxFocus = new THREE.Vector3();
let spawnTimer = 0;
let gloom = 0;                   // 0 clear sky .. 1 overcast right overhead
let rainAmt = 0;
let wxTime = 0;

// A single slowly-drifting wind direction shared by the whole sky, so every
// cloud heads the same way instead of converging on the player from all sides.
const WIND_BASE_DIR = Math.random() * Math.PI * 2;
function liveWindDir() {
  return WIND_BASE_DIR + Math.sin(wxTime * 0.015) * 0.4;
}

function spawnCloud(initial) {
  if (clouds.length >= MAX_CLOUDS) return null;
  const scale = rollStorminess();
  const band  = CLOUD_BAND(scale);
  const shape = rollCloudShape();
  const pool  = CLOUD_GEOS[band][shape];
  const geo   = pool[(Math.random() * pool.length) | 0];

  // Upwind and far out: a fresh cell comes in at the edge of the ring, which at
  // the medium drift speed is a couple of minutes of warning. The initial batch
  // is scattered across the whole range so the sky is never empty at load.
  const wind = liveWindDir();
  const bearing = wind + Math.PI + (Math.random() - 0.5) * Math.PI * 0.6;
  const dist = initial ? 400 + Math.random() * 2000 : 1700 + Math.random() * 700;
  const alt  = BAND_SPEC[band].base[0] + Math.random() * BAND_SPEC[band].base[1];
  const sc   = 0.75 + Math.random() * 0.55;

  const material = cloudMaterial(scale);
  const mesh = new THREE.Mesh(geo, material);
  mesh.position.set(wxFocus.x + Math.cos(bearing) * dist, alt, wxFocus.z + Math.sin(bearing) * dist);
  // Spinning the cluster only moves the puff *centres* — the quads stay facing
  // the eye — so the same handful of pooled geometries never repeat visibly.
  mesh.rotation.y = Math.random() * Math.PI * 2;
  mesh.scale.setScalar(sc);
  cloudGroup.add(mesh);
  // Matching depth-only mesh for the prepass, sharing the same geometry.
  const depthMesh = new THREE.Mesh(geo, depthMat);
  depthMesh.position.copy(mesh.position);
  depthMesh.rotation.copy(mesh.rotation);
  depthMesh.scale.copy(mesh.scale);
  cloudDepthGroup.add(depthMesh);

  // Heading: the shared wind direction, with a little per-cloud scatter for
  // gusting, so the whole sky drifts together instead of converging on the
  // player from every side.
  const head = liveWindDir() + (Math.random() - 0.5) * 0.3;
  const c = {
    mesh,
    depthMesh,
    mat: material,
    scale,
    band,
    shape,
    dirX: Math.cos(head),
    dirZ: Math.sin(head),
    spdMul: 1.0,
    radius: geo.userData.width * 0.5 * sc,
    baseY: alt,
    boltT: -1,
    boltIn: boltInterval(scale) * Math.random(),
  };
  clouds.push(c);
  return c;
}

function clearClouds() {
  for (const c of clouds) {
    cloudGroup.remove(c.mesh); c.mat.dispose();
    cloudDepthGroup.remove(c.depthMesh);
  }
  clouds.length = 0;
  refreshWxUI();
}

// ----- lightning -----
const boltInterval = (scale) => (scale >= 8 ? 2.5 + Math.random() * 6 : 7 + Math.random() * 15);

// The strike envelope: a fast leader, a dip, a brighter return stroke, then the
// glow rolling away. Real lightning is never a single clean flash.
function boltEnv(t) {
  if (t < 0.06) return t / 0.06;
  if (t < 0.14) return 1.0 - (t - 0.06) / 0.08 * 0.85;
  if (t < 0.20) return 0.15 + (t - 0.14) / 0.06 * 0.75;
  if (t < 0.50) return 0.90 * (1 - (t - 0.20) / 0.30);
  return 0;
}

let audioCtx = null;
function initAudio() {
  if (audioCtx) return audioCtx;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  try { audioCtx = new AC(); } catch (e) { audioCtx = null; }
  return audioCtx;
}

// Thunder, synthesised: brown noise (a random walk, which is what gives it the
// low rumble) shaped by an envelope and rolled off harder the further away the
// strike was. Close strikes get a crack on the front; distant ones are all roll.
function playThunder(vol, dist) {
  const ctx = audioCtx;
  if (!ctx || vol <= 0.02) return;
  if (ctx.state === 'suspended') ctx.resume().catch(() => {});
  try {
    const near = 1 - Math.min(1, dist / 1800);
    const sr = ctx.sampleRate;
    const n = Math.floor(sr * (1.5 + (1 - near) * 2.6));
    const buf = ctx.createBuffer(1, n, sr);
    const d = buf.getChannelData(0);
    let b = 0;
    for (let i = 0; i < n; i++) {
      b = b * 0.965 + (Math.random() * 2 - 1) * 0.035;
      const t = i / sr;
      const crack = near * Math.exp(-t * 26) * (Math.random() * 2 - 1) * 0.5;
      const roll  = Math.exp(-t * (1.0 + (1 - near) * 0.7)) * (0.6 + 0.4 * Math.sin(t * 3.1));
      d[i] = THREE.MathUtils.clamp(b * 7.5 * roll + crack, -1, 1);
    }
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 180 + near * 900;
    const g = ctx.createGain();
    g.gain.value = vol * 0.5;
    src.connect(lp); lp.connect(g); g.connect(ctx.destination);
    src.start();
  } catch (e) { /* audio is a nicety; never let it take the frame down */ }
}

function strike(c, dist) {
  c.boltT = 0;
  c.boltIn = boltInterval(c.scale);
  const vol = THREE.MathUtils.clamp(1 - dist / 2000, 0, 1) * (0.35 + 0.065 * c.scale);
  if (audioCtx && vol > 0.02) {
    // Sound lags the flash by the distance over the speed of sound — the reason
    // you count the seconds between them.
    setTimeout(() => playThunder(vol, dist), Math.min(dist, 2400) / 340 * 1000);
  }
}

// ----- rain -----
// The drops belong to a cloud, not to the camera. A cell's base altitude and
// the ground under it give the column its live top and bottom, so a streak is
// born at the cloud's underside and dies at the dirt instead of living in a
// fixed-height box that follows you around. Only the vertical extent is
// cloud-anchored: the column's footprint still centres on the camera, because
// rain is only ever switched on while you are stood under the cell and a
// footprint the width of a storm cell would spread the same drop budget so thin
// the rain would vanish.
//
// The fall itself is straight down in world Y (wrapped modulo the column
// height), so it never depends on which way the camera is looking — a drop is
// exactly as present when you look straight down as when you look at the
// horizon.
//
// Each drop is a screen-aligned quad — stretched along the camera's own up
// vector rather than a fixed world-space "streak" direction — so it is never
// foreshortened away. A quad built from a fixed world-space length axis goes
// edge-on and all but disappears the moment the view direction lines up with
// that axis, which is exactly what happened looking straight down at rain
// falling straight down. Billboarding fully off the camera (right *and* up)
// keeps the streak's full width and length on screen from every angle.
const RAIN_N     = isTouchDevice ? 5000 : 14000;
const RAIN_R     = 42;
const RAIN_LEN   = 6.0;
const RAIN_WIDTH = 0.04;

const rainMat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  uniforms: {
    uTime:      { value: 0 },
    uCam:       { value: new THREE.Vector3() },
    uCamRight:  { value: new THREE.Vector3(1, 0, 0) },
    uCamUp:     { value: new THREE.Vector3(0, 1, 0) },
    uIntensity: { value: 0 },
    uCol:       { value: new THREE.Color(0xb0c4de) },
    uCloudPos:  { value: new THREE.Vector3(0, 140, 0) },   // xz: the raining cell, y: its base
    uCloudH:    { value: 100 },                            // cloud base down to the ground
  },
  vertexShader: /* glsl */`
    attribute vec2 aCorner;   // x: -1/+1 across the streak's width, y: 0 at the head, 1 at the wind-drawn tail
    uniform float uTime;
    uniform vec3 uCam;
    uniform vec3 uCamRight;
    uniform vec3 uCamUp;
    uniform vec3 uCloudPos;
    uniform float uCloudH;
    varying float vA;
    varying vec2 vC;
    void main() {
      vec3 p = position;      // xz: offset in the column, y: 0..1 along it
      // Per-drop fall speed, hashed off its own position so it stays put.
      float j = fract(sin(p.x * 12.9898 + p.z * 78.233) * 43758.5453);
      float span = max(uCloudH, 1.0);
      // Straight-down fall in world space, entirely independent of the camera,
      // wrapping over the live cloud-to-ground distance.
      float fall = mod(p.y * span - uTime * 26.0 * (0.8 + 0.5 * j), span);
      float h = fall / span;                      // 0 at the ground, 1 at the cloud base
      // Lean the top of the column toward the cell that is shedding it, so the
      // streaks visibly trace back up to that cloud rather than to a point
      // straight over your head. Only a fraction of the way, or the far end of
      // the column would slide out of view entirely.
      vec2 lean = (uCloudPos.xz - uCam.xz) * 0.12 * h;
      vec3 w = vec3(uCam.x + p.x + lean.x, uCloudPos.y - span + fall, uCam.z + p.z + lean.y);
      w += aCorner.y * vec3(1.6, 0.0, 0.9) * 0.5;                 // gentle wind slant on the tail
      w += uCamUp * -aCorner.y * ${RAIN_LEN.toFixed(2)};          // billboarded length: never edge-on
      w += uCamRight * aCorner.x * ${RAIN_WIDTH.toFixed(3)};      // billboarded width
      // Ease the column off at both ends so drops are not cut off dead flat
      // where they leave the cloud or reach the dirt.
      vA = smoothstep(0.0, 0.05, h) * (1.0 - smoothstep(0.80, 1.0, h));
      vC = aCorner;
      gl_Position = projectionMatrix * viewMatrix * vec4(w, 1.0);
    }
  `,
  fragmentShader: /* glsl */`
    uniform float uIntensity;
    uniform vec3 uCol;
    varying float vA;
    varying vec2 vC;
    void main() {
      // A streak, not a rectangle: soft along its length (bright just behind the
      // head, tapering out at the tail) and soft across its width.
      float len  = smoothstep(0.0, 0.12, vC.y) * (1.0 - smoothstep(0.55, 1.0, vC.y));
      float wide = 1.0 - vC.x * vC.x;
      gl_FragColor = vec4(uCol, vA * len * wide * 0.95 * uIntensity);
    }
  `,
});

const rainObj = (() => {
  const pos = new Float32Array(RAIN_N * 4 * 3);
  const corner = new Float32Array(RAIN_N * 4 * 2);
  const idx = new Uint32Array(RAIN_N * 6);
  for (let i = 0; i < RAIN_N; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = Math.sqrt(Math.random()) * RAIN_R;
    // y is baked as a 0..1 fraction of the column: the shader scales it by the
    // live cloud-to-ground height, so the same buffer works for any cell.
    const x = Math.cos(a) * r, z = Math.sin(a) * r, y = Math.random();
    const corners = [[-1, 0], [1, 0], [-1, 1], [1, 1]];
    for (let v = 0; v < 4; v++) {
      const o = (i * 4 + v) * 3;
      pos[o] = x; pos[o + 1] = y; pos[o + 2] = z;
      corner[(i * 4 + v) * 2] = corners[v][0];
      corner[(i * 4 + v) * 2 + 1] = corners[v][1];
    }
    const base = i * 4, o6 = i * 6;
    idx[o6] = base; idx[o6 + 1] = base + 1; idx[o6 + 2] = base + 2;
    idx[o6 + 3] = base + 2; idx[o6 + 4] = base + 1; idx[o6 + 5] = base + 3;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aCorner', new THREE.BufferAttribute(corner, 2));
  geo.setIndex(new THREE.BufferAttribute(idx, 1));
  const o = new THREE.Mesh(geo, rainMat);
  o.frustumCulled = false;      // it is always around the camera by construction
  o.visible = false;
  scene.add(o);
  return o;
})();

// ----- overcast palettes -----
const FOG_BASE  = new THREE.Color(FOG_COLOR);
const GLOOM_FOG = new THREE.Color(0x8a97a6);
const GLOOM_Z   = new THREE.Color(0x2c3a4c);
const GLOOM_H   = new THREE.Color(0x8b98a6);
const clamp01 = (t) => (t < 0 ? 0 : t > 1 ? 1 : t);
const shadowList = [];      // scratch, refilled every frame

function updateWeather(dt) {
  wxTime += dt;
  wxFocus.copy(camera.position);

  // --- spawn ---
  const interval = WX.RATES[WX.rateIdx][1];
  if (interval > 0) {
    spawnTimer += dt;
    while (spawnTimer >= interval && clouds.length < MAX_CLOUDS) {
      spawnTimer -= interval;
      spawnCloud(false);
    }
    if (clouds.length >= MAX_CLOUDS) spawnTimer = Math.min(spawnTimer, interval);
  } else {
    spawnTimer = 0;
  }

  // --- drift, cull, and collect what the rest of the scene needs to know ---
  const speed = WX.SPEEDS[WX.speedIdx][1];
  let cover = 0, rainWant = 0, flashGlobal = 0;
  let rainCloud = null;          // the cell currently doing the raining
  shadowList.length = 0;

  for (let i = clouds.length - 1; i >= 0; i--) {
    const c = clouds[i];
    const p = c.mesh.position;
    p.x += c.dirX * speed * c.spdMul * dt;
    p.z += c.dirZ * speed * c.spdMul * dt;
    // The prepass mesh has to ride along, or it writes depth for where the cloud
    // used to be and starts punching holes in the sky behind it.
    c.depthMesh.position.copy(p);

    const dx = p.x - wxFocus.x, dz = p.z - wxFocus.z;
    const dist = Math.hypot(dx, dz);
    if (dist > CLOUD_DESPAWN) {
      cloudGroup.remove(c.mesh);
      cloudDepthGroup.remove(c.depthMesh);
      c.mat.dispose();
      clouds.splice(i, 1);
      continue;
    }

    // How much of this cloud is directly over the camera: 1 well inside it,
    // tapering to 0 a little past its edge.
    const over = 1 - clamp01((dist - c.radius * 0.35) / (c.radius * 0.8));
    cover = Math.max(cover, over * clamp01(0.30 + 0.075 * c.scale));
    // Scale 4-5 spits, 6-7 is heavy, 8-10 is a downpour. Only if we are actually
    // underneath it rather than flying above the cloud deck.
    if (c.scale >= 4 && wxFocus.y < c.baseY - 6) {
      const want = over * Math.min(1, (c.scale - 3) / 5);
      if (want > rainWant) { rainWant = want; rainCloud = c; }
    }

    // --- lightning ---
    if (c.scale >= 6) {
      if (c.boltT >= 0) {
        c.boltT += dt;
        if (c.boltT > 0.5) c.boltT = -1;
      } else {
        c.boltIn -= dt;
        if (c.boltIn <= 0) strike(c, dist);
      }
    }
    const flash = c.boltT >= 0 ? boltEnv(c.boltT) : 0;
    const u = c.mat.uniforms;
    u.uFlash.value = flash;
    // The noise field crawls off uTime, so every cell needs it every frame.
    u.uTime.value = wxTime;
    u.uSunDir.value.copy(SUN);
    flashGlobal = Math.max(flashGlobal, flash * (1 - clamp01((dist - 250) / 1300)));

    shadowList.push(c);
  }

  // --- hand the ground shaders the biggest, nearest footprints ---
  // The shadow lands well downwind of the cloud that casts it: two hundred
  // metres of altitude times the tangent of the sun's angle from vertical.
  for (const c of shadowList) {
    c.shX = c.mesh.position.x - CLOUD_SHADOW_SLANT.x * c.baseY;
    c.shZ = c.mesh.position.z - CLOUD_SHADOW_SLANT.y * c.baseY;
    c.shKey = Math.hypot(c.shX - wxFocus.x, c.shZ - wxFocus.z) - c.radius;
  }
  shadowList.sort((a, b) => a.shKey - b.shKey);
  cloudShadowArr.fill(0);
  const nSh = Math.min(MAX_CLOUD_SHADOWS, shadowList.length);
  for (let i = 0; i < nSh; i++) {
    const c = shadowList[i];
    const o = i * 4;
    cloudShadowArr[o]     = c.shX;
    cloudShadowArr[o + 1] = c.shZ;
    cloudShadowArr[o + 2] = c.radius * 1.10;
    // Quadratic in scale rather than linear: a wisp at scale 1 still lays down
    // a shadow you can watch cross the sand, but a storm cell has to put real
    // weight on the ground under it, so the top of the range needs to pull away
    // from the bottom much faster than a straight line does.
    //
    // Capped short of 1 now that a single cell's footprint is wider than the
    // island. The ground shaders take full shade down to half a percent of the
    // light — fine when a shadow was a patch crossing the sand, but with the
    // whole island inside one footprint it turned the place into a silhouette.
    cloudShadowArr[o + 3] = THREE.MathUtils.clamp(0.30 + 0.10 * c.scale + 0.03 * c.scale * c.scale, 0, 0.82);
  }

  // --- the sky reacting to what is in it ---
  gloom += (cover - gloom) * (1 - Math.exp(-1.2 * dt));
  sun.intensity        = SUN_BASE  * (1 - 0.60 * gloom);
  hemiLight.intensity  = HEMI_BASE * (1 - 0.30 * gloom) + 0.55 * flashGlobal;
  ambLight.intensity   = AMB_BASE  * (1 - 0.25 * gloom) + 1.9 * flashGlobal;

  const g = gloom * 0.8;
  skyMat.uniforms.uZenith.value.copy(SKY_ZENITH).lerp(GLOOM_Z, g);
  skyMat.uniforms.uHorizon.value.copy(SKY_HORIZON).lerp(GLOOM_H, g);
  if (!underwater) {
    scene.fog.color.copy(FOG_BASE).lerp(GLOOM_FOG, gloom * 0.75);
  }

  // --- rain ---
  rainAmt += (rainWant - rainAmt) * (1 - Math.exp(-0.9 * dt));
  // Anchor the column to whichever cell is raining hardest on us. Left alone
  // when nothing qualifies, so the last cell's geometry holds while the shower
  // fades out rather than snapping to a default mid-fade.
  if (rainCloud) {
    const cp = rainCloud.mesh.position;
    const ground = terrainHeight(camera.position.x, camera.position.z);
    // Capped, and this is not cosmetic: the drop budget is fixed, so spreading
    // it over the full 450-900 units the deck now sits at would thin the rain
    // out by a factor of four into a barely-visible drizzle. The column instead
    // fills the bottom of that gap — the part you can actually see — and the
    // streaks still lean toward the cell overhead, which is what sells where
    // they came from.
    const span = Math.min(380, Math.max(20, rainCloud.baseY - ground));
    rainMat.uniforms.uCloudPos.value.set(cp.x, ground + span, cp.z);
    rainMat.uniforms.uCloudH.value = span;
  }
  rainObj.visible = rainAmt > 0.02 && !underwater;
  if (rainObj.visible) {
    rainMat.uniforms.uTime.value = wxTime;
    rainMat.uniforms.uCam.value.copy(camera.position);
    // Columns 0 and 1 of the camera's world matrix are its right and up
    // vectors — billboarding the streak quads off both keeps them fully
    // screen-facing (and therefore visible) from any camera angle.
    rainMat.uniforms.uCamRight.value.setFromMatrixColumn(camera.matrixWorld, 0);
    rainMat.uniforms.uCamUp.value.setFromMatrixColumn(camera.matrixWorld, 1);
    // A gentle floor keeps even a light drizzle legible instead of fading to a
    // near-invisible haze, while heavier cells still read as visibly heavier.
    rainMat.uniforms.uIntensity.value = 0.35 + 0.65 * rainAmt;
  }
}

// ----- weather HUD -----
const wxRateBtn      = document.getElementById('wx-rate');
const wxSpeedBtn     = document.getElementById('wx-speed');
const wxStormBtn     = document.getElementById('wx-storm');
const wxCountEl      = document.getElementById('wx-count');
const wxCloudInfoEl  = document.getElementById('wx-cloud-info');

function refreshWxUI() {
  wxRateBtn.textContent  = WX.RATES[WX.rateIdx][0];
  wxRateBtn.classList.toggle('off', WX.rateIdx === 0);
  wxSpeedBtn.textContent = WX.SPEEDS[WX.speedIdx][0];
  wxStormBtn.textContent = WX.STORMS[WX.stormIdx][0];
  wxCountEl.textContent  = String(clouds.length);
}
const cycleRate  = () => { WX.rateIdx  = (WX.rateIdx  + 1) % WX.RATES.length;  refreshWxUI(); };
const cycleSpeed = () => { WX.speedIdx = (WX.speedIdx + 1) % WX.SPEEDS.length; refreshWxUI(); };
const cycleStorm = () => { WX.stormIdx = (WX.stormIdx + 1) % WX.STORMS.length; refreshWxUI(); };

bindTap(wxRateBtn,  cycleRate);
bindTap(wxSpeedBtn, cycleSpeed);
bindTap(wxStormBtn, cycleStorm);
refreshWxUI();

// Seed the sky before the first frame so there is weather to look at on arrival.
wxFocus.copy(camera.position);
for (let i = 0; i < (isTouchDevice ? 6 : 10); i++) spawnCloud(true);
refreshWxUI();

// ---------------------------------------------------------------------------
// Character controller — a cannon-es body whose velocity is driven by input
// rather than by forces, so the movement stays crisp and predictable.
// ---------------------------------------------------------------------------
const playerBody = new CANNON.Body({
  // Heavier than the crates on purpose. The controller sets velocity directly so
  // mass never affects how the character itself moves — it only decides how much
  // authority the body has in contact impulses, i.e. whether walking into a crate
  // shoves it or stalls against it.
  mass: 6,
  material: physPlayer,
  fixedRotation: true,
  linearDamping: 0,
  angularDamping: 1,
  allowSleep: false,
});
let crouched = false;
let swimming = false;

function setPlayerShape(crouch) {
  while (playerBody.shapes.length) playerBody.removeShape(playerBody.shapes[0]);
  const r = PLAYER.radius;
  if (crouch) {
    playerBody.addShape(new CANNON.Sphere(r));                            // 0.8 tall
  } else {
    // Three stacked spheres stand in for a 1.6-tall capsule (cannon has no
    // capsule primitive). Rounded feet ride over kerbs and up ramps without a
    // dedicated step-up hack.
    playerBody.addShape(new CANNON.Sphere(r), new CANNON.Vec3(0, -0.4, 0));
    playerBody.addShape(new CANNON.Sphere(r), new CANNON.Vec3(0,  0.0, 0));
    playerBody.addShape(new CANNON.Sphere(r), new CANNON.Vec3(0,  0.4, 0));
  }
  playerBody.updateBoundingRadius();
  playerBody.updateMassProperties();   // honours fixedRotation, keeps mass = 1
}
setPlayerShape(false);
playerBody.position.set(SPAWN.x, SPAWN.y, SPAWN.z);
playerBody.updateAABB();
world.addBody(playerBody);

// Visible body — hidden in first person, shown everywhere else.
const playerGeoStand  = new THREE.CapsuleGeometry(PLAYER.radius, 0.8, 6, 18);
const playerGeoCrouch = new THREE.CapsuleGeometry(PLAYER.radius, 0.0, 6, 18);
const playerMesh = new THREE.Mesh(
  playerGeoStand,
  mat(0x63b9ff, 0.42, 0.28, { emissive: 0x0d2c4a, emissiveIntensity: 0.55 })
);
playerMesh.castShadow = true;
playerMesh.receiveShadow = true;
const visor = new THREE.Mesh(
  new THREE.BoxGeometry(0.34, 0.12, 0.14),
  mat(0xffe6a8, 0.3, 0.1, { emissive: 0x6a4a10, emissiveIntensity: 0.9 })
);
visor.position.set(0, 0.42, -0.34);
playerMesh.add(visor);
scene.add(playerMesh);

// Steepest-upward contact normal touching the player, refreshed every substep.
// A contact whose normal is within maxSlope of straight up is walkable ground.
let groundNy = 0;
world.addEventListener('postStep', () => {
  let best = 0;
  for (const c of world.contacts) {
    let ny;
    if (c.bi === playerBody) ny = -c.ni.y;        // ni runs from bi to bj
    else if (c.bj === playerBody) ny = c.ni.y;
    else continue;
    if (ny > best) best = ny;
  }
  groundNy = best;
});

let coyote = 0;                       // grace period for late jump presses
let jumpLock = 0;                     // contacts survive a step after take-off
let eyeH = PLAYER.standEye;           // smoothed, so crouching ducks the view
let playerYaw = SPAWN_YAW * DEG;
const wishDir = new THREE.Vector3();

const centerOffset = () => (crouched ? PLAYER.crouchCenter : PLAYER.standCenter);

// Is there room to stand back up, or are we under the crouch tunnel?
function hasHeadroom() {
  const p = playerBody.position;
  const from = new CANNON.Vec3(p.x, p.y, p.z);
  const to   = new CANNON.Vec3(p.x, p.y + 1.35, p.z);
  let blocked = false;
  world.raycastAll(from, to, {}, (res) => { if (res.body !== playerBody) blocked = true; });
  return !blocked;
}

function respawn() {
  playerBody.position.set(SPAWN.x, SPAWN.y, SPAWN.z);
  playerBody.velocity.setZero();
  playerBody.wakeUp();
  state.yaw = SPAWN_YAW * DEG;
  state.pitch = 0;
}

function updatePlayer(dt) {
  const p = playerBody.position, v = playerBody.velocity;

  // --- how much of the body is under the pool surface (0 = dry, 1 = under) ---
  const bodyH = crouched ? PLAYER.crouchEye : PLAYER.standEye;
  const submerged = inWaterColumn(p.x, p.z)
    ? THREE.MathUtils.clamp((WATER.surfaceY - (p.y - centerOffset())) / bodyH, 0, 1)
    : 0;
  // Hysteresis: bobbing across a single threshold would flip between swimming and
  // walking once a frame, and every walking frame would drop the player.
  swimming = submerged > (swimming ? WATER.swimOut : WATER.swimIn);

  // --- crouch: held on desktop, latched on touch (in water C swims down) ---
  const wantCrouch = (keys.has('KeyC') || state.crouchBtn) && !swimming;
  if (wantCrouch && !crouched) {
    setPlayerShape(true);
    p.y -= PLAYER.standCenter - PLAYER.crouchCenter;   // keep the feet planted
    crouched = true;
  } else if (!wantCrouch && crouched && hasHeadroom()) {
    setPlayerShape(false);
    p.y += PLAYER.standCenter - PLAYER.crouchCenter;
    crouched = false;
  }

  jumpLock = Math.max(0, jumpLock - dt);
  const grounded = groundNy > GROUND_DOT && jumpLock === 0;
  const onSteep  = !grounded && groundNy > 0.05 && groundNy <= GROUND_DOT;
  coyote = grounded ? PLAYER.coyote : Math.max(0, coyote - dt);

  // --- wish direction ---
  const sy = Math.sin(state.yaw), cy = Math.cos(state.yaw);
  let wishY = 0;
  wishDir.set(0, 0, 0);
  if (camMode === CAM.TOP) {
    // Top-down drives the world axes directly — the camera has no heading to be
    // relative to, so W is north rather than "forward".
    if (keys.has('KeyW') || keys.has('ArrowUp'))    wishDir.z -= 1;
    if (keys.has('KeyS') || keys.has('ArrowDown'))  wishDir.z += 1;
    if (keys.has('KeyA') || keys.has('ArrowLeft'))  wishDir.x -= 1;
    if (keys.has('KeyD') || keys.has('ArrowRight')) wishDir.x += 1;
    wishDir.x += state.joyX;
    wishDir.z += state.joyY;
  } else {
    let fwd = 0, str = 0;
    if (keys.has('KeyW') || keys.has('ArrowUp'))    fwd += 1;
    if (keys.has('KeyS') || keys.has('ArrowDown'))  fwd -= 1;   // backpedal
    if (keys.has('KeyD') || keys.has('ArrowRight')) str += 1;
    if (keys.has('KeyA') || keys.has('ArrowLeft'))  str -= 1;
    fwd -= state.joyY;                                          // stick up = forward
    str += state.joyX;
    // Swimming steers with the camera pitch as well, so you dive where you look.
    const cp = swimming ? Math.cos(state.pitch) : 1;
    wishDir.set(-sy * fwd * cp + cy * str, 0, -cy * fwd * cp - sy * str);
    if (swimming) {
      if (keys.has('Space') || state.jumpHeld)     wishY += 1;
      if (keys.has('KeyC')  || state.crouchBtn)    wishY -= 1;
      wishDir.y = Math.sin(state.pitch) * fwd + wishY;
    }
  }
  const wl = wishDir.length();
  if (wl > 1) wishDir.divideScalar(wl);

  // Wading drags on you, and past the swim threshold it hands over to the (much
  // slower) swim speed at roughly the same value, so the change of gait is smooth.
  const wade = 1 - 0.42 * Math.min(1, submerged / WATER.swimIn);
  const speed = swimming
    ? PLAYER.walk * WATER.speedMult
    : (crouched ? PLAYER.crouchSpeed : PLAYER.walk * (isSprinting() ? PLAYER.sprintMult : 1)) * wade;

  // Sprint drives forward and strafe only: whatever part of the target velocity
  // points behind the camera is trimmed back to the walk speed, so you can back
  // up but never backpedal at a sprint. Top-down has no camera heading to be
  // behind, so it keeps driving the world axes as before.
  let tx = wishDir.x * speed, tz = wishDir.z * speed;
  if (camMode !== CAM.TOP) {
    const backCap = Math.min(speed, PLAYER.walk * (swimming ? 1 : wade));
    const along = tx * -sy + tz * -cy;      // + ahead of the camera, - behind it
    if (along < -backCap) {
      const over = along + backCap;         // negative — the excess to take out
      tx += sy * over;                      // i.e. t -= over * forward
      tz += cy * over;
    }
  }

  if (swimming) {
    // No ground to push off, so all three axes are driven the same way and the
    // lerp itself provides the drag.
    const k = 1 - Math.exp(-WATER.accel * dt);
    v.x += (tx - v.x) * k;
    v.z += (tz - v.z) * k;
    v.y += (wishDir.y * speed - v.y) * k;
    // Buoyancy: hand back most of the gravity the solver is about to apply.
    v.y += 9.82 * (1 - WATER.gravityScale) * dt;
    // Left alone near the top you settle at the surface and ride the swell. A
    // deliberate dive gives way — but a couple of degrees of look-down does not,
    // or you would sink every time you swam along the surface off the level.
    if (Math.abs(wishDir.y) < 0.25) {
      const bob = Math.sin(elapsed * 1.9) * 0.055 + Math.sin(elapsed * 1.07 + 2.1) * 0.035;
      const rest = WATER.surfaceY + bob - bodyH * 0.85 + centerOffset();
      const d = rest - p.y;
      if (Math.abs(d) < 1.4) {
        v.y += (THREE.MathUtils.clamp(d * 3.2, -1.2, 1.2) - v.y) * (1 - Math.exp(-6 * dt));
      }
    }
    playerBody.wakeUp();
  } else if (grounded) {
    const k = 1 - Math.exp(-PLAYER.groundAccel * dt);
    v.x += (tx - v.x) * k;
    v.z += (tz - v.z) * k;
  } else if (!onSteep) {
    // Reduced authority in the air; never scrubs speed you already carried, so a
    // sprint jump keeps its momentum even if shift is released mid-flight.
    const hs0 = Math.hypot(v.x, v.z);
    v.x += wishDir.x * PLAYER.airAccel * dt;
    v.z += wishDir.z * PLAYER.airAccel * dt;
    const hs = Math.hypot(v.x, v.z);
    const cap = Math.max(hs0, Math.hypot(tx, tz));
    if (hs > cap) { v.x = v.x / hs * cap; v.z = v.z / hs * cap; }
  }
  // Steeper than maxSlope: no input authority at all. Player/level friction is
  // zero, so gravity simply slides you back down — that is the red 55-degree lane.

  // --- jump (in water Space is the swim-up key instead) ---
  if ((state.jumpQueued || keys.has('Space')) && coyote > 0 && !crouched && !swimming) {
    v.y = PLAYER.jumpSpeed;
    coyote = 0;
    groundNy = 0;
    jumpLock = 0.15;
    playerBody.wakeUp();
  }
  state.jumpQueued = false;

  if (p.y < -25) respawn();

  // --- derived view state ---
  const targetEye = crouched ? PLAYER.crouchEye : PLAYER.standEye;
  eyeH += (targetEye - eyeH) * (1 - Math.exp(-14 * dt));

  if (camMode === CAM.TOP) {
    if (Math.hypot(v.x, v.z) > 0.4) playerYaw = Math.atan2(-v.x, -v.z);
  } else {
    playerYaw = state.yaw;
  }

  // In top-down the fly pad and E/Q become zoom controls.
  if (camMode === CAM.TOP) {
    const out = state.flyUp   || keys.has('KeyE');
    const inn = state.flyDown || keys.has('KeyQ');
    if (out) topZoom = Math.min(90, topZoom + 22 * dt);
    if (inn) topZoom = Math.max(8, topZoom - 22 * dt);
  }
}

// ---------------------------------------------------------------------------
// Camera modes
// ---------------------------------------------------------------------------
const CAM = { FIRST: 0, THIRD: 1, TOP: 2, FREE: 3 };
const CAM_NAMES = ['First Person', 'Third Person', 'Top Down', 'Free Camera'];
let camMode = CAM.FREE;               // start exactly as the old build did
let lastGameCam = CAM.FIRST;
let topZoom = 26;
let blendT = 1;                        // 1 = settled, <1 = mid transition
const BLEND_DUR = 0.42;
const blendPos = new THREE.Vector3();
const blendQuat = new THREE.Quaternion();

function setCamMode(next) {
  if (next === camMode) return;
  let snap = false;

  if (next === CAM.FREE) {
    lastGameCam = camMode;
    // Hand the flying camera the transform we are already looking through so
    // detaching from physics is seamless; yaw/pitch are shared already.
    state.pos.copy(camera.position);
  } else if (camMode === CAM.FREE) {
    snap = true;                       // re-attaching jumps straight to the body
    playerBody.wakeUp();
  }

  camMode = next;
  if (snap) {
    blendT = 1;
  } else {
    blendPos.copy(camera.position);
    blendQuat.copy(camera.quaternion);
    blendT = 0;
  }
  refreshModeUI();
}
function cycleCamera()   { setCamMode((camMode + 1) % 4); }
function toggleGameMode() { setCamMode(camMode === CAM.FREE ? lastGameCam : CAM.FREE); }

const desiredPos  = new THREE.Vector3();
const desiredQuat = new THREE.Quaternion();
const camEuler    = new THREE.Euler(0, 0, 0, 'YXZ');
const camTarget   = new THREE.Vector3();
const camBack     = new THREE.Vector3();
const boomRay     = new THREE.Raycaster();

function updateCamera(dt) {
  const p = playerBody.position;
  const feetY = p.y - centerOffset();

  if (camMode === CAM.FREE) {
    desiredPos.copy(state.pos);
    camEuler.set(state.pitch, state.yaw, 0);
  } else if (camMode === CAM.TOP) {
    desiredPos.set(p.x, feetY + topZoom, p.z);
    camEuler.set(-Math.PI / 2, 0, 0);
  } else {
    camEuler.set(state.pitch, state.yaw, 0);
    if (camMode === CAM.FIRST) {
      desiredPos.set(p.x, feetY + eyeH, p.z);
    } else {
      camTarget.set(p.x, feetY + eyeH * 0.86, p.z);
      camBack.set(0, 0, 1).applyEuler(camEuler);      // straight back along view
      let dist = THIRD_DIST;
      boomRay.set(camTarget, camBack);
      boomRay.far = dist + 0.5;
      const hit = boomRay.intersectObjects(objects.children, false)[0];
      if (hit) dist = Math.max(1.1, hit.distance - 0.35);   // pull in through trunks
      desiredPos.copy(camTarget).addScaledVector(camBack, dist);
    }
    // The boom ray only knows about the props. Terrain is a single 80k-triangle
    // mesh and raycasting it every frame is not worth it when the heightmap can
    // answer the same question directly: never let the boom leave the camera
    // inside a hillside. (Top-down needs no such guard — it sits straight above
    // the player, and a heightmap has nothing overhead.)
    // 1.2 of clearance, not a hair: terrainHeight is the smooth surface, while
    // the mesh is flat triangles across a 2-unit cell, and in a valley cell the
    // triangle can sit up to ~0.7 above the curve it is chasing.
    const floorY = terrainHeight(desiredPos.x, desiredPos.z) + 1.2;
    if (desiredPos.y < floorY) desiredPos.y = floorY;
  }
  desiredQuat.setFromEuler(camEuler);

  if (blendT < 1) {
    blendT = Math.min(1, blendT + dt / BLEND_DUR);
    const s = blendT * blendT * (3 - 2 * blendT);       // smoothstep
    camera.position.lerpVectors(blendPos, desiredPos, s);
    camera.quaternion.slerpQuaternions(blendQuat, desiredQuat, s);
  } else {
    camera.position.copy(desiredPos);
    camera.quaternion.copy(desiredQuat);
  }

  playerMesh.visible = camMode !== CAM.FIRST;
  playerMesh.geometry = crouched ? playerGeoCrouch : playerGeoStand;
  visor.position.y = crouched ? 0.10 : 0.42;
  playerMesh.position.set(p.x, p.y, p.z);
  playerMesh.rotation.y = playerYaw;
}

window.addEventListener('wheel', (e) => {
  if (camMode !== CAM.TOP) return;
  topZoom = THREE.MathUtils.clamp(topZoom + e.deltaY * 0.03, 8, 90);
  e.preventDefault();
}, { passive: false });

// ---------------------------------------------------------------------------
// Mode UI
// ---------------------------------------------------------------------------
const camModeEl = document.getElementById('cam-mode');
const instrEl   = document.getElementById('instructions');
const modeBtn   = document.getElementById('mode-btn');

const HELP_DESKTOP = {
  [CAM.FIRST]: [['W / S', 'Walk / back'], ['A / D', 'Strafe'], ['Space', 'Jump'], ['C', 'Crouch'],
                ['Shift', 'Sprint fwd (2&times;)'], ['Mouse', 'Look'], ['Space / C', 'Swim up / down'],
                ['V', 'Next camera'], ['G', 'Free camera'], ['R', 'Respawn'],
                ['Click view', 'Capture mouse'], ['Esc', 'Free the cursor']],
  [CAM.THIRD]: [['W / S', 'Walk / back'], ['A / D', 'Strafe'], ['Space', 'Jump'], ['C', 'Crouch'],
                ['Shift', 'Sprint fwd (2&times;)'], ['Mouse', 'Orbit'], ['Space / C', 'Swim up / down'],
                ['V', 'Next camera'], ['G', 'Free camera'], ['R', 'Respawn'],
                ['Click view', 'Capture mouse'], ['Esc', 'Free the cursor']],
  [CAM.TOP]:   [['W A S D', 'Move (world axes)'], ['Space', 'Jump'], ['C', 'Crouch'],
                ['Shift', 'Sprint (2&times;)'], ['Wheel / E Q', 'Zoom'], ['V', 'Next camera'],
                ['G', 'Free camera'], ['Esc', 'Free the cursor']],
  [CAM.FREE]:  [['W A S D', 'Fly'], ['E / Q', 'Up / down'], ['Shift', 'Sprint (3&times;)'],
                ['Mouse', 'Look'], ['1 2', 'Weather'], ['4 / 0', 'Add / clear cloud'],
                ['V', 'Next camera'], ['G', 'Enter game'], ['Esc', 'Free the cursor']],
};
const HELP_TOUCH = {
  [CAM.FIRST]: [['Left stick', 'Move (back too)'], ['Right drag', 'Look'], ['JUMP', 'Jump / swim up'],
                ['CROUCH', 'Crouch / swim down'], ['SPRINT', 'Toggle sprint']],
  [CAM.THIRD]: [['Left stick', 'Move (back too)'], ['Right drag', 'Orbit'], ['JUMP', 'Jump / swim up'],
                ['CROUCH', 'Crouch / swim down'], ['SPRINT', 'Toggle sprint']],
  [CAM.TOP]:   [['Left stick', 'Move (world axes)'], ['&#9650; / &#9660;', 'Zoom out / in']],
  [CAM.FREE]:  [['Left half', 'Joystick &mdash; fly'], ['Right half', 'Drag to look'],
                ['&#9650; / &#9660;', 'Up / down'], ['2 fingers', 'Sprint (3&times;)'],
                ['Weather', 'Panel, top left']],
};

function refreshModeUI() {
  const inGame = camMode !== CAM.FREE;
  camModeEl.innerHTML = 'Cam &mdash; ' + CAM_NAMES[camMode];
  modeBtn.textContent = inGame ? 'Free Camera' : 'Game Mode';
  modeBtn.classList.toggle('game', inGame);

  const rows = (isTouchDevice ? HELP_TOUCH : HELP_DESKTOP)[camMode];
  instrEl.innerHTML = '<span class="title">' + CAM_NAMES[camMode] + '</span>' +
    rows.map(([k, v]) => `<div class="row"><b>${k}</b><span>${v}</span></div>`).join('');

  // The weather controls only make sense while you are flying around watching
  // the sky, so they ride with the free camera.
  document.body.classList.toggle('free-cam', camMode === CAM.FREE);

  // Fly pad doubles as the top-down zoom pad; action pad is for on-foot modes.
  document.body.classList.toggle('pad-fly', camMode === CAM.FREE || camMode === CAM.TOP);
  document.body.classList.toggle('pad-act', camMode === CAM.FIRST || camMode === CAM.THIRD);
  document.getElementById('crosshair').style.display = (camMode === CAM.THIRD || camMode === CAM.TOP) ? 'none' : '';
}

// Deliberately does NOT grab the pointer on the way into game mode. While the
// pointer is locked the browser routes every mouse event to the locked element,
// so nothing at all reaches a DOM button — a mode button that locks the pointer
// makes itself unclickable the moment it succeeds, which is exactly why this one
// "didn't always work". Esc frees the cursor (and pops the overlay, which this
// button now sits above); a click in the world captures it again.
bindTap(modeBtn, () => {
  initAudio();                          // first gesture — unlock thunder
  toggleGameMode();
});
refreshModeUI();

// ---------------------------------------------------------------------------
// Overlay
// ---------------------------------------------------------------------------
const overlay = document.getElementById('overlay');
const sprintEl = document.getElementById('sprint');

const KEY_ROWS_DESKTOP = [
  ['W A S D', 'Fly (free camera)'],
  ['Mouse', 'Look'],
  ['E / Q', 'Fly up / down'],
  ['Shift', 'Sprint (3&times;)'],
  ['G', 'Enter game mode'],
  ['V', 'Cycle camera'],
  ['Esc', 'Release mouse'],
];
const KEY_ROWS_TOUCH = [
  ['Left half', 'Virtual joystick &mdash; move'],
  ['Right half', 'Drag to look'],
  ['2 fingers', 'Same side &rarr; sprint (3&times;)'],
  ['&#9650; / &#9660;', 'Fly up / down'],
  ['Game Mode', 'Top-right button &rarr; play on foot'],
];
document.getElementById('keys').innerHTML =
  (isTouchDevice ? KEY_ROWS_TOUCH : KEY_ROWS_DESKTOP)
    .map(([k, v]) => `<b>${k}</b><span>${v}</span>`).join('');
document.getElementById('start-btn').textContent = isTouchDevice ? 'Tap to fly' : 'Enter';

function hideOverlay() {
  overlay.classList.add('hidden');
  initAudio();                  // the gesture the browser wants before any sound
  if (!isTouchDevice) requestLock();
}
function showOverlay() { overlay.classList.remove('hidden'); }

overlay.addEventListener('pointerdown', (e) => { e.preventDefault(); hideOverlay(); }, { passive: false });
overlay.addEventListener('touchstart', (e) => { e.preventDefault(); hideOverlay(); }, { passive: false });

// ---------------------------------------------------------------------------
// Resize
// ---------------------------------------------------------------------------
function resize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const aspect = w / Math.max(h, 1);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w, h, false);
  camera.aspect = aspect;
  // Original used a 90-degree vertical FOV at 16:9. Here the horizontal FOV is
  // pinned near 90 degrees and the vertical is derived, so portrait phones keep
  // a usable view instead of a keyhole.
  camera.fov = THREE.MathUtils.clamp(
    2 * Math.atan(Math.tan(45 * DEG) / aspect) / DEG, 55, 95
  );
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
resize();

// ---------------------------------------------------------------------------
// Main loop
// ---------------------------------------------------------------------------
const fpsEl = document.getElementById('fps');
const posEl = document.getElementById('pos');
const clock = new THREE.Clock();
let frames = 0, fpsAccum = 0, fps = 0, hudAccum = 0;

const forward = new THREE.Vector3();
const right = new THREE.Vector3();
const move = new THREE.Vector3();
let elapsed = 0;

// The original flying camera, untouched apart from living in its own function.
function updateFreeCam(dt) {
  const sy = Math.sin(state.yaw), cy = Math.cos(state.yaw);
  forward.set(-sy, 0, -cy);   // camera looks down -Z at yaw 0
  right.set(cy, 0, -sy);

  move.set(0, 0, 0);
  if (keys.has('KeyW') || keys.has('ArrowUp'))    move.addScaledVector(forward, 1);
  if (keys.has('KeyS') || keys.has('ArrowDown'))  move.addScaledVector(forward, -1);
  if (keys.has('KeyD') || keys.has('ArrowRight')) move.addScaledVector(right, 1);
  if (keys.has('KeyA') || keys.has('ArrowLeft'))  move.addScaledVector(right, -1);
  if (keys.has('KeyE') || state.flyUp)   move.y += 1;
  if (keys.has('KeyQ') || state.flyDown) move.y -= 1;

  if (state.joyX || state.joyY) {
    move.addScaledVector(right, state.joyX);
    move.addScaledVector(forward, -state.joyY);   // finger up = forward
  }

  const len = move.length();
  if (len > 0) {
    const mag = Math.min(1, len);                 // analog on stick, full tilt on keys
    const step = MOVE_SPEED * (isSprinting() ? SPRINT_MULT : 1) * dt * mag / len;
    state.pos.addScaledVector(move, step);
  }
}

function tick() {
  const dt = Math.min(clock.getDelta(), 0.1);
  elapsed += dt;

  if (camMode === CAM.FREE) {
    updateFreeCam(dt);
    // Nobody is driving the character — park it so it does not creep away.
    playerBody.velocity.x = 0;
    playerBody.velocity.z = 0;
  } else {
    updatePlayer(dt);
  }

  // --- physics: fixed 60 Hz steps, sub-stepped to catch up with the frame ---
  world.step(PHYS_STEP, dt, 4);
  for (let i = 0; i < syncList.length; i++) {
    const s = syncList[i];
    s.mesh.position.copy(s.body.position);
    s.mesh.quaternion.copy(s.body.quaternion);
  }

  updateCamera(dt);
  waterTime.value = elapsed;
  updateWaterVisuals();
  // After the water swap, which owns the fog when the camera is submerged — the
  // weather only repaints it while we are above the surface.
  updateWeather(dt);
  sky.position.copy(camera.position);
  // Slide the sea under the camera. The waves themselves are a function of world
  // position, so nothing moves with it — the tessellation just follows the eye,
  // and the horizon is always another 1180 units away.
  ocean.position.set(camera.position.x, 0, camera.position.z);
  sprintEl.classList.toggle('on', isSprinting() && camMode !== CAM.TOP);

  // --- HUD ---
  frames++;
  fpsAccum += dt;
  hudAccum += dt;
  if (fpsAccum >= 0.5) {
    fps = frames / fpsAccum;
    frames = 0;
    fpsAccum = 0;
  }
  if (hudAccum >= 0.1) {
    hudAccum = 0;
    fpsEl.textContent = fps.toFixed(0).padStart(3, ' ');
    const p = camMode === CAM.FREE
      ? state.pos
      : { x: playerBody.position.x, y: playerBody.position.y - centerOffset(), z: playerBody.position.z };
    posEl.textContent =
      p.x.toFixed(1).padStart(6, ' ') + ',' +
      p.y.toFixed(1).padStart(6, ' ') + ',' +
      p.z.toFixed(1).padStart(6, ' ');
    if (camMode === CAM.FREE) {
      wxCountEl.textContent = String(clouds.length);
      let nearest = null, nearestDist = Infinity;
      for (const c of clouds) {
        const d = c.mesh.position.distanceTo(p);
        if (d < nearestDist) { nearestDist = d; nearest = c; }
      }
      wxCloudInfoEl.textContent = nearest
        ? `nearest: storm ${nearest.scale.toFixed(1)} @ ${nearestDist.toFixed(0)}m`
        : 'nearest: —';
    }
  }

  // One pass. The cloud depth prepass is opaque, so it is already sorted ahead
  // of the transparent puff quads inside this render — the previous two-render
  // arrangement could never have worked anyway, because `autoClear` wipes the
  // depth buffer at the top of the second render and takes the prepass with it.
  renderer.render(scene, camera);
}

// Debug handle — handy from the console / remote inspector on a phone.
window.hermes = {
  THREE, CANNON, scene, camera, renderer, state, keys, world, playerBody,
  CAM, setCamMode, cycleCamera, toggleGameMode, respawn,
  SEED, terrain, terrainHeight, slopeAt,
  // The island is bare by design — these are how you put something on it from
  // the console, collider included.
  addBox, addSphere, mat, objects,
  // Weather: WX holds the live settings, spawnCloud(true) drops one in near you.
  WX, clouds, spawnCloud, clearClouds, refreshWxUI,
  weather: () => ({
    count: clouds.length,
    rate: WX.RATES[WX.rateIdx][0],
    speed: WX.SPEEDS[WX.speedIdx][0],
    gloom, rain: rainAmt,
    scales: clouds.map((c) => c.scale).sort((a, b) => a - b),
  }),
  // live read-outs of the controller internals (module-scoped `let`s)
  status: () => ({
    cam: CAM_NAMES[camMode],
    crouched,
    swimming,
    underwater,
    groundNy,
    eyeH,
    grounded: groundNy > GROUND_DOT,
    pos: playerBody.position.toArray(),
    vel: playerBody.velocity.toArray(),
  }),
};

renderer.setAnimationLoop(tick);
renderer.compile(scene, camera);
document.getElementById('loading').classList.add('hidden');
</script>

<script>
// Surface module-load failures (bad network / blocked CDN) instead of a black screen.
window.addEventListener('error', (e) => {
  const el = document.getElementById('loading');
  if (!el || el.classList.contains('hidden')) return;
  el.innerHTML = '<div id="err">Failed to start.\n' +
    String((e && (e.message || e.error)) || 'Unknown error') +
    '\n\nThree.js (unpkg.com) and cannon-es (cdn.jsdelivr.net) are loaded from CDNs — ' +
    'check the network connection.</div>';
}, true);
</script>
</body>
</html>
