const HF_FLOOR = -3.2;         // where the field bottoms out under open water

  const data = [];

    for (let jj = 0; jj < GEN_N; jj++) {

      // row index has to count back down the field.
      const k = (GEN_N - 1 - jj) * GEN_N + i;
      strip[jj] = sTop[k] === NO_COLUMN ? HF_FLOOR : (sTop[k] + 1) * BLOCK;

const hfBody = new CANNON.Body({ mass: 0, material: physWorld });
hfBody.addShape(hfShape);
hfBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
hfBody.position.set(colX(0), 0, colZ(GEN_N - 1));
hfBody.updateAABB();
world.addBody(hfBody);

// One column of the collider, after the store under it changed.
function patchCollider(i, j) {
  const top = sTop[j * GEN_N + i];
  const y = top === NO_COLUMN ? HF_FLOOR : (top + 1) * BLOCK;
  hfShape.setHeightValueAtIndex(i, GEN_N - 1 - j, y);
  // Only ever widened. Recomputing the true extremes means walking the whole
  // field, and a bound that is a little loose costs a broadphase test, where one
  // that is too tight drops contacts.
  if (y > hfShape.maxValue) { hfShape.maxValue = y; hfBody.updateAABB(); }

// Where the ground is, for anything that needs to ask — the top of the block you
// would be standing on, or the sea floor where there is no block. It reads the
// voxel store rather than topLvl so that it keeps answering correctly once
// blocks can be taken out of the top of a column.
function groundHeightAt(x, z) {
  const i = colI(x), j = colJ(z);

// The origin is well inland whatever the seed does with the relief, so the
// player starts on the column there with their feet a couple of centimetres
// clear of whichever block happens to be on top of it.
SPAWN.set(0, groundHeightAt(0, 0) + PLAYER.standCenter + 0.05, 0);


// ---------------------------------------------------------------------------
// Cloud shadows — the ground half of the weather system.
//
// Shadow-mapping the clouds is not an option: they sit 150-250 units up, which is
// *above* the directional light's own position, so they fall outside its frustum
// entirely. Instead the biggest clouds near the camera hand their footprint to
// the ground shaders as a short list of discs, already projected down the sun
// direction onto sea level, and the sea darkens inside them.
// Four floats each: centre x, centre z, radius, strength.
// ---------------------------------------------------------------------------
const MAX_CLOUD_SHADOWS = 8;
const cloudShadowArr = new Float32Array(MAX_CLOUD_SHADOWS * 4);
const uCloudShadows = { value: cloudShadowArr };

const CLOUD_SHADOW_SLANT = new THREE.Vector2(SUN.x / SUN.y, SUN.z / SUN.y);

const CLOUD_SHADOW_GLSL = /* glsl */`
  uniform float uCloudShadows[${MAX_CLOUD_SHADOWS * 4}];
  // 0 in full sun .. 1 under the thickest part of a storm cell. The disc holds
  // full strength out to 55% of its radius before it starts to fall away: a
  // shadow with a wide solid core and a soft rim is what actually reads as a
  // cloud passing overhead, where one that fades from the centre outward just
  // reads as a smudge.
  float cloudShade(vec2 p) {
    float s = 0.0;
    for (int i = 0; i < ${MAX_CLOUD_SHADOWS}; i++) {
      float r = uCloudShadows[i * 4 + 2];
      if (r <= 0.0) continue;
      float d = distance(p, vec2(uCloudShadows[i * 4], uCloudShadows[i * 4 + 1]));
      float v = uCloudShadows[i * 4 + 3] * (1.0 - smoothstep(r * 0.55, r, d));
      // Stacked rather than max()'d: two cells drifting across each other put
      // more mass between the ground and the sun than either does alone.
      s = s + v - s * v;
    }
    return clamp(s, 0.0, 1.0);
  }
`;

// ---------------------------------------------------------------------------

// the water still has something below it out past the edge of the heightfield.

// as endless: there is never an edge to reach, and the fog closes long before

    new THREE.MeshStandardMaterial({ color: 0x2b4550, roughness: 1.0, metalness: 0.0 })

  // The one flat surface left in the world, and it is only ever seen edge-on from

      // The surf. Full height at the waterline and gone by the time the bed
      // drops past waist depth — the band where it lives is the breaker line.
      float surfA = SHORE_RUN * (1.0 - smoothstep(2.5, 9.0, depth));
      w += shoreRoller(p, t) * surfA;

      // The octave amplitudes actually in play here, so that "how close is this
      // pixel to the top of the local swing" means the same thing at every
      // range — otherwise the whitecaps thin out wherever the chop has faded.
      ampOut  = amp * (1.72 + 0.34 * lod1 + 0.16 * lod2) + surfA;
      openOut = open;
      return w;
    }
  `;

  surfMat.onBeforeCompile = (shader) => {
    shader.uniforms.uTime = waterTime;
    shader.uniforms.uCloudShadows = uCloudShadows;
    shader.uniforms.uLandTex = { value: landTex };

    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', /* glsl */`
        #include <common>
        uniform float uTime;
        varying vec3 vWPos;
        varying float vWaveH, vCover, vAmp, vOpen;
        ${NOISE_GLSL}
        ${LAND_GLSL}
        ${WAVE_GLSL}
      `)
      .replace('#include <beginnormal_vertex>', /* glsl */`
        #include <beginnormal_vertex>
        vec3 wpos = (modelMatrix * vec4(position, 1.0)).xyz;
        // Signed, not clamped: on dry land this goes negative, and the fragment
        // shader needs that to know where to stop drawing water.
        float depth = ${WATER.surfaceY.toFixed(2)} - landAt(wpos.xz);
        float amp, open;
        vec3 wave = seaSurface(wpos.xz, uTime, max(depth, 0.0), amp, open);
        objectNormal = normalize(vec3(-wave.y, 1.0, -wave.z));
        vWPos  = wpos + vec3(0.0, wave.x, 0.0);
        vWaveH = wave.x;
        vCover = depth + wave.x;         // metres of water over the bed, right now
        vAmp   = max(amp, 0.001);
        vOpen  = open;
      `)
      .replace('#include <begin_vertex>', /* glsl */`
        #include <begin_vertex>
        transformed.y += wave.x;
      `);

    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', /* glsl */`
        #include <common>
        uniform float uTime;
        varying vec3 vWPos;
        varying float vWaveH, vCover, vAmp, vOpen;
        ${NOISE_GLSL}
        ${SEA_PALETTE}
        ${CLOUD_SHADOW_GLSL}
      `)
      .replace('#include <map_fragment>', /* glsl */`
        #include <map_fragment>
        float foam = 0.0;
        {
          vec2 q = vWPos.xz;

          // --- foam where the wave meets the land ---
          // vCover crosses zero exactly at the edge of the deck, and it carries
          // the wave displacement with it, so this edge washes in and out with
          // every roller. The band just inside it is the broken water.
          float lace = fbmC(q * 0.85 + vec2(uTime * 0.5, uTime * 0.2));
          float edge = 1.0 - smoothstep(0.0, 0.75, vCover);
          float shoreFoam = edge * edge * smoothstep(0.15, 0.55, lace);
          // The leading centimetres are solid white however the noise falls.
          shoreFoam = max(shoreFoam, 1.0 - smoothstep(0.0, 0.18, vCover));

          // --- the break ---
          // In the surf zone the roller runs out of water under it, tips over
          // and goes white along its leading face. Gating on depth is what makes
          // that a line running parallel to the deck edge, and it marches in
          // with the wave because vWaveH does.
          float zone = smoothstep(0.25, 0.9, vCover) * (1.0 - smoothstep(1.3, 3.2, vCover));
          // Only the top of the swing: a wider gate than this stops being a
          // breaker and becomes a bay full of milk.
          float breaker = smoothstep(0.62, 0.97, vWaveH / vAmp) * zone
                        * (0.45 + 0.55 * fbmC(q * 0.5 + vec2(uTime * 0.3, 0.0)));

          // --- whitecaps on the open-water swell ---
          // Only crests, only once the swell is big enough to break: near the
          // platform the water is glassy, offshore it is speckled white.
          float crest = smoothstep(0.45, 0.88, vWaveH / vAmp);
          float caps = crest * smoothstep(0.3, 0.85, vOpen)
                     * smoothstep(0.30, 0.75, fbmC(q * 0.14 + vec2(0.0, uTime * 0.15)));

          foam = clamp(max(max(shoreFoam, breaker), caps * 0.9), 0.0, 1.0);

          float d = max(vCover, 0.0);
          vec3 water = mix(SEA_SHALLOW, SEA_DEEP, smoothstep(0.3, 9.0, d));
          diffuseColor.rgb = mix(water, SEA_FOAM, foam);
          // Cloud shadow. Water reads a squall harder than the land does — a
          // shaded patch of sea goes flat and slate-coloured.
          diffuseColor.rgb *= mix(1.0, 0.01, cloudShade(vWPos.xz));

          // Thin water fades out completely at the very edge, which is what
          // keeps the wash from ending in a hard line against the deck.
          diffuseColor.a = mix(mix(0.40, 0.93, smoothstep(0.25, 5.0, d)), 1.0, foam)
                         * smoothstep(0.0, 0.30, vCover);
        }
      `)
      .replace('#include <roughnessmap_fragment>', /* glsl */`
        #include <roughnessmap_fragment>
        roughnessFactor = mix(roughnessFactor, 0.86, foam);   // foam is not a mirror
      `)
      // Ripples finer than the mesh could ever carry, added straight to the
      // shading normal. This is most of what the sea looks like up close: a
      // gently sloped swell with a perfect mirror finish reads as a sheet of
      // glass, and it is the small stuff that scatters the sun into glitter.
      // Faded out with distance, where the ripples fall below a pixel and would
      // only crawl.
      .replace('#include <normal_fragment_begin>', /* glsl */`
        #include <normal_fragment_begin>
        {
          // The finest octaves fade out first: they are the ones that turn into
          // a crawling moire once a ripple no longer covers a pixel.
          float d = length(vWPos - cameraPosition);
          float closeness = 1.0 - smoothstep(25.0, 130.0, d);
          float fineness  = 1.0 - smoothstep(10.0,  45.0, d);
          if (closeness > 0.004) {
            vec2 q = vWPos.xz;
            // Amplitudes chosen for the slope they give (a * |k|), which is what
            // the shading actually reads — roughly a tenth each.
            vec3 r = waveOct(q, vec2( 0.62,  0.38), 0.150, 1.7, uTime)
                   + waveOct(q, vec2(-0.47,  0.79), 0.110, 2.1, uTime)
                   + waveOct(q, vec2( 1.35, -1.02), 0.045, 3.0, uTime) * fineness
                   + waveOct(q, vec2(-2.60,  1.90), 0.016, 4.4, uTime) * fineness;
            normal = normalize(normal + vec3(-r.y, 0.0, -r.z) * closeness * (1.0 - foam));
          }
        }
      `);
  };

  const surf = new THREE.Mesh(buildOceanGeo(), surfMat);
  surf.position.y = WATER.surfaceY;
  surf.receiveShadow = true;
  surf.castShadow = false;
  // The bounding sphere is centred on the camera and 1180 in radius, so it is
  // never out of view — culling it would only cost a test.
  surf.frustumCulled = false;
  ocean.add(surf);
}

// Submerging the camera swaps the sky and the distance fog for a dense blue one
// (the sky dome is a custom shader and ignores scene.fog, so it is hidden and a
// flat background colour takes over).
const UNDER_BG = new THREE.Color(WATER_FOG);
let underwater = false;
function updateWaterVisuals() {
  const c = camera.position;
  const wet = c.y < WATER.surfaceY && c.y > WATER.floorY - 2 && inWaterColumn(c.x, c.z);
  if (wet === underwater) return;
  underwater = wet;
  scene.fog.color.setHex(wet ? WATER_FOG : FOG_COLOR);
  scene.fog.density = wet ? 0.11 : FOG_DENSITY;
  scene.background = wet ? UNDER_BG : null;
  sky.visible = !wet;
  document.getElementById('underwater').classList.toggle('on', wet);
}

// ---------------------------------------------------------------------------
// Camera state + input
// ---------------------------------------------------------------------------
const state = {
  pos: START_POS.clone(),
  yaw: START_YAW * DEG,
  pitch: START_PITCH * DEG,
  sprint: false,
  flyUp: false,
  flyDown: false,
  joyX: 0,
  joyY: 0,
  touchActive: false,
  // character controller — touch buttons latch, keyboard equivalents are held
  jumpQueued: false,
  jumpHeld: false,          // held state too, so JUMP can drive a swim upwards
  crouchBtn: false,
  sprintBtn: false,
};
const PITCH_LIMIT = 89 * DEG;
const keys = new Set();

// ----- keyboard -----
const TRACKED = new Set([
  'KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyE', 'KeyQ', 'KeyC', 'KeyV', 'KeyG', 'KeyR',
  'KeyF', 'KeyZ', 'KeyX', 'KeyM',
  'ShiftLeft', 'ShiftRight', 'Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight',
]);
// A key that lands in a text field is the field's business and nothing else's —
// it must not also drive the character.
const typing = (e) => !!e.target && (e.target.tagName === 'INPUT' || e.target.isContentEditable);

window.addEventListener('keydown', (e) => {
  if (typing(e)) return;
  if (e.repeat) return;
  if (TRACKED.has(e.code)) { keys.add(e.code); e.preventDefault(); }
  if (e.code === 'KeyV') cycleCamera();
  else if (e.code === 'KeyG') toggleGameMode();
  else if (e.code === 'KeyR' && camMode !== CAM.FREE) respawn();
  else if (e.code === 'KeyF') setShovel(!shovel.on);
  else if (e.code === 'KeyZ') shovelPickUp();
  else if (e.code === 'KeyX') shovelPlace();
  else if (e.code === 'KeyM') setTerrainView(terrainView + 1);
  else if (e.code === 'Space' && camMode !== CAM.FREE) state.jumpQueued = true;
  // Weather controls — free camera only, where the panel showing what they do
  // is on screen.
  else if (camMode === CAM.FREE) {
    if (e.code === 'Digit1' || e.code === 'Numpad1') cycleRate();
    else if (e.code === 'Digit2' || e.code === 'Numpad2') cycleSpeed();
    else if (e.code === 'Digit4' || e.code === 'Numpad4') { spawnCloud(true); refreshWxUI(); }
    else if (e.code === 'Digit0' || e.code === 'Numpad0') clearClouds();
  }
}, { passive: false });
window.addEventListener('keyup', (e) => {
  if (typing(e)) return;
  if (TRACKED.has(e.code)) { keys.delete(e.code); e.preventDefault(); }
}, { passive: false });
window.addEventListener('blur', () => keys.clear());

// ----- pointer lock / mouse look -----
function requestLock() {
  if (isTouchDevice) return;
  const el = renderer.domElement;
  const fn = el.requestPointerLock || el.mozRequestPointerLock;
  if (fn) {
    const r = fn.call(el);
    if (r && typeof r.catch === 'function') r.catch(() => {});
  }
}
const isLocked = () => document.pointerLockElement === renderer.domElement;

renderer.domElement.addEventListener('mousedown', (e) => {
  if (!isLocked()) { requestLock(); return; }
  // Once the pointer is captured the two buttons are the shovel: left takes the
  // block under the crosshair, right puts one back. Nothing else in the world is
  // clickable, so there is nothing to steal them from.
  if (!shovel.on) return;
  if (e.button === 0) shovelPickUp();
  else if (e.button === 2) shovelPlace();
});

document.addEventListener('mousemove', (e) => {
  if (!isLocked()) return;
  state.yaw   -= (e.movementX || 0) * MOUSE_SENSITIVITY * DEG;
  state.pitch -= (e.movementY || 0) * MOUSE_SENSITIVITY * DEG;
  state.pitch = THREE.MathUtils.clamp(state.pitch, -PITCH_LIMIT, PITCH_LIMIT);
});

document.addEventListener('pointerlockchange', () => {
  if (!isLocked() && !isTouchDevice) {
    keys.clear();
    showOverlay();
  }
});

// ----- touch: left half = joystick, right half = look, 2 fingers/side = sprint -----
const stickBase = document.getElementById('stick-base');
const stickKnob = document.getElementById('stick-knob');
const STICK_R = 55;

const touches = new Map();   // identifier -> { zone, role }
let moveId = null;
let lookId = null;
let moveOrigin = { x: 0, y: 0 };

const zoneOf = (x) => (x < window.innerWidth * 0.5 ? 'left' : 'right');

function updateSprint() {
  let l = 0, r = 0;
  for (const t of touches.values()) (t.zone === 'left' ? l++ : r++);
  state.sprint = (l >= 2 || r >= 2);
  sprintEl.classList.toggle('on', state.sprint || keys.has('ShiftLeft') || keys.has('ShiftRight'));
}

function placeStick(x, y) {
  stickBase.style.left = (x - 66) + 'px';
  stickBase.style.top = (y - 66) + 'px';
  stickBase.style.bottom = 'auto';
}

function resetStick() {
  stickBase.classList.remove('active');
  // Cleared rather than written back to a remembered value: the resting place is
  // a stylesheet rule now, and the shovel pad moves it by overriding that rule.
  // An inline `bottom` left behind here would win over the override and park the
  // stick under the PICK UP button.
  stickBase.style.left = '';
  stickBase.style.top = '';
  stickBase.style.bottom = '';
  stickKnob.style.transform = 'translate(0px, 0px)';
  state.joyX = state.joyY = 0;
}

function enableTouchUI() {
  if (state.touchActive) return;
  state.touchActive = true;
  document.body.classList.add('touch');
}

function onTouchStart(e) {
  e.preventDefault();
  enableTouchUI();
  for (const t of e.changedTouches) {
    const zone = zoneOf(t.clientX);
    let role = 'extra';
    if (zone === 'left' && moveId === null) {
      role = 'move';
      moveId = t.identifier;
      moveOrigin = { x: t.clientX, y: t.clientY };
      placeStick(t.clientX, t.clientY);
      stickBase.classList.add('active');
    } else if (zone === 'right' && lookId === null) {
      role = 'look';
      lookId = t.identifier;
    }
    touches.set(t.identifier, { zone, role, x: t.clientX, y: t.clientY });
  }
  updateSprint();
}

// These two are bound on `window`, so every touch in the document passes through
// them — including the ones that landed on a HUD button. Calling preventDefault()
// on those was suppressing the click the browser would otherwise synthesise, and
// that is what made the mode button unreliable on touch. Only speak for the
// touches we actually took ownership of in onTouchStart.
function ownsAny(e) {
  for (const t of e.changedTouches) if (touches.has(t.identifier)) return true;
  return false;
}

function onTouchMove(e) {
  if (!ownsAny(e)) return;
  e.preventDefault();
  for (const t of e.changedTouches) {
    const rec = touches.get(t.identifier);
    if (!rec) continue;

    if (rec.role === 'look') {
      const dx = t.clientX - rec.x;
      const dy = t.clientY - rec.y;
      state.yaw   -= dx * MOUSE_SENSITIVITY * TOUCH_LOOK_MULT * DEG;
      state.pitch -= dy * MOUSE_SENSITIVITY * TOUCH_LOOK_MULT * DEG;
      state.pitch = THREE.MathUtils.clamp(state.pitch, -PITCH_LIMIT, PITCH_LIMIT);
    } else if (rec.role === 'move') {
      let dx = t.clientX - moveOrigin.x;
      let dy = t.clientY - moveOrigin.y;
      const len = Math.hypot(dx, dy);
      if (len > STICK_R) { dx = dx / len * STICK_R; dy = dy / len * STICK_R; }
      stickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
      state.joyX = dx / STICK_R;
      state.joyY = dy / STICK_R;
    }
    rec.x = t.clientX;
    rec.y = t.clientY;
  }
}

function onTouchEnd(e) {
  if (!ownsAny(e)) return;
  e.preventDefault();
  for (const t of e.changedTouches) {
    const rec = touches.get(t.identifier);
    if (!rec) continue;
    touches.delete(t.identifier);
    if (t.identifier === moveId) { moveId = null; resetStick(); }
    if (t.identifier === lookId) { lookId = null; }
  }
  // promote a leftover finger so control never gets stuck after a multi-touch
  if (lookId === null) {
    for (const [id, rec] of touches) {
      if (rec.role === 'extra' && rec.zone === 'right') { rec.role = 'look'; lookId = id; break; }
    }
  }
  if (moveId === null) {
    for (const [id, rec] of touches) {
      if (rec.role === 'extra' && rec.zone === 'left') {
        rec.role = 'move';
        moveId = id;
        moveOrigin = { x: rec.x, y: rec.y };
        placeStick(rec.x, rec.y);
        stickBase.classList.add('active');
        break;
      }
    }
  }
  updateSprint();
}

// The touch UI should come up on the first touch anywhere, not only on the first
// touch that happens to land on the canvas — starting the session by tapping the
// mode button used to leave the joystick and pads hidden.
window.addEventListener('touchstart', enableTouchUI, { passive: true, capture: true });
canvas.addEventListener('touchstart', onTouchStart, { passive: false });
window.addEventListener('touchmove', onTouchMove, { passive: false });
window.addEventListener('touchend', onTouchEnd, { passive: false });
window.addEventListener('touchcancel', onTouchEnd, { passive: false });

// kill browser pinch-zoom / scroll / long-press menus
for (const ev of ['gesturestart', 'gesturechange', 'gestureend']) {
  document.addEventListener(ev, (e) => e.preventDefault(), { passive: false });
}
document.addEventListener('contextmenu', (e) => e.preventDefault());
document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });

// ----- on-screen fly buttons -----
function bindHold(el, on, off) {
  const press = (e) => { e.preventDefault(); e.stopPropagation(); el.classList.add('down'); on(); };
  const release = (e) => { e.preventDefault(); e.stopPropagation(); el.classList.remove('down'); off(); };
  el.addEventListener('touchstart', press, { passive: false });
  el.addEventListener('touchend', release, { passive: false });
  el.addEventListener('touchcancel', release, { passive: false });
  el.addEventListener('mousedown', press);
  window.addEventListener('mouseup', () => { el.classList.remove('down'); off(); });
}
bindHold(document.getElementById('btn-up'),   () => state.flyUp = true,   () => state.flyUp = false);
bindHold(document.getElementById('btn-down'), () => state.flyDown = true, () => state.flyDown = false);

// A one-shot tap, for the HUD buttons that toggle something rather than being
// held. `click` alone is not enough: a touch that ends anywhere near a window
// listener calling preventDefault() never produces one, which is why the mode
// button used to work on some taps and not others. Take pointerdown when the
// browser has it and fall back to click when it does not, and never act on both
// — once a pointerdown has been seen, the compatibility click is dead to us.
function bindTap(el, fn) {
  let sawPointer = false;
  const fire = (e) => {
    e.preventDefault();
    e.stopPropagation();
    if (el.blur) el.blur();     // otherwise Space would re-press the focused button
    fn(e);
  };
  el.addEventListener('pointerdown', (e) => { sawPointer = true; fire(e); });
  el.addEventListener('click', (e) => {
    if (sawPointer) { e.preventDefault(); e.stopPropagation(); return; }
    fire(e);
  });
  // Keep the canvas / overlay handlers out of it entirely.
  el.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true });
  el.addEventListener('touchend', (e) => e.stopPropagation(), { passive: true });
}

// ----- on-screen action buttons (first / third person) -----
const btnJump   = document.getElementById('btn-jump');
const btnCrouch = document.getElementById('btn-crouch');
const btnSprint = document.getElementById('btn-sprint');

bindHold(btnJump,
  () => { state.jumpQueued = true; state.jumpHeld = true; },
  () => { state.jumpHeld = false; });
function bindToggle(el, get, set) {
  const press = (e) => {
    e.preventDefault();
    e.stopPropagation();
    set(!get());
    el.classList.toggle('down', get());
  };
  el.addEventListener('touchstart', press, { passive: false });
  el.addEventListener('mousedown', press);
}
bindToggle(btnCrouch, () => state.crouchBtn, (v) => state.crouchBtn = v);
bindToggle(btnSprint, () => state.sprintBtn, (v) => state.sprintBtn = v);

const isSprinting = () =>
  state.sprint || state.sprintBtn || keys.has('ShiftLeft') || keys.has('ShiftRight');

// ---------------------------------------------------------------------------
// Weather — clouds, rain, lightning
//
// Each cloud is a solid cluster of 8-20 overlapping lumpy ellipsoids baked into
// one indexed geometry, so a whole cell is a single draw call. Their surfaces
// come out merged rather than beaded because the normals are taken from the
// gradient of a metaball field over *all* the blobs in the cluster, not from the
// sphere each vertex happens to belong to — neighbouring blobs therefore shade
// continuously across the seam where they intersect. Triangles buried inside
// another blob are dropped at build time.
//
// Shading is baked, not lit: a directional light cannot give a cloud its
// characteristic bright top and shadowed underside, because that gradient comes
// from light scattering *through* the mass, which a surface material knows
// nothing about. So the material is unlit and mixes a top and a base colour by
// height-within-the-cloud plus normal, and the pair of colours is what encodes
// the storm scale.
// ---------------------------------------------------------------------------

// The four bands the 1-10 scale falls into: fair, building, storm, severe.
const CLOUD_BAND = (s) => (s <= 3 ? 0 : s <= 5 ? 1 : s <= 7 ? 2 : 3);
const BAND_SPEC = [
  { width: [200, 320], height: [ 48,  96], puffs: [ 5,  9], base: [110, 60] },
  { width: [320, 480], height: [160, 240], puffs: [ 7, 11], base: [140, 70] },
  { width: [480, 640], height: [320, 432], puffs: [ 9, 13], base: [160, 80] },
  { width: [560, 720], height: [392, 504], puffs: [11, 15], base: [175, 90] },
];

// How wide the cluster is at height fraction t: a flat sheet, a heap, a tower
// that flares at the top, and a tower with a pinched waist under a full anvil.
function cloudProfile(band, t) {
  if (band === 0) return 1.00 - 0.30 * t * t;
  if (band === 1) return 1.00 - 0.44 * Math.pow(t, 1.35);
  if (band === 2) return 1.00 - 0.46 * Math.pow(t, 0.85) + 0.34 * smooth((t - 0.70) / 0.30);
  return 1.00 - 0.60 * Math.pow(t, 0.80) + 0.78 * smooth((t - 0.58) / 0.42);
}

// PolyhedronGeometry hands back a non-indexed soup — every face carries its own
// three vertices. Welding it first means a blob costs 162 vertices rather than
// 960, and it is the welded form the merge below assumes.
function indexedUnitSphere(detail) {
  const src = new THREE.IcosahedronGeometry(1, detail);
  const sp = src.attributes.position.array;
  const seen = new Map();
  const pos = [], idx = [];
  for (let i = 0; i < sp.length; i += 3) {
    const key = sp[i].toFixed(4) + ',' + sp[i + 1].toFixed(4) + ',' + sp[i + 2].toFixed(4);
    let v = seen.get(key);
    if (v === undefined) {
      v = pos.length / 3;
      seen.set(key, v);
      pos.push(sp[i], sp[i + 1], sp[i + 2]);
    }
    idx.push(v);
  }
  src.dispose();
  return { pos: new Float32Array(pos), idx: new Uint16Array(idx), count: pos.length / 3 };
}
// three's `detail` counts subdivision cuts, not recursions: 2 gives 180 faces per
// blob and 3 gives 320. Three is smooth enough that the lumps read as lumps
// rather than as facets, and a whole cloud still lands around 5k triangles.
const CLOUD_PUFF = indexedUnitSphere(isTouchDevice ? 2 : 3);
const lerpRange = (r, t) => r[0] + (r[1] - r[0]) * t;

function buildCloudGeo(band, rnd) {
  const spec   = BAND_SPEC[band];
  const width  = lerpRange(spec.width, rnd());
  const height = lerpRange(spec.height, rnd());
  const count  = Math.round(lerpRange(spec.puffs, rnd()));
  const R = width * 0.5;

  const puffs = [];
  for (let k = 0; k < count; k++) {
    const t = count > 1 ? Math.min(1, (k + rnd() * 0.8) / count) : 0;
    const prof  = Math.max(0.18, cloudProfile(band, t));
    const anvil = band >= 2 && t > 0.72;      // the flat spreading cap up top
    const a = rnd() * Math.PI * 2;
    // sqrt() keeps the blobs spread evenly over the disc instead of crowding
    // into the middle of it. The spread is deliberately tighter than the blob
    // radius: neighbours have to interpenetrate by a good margin or the cluster
    // reads as a bag of balls rather than as one mass.
    const rad = R * prof * Math.sqrt(rnd()) * 0.72;
    const pr  = R * (0.24 + 0.28 * rnd()) * Math.max(0.55, prof);
    puffs.push({
      x: Math.cos(a) * rad,
      y: t * height * (band === 0 ? 0.55 : 0.88) + (rnd() - 0.5) * height * 0.22,
      z: Math.sin(a) * rad,
      // A narrower spread on the axis jitter than before: one blob at half the
      // radius of its neighbour pokes out of the mass as a recognisable ball
      // however well the seam around it is handled.
      rx: pr * (0.80 + rnd() * 0.50),
      ry: pr * (anvil ? 0.40 : band === 0 ? 0.55 : 0.80) * (0.90 + rnd() * 0.25),
      rz: pr * (0.80 + rnd() * 0.50),
      seed: rnd() * 40,
    });
  }

  const sp = CLOUD_PUFF.pos;
  const si = CLOUD_PUFF.idx;
  const vc = CLOUD_PUFF.count;
  const total = vc * puffs.length;

  // Lumps baked into the surface — a perfectly round ball never reads as cloud
  // however it is shaded. This displaces the surface by up to a third of the
  // radius either way, so it is not a detail anything downstream can ignore:
  // both the seam fillet and the buried-face cull have to ask this where a puff
  // actually ends rather than assume its ellipsoid.
  const LUMP = 0.20;
  const lumpAt = (pf, dx, dy, dz) =>
    1 + LUMP * (Math.sin(dx * 3.1 + pf.seed) * Math.sin(dy * 2.7 + pf.seed * 1.9)
        + 0.55 * Math.sin(dz * 5.3 + pf.seed * 2.7) * Math.sin(dx * 4.3 - pf.seed));

  // Where a point sits relative to a puff's lumpy surface: below 1 is inside it,
  // 1 is on it, above 1 is clear of it.
  const surfDepth = (px, py, pz, pf) => {
    const ex = (px - pf.x) / pf.rx, ey = (py - pf.y) / pf.ry, ez = (pz - pf.z) / pf.rz;
    const q = Math.hypot(ex, ey, ez);
    if (q < 1e-6) return 0;
    return q / lumpAt(pf, ex / q, ey / q, ez / q);
  };

  // --- vertices ---
  // Built and kept in raw space: the flat base is a non-uniform squash, and
  // every field query below — normals, fillet, cull — compares points against
  // plain ellipsoids, so it has to happen before that squash distorts them.
  // Testing squashed points against unsquashed puffs is what put the worst of
  // the seam junk down in the skirt, which is exactly where a cumulus is most
  // obviously a heap of balls.
  const pos = new Float32Array(total * 3);
  for (let k = 0; k < puffs.length; k++) {
    const pf = puffs[k];
    for (let v = 0; v < vc; v++) {
      const dx = sp[v * 3], dy = sp[v * 3 + 1], dz = sp[v * 3 + 2];
      const l = lumpAt(pf, dx, dy, dz);
      const o = (k * vc + v) * 3;
      pos[o]     = pf.x + dx * pf.rx * l;
      pos[o + 1] = pf.y + dy * pf.ry * l;
      pos[o + 2] = pf.z + dz * pf.rz * l;
    }
  }

  // --- normals from the metaball field, so the blobs shade as one mass ---
  const nrm = new Float32Array(total * 3);
  const fieldNormals = () => {
    for (let i = 0; i < total; i++) {
      const px = pos[i * 3], py = pos[i * 3 + 1], pz = pos[i * 3 + 2];
      let gx = 0, gy = 0, gz = 0;
      for (let k = 0; k < puffs.length; k++) {
        const pf = puffs[k];
        const ex = (px - pf.x) / pf.rx, ey = (py - pf.y) / pf.ry, ez = (pz - pf.z) / pf.rz;
        const q2 = ex * ex + ey * ey + ez * ez + 1e-4;
        const w = 1 / (q2 * q2);            // d/dp of the 1/q^2 falloff, outward
        gx += w * ex / pf.rx;
        gy += w * ey / pf.ry;
        gz += w * ez / pf.rz;
      }
      const len = Math.hypot(gx, gy, gz) || 1;
      nrm[i * 3] = gx / len; nrm[i * 3 + 1] = gy / len; nrm[i * 3 + 2] = gz / len;
    }
  };
  fieldNormals();

  // --- fillet the seams ---
  // Two spheres pushed into each other cross in a hard V, and no amount of
  // smoothed normals hides a crease that sharp: it catches the light as a line
  // and the eye reads the two balls straight off it. Nudging the vertices that
  // sit near a neighbour's surface outward along the field gradient fills that V
  // in with a fillet, so the pair meets at a waist the way real cloud does.
  // Vertices already well inside a neighbour are culled below and do not matter.
  for (let k = 0; k < puffs.length; k++) {
    const A = puffs[k];
    const reach = (A.rx + A.ry + A.rz) / 3;
    for (let v = 0; v < vc; v++) {
      const i = k * vc + v;
      const px = pos[i * 3], py = pos[i * 3 + 1], pz = pos[i * 3 + 2];
      let near = 0;
      for (let m = 0; m < puffs.length; m++) {
        if (m === k) continue;
        // 1 on the neighbour's surface, tapering to 0 half a radius clear of it.
        const f = 1.5 - surfDepth(px, py, pz, puffs[m]);
        if (f > near) near = f;
      }
      if (near <= 0) continue;
      const t2 = Math.min(1, near / 0.5);
      const push = reach * 0.22 * t2 * t2 * (3 - 2 * t2);
      pos[i * 3]     = px + nrm[i * 3] * push;
      pos[i * 3 + 1] = py + nrm[i * 3 + 1] * push;
      pos[i * 3 + 2] = pz + nrm[i * 3 + 2] * push;
    }
  }
  fieldNormals();   // the surface moved, so the gradient has to be read again

  // --- faces, minus the ones sealed inside a neighbouring blob ---
  // The material is alpha-blended with no depth write, so a face left inside a
  // neighbour is not hidden by it — it blends on top, and every one of those
  // stacked interior shells darkens the overlap into a visible ball-shaped
  // outline. Culling against the true lumpy surface lets the threshold sit right
  // at it: anything below 1 is genuinely inside and has to go. The old 0.94
  // against a plain ellipsoid both kept a shell of interior faces around every
  // intersection and cut holes wherever a lump dented the surface inward.
  const buriedIn = (i, pf) => surfDepth(pos[i * 3], pos[i * 3 + 1], pos[i * 3 + 2], pf) < 1.0;
  const idx = [];
  for (let k = 0; k < puffs.length; k++) {
    const base = k * vc;
    const A = puffs[k];
    // Only the blobs that actually reach this one can swallow any of its faces —
    // testing the rest of the cluster per triangle is most of the build cost.
    // The 1.35 is the widest the lumps plus the fillet push a surface out.
    const near = [];
    const rA = Math.max(A.rx, A.ry, A.rz) * 1.35;
    for (let m = 0; m < puffs.length; m++) {
      if (m === k) continue;
      const B = puffs[m];
      if (Math.hypot(A.x - B.x, A.y - B.y, A.z - B.z) < rA + Math.max(B.rx, B.ry, B.rz) * 1.35) near.push(B);
    }
    for (let f = 0; f < si.length; f += 3) {
      const a = base + si[f], b = base + si[f + 1], c = base + si[f + 2];
      let buried = false;
      for (let m = 0; m < near.length && !buried; m++) {
        const pf = near[m];
        buried = buriedIn(a, pf) && buriedIn(b, pf) && buriedIn(c, pf);
      }
      if (!buried) idx.push(a, b, c);
    }
  }

  // --- flatten the base ---
  // Everything below the cluster datum is squashed into a shallow skirt, which
  // is what gives cumulus their flat, level bases. Normals take the inverse of
  // that scale, so faces that were pointing gently downward end up pointing
  // straight down — a flat base that shades like one.
  const BASE_SQUASH = 0.22;
  for (let i = 0; i < total; i++) {
    if (pos[i * 3 + 1] >= 0) continue;
    pos[i * 3 + 1] *= BASE_SQUASH;
    const nx = nrm[i * 3], ny = nrm[i * 3 + 1] / BASE_SQUASH, nz = nrm[i * 3 + 2];
    const len = Math.hypot(nx, ny, nz) || 1;
    nrm[i * 3] = nx / len; nrm[i * 3 + 1] = ny / len; nrm[i * 3 + 2] = nz / len;
  }

  // --- normalise the vertical: local y = 0 is the cloud base, aH is 0..1 ---
  let minY = Infinity, maxY = -Infinity;
  for (let i = 1; i < pos.length; i += 3) {
    if (pos[i] < minY) minY = pos[i];
    if (pos[i] > maxY) maxY = pos[i];
  }
  const span = Math.max(1e-3, maxY - minY);
  const aH = new Float32Array(total);
  for (let i = 0; i < total; i++) {
    pos[i * 3 + 1] -= minY;
    aH[i] = pos[i * 3 + 1] / span;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('normal', new THREE.BufferAttribute(nrm, 3));
  geo.setAttribute('aH', new THREE.BufferAttribute(aH, 1));
  geo.setIndex(idx);
  geo.computeBoundingSphere();
  geo.userData.width = width;
  geo.userData.height = span;
  return geo;
}

// A pool built once at load and shared: a cloud picks a shell, spins it and
// scales it a little, and gets its own colours from its own weather scale.
const cloudRand = mulberry32((SEED ^ 0x9e3779b9) >>> 0);
const CLOUD_GEOS = BAND_SPEC.map((_, band) => {
  const n = isTouchDevice ? 2 : 3;
  const out = [];
  for (let i = 0; i < n; i++) out.push(buildCloudGeo(band, cloudRand));
  return out;
});

const CLOUD_VERT = /* glsl */`
  attribute float aH;
  varying float vH;
  varying vec3 vN;
  varying vec3 vW;
  void main() {
    vH = aH;
    vN = normalize(mat3(modelMatrix) * normal);
    vec4 wp = modelMatrix * vec4(position, 1.0);
    vW = wp.xyz;
    gl_Position = projectionMatrix * viewMatrix * wp;
  }
`;

const CLOUD_FRAG = /* glsl */`
  varying float vH;
  varying vec3 vN;
  varying vec3 vW;
  uniform vec3  uTop, uBot, uTint, uSunDir, uHaze, uSunCol;
  uniform float uTintAmt, uFlash, uHazeMax, uThickness;

  // Henyey-Greenstein: fraction of light scattered toward the eye for a given
  // sun/view angle. g > 0 throws most of it forward, through the mass, which
  // is what makes a cloud glow when the sun sits behind it.
  float henyeyGreenstein(float cosTheta, float g) {
    float g2 = g * g;
    return (1.0 - g2) / (12.566371 * pow(1.0 + g2 - 2.0 * g * cosTheta, 1.5));
  }

  void main() {
    vec3 n = normalize(vN);
    vec3 v = normalize(cameraPosition - vW);
    // Two things decide how much light reaches a patch of cloud: how far up the
    // mass it is (light comes down through the whole depth of it) and which way
    // it faces. Downward faces are what the rain falls out of, and they are the
    // darkest part of any cloud that is worth looking at.
    float up  = n.y * 0.5 + 0.5;
    float sun = dot(n, uSunDir) * 0.5 + 0.5;

    // Stand-in for the mass of cloud behind this point: thicker toward the
    // base of the shell, scaled by the cell's own storminess (uThickness).
    float density = uThickness * (0.35 + 0.65 * (1.0 - vH));
    // Beer-Lambert extinction: how much direct light survives that mass.
    // A steeper falloff than a flatter mass would use — it's what makes the
    // difference between "thin here, thick there" actually read as depth.
    float transmit = exp(-density * 2.3);

    // Punchier spread between the two terms that drive the top/bottom
    // gradient (facing + height) is what reads as real depth rather than a
    // flat wash — a cloud lit only by a soft blend looks like a painted
    // sphere, not a mass with a lit crown and a heavy, shadowed belly.
    float lit = clamp(0.06 + 0.56 * up + 0.30 * pow(sun, 1.4) + 0.42 * vH, 0.0, 1.0);
    vec3 col = mix(uBot, uTop, lit) * mix(0.7, 1.0, transmit);

    // Extra luminosity on the crown: strongly upward-facing, thin (well-lit)
    // patches push past the flat top colour into a proper glow, which is what
    // gives fluffy tops their sunlit puffiness instead of a flat matte white.
    col += uTop * pow(max(up, 0.0), 5.0) * 0.36 * mix(0.5, 1.0, transmit);
    // Undersides read as darker, heavier mass by contrast — cheap but the
    // single biggest lever for the "fluffy top, moody bottom" silhouette.
    // Widened from the original spread so the gradient carries real
    // top-to-bottom contrast instead of a gentle fade.
    col *= mix(0.38, 1.18, up);

    // Forward scatter through the cloud body, brightest looking through thin,
    // backlit mass toward the sun.
    float cosTheta = dot(v, -uSunDir);
    float phase = henyeyGreenstein(cosTheta, 0.45);
    col += uSunCol * phase * (1.0 - transmit) * 1.4;

    // Subsurface scattering approximation: thin, sunlit-from-behind patches
    // glow with transmitted light rather than reading as flat silhouette.
    float backlit = pow(clamp(dot(-v, uSunDir), 0.0, 1.0), 2.0) * (1.0 - transmit);
    col += uSunCol * backlit * 0.55;

    // Fresnel silver lining: grazing, sun-facing rims catch the most light.
    // Wider and hotter than a physically-tight rim so it reads clearly at a
    // distance rather than as a single blown-out pixel.
    float fresnel = pow(1.0 - clamp(dot(n, v), 0.0, 1.0), 3.0);
    col += uSunCol * fresnel * pow(max(sun, 0.0), 1.7) * 1.15;
    // Tight hot rim, kept for the sharp highlight right at the sun.
    col += vec3(0.34, 0.30, 0.22) * pow(max(sun, 0.0), 7.0);
    // Golden-hour warmth: a soft amber cast where that rim catches raking
    // sunlight, so lit edges skew warm rather than the same cool white as the
    // rest of the mass.
    vec3 warm = vec3(1.0, 0.66, 0.32);
    col += warm * fresnel * pow(max(sun, 0.0), 1.6) * 0.56;

    // Severe cells go sickly green-yellow underneath. It is a cast over the
    // charcoal, not a coat of paint — enough to read as "that one is dangerous"
    // from across the water and no more, and only across the lowest fifth.
    col = mix(col, uTint, uTintAmt * (1.0 - smoothstep(0.0, 0.22, vH)));
    // Lightning lights the cell from the inside, brightest low down.
    col += vec3(0.80, 0.84, 1.0) * uFlash * (1.15 - vH * 0.55);
    // The scene's own fog would swallow these at a third of the range they are
    // meant to be legible from, so they carry their own much thinner haze.
    float haze = uHazeMax * smoothstep(420.0, 2500.0, distance(vW, cameraPosition));
    col = mix(col, uHaze, haze);

    // Soft alpha: thin, grazing edges fade toward transparent instead of
    // hard-clipping at the mesh boundary.
    float alpha = clamp((1.0 - transmit) * mix(1.0, 0.35, fresnel) + 0.25, 0.0, 1.0);

    gl_FragColor = vec4(col, alpha);
    #include <tonemapping_fragment>
    #include <colorspace_fragment>
  }
`;

// Colour by weather scale: white and bright at 1, charcoal with almost no light
// left in the base by 10.
const CLOUD_KEYS = [
  { s: 1,  top: 0xffffff, bot: 0xd2e0f0 },
  { s: 3,  top: 0xfefeff, bot: 0xb3c2d4 },
  { s: 5,  top: 0xf4f7fb, bot: 0x7c8998 },
  { s: 7,  top: 0xd2d7de, bot: 0x3c434f },
  { s: 9,  top: 0xacb2bc, bot: 0x21252c },
  { s: 10, top: 0x969ba6, bot: 0x14171c },
];
function cloudColors(s) {
  let i = 0;
  while (i < CLOUD_KEYS.length - 2 && s > CLOUD_KEYS[i + 1].s) i++;
  const a = CLOUD_KEYS[i], b = CLOUD_KEYS[i + 1];
  const t = THREE.MathUtils.clamp((s - a.s) / (b.s - a.s), 0, 1);
  return {
    top: new THREE.Color(a.top).lerp(new THREE.Color(b.top), t),
    bot: new THREE.Color(a.bot).lerp(new THREE.Color(b.bot), t),
  };
}

const CLOUD_HAZE = new THREE.Color(0xc4d8ea);
const SEVERE_TINT = new THREE.Color(0x7d7f4e);

const CLOUD_SUN_COLOR = new THREE.Color(0xfff0cf);

function cloudMaterial(scale) {
  const { top, bot } = cloudColors(scale);
  return new THREE.ShaderMaterial({
    vertexShader: CLOUD_VERT,
    fragmentShader: CLOUD_FRAG,
    transparent: true,
    depthWrite: false,
    uniforms: {
      uTop:       { value: top },
      uBot:       { value: bot },
      uTint:      { value: SEVERE_TINT.clone() },
      uTintAmt:   { value: smooth((scale - 7.4) / 2.2) * 0.22 },
      uSunDir:    { value: SUN.clone() },
      uSunCol:    { value: CLOUD_SUN_COLOR.clone() },
      uHaze:      { value: CLOUD_HAZE.clone() },
      uHazeMax:   { value: 0.66 },
      uFlash:     { value: 0 },
      // Storm cells thicken faster than fair-weather puffs, which is what
      // makes the high end of the scale read as distinctly darker and more
      // ominous rather than just a tinted version of a bright cloud.
      uThickness: { value: 0.75 + scale * 0.16 },
    },
  });
}

// ----- the controls the free camera exposes -----
const WX = {
  rateIdx: 2,
  speedIdx: 1,
  // label, seconds between spawns (0 = off)
  RATES:  [['Off', 0], ['Slow', 16], ['Medium', 7.5], ['Fast', 3]],
  // label, drift speed in units / second
  SPEEDS: [['Slow', 5], ['Medium', 13], ['Fast', 27]],
};

// Storminess is rolled per cloud rather than picked from a shared range: most
// cells land mild, with severe ones getting rarer the higher the scale climbs.
function rollStorminess(min, max) {
  return min + Math.pow(Math.random(), 2.2) * (max - min);
}

const MAX_CLOUDS    = isTouchDevice ? 14 : 24;
const CLOUD_DESPAWN = 2100;      // they are gone once they are this far behind you

const clouds = [];
const cloudGroup = new THREE.Group();
scene.add(cloudGroup);
// Depth prepass: render clouds with a depth-only material first so interior
// faces are hidden by the depth buffer when the volumetric pass runs.
const depthMat = new THREE.MeshBasicMaterial({ colorWrite: false });
const cloudDepthGroup = new THREE.Group();
scene.add(cloudDepthGroup);

const wxFocus = new THREE.Vector3();
let spawnTimer = 0;
let gloom = 0;                   // 0 clear sky .. 1 overcast right overhead
let rainAmt = 0;
let wxTime = 0;

// A single slowly-drifting wind direction shared by the whole sky, so every
// cloud heads the same way instead of converging on the player from all sides.
const WIND_BASE_DIR = Math.random() * Math.PI * 2;
function liveWindDir() {
  return WIND_BASE_DIR + Math.sin(wxTime * 0.015) * 0.4;
}

function spawnCloud(initial) {
  if (clouds.length >= MAX_CLOUDS) return null;
  const scale = rollStorminess(1, 10);
  const band  = CLOUD_BAND(scale);
  const pool  = CLOUD_GEOS[band];
  const geo   = pool[(Math.random() * pool.length) | 0];

  // Far out and in a random direction. A fresh cloud is 800-1500 away, which at
  // the medium drift speed is a couple of minutes of warning; the initial batch
  // is scattered across the whole range so the sky is never empty at load.
  const wind = liveWindDir();
  const bearing = wind + Math.PI + (Math.random() - 0.5) * Math.PI * 0.6;
  const dist = initial ? 140 + Math.random() * 1360 : 800 + Math.random() * 700;
  const alt  = BAND_SPEC[band].base[0] + Math.random() * BAND_SPEC[band].base[1];
  const sc   = 0.65 + Math.random() * 0.9;

  const material = cloudMaterial(scale);
  const mesh = new THREE.Mesh(geo, material);
  mesh.position.set(wxFocus.x + Math.cos(bearing) * dist, alt, wxFocus.z + Math.sin(bearing) * dist);
  mesh.rotation.y = Math.random() * Math.PI * 2;
  mesh.scale.setScalar(sc);
  cloudGroup.add(mesh);
  // Matching depth-only mesh for the prepass.
  const depthMesh = new THREE.Mesh(geo, depthMat);
  depthMesh.position.copy(mesh.position);
  depthMesh.rotation.copy(mesh.rotation);
  depthMesh.scale.copy(mesh.scale);
  cloudDepthGroup.add(depthMesh);

  // Heading: the shared wind direction, with a little per-cloud scatter for
  // gusting, so the whole sky drifts together instead of converging on the
  // player from every side.
  const head = liveWindDir() + (Math.random() - 0.5) * 0.3;
  const c = {
    mesh,
    depthMesh,
    mat: material,
    scale,
    band,
    dirX: Math.cos(head),
    dirZ: Math.sin(head),
    spdMul: 1.0,
    radius: geo.userData.width * 0.5 * sc,
    baseY: alt,
    boltT: -1,
    boltIn: boltInterval(scale) * Math.random(),
  };
  clouds.push(c);
  return c;
}

function clearClouds() {
  for (const c of clouds) {
    cloudGroup.remove(c.mesh); c.mat.dispose();
    cloudDepthGroup.remove(c.depthMesh);
  }
  clouds.length = 0;
  refreshWxUI();
}

// ----- lightning -----
const boltInterval = (scale) => (scale >= 8 ? 2.5 + Math.random() * 6 : 7 + Math.random() * 15);

// The strike envelope: a fast leader, a dip, a brighter return stroke, then the
// glow rolling away. Real lightning is never a single clean flash.
function boltEnv(t) {
  if (t < 0.06) return t / 0.06;
  if (t < 0.14) return 1.0 - (t - 0.06) / 0.08 * 0.85;
  if (t < 0.20) return 0.15 + (t - 0.14) / 0.06 * 0.75;
  if (t < 0.50) return 0.90 * (1 - (t - 0.20) / 0.30);
  return 0;
}

let audioCtx = null;
function initAudio() {
  if (audioCtx) return audioCtx;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  try { audioCtx = new AC(); } catch (e) { audioCtx = null; }
  return audioCtx;
}

// Thunder, synthesised: brown noise (a random walk, which is what gives it the
// low rumble) shaped by an envelope and rolled off harder the further away the
// strike was. Close strikes get a crack on the front; distant ones are all roll.
function playThunder(vol, dist) {
  const ctx = audioCtx;
  if (!ctx || vol <= 0.02) return;
  if (ctx.state === 'suspended') ctx.resume().catch(() => {});
  try {
    const near = 1 - Math.min(1, dist / 1800);
    const sr = ctx.sampleRate;
    const n = Math.floor(sr * (1.5 + (1 - near) * 2.6));
    const buf = ctx.createBuffer(1, n, sr);
    const d = buf.getChannelData(0);
    let b = 0;
    for (let i = 0; i < n; i++) {
      b = b * 0.965 + (Math.random() * 2 - 1) * 0.035;
      const t = i / sr;
      const crack = near * Math.exp(-t * 26) * (Math.random() * 2 - 1) * 0.5;
      const roll  = Math.exp(-t * (1.0 + (1 - near) * 0.7)) * (0.6 + 0.4 * Math.sin(t * 3.1));
      d[i] = THREE.MathUtils.clamp(b * 7.5 * roll + crack, -1, 1);
    }
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 180 + near * 900;
    const g = ctx.createGain();
    g.gain.value = vol * 0.5;
    src.connect(lp); lp.connect(g); g.connect(ctx.destination);
    src.start();
  } catch (e) { /* audio is a nicety; never let it take the frame down */ }
}

function strike(c, dist) {
  c.boltT = 0;
  c.boltIn = boltInterval(c.scale);
  const vol = THREE.MathUtils.clamp(1 - dist / 2000, 0, 1) * (0.35 + 0.065 * c.scale);
  if (audioCtx && vol > 0.02) {
    // Sound lags the flash by the distance over the speed of sound — the reason
    // you count the seconds between them.
    setTimeout(() => playThunder(vol, dist), Math.min(dist, 2400) / 340 * 1000);
  }
}

// ----- rain -----
// Drops fill a column that rides with the camera in world space: their fall
// (straight down, in world Y, wrapped modulo RAIN_H as they pass the player)
// never depends on which way the camera is looking, so a drop is exactly as
// present when you look straight down as when you look at the horizon.
//
// Each drop is a screen-aligned quad — stretched along the camera's own up
// vector rather than a fixed world-space "streak" direction — so it is never
// foreshortened away. A quad built from a fixed world-space length axis goes
// edge-on and all but disappears the moment the view direction lines up with
// that axis, which is exactly what happened looking straight down at rain
// falling straight down. Billboarding fully off the camera (right *and* up)
// keeps the streak's full width and length on screen from every angle.
const RAIN_N     = isTouchDevice ? 3000 : 7000;
const RAIN_R     = 50;
const RAIN_H     = 50;
const RAIN_LEN   = 4.2;
const RAIN_WIDTH = 0.09;

const rainMat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  uniforms: {
    uTime:      { value: 0 },
    uCam:       { value: new THREE.Vector3() },
    uCamRight:  { value: new THREE.Vector3(1, 0, 0) },
    uCamUp:     { value: new THREE.Vector3(0, 1, 0) },
    uIntensity: { value: 0 },
    uCol:       { value: new THREE.Color(0xf0f6fb) },
  },
  vertexShader: /* glsl */`
    attribute vec2 aCorner;   // x: -1/+1 across the streak's width, y: 0 at the head, 1 at the wind-drawn tail
    uniform float uTime;
    uniform vec3 uCam;
    uniform vec3 uCamRight;
    uniform vec3 uCamUp;
    varying float vA;
    void main() {
      vec3 p = position;
      // Per-drop fall speed, hashed off its own position so it stays put.
      float j = fract(sin(p.x * 12.9898 + p.z * 78.233) * 43758.5453);
      // Straight-down fall in world space, entirely independent of the camera.
      float y = mod(p.y - uTime * 26.0 * (0.8 + 0.5 * j), ${RAIN_H.toFixed(1)});
      vec3 w = uCam + vec3(p.x, y - ${(RAIN_H * 0.55).toFixed(2)}, p.z);
      w += aCorner.y * vec3(1.6, 0.0, 0.9) * 0.5;                 // gentle wind slant on the tail
      w += uCamUp * -aCorner.y * ${RAIN_LEN.toFixed(2)};          // billboarded length: never edge-on
      w += uCamRight * aCorner.x * ${RAIN_WIDTH.toFixed(3)};      // billboarded width
      vA = 1.0 - aCorner.y * 0.5;
      gl_Position = projectionMatrix * viewMatrix * vec4(w, 1.0);
    }
  `,
  fragmentShader: /* glsl */`
    uniform float uIntensity;
    uniform vec3 uCol;
    varying float vA;
    void main() { gl_FragColor = vec4(uCol, vA * 0.72 * uIntensity); }
  `,
});

const rainObj = (() => {
  const pos = new Float32Array(RAIN_N * 4 * 3);
  const corner = new Float32Array(RAIN_N * 4 * 2);
  const idx = new Uint32Array(RAIN_N * 6);
  for (let i = 0; i < RAIN_N; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = Math.sqrt(Math.random()) * RAIN_R;
    const x = Math.cos(a) * r, z = Math.sin(a) * r, y = Math.random() * RAIN_H;
    const corners = [[-1, 0], [1, 0], [-1, 1], [1, 1]];
    for (let v = 0; v < 4; v++) {
      const o = (i * 4 + v) * 3;
      pos[o] = x; pos[o + 1] = y; pos[o + 2] = z;
      corner[(i * 4 + v) * 2] = corners[v][0];
      corner[(i * 4 + v) * 2 + 1] = corners[v][1];
    }
    const base = i * 4, o6 = i * 6;
    idx[o6] = base; idx[o6 + 1] = base + 1; idx[o6 + 2] = base + 2;
    idx[o6 + 3] = base + 2; idx[o6 + 4] = base + 1; idx[o6 + 5] = base + 3;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aCorner', new THREE.BufferAttribute(corner, 2));
  geo.setIndex(new THREE.BufferAttribute(idx, 1));
  const o = new THREE.Mesh(geo, rainMat);
  o.frustumCulled = false;      // it is always around the camera by construction
  o.visible = false;
  scene.add(o);
  return o;
})();

// ----- overcast palettes -----
const FOG_BASE  = new THREE.Color(FOG_COLOR);
const GLOOM_FOG = new THREE.Color(0x8a97a6);
const GLOOM_Z   = new THREE.Color(0x2c3a4c);
const GLOOM_H   = new THREE.Color(0x8b98a6);
const clamp01 = (t) => (t < 0 ? 0 : t > 1 ? 1 : t);
const shadowList = [];      // scratch, refilled every frame

function updateWeather(dt) {
  wxTime += dt;
  wxFocus.copy(camera.position);

  // --- spawn ---
  const interval = WX.RATES[WX.rateIdx][1];
  if (interval > 0) {
    spawnTimer += dt;
    while (spawnTimer >= interval && clouds.length < MAX_CLOUDS) {
      spawnTimer -= interval;
      spawnCloud(false);
    }
    if (clouds.length >= MAX_CLOUDS) spawnTimer = Math.min(spawnTimer, interval);
  } else {
    spawnTimer = 0;
  }

  // --- drift, cull, and collect what the rest of the scene needs to know ---
  const speed = WX.SPEEDS[WX.speedIdx][1];
  let cover = 0, rainWant = 0, flashGlobal = 0;
  shadowList.length = 0;

  for (let i = clouds.length - 1; i >= 0; i--) {
    const c = clouds[i];
    const p = c.mesh.position;
    p.x += c.dirX * speed * c.spdMul * dt;
    p.z += c.dirZ * speed * c.spdMul * dt;

    const dx = p.x - wxFocus.x, dz = p.z - wxFocus.z;
    const dist = Math.hypot(dx, dz);
    if (dist > CLOUD_DESPAWN) {
      cloudGroup.remove(c.mesh);
      cloudDepthGroup.remove(c.depthMesh);
      c.mat.dispose();
      clouds.splice(i, 1);
      continue;
    }

    // How much of this cloud is directly over the camera: 1 well inside it,
    // tapering to 0 a little past its edge.
    const over = 1 - clamp01((dist - c.radius * 0.35) / (c.radius * 0.8));
    cover = Math.max(cover, over * clamp01(0.30 + 0.075 * c.scale));
    // Scale 4-5 spits, 6-7 is heavy, 8-10 is a downpour. Only if we are actually
    // underneath it rather than flying above the cloud deck.
    if (c.scale >= 4 && wxFocus.y < c.baseY - 6) {
      rainWant = Math.max(rainWant, over * Math.min(1, (c.scale - 3) / 5));
    }

    // --- lightning ---
    if (c.scale >= 6) {
      if (c.boltT >= 0) {
        c.boltT += dt;
        if (c.boltT > 0.5) c.boltT = -1;
      } else {
        c.boltIn -= dt;
        if (c.boltIn <= 0) strike(c, dist);
      }
    }
    const flash = c.boltT >= 0 ? boltEnv(c.boltT) : 0;
    c.mat.uniforms.uFlash.value = flash;
    flashGlobal = Math.max(flashGlobal, flash * (1 - clamp01((dist - 250) / 1300)));

    shadowList.push(c);
  }

  // --- hand the ground shaders the biggest, nearest footprints ---
  // The shadow lands well downwind of the cloud that casts it: two hundred
  // metres of altitude times the tangent of the sun's angle from vertical.
  for (const c of shadowList) {
    c.shX = c.mesh.position.x - CLOUD_SHADOW_SLANT.x * c.baseY;
    c.shZ = c.mesh.position.z - CLOUD_SHADOW_SLANT.y * c.baseY;
    c.shKey = Math.hypot(c.shX - wxFocus.x, c.shZ - wxFocus.z) - c.radius;
  }
  shadowList.sort((a, b) => a.shKey - b.shKey);
  cloudShadowArr.fill(0);
  const nSh = Math.min(MAX_CLOUD_SHADOWS, shadowList.length);
  for (let i = 0; i < nSh; i++) {
    const c = shadowList[i];
    const o = i * 4;
    cloudShadowArr[o]     = c.shX;
    cloudShadowArr[o + 1] = c.shZ;
    cloudShadowArr[o + 2] = c.radius * 1.10;
    // Quadratic in scale rather than linear: a wisp at scale 1 still lays down
    // a shadow you can watch cross the deck, but a scale-10 storm cell has to
    // black the ground out under it, so the top of the range needs to pull away
    // from the bottom much faster than a straight line does. Saturates around
    // scale 8 — past that the cell is simply opaque.
    cloudShadowArr[o + 3] = THREE.MathUtils.clamp(0.45 + 0.12 * c.scale + 0.04 * c.scale * c.scale, 0, 1);
  }

  // --- the sky reacting to what is in it ---
  gloom += (cover - gloom) * (1 - Math.exp(-1.2 * dt));
  sun.intensity        = SUN_BASE  * (1 - 0.60 * gloom);
  hemiLight.intensity  = HEMI_BASE * (1 - 0.30 * gloom) + 0.55 * flashGlobal;
  ambLight.intensity   = AMB_BASE  * (1 - 0.25 * gloom) + 1.9 * flashGlobal;

  const g = gloom * 0.8;
  skyMat.uniforms.uZenith.value.copy(SKY_ZENITH).lerp(GLOOM_Z, g);
  skyMat.uniforms.uHorizon.value.copy(SKY_HORIZON).lerp(GLOOM_H, g);
  if (!underwater) {
    scene.fog.color.copy(FOG_BASE).lerp(GLOOM_FOG, gloom * 0.75);
  }

  // --- rain ---
  rainAmt += (rainWant - rainAmt) * (1 - Math.exp(-0.9 * dt));
  rainObj.visible = rainAmt > 0.02 && !underwater;
  if (rainObj.visible) {
    rainMat.uniforms.uTime.value = wxTime;
    rainMat.uniforms.uCam.value.copy(camera.position);
    // Columns 0 and 1 of the camera's world matrix are its right and up
    // vectors — billboarding the streak quads off both keeps them fully
    // screen-facing (and therefore visible) from any camera angle.
    rainMat.uniforms.uCamRight.value.setFromMatrixColumn(camera.matrixWorld, 0);
    rainMat.uniforms.uCamUp.value.setFromMatrixColumn(camera.matrixWorld, 1);
    // A gentle floor keeps even a light drizzle legible instead of fading to a
    // near-invisible haze, while heavier cells still read as visibly heavier.
    rainMat.uniforms.uIntensity.value = 0.35 + 0.65 * rainAmt;
  }
}

// ----- weather HUD -----
const wxRateBtn      = document.getElementById('wx-rate');
const wxSpeedBtn     = document.getElementById('wx-speed');
const wxCountEl      = document.getElementById('wx-count');
const wxCloudInfoEl  = document.getElementById('wx-cloud-info');

function refreshWxUI() {
  wxRateBtn.textContent  = WX.RATES[WX.rateIdx][0];
  wxRateBtn.classList.toggle('off', WX.rateIdx === 0);
  wxSpeedBtn.textContent = WX.SPEEDS[WX.speedIdx][0];
  wxCountEl.textContent  = String(clouds.length);
}
const cycleRate  = () => { WX.rateIdx  = (WX.rateIdx  + 1) % WX.RATES.length;  refreshWxUI(); };
const cycleSpeed = () => { WX.speedIdx = (WX.speedIdx + 1) % WX.SPEEDS.length; refreshWxUI(); };

bindTap(wxRateBtn,  cycleRate);
bindTap(wxSpeedBtn, cycleSpeed);
refreshWxUI();

// Seed the sky before the first frame so there is weather to look at on arrival.
wxFocus.copy(camera.position);
for (let i = 0; i < (isTouchDevice ? 7 : 11); i++) spawnCloud(true);
refreshWxUI();

// ---------------------------------------------------------------------------
// Character controller — a cannon-es body whose velocity is driven by input
// rather than by forces, so the movement stays crisp and predictable.
// ---------------------------------------------------------------------------
const playerBody = new CANNON.Body({
  // Heavier than the crates on purpose. The controller sets velocity directly so
  // mass never affects how the character itself moves — it only decides how much
  // authority the body has in contact impulses, i.e. whether walking into a crate
  // shoves it or stalls against it.
  mass: 6,
  material: physPlayer,
  fixedRotation: true,
  linearDamping: 0,
  angularDamping: 1,
  allowSleep: false,
});
let crouched = false;
let swimming = false;

function setPlayerShape(crouch) {
  while (playerBody.shapes.length) playerBody.removeShape(playerBody.shapes[0]);
  const r = PLAYER.radius;
  if (crouch) {
    playerBody.addShape(new CANNON.Sphere(r));                            // 0.8 tall
  } else {
    // Three stacked spheres stand in for a 1.6-tall capsule (cannon has no
    // capsule primitive). Rounded feet ride over kerbs and up ramps without a
    // dedicated step-up hack.
    playerBody.addShape(new CANNON.Sphere(r), new CANNON.Vec3(0, -0.4, 0));
    playerBody.addShape(new CANNON.Sphere(r), new CANNON.Vec3(0,  0.0, 0));
    playerBody.addShape(new CANNON.Sphere(r), new CANNON.Vec3(0,  0.4, 0));
  }
  playerBody.updateBoundingRadius();
  playerBody.updateMassProperties();   // honours fixedRotation, keeps mass = 1
}
setPlayerShape(false);
playerBody.position.set(SPAWN.x, SPAWN.y, SPAWN.z);
playerBody.updateAABB();
world.addBody(playerBody);

// Visible body — hidden in first person, shown everywhere else.
const playerGeoStand  = new THREE.CapsuleGeometry(PLAYER.radius, 0.8, 6, 18);
const playerGeoCrouch = new THREE.CapsuleGeometry(PLAYER.radius, 0.0, 6, 18);
const playerMesh = new THREE.Mesh(
  playerGeoStand,
  mat(0x63b9ff, 0.42, 0.28, { emissive: 0x0d2c4a, emissiveIntensity: 0.55 })
);
playerMesh.castShadow = true;
playerMesh.receiveShadow = true;
const visor = new THREE.Mesh(
  new THREE.BoxGeometry(0.34, 0.12, 0.14),
  mat(0xffe6a8, 0.3, 0.1, { emissive: 0x6a4a10, emissiveIntensity: 0.9 })
);
visor.position.set(0, 0.42, -0.34);
playerMesh.add(visor);
scene.add(playerMesh);

// Steepest-upward contact normal touching the player, refreshed every substep.
// A contact whose normal is within maxSlope of straight up is walkable ground.
let groundNy = 0;
world.addEventListener('postStep', () => {
  let best = 0;
  for (const c of world.contacts) {
    let ny;
    if (c.bi === playerBody) ny = -c.ni.y;        // ni runs from bi to bj
    else if (c.bj === playerBody) ny = c.ni.y;
    else continue;
    if (ny > best) best = ny;
  }
  groundNy = best;
});

let coyote = 0;                       // grace period for late jump presses
let jumpLock = 0;                     // contacts survive a step after take-off
let eyeH = PLAYER.standEye;           // smoothed, so crouching ducks the view
let playerYaw = SPAWN_YAW * DEG;
const wishDir = new THREE.Vector3();

const centerOffset = () => (crouched ? PLAYER.crouchCenter : PLAYER.standCenter);

// Is there room to stand back up, or are we under the crouch tunnel?
function hasHeadroom() {
  const p = playerBody.position;
  const from = new CANNON.Vec3(p.x, p.y, p.z);
  const to   = new CANNON.Vec3(p.x, p.y + 1.35, p.z);
  let blocked = false;
  world.raycastAll(from, to, {}, (res) => { if (res.body !== playerBody) blocked = true; });
  return !blocked;
}

function respawn() {
  playerBody.position.set(SPAWN.x, SPAWN.y, SPAWN.z);
  playerBody.velocity.setZero();
  playerBody.wakeUp();
  state.yaw = SPAWN_YAW * DEG;
  state.pitch = 0;
}

function updatePlayer(dt) {
  const p = playerBody.position, v = playerBody.velocity;

  // --- how much of the body is under the pool surface (0 = dry, 1 = under) ---
  const bodyH = crouched ? PLAYER.crouchEye : PLAYER.standEye;
  const submerged = inWaterColumn(p.x, p.z)
    ? THREE.MathUtils.clamp((WATER.surfaceY - (p.y - centerOffset())) / bodyH, 0, 1)
    : 0;
  // Hysteresis: bobbing across a single threshold would flip between swimming and
  // walking once a frame, and every walking frame would drop the player.
  swimming = submerged > (swimming ? WATER.swimOut : WATER.swimIn);

  // --- crouch: held on desktop, latched on touch (in water C swims down) ---
  const wantCrouch = (keys.has('KeyC') || state.crouchBtn) && !swimming;
  if (wantCrouch && !crouched) {
    setPlayerShape(true);
    p.y -= PLAYER.standCenter - PLAYER.crouchCenter;   // keep the feet planted
    crouched = true;
  } else if (!wantCrouch && crouched && hasHeadroom()) {
    setPlayerShape(false);
    p.y += PLAYER.standCenter - PLAYER.crouchCenter;
    crouched = false;
  }

  jumpLock = Math.max(0, jumpLock - dt);
  const grounded = groundNy > GROUND_DOT && jumpLock === 0;
  const onSteep  = !grounded && groundNy > 0.05 && groundNy <= GROUND_DOT;
  coyote = grounded ? PLAYER.coyote : Math.max(0, coyote - dt);

  // --- wish direction ---
  const sy = Math.sin(state.yaw), cy = Math.cos(state.yaw);
  let wishY = 0;
  wishDir.set(0, 0, 0);
  if (camMode === CAM.TOP) {
    // Top-down drives the world axes directly — the camera has no heading to be
    // relative to, so W is north rather than "forward".
    if (keys.has('KeyW') || keys.has('ArrowUp'))    wishDir.z -= 1;
    if (keys.has('KeyS') || keys.has('ArrowDown'))  wishDir.z += 1;
    if (keys.has('KeyA') || keys.has('ArrowLeft'))  wishDir.x -= 1;
    if (keys.has('KeyD') || keys.has('ArrowRight')) wishDir.x += 1;
    wishDir.x += state.joyX;
    wishDir.z += state.joyY;
  } else {
    let fwd = 0, str = 0;
    if (keys.has('KeyW') || keys.has('ArrowUp'))    fwd += 1;
    if (keys.has('KeyS') || keys.has('ArrowDown'))  fwd -= 1;   // backpedal
    if (keys.has('KeyD') || keys.has('ArrowRight')) str += 1;
    if (keys.has('KeyA') || keys.has('ArrowLeft'))  str -= 1;
    fwd -= state.joyY;                                          // stick up = forward
    str += state.joyX;
    // Swimming steers with the camera pitch as well, so you dive where you look.
    const cp = swimming ? Math.cos(state.pitch) : 1;
    wishDir.set(-sy * fwd * cp + cy * str, 0, -cy * fwd * cp - sy * str);
    if (swimming) {
      if (keys.has('Space') || state.jumpHeld)     wishY += 1;
      if (keys.has('KeyC')  || state.crouchBtn)    wishY -= 1;
      wishDir.y = Math.sin(state.pitch) * fwd + wishY;
    }
  }
  const wl = wishDir.length();
  if (wl > 1) wishDir.divideScalar(wl);

  // Wading drags on you, and past the swim threshold it hands over to the (much
  // slower) swim speed at roughly the same value, so the change of gait is smooth.
  const wade = 1 - 0.42 * Math.min(1, submerged / WATER.swimIn);
  const speed = swimming
    ? PLAYER.walk * WATER.speedMult
    : (crouched ? PLAYER.crouchSpeed : PLAYER.walk * (isSprinting() ? PLAYER.sprintMult : 1)) * wade;

  // Sprint drives forward and strafe only: whatever part of the target velocity
  // points behind the camera is trimmed back to the walk speed, so you can back
  // up but never backpedal at a sprint. Top-down has no camera heading to be
  // behind, so it keeps driving the world axes as before.
  let tx = wishDir.x * speed, tz = wishDir.z * speed;
  if (camMode !== CAM.TOP) {
    const backCap = Math.min(speed, PLAYER.walk * (swimming ? 1 : wade));
    const along = tx * -sy + tz * -cy;      // + ahead of the camera, - behind it
    if (along < -backCap) {
      const over = along + backCap;         // negative — the excess to take out
      tx += sy * over;                      // i.e. t -= over * forward
      tz += cy * over;
    }
  }

  if (swimming) {
    // No ground to push off, so all three axes are driven the same way and the
    // lerp itself provides the drag.
    const k = 1 - Math.exp(-WATER.accel * dt);
    v.x += (tx - v.x) * k;
    v.z += (tz - v.z) * k;
    v.y += (wishDir.y * speed - v.y) * k;
    // Buoyancy: hand back most of the gravity the solver is about to apply.
    v.y += 9.82 * (1 - WATER.gravityScale) * dt;
    // Left alone near the top you settle at the surface and ride the swell. A
    // deliberate dive gives way — but a couple of degrees of look-down does not,
    // or you would sink every time you swam along the surface off the level.
    if (Math.abs(wishDir.y) < 0.25) {
      const bob = Math.sin(elapsed * 1.9) * 0.055 + Math.sin(elapsed * 1.07 + 2.1) * 0.035;
      const rest = WATER.surfaceY + bob - bodyH * 0.85 + centerOffset();
      const d = rest - p.y;
      if (Math.abs(d) < 1.4) {
        v.y += (THREE.MathUtils.clamp(d * 3.2, -1.2, 1.2) - v.y) * (1 - Math.exp(-6 * dt));
      }
    }
    playerBody.wakeUp();
  } else if (grounded) {
    const k = 1 - Math.exp(-PLAYER.groundAccel * dt);
    v.x += (tx - v.x) * k;
    v.z += (tz - v.z) * k;
  } else if (!onSteep) {
    // Reduced authority in the air; never scrubs speed you already carried, so a
    // sprint jump keeps its momentum even if shift is released mid-flight.
    const hs0 = Math.hypot(v.x, v.z);
    v.x += wishDir.x * PLAYER.airAccel * dt;
    v.z += wishDir.z * PLAYER.airAccel * dt;
    const hs = Math.hypot(v.x, v.z);
    const cap = Math.max(hs0, Math.hypot(tx, tz));
    if (hs > cap) { v.x = v.x / hs * cap; v.z = v.z / hs * cap; }
  }
  // Steeper than maxSlope: no input authority at all. Player/level friction is
  // zero, so gravity simply slides you back down — that is the red 55-degree lane.

  // --- jump (in water Space is the swim-up key instead) ---
  if ((state.jumpQueued || keys.has('Space')) && coyote > 0 && !crouched && !swimming) {
    v.y = PLAYER.jumpSpeed;
    coyote = 0;
    groundNy = 0;
    jumpLock = 0.15;
    playerBody.wakeUp();
  }
  state.jumpQueued = false;

  if (p.y < -25) respawn();

  // --- derived view state ---
  const targetEye = crouched ? PLAYER.crouchEye : PLAYER.standEye;
  eyeH += (targetEye - eyeH) * (1 - Math.exp(-14 * dt));

  if (camMode === CAM.TOP) {
    if (Math.hypot(v.x, v.z) > 0.4) playerYaw = Math.atan2(-v.x, -v.z);
  } else {
    playerYaw = state.yaw;
  }

  // In top-down the fly pad and E/Q become zoom controls.
  if (camMode === CAM.TOP) {
    const out = state.flyUp   || keys.has('KeyE');
    const inn = state.flyDown || keys.has('KeyQ');
    if (out) topZoom = Math.min(90, topZoom + 22 * dt);
    if (inn) topZoom = Math.max(8, topZoom - 22 * dt);
  }
}

// ---------------------------------------------------------------------------
// Camera modes
// ---------------------------------------------------------------------------
const CAM = { FIRST: 0, THIRD: 1, TOP: 2, FREE: 3 };
const CAM_NAMES = ['First Person', 'Third Person', 'Top Down', 'Free Camera'];
let camMode = CAM.FREE;               // start exactly as the old build did
let lastGameCam = CAM.FIRST;
let topZoom = 26;
let blendT = 1;                        // 1 = settled, <1 = mid transition
const BLEND_DUR = 0.42;
const blendPos = new THREE.Vector3();
const blendQuat = new THREE.Quaternion();

function setCamMode(next) {
  if (next === camMode) return;
  let snap = false;

  if (next === CAM.FREE) {
    lastGameCam = camMode;
    // Hand the flying camera the transform we are already looking through so
    // detaching from physics is seamless; yaw/pitch are shared already.
    state.pos.copy(camera.position);
  } else if (camMode === CAM.FREE) {
    snap = true;                       // re-attaching jumps straight to the body
    playerBody.wakeUp();
  }

  camMode = next;
  if (snap) {
    blendT = 1;
  } else {
    blendPos.copy(camera.position);
    blendQuat.copy(camera.quaternion);
    blendT = 0;
  }
  refreshModeUI();
}
function cycleCamera()   { setCamMode((camMode + 1) % 4); }
function toggleGameMode() { setCamMode(camMode === CAM.FREE ? lastGameCam : CAM.FREE); }

const desiredPos  = new THREE.Vector3();
const desiredQuat = new THREE.Quaternion();
const camEuler    = new THREE.Euler(0, 0, 0, 'YXZ');
const camTarget   = new THREE.Vector3();
const camBack     = new THREE.Vector3();
const boomRay     = new THREE.Raycaster();

function updateCamera(dt) {
  const p = playerBody.position;
  const feetY = p.y - centerOffset();

  if (camMode === CAM.FREE) {
    desiredPos.copy(state.pos);
    camEuler.set(state.pitch, state.yaw, 0);
  } else if (camMode === CAM.TOP) {
    desiredPos.set(p.x, feetY + topZoom, p.z);
    camEuler.set(-Math.PI / 2, 0, 0);
  } else {
    camEuler.set(state.pitch, state.yaw, 0);
    if (camMode === CAM.FIRST) {
      desiredPos.set(p.x, feetY + eyeH, p.z);
    } else {
      camTarget.set(p.x, feetY + eyeH * 0.86, p.z);
      camBack.set(0, 0, 1).applyEuler(camEuler);      // straight back along view
      let dist = THIRD_DIST;
      boomRay.set(camTarget, camBack);
      boomRay.far = dist + 0.5;
      const hit = boomRay.intersectObjects(objects.children, false)[0];
      if (hit) dist = Math.max(1.1, hit.distance - 0.35);   // pull in past props
      desiredPos.copy(camTarget).addScaledVector(camBack, dist);
    }
    // The boom ray only knows about the props, so the ground is handled
    // separately: never let the boom drop the camera through the deck. Off the
    // platform the floor is the sea bed, which lets the boom dip underwater when
    // you swim away from it. (Top-down needs no such guard — it sits straight
    // above the player, and flat ground has nothing overhead.)
    const floorY = groundHeightAt(desiredPos.x, desiredPos.z) + 0.6;
    if (desiredPos.y < floorY) desiredPos.y = floorY;
  }
  desiredQuat.setFromEuler(camEuler);

  if (blendT < 1) {
    blendT = Math.min(1, blendT + dt / BLEND_DUR);
    const s = blendT * blendT * (3 - 2 * blendT);       // smoothstep
    camera.position.lerpVectors(blendPos, desiredPos, s);
    camera.quaternion.slerpQuaternions(blendQuat, desiredQuat, s);
  } else {
    camera.position.copy(desiredPos);
    camera.quaternion.copy(desiredQuat);
  }

  playerMesh.visible = camMode !== CAM.FIRST;
  playerMesh.geometry = crouched ? playerGeoCrouch : playerGeoStand;
  visor.position.y = crouched ? 0.10 : 0.42;
  playerMesh.position.set(p.x, p.y, p.z);
  playerMesh.rotation.y = playerYaw;
}

window.addEventListener('wheel', (e) => {
  if (camMode !== CAM.TOP) return;
  topZoom = THREE.MathUtils.clamp(topZoom + e.deltaY * 0.03, 8, 90);
  e.preventDefault();
}, { passive: false });

// ---------------------------------------------------------------------------
// The shovel — a temporary tool for picking blocks up and putting them down.
//
// The one rule it enforces is conservation: a block leaves the world only by
// going into your hands and re-enters it only by coming back out of them, so
// `worldBlocks + shovel.held.length` is the same number it was at load, forever.
// That is why the two halves are not symmetrical in the code below — the pick-up
// checks that there is really something there before it pushes, and the place
// checks that the write will really land before it pops. Neither one can leak.
//
// Each block carries its material with it, so a rock you take out of a cliff
// goes back down as rock wherever you put it.
//
// It is meant to be temporary: it edits the store, patches the collider column
// under the block and redraws the mesh chunk around it, and that is the whole of
// it. There is no undo, nothing is saved, and the heightfield collider can only
// follow the *top* of each column — dig sideways into a cliff and you will walk
// through the overhang you left above you.
// ---------------------------------------------------------------------------
const SHOVEL_REACH = 6.0;      // metres of reach from the eye
const SHOVEL_CAP   = 64;       // blocks your hands hold
const MAT_NAMES = ['sand', 'dirt', 'rock'];

const shovel = {
  on: false,
  held: [],       // materials, last in first out — you put back what you just took
  hit: null,      // {i, j, lvl} the block being looked at, or null
  spot: null,     // {i, j, lvl} the empty cell a placed block would go into
};

// ----- the ray -----
// Amanatides & Woo over the column grid. It reports the first solid cell along
// the ray *and* the last empty one before it, which are exactly the two cells a
// pick-up and a place need — a face you can see is a block to take and a gap in
// front of it to fill.
const ddaHit  = { i: 0, j: 0, lvl: 0 };
const ddaPrev = { i: 0, j: 0, lvl: 0 };
function voxelRay(ox, oy, oz, dx, dy, dz, reach) {
  // One grid unit per block, so the DDA is the textbook unit-cell one and the
  // direction carries over unchanged (the scaling is uniform).
  const gx = (ox + GEN_R) / BLOCK, gy = oy / BLOCK, gz = (oz + GEN_R) / BLOCK;
  let i = Math.floor(gx), lvl = Math.floor(gy), j = Math.floor(gz);
  const si = dx > 0 ? 1 : -1, sl = dy > 0 ? 1 : -1, sj = dz > 0 ? 1 : -1;
  const tdI = dx !== 0 ? Math.abs(1 / dx) : Infinity;
  const tdL = dy !== 0 ? Math.abs(1 / dy) : Infinity;
  const tdJ = dz !== 0 ? Math.abs(1 / dz) : Infinity;
  let tI = dx !== 0 ? (dx > 0 ? i + 1 - gx : gx - i) * tdI : Infinity;
  let tL = dy !== 0 ? (dy > 0 ? lvl + 1 - gy : gy - lvl) * tdL : Infinity;
  let tJ = dz !== 0 ? (dz > 0 ? j + 1 - gz : gz - j) * tdJ : Infinity;
  const tMax = reach / BLOCK;

  let pi = i, pj = j, pl = lvl, t = 0;
  for (let step = 0; step < 256; step++) {
    if (voxelAt(i, j, lvl) !== AIR) {
      ddaHit.i = i;   ddaHit.j = j;   ddaHit.lvl = lvl;
      ddaPrev.i = pi; ddaPrev.j = pj; ddaPrev.lvl = pl;
      return true;
    }
    pi = i; pj = j; pl = lvl;
    if (tI <= tL && tI <= tJ)  { t = tI; i   += si; tI += tdI; }
    else if (tL <= tJ)         { t = tL; lvl += sl; tL += tdL; }
    else                       { t = tJ; j   += sj; tJ += tdJ; }
    if (t > tMax) return false;
  }
  return false;
}

// Would a block at this cell be inside the player? Placing one there would leave
// them stuck in the ground, so the tool refuses.
function spotBlocked(i, j, lvl) {
  if (camMode === CAM.FREE) return false;          // nobody is standing anywhere
  const p = playerBody.position;
  const r = PLAYER.radius, half = centerOffset();
  const x0 = -GEN_R + i * BLOCK, z0 = -GEN_R + j * BLOCK, y0 = lvl * BLOCK;
  return p.x + r > x0 && p.x - r < x0 + BLOCK
      && p.z + r > z0 && p.z - r < z0 + BLOCK
      && p.y + half > y0 && p.y - half < y0 + BLOCK;
}

const aimDir = new THREE.Vector3();

// Refresh what the tool is pointing at. Runs every frame while the shovel is out
// so the highlight boxes and the two buttons are always telling the truth.
function shovelAim() {
  shovel.hit = null;
  shovel.spot = null;
  if (!shovel.on) return;

  camera.getWorldDirection(aimDir);
  let ox, oy, oz;
  if (camMode === CAM.FREE) {
    ox = camera.position.x; oy = camera.position.y; oz = camera.position.z;
  } else {
    // From the player's eye, not the camera: in third person the camera is five
    // metres behind their head and would reach through the hill they stand on.
    const p = playerBody.position;
    ox = p.x; oy = p.y - centerOffset() + eyeH; oz = p.z;
  }

  if (voxelRay(ox, oy, oz, aimDir.x, aimDir.y, aimDir.z, SHOVEL_REACH)) {
    shovel.hit = { i: ddaHit.i, j: ddaHit.j, lvl: ddaHit.lvl };
    shovel.spot = { i: ddaPrev.i, j: ddaPrev.j, lvl: ddaPrev.lvl };
  } else if (camMode !== CAM.FREE) {
    // Nothing under the crosshair. Fall back to what you are standing on, and to
    // the ground a stride ahead of you for the other half — looking at the sky
    // should not make the tool useless.
    const p = playerBody.position;
    const i = colI(p.x), j = colJ(p.z);
    const top = solidTopAt(i, j);
    if (top !== NO_COLUMN) shovel.hit = { i, j, lvl: top };
    const ai = colI(p.x - Math.sin(state.yaw) * 1.5);
    const aj = colJ(p.z - Math.cos(state.yaw) * 1.5);
    const atop = solidTopAt(ai, aj);
    if (atop !== NO_COLUMN) shovel.spot = { i: ai, j: aj, lvl: atop + 1 };
  }

  // A place has to land in a cell the store can actually hold a block in, that
  // is empty, and that the player is not standing in.
  const s = shovel.spot;
  if (s && (!inVoxelRange(s.i, s.j, s.lvl) || voxelAt(s.i, s.j, s.lvl) !== AIR
            || spotBlocked(s.i, s.j, s.lvl))) shovel.spot = null;
}

// ----- writing it back -----
// Chunks whose meshes no longer match the store. Flushed once per frame rather
// than per edit, so holding a button down does not rebuild the same chunk twice.
const dirtyChunks = new Set();

function editBlock(i, j, lvl, m) {
