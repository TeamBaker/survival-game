<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
<script>
// Cache-bust: if Safari serves a stale HTML, this forces a hard reload
(function(){
  var v = 9;
  var key = '__sv_game_v';
  try {
    var prev = parseInt(localStorage.getItem(key));
    if (prev && prev < v) {
      localStorage.setItem(key, v);
      location.replace(location.href.split('?')[0] + '?_=' + Date.now());
      return;
    }
    localStorage.setItem(key, v);
  } catch(e) {}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1220">
<title>Hermes 3D Engine — Web</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a56b8'/%3E%3Cpath d='M16 5l10 5.6v11L16 27 6 21.6v-11z' fill='none' stroke='%23cfe6ff' stroke-width='2.2' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    background: #0b1220;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    color: #e8eef7;
  }

  #view {
    display: block;
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  /* ---------- HUD ---------- */
  #hud {
    position: fixed;
    top: calc(10px + env(safe-area-inset-top));
    left: calc(10px + env(safe-area-inset-left));
    padding: 8px 11px;
    font-size: 13px;
    line-height: 1.5;
    letter-spacing: 0.02em;
    background: rgba(8, 14, 24, 0.5);
    border: 1px solid rgba(160, 200, 255, 0.16);
    border-radius: 8px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    pointer-events: none;
    white-space: pre;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
    z-index: 10;
  }
  #hud .k { color: #7fa8d8; }
  #hud .v { color: #eaf2ff; }

  #crosshair {
    position: fixed;
    left: 50%;
    top: 50%;
    width: 18px;
    height: 18px;
    margin: -9px 0 0 -9px;
    pointer-events: none;
    opacity: 0.55;
    z-index: 9;
  }
  #crosshair::before, #crosshair::after {
    content: "";
    position: absolute;
    background: #fff;
    box-shadow: 0 0 3px rgba(0, 0, 0, 0.9);
  }
  #crosshair::before { left: 50%; top: 0; width: 1.5px; height: 100%; margin-left: -0.75px; }
  #crosshair::after  { top: 50%; left: 0; height: 1.5px; width: 100%; margin-top: -0.75px; }
  body.touch #crosshair { opacity: 0.3; }

  #sprint {
    position: fixed;
    top: calc(12px + env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%) scale(0.9);
    padding: 5px 14px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.18em;
    border-radius: 999px;
    background: rgba(255, 168, 60, 0.18);
    border: 1px solid rgba(255, 190, 110, 0.55);
    color: #ffd7a0;
    opacity: 0;
    transition: opacity 0.12s ease, transform 0.12s ease;
    pointer-events: none;
    z-index: 10;
  }
  #sprint.on { opacity: 1; transform: translateX(-50%) scale(1); }

  /* Tint that fades in while the camera is under the water surface. */
  #underwater {
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.28s ease;
    background:
      radial-gradient(ellipse at 50% 45%, rgba(60, 170, 220, 0.10), rgba(6, 52, 84, 0.50) 76%),
      linear-gradient(180deg, rgba(70, 180, 230, 0.16), rgba(4, 34, 60, 0.40));
  }
  #underwater.on { opacity: 1; }

  /* On a narrow phone the centred pill would collide with the HUD panel. */
  @media (max-width: 620px) {
    #hud { font-size: 11px; padding: 6px 9px; }
    #sprint {
      top: auto;
      bottom: calc(26px + env(safe-area-inset-bottom));
    }
  }

  /* ---------- Touch controls ---------- */
  #touch-ui { display: none; }
  body.touch #touch-ui { display: block; }

  #stick-base {
    position: fixed;
    left: 28px;
    bottom: calc(34px + env(safe-area-inset-bottom));
    width: 132px;
    height: 132px;
    margin: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, rgba(120, 170, 230, 0.10), rgba(120, 170, 230, 0.03) 70%);
    border: 1.5px solid rgba(150, 195, 245, 0.28);
    opacity: 0.5;
    transition: opacity 0.15s ease;
    pointer-events: none;
    z-index: 8;
  }
  #stick-base.active { opacity: 0.95; transition: none; }

  #stick-knob {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 58px;
    height: 58px;
    margin: -29px 0 0 -29px;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 32%, rgba(235, 245, 255, 0.85), rgba(130, 175, 225, 0.5));
    border: 1.5px solid rgba(230, 242, 255, 0.7);
    box-shadow: 0 3px 12px rgba(0, 0, 0, 0.35);
  }

  .fly-btn {
    position: fixed;
    right: calc(26px + env(safe-area-inset-right));
    width: 76px;
    height: 76px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    line-height: 1;
    color: #dce9f8;
    background: rgba(20, 34, 54, 0.5);
    border: 1.5px solid rgba(150, 195, 245, 0.35);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    touch-action: none;
    z-index: 12;
  }
  .fly-btn.down { background: rgba(90, 160, 235, 0.55); border-color: rgba(220, 240, 255, 0.85); color: #fff; }
  #btn-up   { bottom: calc(130px + env(safe-area-inset-bottom)); }
  #btn-down { bottom: calc(40px + env(safe-area-inset-bottom)); }

  /* Fly/zoom pad only in free + top-down; action pad only in first/third. */
  #touch-ui .fly-btn { display: none; }
  #touch-ui .act-btn { display: none; }
  body.touch.pad-fly #touch-ui .fly-btn { display: flex; }
  body.touch.pad-act #touch-ui .act-btn { display: flex; }

  .act-btn {
    position: fixed;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    line-height: 1;
    color: #dce9f8;
    background: rgba(20, 34, 54, 0.5);
    border: 1.5px solid rgba(150, 195, 245, 0.35);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    touch-action: none;
    z-index: 12;
  }
  .act-btn .glyph { font-size: 20px; }
  .act-btn.down { background: rgba(90, 160, 235, 0.55); border-color: rgba(220, 240, 255, 0.85); color: #fff; }
  #btn-jump {
    right: calc(24px + env(safe-area-inset-right));
    bottom: calc(44px + env(safe-area-inset-bottom));
    width: 90px; height: 90px; font-size: 12px;
  }
  #btn-crouch {
    right: calc(124px + env(safe-area-inset-right));
    bottom: calc(40px + env(safe-area-inset-bottom));
    width: 72px; height: 72px;
  }
  #btn-sprint {
    right: calc(34px + env(safe-area-inset-right));
    bottom: calc(146px + env(safe-area-inset-bottom));
    width: 72px; height: 72px;
  }
  #btn-sprint.down { background: rgba(255, 168, 60, 0.5); border-color: rgba(255, 210, 150, 0.9); color: #fff; }

  /* ---------- Mode UI ---------- */
  #mode-btn {
    position: fixed;
    top: calc(10px + env(safe-area-inset-top));
    right: calc(10px + env(safe-area-inset-right));
    padding: 11px 18px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #06101f;
    background: linear-gradient(180deg, #cfe6ff, #7db4ee);
    border: none;
    border-radius: 999px;
    box-shadow: 0 4px 18px rgba(90, 150, 220, 0.35);
    cursor: pointer;
    touch-action: manipulation;
    /* Above the pause overlay (50): releasing the mouse pops that overlay up, and
       a mode button you cannot reach while paused is a mode button that "does not
       always work". */
    z-index: 60;
  }
  #mode-btn.game { background: linear-gradient(180deg, #ffd9a8, #f0a054); }
  #mode-btn:active { transform: translateY(1px); }

  #cam-mode {
    position: fixed;
    top: calc(62px + env(safe-area-inset-top));
    left: calc(10px + env(safe-area-inset-left));
    padding: 5px 10px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #9ecbff;
    background: rgba(8, 14, 24, 0.5);
    border: 1px solid rgba(160, 200, 255, 0.16);
    border-radius: 7px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    pointer-events: none;
    white-space: nowrap;
    z-index: 10;
  }

  #instructions {
    position: fixed;
    top: calc(58px + env(safe-area-inset-top));
    right: calc(10px + env(safe-area-inset-right));
    width: 216px;
    max-width: 46vw;
    padding: 9px 11px;
    font-size: 11px;
    line-height: 1.45;
    background: rgba(8, 14, 24, 0.5);
    border: 1px solid rgba(160, 200, 255, 0.16);
    border-radius: 8px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    pointer-events: none;
    z-index: 10;
  }
  #instructions .title {
    display: block;
    margin-bottom: 5px;
    font-size: 10px;
    letter-spacing: 0.16em;
    color: #6f92bd;
    text-transform: uppercase;
  }
  #instructions .row { display: flex; gap: 8px; justify-content: space-between; }
  #instructions b { color: #9ecbff; font-weight: 600; white-space: nowrap; }
  #instructions span { color: #b9c9dc; text-align: right; }

  @media (max-width: 620px) {
    #mode-btn { font-size: 11px; padding: 9px 14px; }
    #cam-mode { top: calc(52px + env(safe-area-inset-top)); font-size: 10px; }
    #instructions { width: 168px; font-size: 10px; padding: 7px 9px; top: calc(52px + env(safe-area-inset-top)); }
  }

  /* ---------- World stats / settings ---------- */
  /* The top-right corner already belongs to #mode-btn and #instructions, so the
     two toggles live under #cam-mode on the left and the panels they open hang
     off the same column. #panels is a flex column so stats and settings can
     both be open without landing on top of each other. */
  #panel-toggles {
    position: fixed;
    top: calc(94px + env(safe-area-inset-top));
    left: calc(10px + env(safe-area-inset-left));
    display: flex;
    gap: 8px;
    z-index: 55;
  }
  #panel-toggles button {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    font-family: inherit;
    font-size: 18px;
    line-height: 1;
    color: #e8eef7;
    background: rgba(8, 14, 24, 0.6);
    border: 1px solid rgba(160, 200, 255, 0.2);
    border-radius: 8px;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    cursor: pointer;
    touch-action: manipulation;
  }
  #panel-toggles button.on {
    background: rgba(90, 150, 220, 0.5);
    border-color: rgba(220, 240, 255, 0.7);
  }

  #panels {
    position: fixed;
    top: calc(142px + env(safe-area-inset-top));
    left: calc(10px + env(safe-area-inset-left));
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: calc(100dvh - 200px);
    overflow-y: auto;
    z-index: 50;
  }

  #stats-panel, #settings-panel {
    padding: 12px 16px;
    font-size: 13px;
    line-height: 1.6;
    background: rgba(8, 14, 24, 0.85);
    border: 1px solid rgba(160, 200, 255, 0.2);
    border-radius: 10px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    min-width: 232px;
  }
  #stats-panel .title, #settings-panel .title {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: #7fa8d8;
    margin-bottom: 8px;
  }
  .stat-row {
    display: flex;
    justify-content: space-between;
    gap: 16px;
  }
  .stat-row .k { color: #7fa8d8; }
  .stat-row .v { color: #eaf2ff; font-variant-numeric: tabular-nums; }

  .wx-row { margin-bottom: 9px; }
  .wx-row:last-child { margin-bottom: 0; }
  .wx-row .lbl {
    display: flex;
    justify-content: space-between;
    gap: 14px;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: #7fa8d8;
    margin-bottom: 3px;
  }
  .wx-row .val { color: #eaf2ff; font-variant-numeric: tabular-nums; }
  .wx-row input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    display: block;
    width: 100%;
    height: 4px;
    border-radius: 2px;
    background: rgba(160, 200, 255, 0.22);
    outline: none;
    touch-action: manipulation;
  }
  .wx-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: linear-gradient(180deg, #cfe6ff, #7db4ee);
    border: none;
    cursor: pointer;
  }
  .wx-row input[type="range"]::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #9ecbff;
    border: none;
    cursor: pointer;
  }

  @media (max-width: 620px) {
    #panel-toggles { top: calc(82px + env(safe-area-inset-top)); }
    #panels { top: calc(130px + env(safe-area-inset-top)); max-height: calc(100dvh - 190px); }
    #stats-panel, #settings-panel { font-size: 12px; min-width: 200px; }
  }

  /* ---------- Start / pause overlay ---------- */
  #overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding: 28px;
    text-align: center;
    background: radial-gradient(ellipse at 50% 40%, rgba(24, 44, 78, 0.82), rgba(6, 10, 18, 0.94));
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
  }
  #overlay.hidden { display: none; }

  #overlay h1 {
    font-size: clamp(22px, 6vw, 36px);
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    background: linear-gradient(180deg, #ffffff, #8fc0f0);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  #overlay .sub {
    font-size: 12px;
    letter-spacing: 0.24em;
    color: #6f92bd;
    text-transform: uppercase;
    margin-top: -14px;
  }

  #keys {
    display: grid;
    grid-template-columns: auto auto;
    gap: 7px 18px;
    font-size: 13px;
    text-align: left;
    padding: 18px 22px;
    border-radius: 12px;
    background: rgba(10, 18, 32, 0.55);
    border: 1px solid rgba(140, 185, 240, 0.18);
    max-width: 100%;
  }
  #keys b { color: #9ecbff; font-weight: 600; white-space: nowrap; }
  #keys span { color: #b9c9dc; }

  #start-btn {
    padding: 14px 34px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #06101f;
    background: linear-gradient(180deg, #cfe6ff, #7db4ee);
    border: none;
    border-radius: 999px;
    box-shadow: 0 6px 24px rgba(90, 150, 220, 0.35);
    cursor: pointer;
    touch-action: manipulation;
  }
  #start-btn:active { transform: translateY(1px); }

  #loading {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0b1220;
    color: #7fa8d8;
    font-size: 13px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    z-index: 60;
  }
  #loading.hidden { display: none; }
  #err {
    padding: 24px;
    color: #ffb4b4;
    font-size: 13px;
    line-height: 1.6;
    white-space: pre-wrap;
    text-align: left;
  }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="hud"><span class="k">FPS</span> <span class="v" id="fps">--</span>
<span class="k">POS</span> <span class="v" id="pos">--</span></div>

<div id="cam-mode">Cam &mdash; Free</div>
<div id="instructions"></div>
<button id="mode-btn" class="ui-el">Game Mode</button>

<div id="panel-toggles">
  <button id="stats-toggle" class="ui-el" aria-label="World stats">&#128202;</button>
  <button id="settings-toggle" class="ui-el" aria-label="Settings">&#9881;&#65039;</button>
</div>

<div id="panels">
  <aside id="stats-panel" class="ui-el" style="display:none;">
    <span class="title">World Stats</span>
    <div class="stats-grid">
      <div class="stat-row"><span class="k">Direction N</span><span class="v" id="st-north">0&deg;</span></div>
      <div class="stat-row"><span class="k">Direction E</span><span class="v" id="st-east">90&deg;</span></div>
      <div class="stat-row"><span class="k">Direction S</span><span class="v" id="st-south">180&deg;</span></div>
      <div class="stat-row"><span class="k">Direction W</span><span class="v" id="st-west">270&deg;</span></div>
      <div class="stat-row"><span class="k">Time of Day</span><span class="v" id="st-time">09:00</span></div>
      <div class="stat-row"><span class="k">Climate</span><span class="v" id="st-climate">Tropical Marine</span></div>
      <div class="stat-row"><span class="k">Temperature</span><span class="v" id="st-temp">27.0&deg;C</span></div>
      <div class="stat-row"><span class="k">Wind Direction</span><span class="v" id="st-windir">270&deg; (W)</span></div>
      <div class="stat-row"><span class="k">Wind Speed</span><span class="v" id="st-winspd">5.0 m/s</span></div>
    </div>
  </aside>

  <aside id="settings-panel" class="ui-el" style="display:none;">
    <span class="title">Settings</span>
    <div class="wx-row">
      <label class="lbl" for="set-time">Time of Day<span class="val" id="set-time-v">09:00</span></label>
      <input type="range" id="set-time" min="0" max="23.98" step="0.01" value="9">
    </div>
    <div class="wx-row">
      <label class="lbl" for="set-windspd">Wind Speed<span class="val" id="set-windspd-v">5.0</span></label>
      <input type="range" id="set-windspd" min="0" max="30" step="0.5" value="5">
    </div>
    <div class="wx-row">
      <label class="lbl" for="set-winddir">Wind Direction<span class="val" id="set-winddir-v">270&deg;</span></label>
      <input type="range" id="set-winddir" min="0" max="360" step="1" value="270">
    </div>
    <div class="wx-row">
      <label class="lbl" for="set-tempoff">Temp Offset<span class="val" id="set-tempoff-v">0.0&deg;C</span></label>
      <input type="range" id="set-tempoff" min="-10" max="10" step="0.5" value="0">
    </div>
    <div class="wx-row">
      <label class="lbl" for="set-windplane">Wind Plane<span class="val" id="set-windplane-v">OFF</span></label>
      <input type="range" id="set-windplane" min="0" max="1" step="1" value="0">
    </div>
  </aside>
</div>

<div id="underwater"></div>
<div id="crosshair"></div>
<div id="sprint">SPRINT</div>

<div id="touch-ui">
  <div id="stick-base"><div id="stick-knob"></div></div>
  <div class="fly-btn" id="btn-up">&#9650;</div>
  <div class="fly-btn" id="btn-down">&#9660;</div>
  <div class="act-btn" id="btn-jump"><span class="glyph">&#8679;</span>JUMP</div>
  <div class="act-btn" id="btn-crouch"><span class="glyph">&#8681;</span>CROUCH</div>
  <div class="act-btn" id="btn-sprint"><span class="glyph">&#187;</span>SPRINT</div>
</div>

<div id="overlay">
  <div>
    <h1>Hermes 3D</h1>
  </div>
  <div class="sub">Engine &mdash; Web Edition</div>
  <div id="keys"></div>
  <button id="start-btn">Enter</button>
</div>

<div id="loading">Loading&hellip;</div>

<script src="lib/three.js?v=2"></script>
<script src="lib/cannon-global.js?v=2"></script>
<script type="module">
// THREE and CANNON are loaded as globals from the script tags above.

// ---------------------------------------------------------------------------
// Constants — mirrored from engine.py
// ---------------------------------------------------------------------------
const MOUSE_SENSITIVITY = 0.15;   // degrees of rotation per pixel of pointer motion
const MOVE_SPEED        = 14.0;   // world units / second
const SPRINT_MULT       = 3.0;
const TOUCH_LOOK_MULT   = 1.6;    // finger drags cover fewer pixels than a mouse
const START_POS         = new THREE.Vector3(0, 52, -168);

const FOG_COLOR   = 0xb8d1e8;
// Thinner than the old courtyard scene needed: the island is 200 units across

const WORLD = {
  // Fixed constants
  directions: { north: 0, east: 90, south: 180, west: 270 },
  climate: 'Tropical Marine',
  climateTemp: 27,      // base air temperature in degC for tropical marine

  // Dynamic

  windDir: 270,         // the trade wind: out of the west, blowing east

  lastTempUpdate: 0,    // `elapsed` at the last temperature roll
};

// Debug-only bias on top of the computed temperature (Settings panel).
const tempOffset = { value: 0 };

// 1 real second = 1 game minute, so a full day is 24 real minutes.
const HOURS_PER_SEC = 1 / 60;
const TEMP_INTERVAL = 30;     // reroll the temperature every 30 game minutes

const COMPASS = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
const compassOf = (deg) => COMPASS[Math.round(((deg % 360) + 360) % 360 / 45) % 8];

function computeTemperature() {
  const hour = WORLD.timeOfDay;
  // Sinusoidal daily swing. NOTE: a single 24-hour sinusoid puts its trough and
  // its peak exactly twelve hours apart, so "coolest 05:00 / warmest 14:00" is
  // not expressible as one; this is the spec's curve as written — zero and
  // rising at 05:00, peaking at 11:00, trough at 23:00.
  const dayPhase = Math.sin((hour - 5) / 24 * Math.PI * 2);
  const timeOffset = dayPhase * 4;              // +/-4 degC from the clock
  const noise = (Math.random() - 0.5) * 2;      // +/-1 degC of weather
  WORLD.temperature = WORLD.climateTemp + timeOffset + noise + tempOffset.value;
}

// A calm-to-fresh breeze to start with; the Settings panel can push it to gale.

// ---------------------------------------------------------------------------
// Gradient sky (custom shader dome that rides along with the camera)
// ---------------------------------------------------------------------------
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  depthWrite: false,
  uniforms: {
    // Cloned, so the module constants stay the untouched reference values.
    uZenith:  { value: SKY_ZENITH.clone() },
    uHorizon: { value: SKY_HORIZON.clone() },
    uGround:  { value: SKY_GROUND.clone() },
    uSunDir:  { value: SUN.clone() },
    uSunCol:  { value: new THREE.Color(0xfff0cf) },
  },
  vertexShader: /* glsl */`
    varying vec3 vDir;
    void main() {
      vDir = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: /* glsl */`
    varying vec3 vDir;
    uniform vec3 uZenith, uHorizon, uGround, uSunDir, uSunCol;
    void main() {
      vec3 d = normalize(vDir);
      float up = clamp(d.y, 0.0, 1.0);
      float dn = clamp(-d.y, 0.0, 1.0);
      vec3 col = mix(uHorizon, uZenith, pow(up, 0.48));
      col = mix(col, uGround, pow(dn, 0.30));

      float sd = max(dot(d, normalize(uSunDir)), 0.0);
      col += uSunCol * (pow(sd, 900.0) * 6.0 + pow(sd, 30.0) * 0.35 + pow(sd, 4.0) * 0.10);

      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }
  `,
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 32), skyMat);
sky.scale.setScalar(600);

sky.frustumCulled = false;
