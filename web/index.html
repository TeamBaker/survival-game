// In cross-section it is three steps: collect every exposed unit face as a
// directed edge, chain the edges into an outline, then replace every corner of
// the outline with a quarter-circle arc. Here the same three steps are local
// rather than global, because a 3D surface has no single walkable outline: each
// exposed face contributes its own tile, inset by the fillet radius on every
// side that joins another face at 90°, and the arc over each joint is split
// down the middle — every tile carries the half of the arc that leans its way,
// out to 45°, so the two tiles either side of a joint meet exactly on it and
// neither has to know the other one exists.
//
// A joint is convex where the cell beyond the face's edge is empty (the outside
// corner of a step, arc bending away from the solid, taking the corner off) and
// concave where that cell is filled and the one above it is too (the inside
// corner at the foot of a wall, arc bending out into the air, filling the
// corner in) — exactly the two cases that corner walk rounds, and with the
// same radius. A face whose neighbour simply carries on in the same plane has
// no joint there at all and no inset, so a flat run of blocks comes out flat,
// a cliff comes out vertical, and a staircase gets a real arc at each step
// edge rather than a ramp between the two heights.
//
// Segments per half-arc. Four across a full 90° fillet is enough that the curve
// reads as a curve rather than a facet, and every extra one is paid for on
// every filleted edge of every block in range.
const FILLET_SUB = 2;
// Fillet radius, in metres: half a block. Two opposite insets on the same face
// then sum to exactly the block width, so they meet in the middle at worst and
// never cross.
const FILLET_R_MAX = BLOCK * 0.5;
// How far out from the middle of the field gets a skin, in metres. Past the
// shoreline and its wash and not much further: at a vertex every few centimetres
// this costs far more per square metre than the cubes do, and the sea floor
// beyond here is under enough water and fog that its corners were never legible.
// Chunks outside it keep their cubes in every view, so there is no hole.
const FILLET_R = 64;
// tan of each sample's angle along a half-arc, which is swept uniformly in
// angle from 0 to 45°. tan is the form the corner blend below wants: a point on
// the arc is `normalise(outward + tan(angle) * sideways)`, and that same
// expression with a second sideways term in it is what rounds the corners where
// two arcs meet, with no special case for the corner itself.
const FILLET_TAN = [];
for (let s = 0; s <= FILLET_SUB; s++) FILLET_TAN.push(Math.tan((Math.PI / 4) * (s / FILLET_SUB)));
// At exactly half a block the two arcs of a doubly-filleted axis are tangent in
// the middle, so the flat run between them is zero-width and its second sample
// is a duplicate of the first.
const FILLET_NO_FLAT = BLOCK - 2 * FILLET_R_MAX < 1e-9;

// The six directions a face can front, as a step through the block store
// (di, dj, dl), a world vector, and the index of the opposite one.
const FDIR = [
  { di:  1, dj:  0, dl:  0, vx:  1, vy:  0, vz:  0 },   // 0  east
  { di: -1, dj:  0, dl:  0, vx: -1, vy:  0, vz:  0 },   // 1  west
  { di:  0, dj:  0, dl:  1, vx:  0, vy:  1, vz:  0 },   // 2  up
  { di:  0, dj:  0, dl: -1, vx:  0, vy: -1, vz:  0 },   // 3  down
  { di:  0, dj:  1, dl:  0, vx:  0, vy:  0, vz:  1 },   // 4  north
  { di:  0, dj: -1, dl:  0, vx:  0, vy:  0, vz: -1 },   // 5  south
];
const FOPP = [1, 0, 3, 2, 5, 4];
// The same opposites reachable straight off a direction, since the walk below
// carries directions around as these records rather than as indices.
for (let d = 0; d < 6; d++) FDIR[d].op = FDIR[FOPP[d]];
// The two in-plane axes of each face, u then v, picked so that u cross v is the
// face's own direction — which is what makes a quad walked u-then-v wind
// outward without anything having to check afterwards.
const FFRAME = [[2, 4], [4, 2], [4, 0], [0, 4], [0, 2], [2, 0]];

// Is there a block at (i, j, l)? Anything under the store's floor reads as
// bedrock — an infinite solid, so nothing ever grows a face on its underside —
// and anything off the side of the
// field, or above a column's top, reads as air.
function filletSolid(i, j, l) {
  if (l < VOX_FLOOR) return true;
  if (i < 0 || j < 0 || i >= GEN_N || j >= GEN_N) return false;
  const k = j * GEN_N + i;
  if (topLvl[k] === NO_COLUMN || l > sTop[k]) return false;
  return voxMat[voxOff[k] + l - VOX_FLOOR] !== AIR;
}

// Every joint the skin can round is one edge of the block lattice, and what it
// does there is settled by the four cells around that edge and nothing else.
// Naming an edge by the cell it runs out of and the two directions that pick
// the corner (the edge itself runs along the third axis) is what keeps that
// true: the same edge named from any of the four cells, or with its two
// directions the other way round, classifies the same, so no two faces that
// meet on it can disagree about it.
//
//   -1  the surface turns away from the solid: one cell of the four is filled
//       and this is the outside corner of a step, so the arc bends away from
//       the solid and takes the corner off.
//    1  it turns into it: three are filled and this is the inside corner at the
//       foot of a wall, so the arc bends out into the air and fills it in.
//    0  the two faces either side are in the same plane, or there is no surface
//       here at all: nothing to round.
//   FPINCH  the two filled cells meet across nothing but the edge itself. The
//       surface is pinched to a line along it and there is no arc either block
//       can cut that the other agrees with, so the edge stays square — and so
//       does everything that runs into it (see filletRun).
const FPINCH = 2;
function filletSense(i, j, l, b, c) {
  const s00 = filletSolid(i, j, l);
  const s10 = filletSolid(i + b.di, j + b.dj, l + b.dl);
  const s01 = filletSolid(i + c.di, j + c.dj, l + c.dl);
  const s11 = filletSolid(i + b.di + c.di, j + b.dj + c.dj, l + b.dl + c.dl);
  const n = s00 + s10 + s01 + s11;
  if (n === 1) return -1;
  if (n === 3) return 1;
  // Two filled and the pair is diagonal, so they touch along the edge alone.
  if (n === 2 && s00 === s11) return FPINCH;
  return 0;
}

// The joint on the `g` edge of the face of block (i, j, l) that points `d`,
// which is that same lattice edge with a pinch read as the square edge it
// leaves behind. Everything below asks for the joint through here, so the tile
// that owns it and every tile that has to meet its arc get the same answer.
function filletJoint(i, j, l, g, d) {
  const s = filletSense(i, j, l, g, d);
  return s === FPINCH ? 0 : s;
}

// Whether the joint on this face's `g` edge is still at full depth by the time
// that edge reaches its `h` end, as a 0/1 weight on the arc there.
//
// This is the one thing a cross-section never has to answer. A fillet there runs
// along a line and stops at a corner; here it runs along a strip, and the ends
// of that strip are edges other tiles have to meet flush. So the question is
// really about the tile on the other side of that end: the joint keeps its full
// depth exactly when that tile carries the same joint, of the same sense, on its
// own `g` edge, because then the two arcs are two lengths of one fillet and meet
// each other at full depth. Where that tile is flat along the shared edge the
// joint stops dead there instead, and the arc has to be back down on the block's
// own square edge by the time it arrives, or the two tear apart.
//
// Which tile that is depends on what the surface does at this end, and it is
// only ever one of three things. It carries straight on, where the block one
// step along `h` is there with air above it and its face is in this same plane.
// It turns a convex corner, where that block is missing — then the surface folds
// onto this same block's own `h` face. Or it turns a concave one, where that
// block is there and the cell above it is filled too — then the surface climbs
// that wall, and the tile across the end is the wall's face looking back down
// `h`. All three are the same question asked of a different face.
//
// Rounding across those two turns rather than stopping dead at them is what
// carries a fillet around the corner of a step instead of squaring it off. On
// terrain that steps in both directions at once — which is most of an island,
// since a contour that is not square to the grid climbs as a staircase of one-
// block jogs — nearly every joint ends at a turn rather than at a straight run,
// so stopping at them left the arc dying out on both ends of almost every tile
// and only the runs that happened to line up with the grid looking rounded. The
// vertical arc up the outside corner of a tower, the one running down the inside
// corner where two walls meet, and every step corner in between are all just a
// joint continuing across a turn.
//
// One face's answer, though. A joint has two faces on it and they run out to the
// same end over different neighbours, so they can and do answer this
// differently — see filletRun, which is what everything actually asks.
function filletRunFace(i, j, l, d, g, h, sg) {
  let bi = i + h.di, bj = j + h.dj, bl = l + h.dl, nd = h;
  if (!filletSolid(bi, bj, bl)) {                    // convex turn, onto this block's `h` face
    bi = i; bj = j; bl = l;
  } else if (filletSolid(bi + d.di, bj + d.dj, bl + d.dl)) {
    bi += d.di; bj += d.dj; bl += d.dl; nd = h.op;   // concave turn, up the wall's face
  } else {
    nd = d;                                          // same plane, one block along
  }
  return filletJoint(bi, bj, bl, g, nd) === sg ? 1 : 0;
}

// The same question asked of both faces on the joint, and answered no if either
// of them says no.
//
// A joint is one edge with a face on either side of it, and each of them carries
// half the arc. Where the two halves end has to be one answer, or they end in
// different places and the arc rips down the seam between them — and asking only
// the face that happens to be building right now is not one answer, because the
// two faces run out to the end of the joint over quite different neighbours.
//
// The one-block tread of a staircase is where they part company, and an island
// is made of those. Take the convex edge along the top of a step, and follow it
// to where the next step up crosses it. Its top face turns a concave corner
// there, up the riser, and finds the same convex edge carrying on as the riser's
// own outside corner: full depth, and true — a ball rolled along the crease
// rolls right into the corner and pivots. Its side face is in one flat wall with
// the block beyond the corner, and that block's face is square along the shared
// edge, because the block above it fills the corner in. It has to be square
// there too, so its half of the arc has to be gone by the time it arrives.
//
// Both are right about their own side, so neither can be given the casting vote,
// and the arc has to go where it can still be joined: it fades. Which is what
// this does, and it is also why it is an AND rather than the other way round —
// a fillet that stops a little early is a fillet, and a fillet that stops in two
// places at once is a hole. It costs the very last of the arc into a corner the
// mesh has no way to cap anyway, and nothing else.
//
// Reading the second face means finding it. Across a convex joint the two faces
// are two faces of this same block, so it is the `g` face with the joint on its
// `d` edge. Across a concave one this block's neighbour along `g` is solid and
// has no exposed face there at all: the wall the surface climbs is the block
// diagonally across the joint, looking back the way it came.
function filletRun(i, j, l, d, g, h, sg) {
  if (sg === 0) return 1;                            // nothing there to fade
  if (!filletRunFace(i, j, l, d, g, h, sg)) return 0;
  if (sg < 0) return filletRunFace(i, j, l, g, d, h, sg);
  return filletRunFace(i + d.di + g.di, j + d.dj + g.dj, l + d.dl + g.dl, g.op, d.op, h, sg);
}

// The samples along one axis of a face, from its low edge to its high one: the
// block's own square edge the sample hangs off, the inset from it to where the
// flat part of the tile ends (signed inwards, and the thing a fade scales away),
// the arc offset at that sample (signed too, so the low half-arc runs -1 -> 0
// and the high one 0 -> +1), the joint's sense, how far along the arc it is for
// the colour blend, and which end of the axis it belongs to. An unjointed side
// is a single sample at the block's own edge with no inset and no offset, which
// is what leaves a flat face flat — and it is also exactly what a jointed side
// collapses to when its arc has faded out, so a fading tile meets a flat one on
// the nose.
const FILAX = 2 * (FILLET_SUB + 1) + 1;
const filAQ = new Float64Array(FILAX), filAD = new Float64Array(FILAX);
const filAN = new Float64Array(FILAX), filAS = new Float64Array(FILAX);
const filAT = new Float64Array(FILAX), filAE = new Float64Array(FILAX);
// Two per axis: how far along it each sample actually sits, once at each end of
// the other axis. See filletSpread.
const filAF0 = new Float64Array(FILAX), filAF1 = new Float64Array(FILAX);
const filBQ = new Float64Array(FILAX), filBD = new Float64Array(FILAX);
const filBN = new Float64Array(FILAX), filBS = new Float64Array(FILAX);
const filBT = new Float64Array(FILAX), filBE = new Float64Array(FILAX);
const filBF0 = new Float64Array(FILAX), filBF1 = new Float64Array(FILAX);

// `full` says both of this axis's arcs run at full depth along their whole
// length, which is what lets the two middle samples be shared.
//
// `mid` asks for one extra sample across the middle of the block, which is what
// a tile needs to bend a fade rather than rule it straight: an arc that fades
// along this axis is only ever read where this axis has a sample, so with just
// the block's two edges to go on, the only shape a fade can take between them is
// a straight ramp — the fillet drains away from full depth to nothing in one
// even slope, which is the straight line at every step corner. One sample in
// between is enough to hold the fillet near its full depth for the first half of
// the run and put the whole run-out in the second, which is what the corner
// actually looks like (see filFade).
//
// Half a block is the one place it can go. Both arcs reach exactly that far at
// full depth and no further, so a sample there is never overtaken by one of them
// and the samples stay in order; at full depth it lands on top of them and comes
// out as a seam of zero-area quads, which costs a few vertices and draws nothing.
function filletAxis(sLo, sHi, full, mid, Q, Dq, N, S, T, E) {
  let m = 0;
  if (sLo !== 0) {
    for (let s = FILLET_SUB; s >= 0; s--) {
      Q[m] = 0; Dq[m] = FILLET_R_MAX; N[m] = -FILLET_TAN[s]; S[m] = sLo; T[m] = s / FILLET_SUB; E[m] = 0; m++;
    }
  } else {
    Q[m] = 0; Dq[m] = 0; N[m] = 0; S[m] = 0; T[m] = 0; E[m] = 0; m++;
  }
  // No inset and no offset of its own: it sits on the block's own middle
  // wherever the arcs either side of it have got to, and carries nothing but the
  // other axis's fade, read at half a block in.
  if (mid) { Q[m] = BLOCK * 0.5; Dq[m] = 0; N[m] = 0; S[m] = 0; T[m] = 0; E[m] = 0; m++; }
  if (sHi !== 0) {
    // Skip the second copy of the middle sample when the flat run between the
    // two arcs has no width. Only when neither arc fades, though: a fading one
    // pulls its middle sample back onto the block's edge and the two are no
    // longer the same point.
    for (let s = (sLo !== 0 && FILLET_NO_FLAT && full) ? 1 : 0; s <= FILLET_SUB; s++) {
      Q[m] = BLOCK; Dq[m] = -FILLET_R_MAX; N[m] = FILLET_TAN[s]; S[m] = sHi; T[m] = s / FILLET_SUB; E[m] = 1; m++;
    }
  } else {
    Q[m] = BLOCK; Dq[m] = 0; N[m] = 0; S[m] = 0; T[m] = 0; E[m] = 1; m++;
  }
  return m;
}

// How deep a joint's arc is a fraction `f` of the way along the tile, between
// the depths `w0` and `w1` it has to have at the two ends. Nothing to decide
// where the two agree — a joint that runs on at both ends is at full depth all
// the way across, and one with nothing at either end has nothing anywhere.
//
// Where they disagree the joint is running out, and the shape of that run-out is
// the shape of the corner it runs out at. A ball of radius r rolled along the
// crease keeps its full depth until it is r from the end and only then starts to
// lift away, so the fillet holds its size along most of the last block and does
// all of its dying in the last half of one — a quarter circle's worth of
// run-out, which is what this is: full depth with a flat start, then away
// sharply at the end. Ramping straight from one to the other instead, which is
// all two samples can express, drains the fillet evenly across the whole block
// and leaves the straight taper this replaces.
//
// Both ends dead is a run-out from each of them rather than nothing at all, and
// it is the only shape a joint one block long can have. Wherever a feature is a
// single block wide — a lone rock on the plain, the foot of a one-block step, an
// inside corner where three walls converge on one point — every joint that meets
// it is exactly one block of crease with a corner at each end, so both ends fade
// and the fillet used to be dropped whole and leave the square edge behind. The
// ball still rolls down that crease; it just never gets to sit at the bottom of
// it, and what it cuts is the near half of one run-out met by the near half of
// the other, which is the smaller of the two profiles at every point along it.
//
// r is half a block, so the whole of that run-out belongs in the last half of
// the last block and the first half of it is still full depth: `u` is how far
// into the run-out the sample is, and everything before it stays at 1. Measuring
// the quarter circle from the far end instead spent it over a whole block, which
// held nothing at full depth and left every fading joint shallower than the ball
// that cuts it — a one-block crease, which most of the island is made of, peaked
// at 0.87 of its radius in the middle instead of touching bottom there.
function filFade(w0, w1, f) {
  if (w0 === w1 && w0) return w0;
  const t = w0 === w1 ? (f > 0.5 ? f : 1 - f) : w0 ? f : 1 - f;
  const u = 2 * t - 1;
  return u > 0 ? Math.sqrt(1 - u * u) : 1;
}

// How far along its axis each of those samples actually ends up, given how deep
// the axis's two arcs are here, rescaled so the first sample is 0 and the last
// is 1. This is the fraction the *other* axis's arcs fade over — see the sample
// loop in filletFace.
//
// It has to be the realised position and not the full-depth one. An arc that
// has faded to nothing puts its whole half of the samples on the block's own
// edge, one on top of another; they are one point, and anything read off them
// has to come out the same for all of them or they get pulled apart into a
// little fan. Reading their nominal positions would do exactly that, and the
// tile on the other side of the joint — which samples its own axes its own way
// — would not make the same fan, so the two would tear along the seam.
function filletSpread(Q, Dq, N, E, m, wLo, wHi, F) {
  for (let k = 0; k < m; k++) {
    const w = E[k] ? wHi : wLo, n = w > 0 ? N[k] : 0;
    F[k] = Q[k] + w * Dq[k] + w * FILLET_R_MAX * n / Math.sqrt(n * n + 1);
  }
  const f0 = F[0], span = F[m - 1] - f0;
  for (let k = 0; k < m; k++) F[k] = span > 1e-12 ? (F[k] - f0) / span : E[k];
}

// The colour of one block, which after a dig is not what the generator left on
// the column: the material actually there now, times the column's own tint.
const filColC = [0, 0, 0], filColUL = [0, 0, 0], filColUH = [0, 0, 0];
const filColVL = [0, 0, 0], filColVH = [0, 0, 0];

function filletCellColor(i, j, l, out) {
  if (i < 0 || j < 0 || i >= GEN_N || j >= GEN_N) { out[0] = out[1] = out[2] = 0.5; return; }
  const k = j * GEN_N + i;
  let m = topMat[k];
  if (topLvl[k] !== NO_COLUMN && l >= VOX_FLOOR && l <= voxCap(k)) {
    const v = voxMat[voxOff[k] + l - VOX_FLOOR];
    if (v !== AIR) m = v;
  }
  const col = TERRAIN_MATS[m].color, s = tint[k];
  out[0] = col.r * s; out[1] = col.g * s; out[2] = col.b * s;
}

// The block on the far side of a joint, whose colour the arc blends towards.
// Across a convex joint that is this same block seen from another side, so the
// blend is a no-op and the corner keeps its own colour; across a concave one it
// is the block whose wall the surface climbs, so the ground takes on the colour
// of the step above it as it curves into it.
function filletJointColor(i, j, l, g, d, s, out) {
  if (s === 1) filletCellColor(i + g.di + d.di, j + g.dj + d.dj, l + g.dl + d.dl, out);
  else filletCellColor(i, j, l, out);
}

// Scratch for the chunk currently being built. Plain JS arrays because the
// vertex count isn't known ahead of time — it depends on how much of the chunk's
// block surface is actually exposed and how much of that is jointed, not on a
// fixed subdivision of anything. Copied into typed BufferAttributes at the end.
const fpPos = [], fpNor = [], fpCol = [], fpIdx = [];

// One exposed face, as a tile: a grid of samples over the block's face, inset
// by the fillet radius on every jointed side and carrying the near half of each
// joint's arc. Every sample is
//
//     anchor + r * n / |n|   with   n = outward + nu * u + nv * v
//
// taken apart into its three components, where nu and nv are the tan offsets
// along the two axes. With one of them zero that is a plain quarter-circle
// swept along the edge; with both non-zero the same expression is the sphere
// that rounds the corner where the two arcs meet, so there is no seam between
// an edge fillet and a corner one and no separate corner case to get wrong.
// The outward offset is signed by the joint (into the solid for a convex one,
// out into the air for a concave one), blended between the two axes' senses
// where they disagree. Normals come out of the same expression analytically,
// so the arc is smooth-shaded and meets the flat part of the tile with the
// flat part's own normal.
function filletFace(i, j, l, d) {
  const D = FDIR[d];
  const iu = FFRAME[d][0], iv = FFRAME[d][1];
  const U = FDIR[iu], V = FDIR[iv], UL = FDIR[FOPP[iu]], VL = FDIR[FOPP[iv]];

  const sUH = filletJoint(i, j, l, U, D), sUL = filletJoint(i, j, l, UL, D);
  const sVH = filletJoint(i, j, l, V, D), sVL = filletJoint(i, j, l, VL, D);

  // How much of each of the four arcs is left at each of the two ends it runs
  // between — 1 where the joint carries on or closes into a corner, 0 where it
  // stops and the arc has to be back on the block's square edge.
  const aL0 = filletRun(i, j, l, D, UL, VL, sUL), aL1 = filletRun(i, j, l, D, UL, V, sUL);
  const aH0 = filletRun(i, j, l, D, U,  VL, sUH), aH1 = filletRun(i, j, l, D, U,  V, sUH);
  const bL0 = filletRun(i, j, l, D, VL, UL, sVL), bL1 = filletRun(i, j, l, D, VL, U, sVL);
  const bH0 = filletRun(i, j, l, D, V,  UL, sVH), bH1 = filletRun(i, j, l, D, V,  U, sVH);

  // An arc that has faded at both ends has faded everywhere, and is worth not
  // having: it would come out as a fan of samples all sitting on the block's own
  // edge, which is where an unjointed side puts its single sample anyway.
  // An axis needs its middle sample exactly where something bends along it, and
  // what bends along one axis is the fade of the arcs on the other. A face whose
  // joints all run straight through — every flat face, and every one in the
  // middle of a long step — has nothing to bend and stays the four corners it
  // has always been. Two tiles either side of a joint that fades read that
  // joint's two ends the same way, so both subdivide it and their samples land
  // on each other; a tile that subdivides for a joint of its own that the other
  // one cannot see puts its extra sample on a stretch the other one is holding
  // straight, so it lands on that straight line and neither tears.
  // Anything short of full depth at both ends bends along the joint's own
  // length, which now includes the arc that is dead at both of them: it bulges
  // in the middle rather than being flat nothing, and without a sample there it
  // has nowhere to put the bulge.
  const midA = (sVL && !(bL0 & bL1)) || (sVH && !(bH0 & bH1));
  const midB = (sUL && !(aL0 & aL1)) || (sUH && !(aH0 & aH1));

  // The sense alone decides whether a side is jointed. An arc that has run out
  // at both ends still has the middle of its own run to cut (see filFade), and
  // dropping it there is what squared off every one-block feature.
  const na = filletAxis(sUL, sUH, aL0 & aL1 & aH0 & aH1, midA,
                        filAQ, filAD, filAN, filAS, filAT, filAE);
  const nb = filletAxis(sVL, sVH, bL0 & bL1 & bH0 & bH1, midB,
                        filBQ, filBD, filBN, filBS, filBT, filBE);

  // Each axis measured once at each end of the other, since how far along an
  // axis a sample sits depends on how deep that axis's arcs are, and that is
  // what varies from one end of the other axis to the other.
  filletSpread(filAQ, filAD, filAN, filAE, na, aL0, aH0, filAF0);
  filletSpread(filAQ, filAD, filAN, filAE, na, aL1, aH1, filAF1);
  filletSpread(filBQ, filBD, filBN, filBE, nb, bL0, bH0, filBF0);
  filletSpread(filBQ, filBD, filBN, filBE, nb, bL1, bH1, filBF1);

  filletCellColor(i, j, l, filColC);
  filletJointColor(i, j, l, U,  D, sUH, filColUH);
  filletJointColor(i, j, l, UL, D, sUL, filColUL);
  filletJointColor(i, j, l, V,  D, sVH, filColVH);
  filletJointColor(i, j, l, VL, D, sVL, filColVL);

  // The corner of the block's face this tile's axes run out from.
  const ox = -GEN_R + i * BLOCK + (D.vx > 0 ? BLOCK : 0);
  const oy = l * BLOCK + (D.vy > 0 ? BLOCK : 0);
  const oz = -GEN_R + j * BLOCK + (D.vz > 0 ? BLOCK : 0);

  const r = FILLET_R_MAX;
  const base = fpPos.length / 3;
  for (let b = 0; b < nb; b++) {
    const eb = filBE[b];
    const sv = filBS[b], tv = filBT[b];
    const cv = filBN[b] < 0 ? filColVL : filColVH;
    for (let a = 0; a < na; a++) {
      const ea = filAE[a];
      // The two u-arcs are only as deep as they are at this point along v, and
      // vice versa — which is what fades an arc out along its own length. The
      // end weights are what the tiles either side of this one see at the edges
      // they share with it, so the samples at each end carry their end's weight
      // exactly and the arc runs out between the two across the tile in between,
      // to the profile filFade gives it. It has to be read off where the sample
      // actually sits and not off which end it belongs to: stepping straight
      // from one end weight to the other on the end index would hold the arc at
      // full depth for the whole first half of the face and then drop it to
      // nothing across a single row of quads, and on a doubly-filleted axis
      // those two rows are a few millimetres apart in the middle of the face, so
      // the last block of every run came out as a crease down its middle with a
      // flat strip of square edge past it.
      const fb = ea ? filBF1[b] : filBF0[b], fa = eb ? filAF1[a] : filAF0[a];
      const wu = ea ? filFade(aH0, aH1, fb) : filFade(aL0, aL1, fb);
      const wv = eb ? filFade(bH0, bH1, fa) : filFade(bL0, bL1, fa);
      // A fading arc keeps its whole quarter turn and shrinks its radius to
      // w * r, rather than holding the radius and sweeping through less of the
      // turn. Both come out the same at full depth, and the difference matters
      // everywhere else: an arc that only sweeps atan(w) stops short of the 45°
      // diagonal the tile across the joint meets it on, and the two faces close
      // on each other at an angle instead of a tangent — a hard crease running
      // the length of every fading joint, which on this terrain is most of them.
      // Shrinking the radius instead keeps both halves tangent to their own face
      // and to each other the whole way out, so a fillet that fades reads as a
      // fillet getting smaller rather than as a chamfer with a line down it.
      //
      // An arc with nothing left has no turn either: zeroing it, rather than
      // letting a zero radius hide a non-zero one, keeps its samples exactly on
      // top of each other and out of `len`, which is what a collapsed arc needs.
      const nu = wu > 0 ? filAN[a] : 0, nv = wv > 0 ? filBN[b] : 0;
      const qu = filAQ[a] + wu * filAD[a], qv = filBQ[b] + wv * filBD[b];
      const su = filAS[a], tu = filAT[a];
      const cu = nu < 0 ? filColUL : filColUH;

      const len = Math.sqrt(nu * nu + nv * nv + 1);
      // How much of the corner each arc has a say in, which is still a question
      // about how deep they are and not just how far round they have turned.
      const au = wu * (nu < 0 ? -nu : nu), av = wv * (nv < 0 ? -nv : nv);
      // Which way the joint bends, blended between the two axes where they
      // disagree — and how deep the standoff off the face's own plane is, which
      // once arcs can fade is no longer just the radius.
      //
      // A fading arc insets by w*r and reaches w*r along the face, so it has to
      // stand off by w*r too or its 45° sample slides off the diagonal of the
      // joint. That sample is the one the tile across the joint has to meet, and
      // that tile measures the same joint from the other face — its own 45°
      // sample is this one with the along-face and standoff parts swapped, so
      // anything but w*r tears the two apart along the whole seam.
      //
      // Which w, where a sample has both arcs under it, is settled by whichever
      // arc is nearer its own 45° end, because that is the seam this sample is
      // on; an arc with no depth left has no seam and never takes charge. The
      // two are only both at 45° at the one sample in the corner of the tile,
      // where the seams cross and there is no single answer. At full depth all
      // of this is 1 and the standoff is the plain radius it always was.
      const du = wu > 0 ? tu : -1, dv = wv > 0 ? tv : -1;
      const wd = du > dv ? wu : dv > du ? wv : (wu + wv) * 0.5;
      const sense = au + av > 0 ? (su * au + sv * av) / (au + av) : 0;
      const pu = qu + wu * r * nu / len, pv = qv + wv * r * nv / len, pw = sense * wd * r * (1 - 1 / len);

      fpPos.push(ox + pu * U.vx + pv * V.vx + pw * D.vx,
                 oy + pu * U.vy + pv * V.vy + pw * D.vy,
                 oz + pu * U.vz + pv * V.vz + pw * D.vz);

      const gx = D.vx - su * nu * U.vx - sv * nv * V.vx;
      const gy = D.vy - su * nu * U.vy - sv * nv * V.vy;
      const gz = D.vz - su * nu * U.vz - sv * nv * V.vz;
      const gl = Math.hypot(gx, gy, gz) || 1;
      fpNor.push(gx / gl, gy / gl, gz / gl);

      let cr = filColC[0], cg = filColC[1], cb = filColC[2];
      if (nu !== 0) { const t = tu * 0.5; cr += (cu[0] - cr) * t; cg += (cu[1] - cg) * t; cb += (cu[2] - cb) * t; }
      if (nv !== 0) { const t = tv * 0.5; cr += (cv[0] - cr) * t; cg += (cv[1] - cg) * t; cb += (cv[2] - cb) * t; }
      fpCol.push(cr, cg, cb);
    }
  }

  for (let b = 0; b + 1 < nb; b++) {
    for (let a = 0; a + 1 < na; a++) {
      const p = base + b * na + a;
      fpIdx.push(p, p + 1, p + 1 + na, p, p + 1 + na, p + na);
    }
  }
}

// Every exposed face of every block in one column. The vertical walk is the
// cube mesher's, for the same reason: everything under the lowest of the four
// neighbours is walled in on all sides and can have no exposed face, so an
// untouched column stops there rather than running to bedrock — but once the
// shovel has been in this column or one beside it there can be air anywhere in
// it, and the floor and the ceiling of a dug-out pocket are both surfaces the
// skin has to trace, so then the walk goes all the way down.
function filletColumn(i, j) {
  const k = j * GEN_N + i;
  const top = sTop[k];
  if (top === NO_COLUMN || topLvl[k] === NO_COLUMN) return;

  let low = top, dug = colDug[k] !== 0;
  for (let e = 0; e < 4; e++) {
    const g = FDIR[e < 2 ? e : e + 2];               // the four sideways steps
    const ni = i + g.di, nj = j + g.dj;
    if (ni < 0 || nj < 0 || ni >= GEN_N || nj >= GEN_N) { low = Math.min(low, top - RIM_DEPTH); continue; }
    const nk = nj * GEN_N + ni;
    const v = sTop[nk];
    low = Math.min(low, v === NO_COLUMN ? top - RIM_DEPTH : v);
    if (colDug[nk]) dug = true;
  }
  const deepest = Math.max(VOX_FLOOR, top - MAX_DEPTH);
  const floor = dug ? deepest : Math.max(deepest, Math.min(top, low + 1));

  const o = voxOff[k] - VOX_FLOOR;
  for (let l = top; l >= floor; l--) {
    if (voxMat[o + l] === AIR) continue;
    for (let d = 0; d < 6; d++) {
      const g = FDIR[d];
      if (!filletSolid(i + g.di, j + g.dj, l + g.dl)) filletFace(i, j, l, d);
    }
  }
}

// ----- Phase 1: vertex-corner classification -----
// A lattice vertex is where 4 tiles (columns) meet. buildFilletChunk's fillets
// are computed per edge, i.e. two tiles at a time, so an outside corner — 3 of
// the 4 tiles built, 1 empty diagonal — gets no fillet across that diagonal
// and the smooth skin leaves a V-notch there. This classifies what's
// happening at a vertex so a later pass can round that notch off too.

// Column height at tile (i, j) as a block count (0 = empty), not a level
// index — matches the height > 0 occupancy check below.
function fcTileHeight(i, j) {
  if (i < 0 || j < 0 || i >= GEN_N || j >= GEN_N) return 0;
  const top = sTop[j * GEN_N + i];
  return top === NO_COLUMN ? 0 : top + 1;
}

// Classify the 2x2 block of tiles around lattice vertex (vx, vz) — world
// coordinates, i.e. grid indices already multiplied by BLOCK.
function classifyVertexVertexCorner(vx, vz) {
  const vi = Math.round((vx + GEN_R) / BLOCK);
  const vj = Math.round((vz + GEN_R) / BLOCK);
  const h = [
    fcTileHeight(vi - 1, vj - 1), // SW
    fcTileHeight(vi,     vj - 1), // SE
    fcTileHeight(vi - 1, vj),     // NW
    fcTileHeight(vi,     vj),     // NE
  ];
  // Occupancy alone (h > 0) never fires on this island: every column gets
  // blocks at generation, so all four are always "occupied" and a raised
  // single-tile step — the actual wall-foot notch case — read as count === 4,
  // i.e. 'flat'. What the two edge fillets meeting at the vertex actually care
  // about is which tiles reach the *tallest* level here, not whether they
  // have any height at all, so compare against the vertex's own max instead.
  const maxH = Math.max(h[0], h[1], h[2], h[3]);
  const occ = h.map((v) => v === maxH);
  const count = occ[0] + occ[1] + occ[2] + occ[3];

  if (maxH === 0 || count === 4) return { type: 'flat', heights: h };
  if (count === 3) return { type: 'outside', diagonal: occ.indexOf(false), heights: h };
  // One tile alone at the vertex's max height, the other three lower: the
  // corner being rounded is that tile's own, so the cap has to open away from
  // it — toward the diagonally opposite tile, not toward the tall one itself
  // (the mirror image of the count === 3 case, where the odd one out already
  // *is* the low side to open toward).
  if (count === 1) return { type: 'outside', diagonal: 3 - occ.indexOf(true), heights: h };
  const diagonalPair = (occ[0] && occ[3]) || (occ[1] && occ[2]); // SW+NE or SE+NW
  return { type: diagonalPair ? 'L' : 'edge', heights: h };
}

// ----- Phase 2: vertex-cap geometry -----
// buildFilletChunk fillets are per-edge, so an 'outside' or 'L' vertex (see
// classifyVertexVertexCorner) is left with a V-notch where two of those edge
// fillets meet but don't blend into each other. This patches it with a
// quarter-torus: the same inset-by-FILLET_R_MAX, quarter-circle profile every
// edge fillet already uses (touch the flat top at radius R in from the true
// corner, touch the wall at the true corner, R below the top), just swept
// round the vertex's vertical axis between the two walls instead of run
// straight along one edge. Column index of the tile in quadrant `empty`,
// relative to lattice vertex (vi, vj) — SW, SE, NW, NE, matching the order
// classifyVertexVertexCorner reads them in.
function vcTileCol(idx, vi, vj) {
  return idx === 0 ? [vi - 1, vj - 1] : idx === 1 ? [vi, vj - 1]
       : idx === 2 ? [vi - 1, vj] : [vi, vj];
}

const VC_ARCS = 8;   // steps around the corner
const VC_RING = 4;   // steps from the flat top down to the wall
// Sweep start angle (atan2(z, x) convention), one per empty quadrant index —
// the arc always opens toward the empty tile, since that's where the notch is.
const VC_QUAD = [Math.PI, -Math.PI / 2, Math.PI / 2, 0];

// One cap's mesh, pushed as a plain triangle list (no index buffer) straight
// into the caller's position/color/normal arrays.
function vcEmitCap(vi, vj, empty, sweep, radius, vyTop, offset, vao, vcx, vcz) {
  const vx = -GEN_R + vi * BLOCK, vz = -GEN_R + vj * BLOCK;
  const start = VC_QUAD[empty] + offset;
  const stride = VC_RING + 1;
  const gp = [], gn = [];
  for (let a = 0; a <= VC_ARCS; a++) {
    const theta = start + (a / VC_ARCS) * sweep;
    const ct = Math.cos(theta), st = Math.sin(theta);
    for (let r = 0; r <= VC_RING; r++) {
      const phi = (r / VC_RING) * (Math.PI / 2);
      const sp = Math.sin(phi), cp = Math.cos(phi);
      // sp is 0 at the top (phi = 0) and 1 at the wall (phi = pi/2), so the
      // horizontal offset collapses onto the vertex's own vertical edge right
      // at the flat top — matching the edge fillets either side of it, whose
      // own corner blend runs out to nothing at exactly that height — and
      // spreads out to the R-inset, into the two tiles' own footprints, as it
      // drops toward the wall, matching where those same edge fillets are
      // still their full rounded selves.
      gp.push(vx + radius * ct * sp, vyTop - radius + radius * cp, vz + radius * st * sp);
      gn.push(sp * ct, cp, sp * st);
    }
  }
  const push = (p) => {
    vao.push(gp[p * 3], gp[p * 3 + 1], gp[p * 3 + 2]);
    vcz.push(gn[p * 3], gn[p * 3 + 1], gn[p * 3 + 2]);
    vcx.push(filColC[0], filColC[1], filColC[2]);
  };
  for (let a = 0; a < VC_ARCS; a++) {
    for (let r = 0; r < VC_RING; r++) {
      const p00 = a * stride + r, p10 = p00 + stride, p01 = p00 + 1, p11 = p10 + 1;
      push(p00); push(p01); push(p11);
      push(p00); push(p11); push(p10);
    }
  }
}

// Scan every lattice vertex in chunk (cx, cz)'s column-index range — same
// origin buildFilletChunk derives from its chunk index — and cap the ones
// classifyVertexVertexCorner calls 'outside' (one quarter-torus, full
// FILLET_R_MAX, 90 degree sweep) or 'L' (two smaller ones, since an 'L'
// vertex has two empty quadrants pinched to the one point, 0.7 * FILLET_R_MAX,
// 60 degree sweep centred in each quadrant). Colour and cap height both come
// from the tallest of the tiles that meet at the vertex, the same tile
// filletCellColor would read for the block actually standing there.
function buildVertexCaps(cx, cz, vao, vcx, vcz) {
  const i1 = Math.min(cx + CHUNK, GEN_N), j1 = Math.min(cz + CHUNK, GEN_N);
  for (let vj = Math.max(0, cz); vj <= j1; vj++) {
    for (let vi = Math.max(0, cx); vi <= i1; vi++) {
      const info = classifyVertexVertexCorner(-GEN_R + vi * BLOCK, -GEN_R + vj * BLOCK);
      if (info.type !== 'outside' && info.type !== 'L') continue;

      const maxH = Math.max(info.heights[0], info.heights[1], info.heights[2], info.heights[3]);
      if (maxH <= 0) continue;
      const [mi, mj] = vcTileCol(info.heights.indexOf(maxH), vi, vj);
      filletCellColor(mi, mj, maxH - 1, filColC);
      const vyTop = maxH * BLOCK;

      if (info.type === 'outside') {
        // Two different shapes share the 'outside' label: three tiles at
        // maxH with one diagonal gap (the genuine cross-tile notch this pass
        // exists for), and one lone tile at maxH with three empty diagonals
        // (an ordinary box corner, already a single block's own two faces
        // meeting — filletFace's per-face corner blend already rounds that
        // by itself). A cap on top of the second case duplicates and fights
        // that existing rounding instead of filling a gap, so only the
        // three-tile case gets one.
        const highCount = info.heights.reduce((n, hh) => n + (hh === maxH ? 1 : 0), 0);
        if (highCount === 3) vcEmitCap(vi, vj, info.diagonal, Math.PI / 2, FILLET_R_MAX, vyTop, 0, vao, vcx, vcz);
      } else {
        for (let k = 0; k < 4; k++) {
          if (info.heights[k] > 0) continue;
          vcEmitCap(vi, vj, k, Math.PI / 3, FILLET_R_MAX * 0.7, vyTop, Math.PI / 12, vao, vcx, vcz);
        }
      }
    }
  }
}

const filletGroup = new THREE.Group();
filletGroup.visible = false;      // blocks-only terrain: the skin is never shown
scene.add(filletGroup);
// One material for all three terrain colours. The skin blends across a material
// boundary rather than stepping over it, so the colour has to ride on the
// vertices — which is also where the per-column tint goes. Roughness is split
// between the three the cubes use.
// shadowSide overrides the back-face default mat() uses for the cubes: that one
// works because a cube is a closed solid, and this is an open sheet with nothing
// behind it to cast from.
const filletMat = mat(0xffffff, 0.95, 0.0, {
  envMapIntensity: 0.45, vertexColors: true, shadowSide: THREE.DoubleSide,
});
const filletTris = new Int32Array(CHUNK_N * CHUNK_N);

// Does the chunk's footprint reach inside FILLET_R? Nearest point of it to the
// middle of the field, so a chunk the circle only clips still gets a skin.
function filletCovers(i0, j0, i1, j1) {
  const x0 = colX(i0) - BLOCK * 0.5, x1 = colX(i1) + BLOCK * 0.5;
  const z0 = colZ(j0) - BLOCK * 0.5, z1 = colZ(j1) + BLOCK * 0.5;
  const nx = Math.min(Math.max(0, x0), x1), nz = Math.min(Math.max(0, z0), z1);
  return Math.hypot(nx, nz) <= FILLET_R;
}

function buildFilletChunk(c) {
  const i0 = (c % CHUNK_N) * CHUNK, j0 = ((c / CHUNK_N) | 0) * CHUNK;
  const i1 = Math.min(i0 + CHUNK, GEN_N), j1 = Math.min(j0 + CHUNK, GEN_N);
  if (i1 <= i0 || j1 <= j0 || !filletCovers(i0, j0, i1 - 1, j1 - 1)) return;

  fpPos.length = fpNor.length = fpCol.length = fpIdx.length = 0;
  // Only this chunk's own columns, but every neighbour lookup above reads the
  // whole field — so a face on a chunk edge is built from the same blocks
  // whichever side of the boundary owns it, and there is no seam.
  for (let j = j0; j < j1; j++) for (let i = i0; i < i1; i++) filletColumn(i, j);

  // Vertex caps push a flat (non-indexed) triangle list into the same
  // position/color/normal arrays, so give the new vertices sequential
  // indices to match — everything above them is already indexed properly.
  const capBase = fpPos.length / 3;
  buildVertexCaps(i0, j0, fpPos, fpCol, fpNor);
  const capEnd = fpPos.length / 3;
  for (let v = capBase; v < capEnd; v++) fpIdx.push(v);

  if (fpIdx.length === 0) return;

  const nv = fpPos.length / 3;
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(fpPos), 3));
  geo.setAttribute('normal',   new THREE.BufferAttribute(new Float32Array(fpNor), 3));
  geo.setAttribute('color',    new THREE.BufferAttribute(new Float32Array(fpCol), 3));
  geo.setIndex(new THREE.BufferAttribute(nv > 65535 ? new Uint32Array(fpIdx) : new Uint16Array(fpIdx), 1));
  geo.computeBoundingSphere();      // per chunk, for the same culling the cubes get

  const m = new THREE.Mesh(geo, filletMat);
  m.receiveShadow = true;
  m.castShadow = !isTouchDevice;
  filletGroup.add(m);
  filletMesh[c] = m;
  filletTris[c] = fpIdx.length / 3;
}

// (Re)build one chunk's skin. Same unit and same trigger as the cubes: the
// shovel dirties a chunk and both surfaces over it come back.
function rebuildFilletChunk(c) {
  const old = filletMesh[c];
  if (old) {
    filletGroup.remove(old);
    old.geometry.dispose();         // the material is shared, so it stays
    filletMesh[c] = null;
    filletTris[c] = 0;
  }
  buildFilletChunk(c);
  applyChunkView(c);                // the cubes under it hide or come back
}

// The skin is not built at startup and not rebuilt by the shovel — the cubes are
// the terrain. rebuildFilletChunk() above is left in place for debug use from the
// console; nothing in the game calls it.

// ----- pass 4b: the collider -----
// A cannon heightfield on the same grid, its vertices sitting on the centres of
// the block tops. Between two columns one level apart it ramps rather than
// steps, but the ramp is one block long against one block of rise — 45 degrees,
// just inside maxSlope — and at 20 cm a block that ramp is well under the
// player's own radius, so a hillside climbs as a walkable slope and never
// catches on an edge. Two levels apart is 63 degrees, past maxSlope, and stays a
// cliff — which is what a dug face or a bluff is made of.
//
// Baked from the store, and patched a column at a time by the shovel: a
// heightfield only knows the top of each column, so a hole you dig lowers it and
// a block you stack raises it. That is the whole of what a heightfield can
// represent — dig sideways under a ledge and the collider will not follow you —
// but it is exact for the one-block-at-a-time editing the shovel actually does.
const HF_FLOOR = -3.2;         // where the field bottoms out under open water
const DEBRIS_GROUP  = 1;     // pieces collide with each other and with everything else
const PLAYER_GROUP = 2;     // player uses voxel collision, so skip cannon heightfield

const hfShape = (() => {
  const data = [];
  for (let i = 0; i < GEN_N; i++) {
    const strip = new Array(GEN_N);
    for (let jj = 0; jj < GEN_N; jj++) {
      // Tipping the body up sends the heightfield's local +y to world -z, so the
      // row index has to count back down the field.
      const k = (GEN_N - 1 - jj) * GEN_N + i;
      strip[jj] = sTop[k] === NO_COLUMN ? HF_FLOOR : (sTop[k] + 1) * BLOCK;
    }
    data.push(strip);
  }
  return new CANNON.Heightfield(data, { elementSize: BLOCK });
})();
const hfBody = new CANNON.Body({ mass: 0, material: physWorld });
hfBody.addShape(hfShape);
hfBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
hfBody.position.set(colX(0), 0, colZ(GEN_N - 1));
hfBody.updateAABB();
// hfBody removed — voxel collision handles both player and debris

// One column of the collider, after the store under it changed.
function patchCollider(i, j) {
  const top = sTop[j * GEN_N + i];
  const y = top === NO_COLUMN ? HF_FLOOR : (top + 1) * BLOCK;
  hfShape.setHeightValueAtIndex(i, GEN_N - 1 - j, y);
  // Only ever widened. Recomputing the true extremes means walking the whole
  // field, and a bound that is a little loose costs a broadphase test, where one
  // that is too tight drops contacts.
  if (y > hfShape.maxValue) { hfShape.maxValue = y; hfBody.updateAABB(); }
  if (y < hfShape.minValue) { hfShape.minValue = y; hfBody.updateAABB(); }
}

// Where the ground is, for anything that needs to ask — the top of the block you
// would be standing on, or the sea floor where there is no block. It reads the
// voxel store rather than topLvl so that it keeps answering correctly once
// blocks can be taken out of the top of a column.
function groundHeightAt(x, z) {
  const i = colI(x), j = colJ(z);
  if (i < 0 || j < 0 || i >= GEN_N || j >= GEN_N) return -SEABED_DEPTH;
  const top = sTop[j * GEN_N + i];
  return top === NO_COLUMN ? HF_FLOOR : (top + 1) * BLOCK;
}
const onLand = (x, z) => groundHeightAt(x, z) > SEA_Y;

// The origin is well inland whatever the seed does with the relief, so the
// player starts on the column there with their feet a couple of centimetres
// clear of whichever block happens to be on top of it.
SPAWN.set(0, groundHeightAt(0, 0) + PLAYER.standCenter + 0.05, 0);

// ---------------------------------------------------------------------------
// There is no sea mesh. The WATER blocks in the voxel store are the whole of the
// water: the field generates them from the bed up to sea level, so the sea is
// made of the same cubes as the land and stops where they stop. Past the rim of
// the field the fog closes in before the edge is legible.
// ---------------------------------------------------------------------------


// ---------------------------------------------------------------------------
// Camera state + input
// ---------------------------------------------------------------------------
const state = {
  pos: START_POS.clone(),
  yaw: START_YAW * DEG,
  pitch: START_PITCH * DEG,
  sprint: false,
  flyUp: false,
  flyDown: false,
  joyX: 0,
  joyY: 0,
  touchActive: false,
  // character controller — touch buttons latch, keyboard equivalents are held
  jumpQueued: false,
  crouchBtn: false,
  sprintBtn: false,
};
const PITCH_LIMIT = 89 * DEG;
const keys = new Set();

// ----- keyboard -----
const TRACKED = new Set([
  'KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyE', 'KeyQ', 'KeyC', 'KeyV', 'KeyG', 'KeyR',
  'KeyF', 'KeyH', 'KeyZ', 'KeyX', 'KeyT',
  'ShiftLeft', 'ShiftRight', 'Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight',
]);
// A key that lands in a text field is the field's business and nothing else's —
// it must not also drive the character.
const typing = (e) => !!e.target && (e.target.tagName === 'INPUT' || e.target.isContentEditable);

window.addEventListener('keydown', (e) => {
  if (typing(e)) return;
  if (e.repeat) return;
  if (TRACKED.has(e.code)) { keys.add(e.code); e.preventDefault(); }
  if (e.code === 'KeyV') cycleCamera();
  else if (e.code === 'KeyG') toggleGameMode();
  else if (e.code === 'KeyR' && camMode !== CAM.FREE) respawn();
  else if (e.code === 'KeyF') setShovel(!shovel.on);
  else if (e.code === 'KeyH') setHammer(!hammer.on);
  else if (e.code === 'KeyZ') shovelPickUp();
  else if (e.code === 'KeyX') shovelPlace();
  else if (e.code === 'Space' && camMode !== CAM.FREE) state.jumpQueued = true;
  else if (e.code === 'Digit5' || e.code === 'Numpad5') toggleMaterialsUI();
  else if (e.code === 'KeyT') toggleChart();
}, { passive: false });
window.addEventListener('keyup', (e) => {
  if (typing(e)) return;
  if (TRACKED.has(e.code)) { keys.delete(e.code); e.preventDefault(); }
}, { passive: false });
window.addEventListener('blur', () => keys.clear());

// ----- pointer lock / mouse look -----
function requestLock() {
  if (isTouchDevice) return;
  const el = renderer.domElement;
  const fn = el.requestPointerLock || el.mozRequestPointerLock;
  if (fn) {
    const r = fn.call(el);
    if (r && typeof r.catch === 'function') r.catch(() => {});
  }
}
const isLocked = () => document.pointerLockElement === renderer.domElement;

renderer.domElement.addEventListener('mousedown', (e) => {
  if (!isLocked()) { requestLock(); return; }
  // Once the pointer is captured the two buttons are the shovel: left takes the
  // block under the crosshair, right puts one back. Nothing else in the world is
  // clickable, so there is nothing to steal them from.
  // The hammer takes the left button on its own — it is the only thing it does.
  if (hammer.on) { if (e.button === 0) hammerStrike(); return; }
  if (!shovel.on) return;
  if (e.button === 0) shovelPickUp();
  else if (e.button === 2) shovelPlace();
});

document.addEventListener('mousemove', (e) => {
  if (!isLocked()) return;
  state.yaw   -= (e.movementX || 0) * MOUSE_SENSITIVITY * DEG;
  state.pitch -= (e.movementY || 0) * MOUSE_SENSITIVITY * DEG;
  state.pitch = THREE.MathUtils.clamp(state.pitch, -PITCH_LIMIT, PITCH_LIMIT);
});

document.addEventListener('pointerlockchange', () => {
  if (!isLocked() && !isTouchDevice) {
    keys.clear();
    showOverlay();
  }
});

// ----- touch: left half = joystick, right half = look, 2 fingers/side = sprint -----
const stickBase = document.getElementById('stick-base');
const stickKnob = document.getElementById('stick-knob');
const STICK_R = 55;

const touches = new Map();   // identifier -> { zone, role }
let moveId = null;
let lookId = null;
let moveOrigin = { x: 0, y: 0 };

const zoneOf = (x) => (x < window.innerWidth * 0.5 ? 'left' : 'right');

function updateSprint() {
  let l = 0, r = 0;
  for (const t of touches.values()) (t.zone === 'left' ? l++ : r++);
  state.sprint = (l >= 2 || r >= 2);
  sprintEl.classList.toggle('on', state.sprint || keys.has('ShiftLeft') || keys.has('ShiftRight'));
}

function placeStick(x, y) {
  stickBase.style.left = (x - 66) + 'px';
  stickBase.style.top = (y - 66) + 'px';
  stickBase.style.bottom = 'auto';
}

function resetStick() {
  stickBase.classList.remove('active');
  // Cleared rather than written back to a remembered value: the resting place is
  // a stylesheet rule now, and the shovel pad moves it by overriding that rule.
  // An inline `bottom` left behind here would win over the override and park the
  // stick under the PICK UP button.
  stickBase.style.left = '';
  stickBase.style.top = '';
  stickBase.style.bottom = '';
  stickKnob.style.transform = 'translate(0px, 0px)';
  state.joyX = state.joyY = 0;
}

function enableTouchUI() {
  if (state.touchActive) return;
  state.touchActive = true;
  document.body.classList.add('touch');
}

function onTouchStart(e) {
  e.preventDefault();
  enableTouchUI();
  for (const t of e.changedTouches) {
    const zone = zoneOf(t.clientX);
    let role = 'extra';
    if (zone === 'left' && moveId === null) {
      role = 'move';
      moveId = t.identifier;
      moveOrigin = { x: t.clientX, y: t.clientY };
      placeStick(t.clientX, t.clientY);
      stickBase.classList.add('active');
    } else if (zone === 'right' && lookId === null) {
      role = 'look';
      lookId = t.identifier;
    }
    touches.set(t.identifier, { zone, role, x: t.clientX, y: t.clientY });
  }
  updateSprint();
}

// These two are bound on `window`, so every touch in the document passes through
// them — including the ones that landed on a HUD button. Calling preventDefault()
// on those was suppressing the click the browser would otherwise synthesise, and
// that is what made the mode button unreliable on touch. Only speak for the
// touches we actually took ownership of in onTouchStart.
function ownsAny(e) {
  for (const t of e.changedTouches) if (touches.has(t.identifier)) return true;
  return false;
}

function onTouchMove(e) {
  if (!ownsAny(e)) return;
  e.preventDefault();
  for (const t of e.changedTouches) {
    const rec = touches.get(t.identifier);
    if (!rec) continue;

    if (rec.role === 'look') {
      const dx = t.clientX - rec.x;
      const dy = t.clientY - rec.y;
      state.yaw   -= dx * MOUSE_SENSITIVITY * TOUCH_LOOK_MULT * DEG;
      state.pitch -= dy * MOUSE_SENSITIVITY * TOUCH_LOOK_MULT * DEG;
      state.pitch = THREE.MathUtils.clamp(state.pitch, -PITCH_LIMIT, PITCH_LIMIT);
    } else if (rec.role === 'move') {
      let dx = t.clientX - moveOrigin.x;
      let dy = t.clientY - moveOrigin.y;
      const len = Math.hypot(dx, dy);
      if (len > STICK_R) { dx = dx / len * STICK_R; dy = dy / len * STICK_R; }
      stickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
      state.joyX = dx / STICK_R;
      state.joyY = dy / STICK_R;
    }
    rec.x = t.clientX;
    rec.y = t.clientY;
  }
}

function onTouchEnd(e) {
  if (!ownsAny(e)) return;
  e.preventDefault();
  for (const t of e.changedTouches) {
    const rec = touches.get(t.identifier);
    if (!rec) continue;
    touches.delete(t.identifier);
    if (t.identifier === moveId) { moveId = null; resetStick(); }
    if (t.identifier === lookId) { lookId = null; }
  }
  // promote a leftover finger so control never gets stuck after a multi-touch
  if (lookId === null) {
    for (const [id, rec] of touches) {
      if (rec.role === 'extra' && rec.zone === 'right') { rec.role = 'look'; lookId = id; break; }
    }
  }
  if (moveId === null) {
    for (const [id, rec] of touches) {
      if (rec.role === 'extra' && rec.zone === 'left') {
        rec.role = 'move';
        moveId = id;
        moveOrigin = { x: rec.x, y: rec.y };
        placeStick(rec.x, rec.y);
        stickBase.classList.add('active');
        break;
      }
    }
  }
  updateSprint();
}

// The touch UI should come up on the first touch anywhere, not only on the first
// touch that happens to land on the canvas — starting the session by tapping the
// mode button used to leave the joystick and pads hidden.
window.addEventListener('touchstart', enableTouchUI, { passive: true, capture: true });
canvas.addEventListener('touchstart', onTouchStart, { passive: false });
window.addEventListener('touchmove', onTouchMove, { passive: false });
window.addEventListener('touchend', onTouchEnd, { passive: false });
window.addEventListener('touchcancel', onTouchEnd, { passive: false });

// kill browser pinch-zoom / scroll / long-press menus
for (const ev of ['gesturestart', 'gesturechange', 'gestureend']) {
  document.addEventListener(ev, (e) => e.preventDefault(), { passive: false });
}
document.addEventListener('contextmenu', (e) => e.preventDefault());
document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });

// ----- on-screen fly buttons -----
function bindHold(el, on, off) {
  const press = (e) => { e.preventDefault(); e.stopPropagation(); el.classList.add('down'); on(); };
  const release = (e) => { e.preventDefault(); e.stopPropagation(); el.classList.remove('down'); off(); };
  el.addEventListener('touchstart', press, { passive: false });
  el.addEventListener('touchend', release, { passive: false });
  el.addEventListener('touchcancel', release, { passive: false });
  el.addEventListener('mousedown', press);
  window.addEventListener('mouseup', () => { el.classList.remove('down'); off(); });
}
bindHold(document.getElementById('btn-up'),   () => state.flyUp = true,   () => state.flyUp = false);
bindHold(document.getElementById('btn-down'), () => state.flyDown = true, () => state.flyDown = false);

// A one-shot tap, for the HUD buttons that toggle something rather than being
// held. `click` alone is not enough: a touch that ends anywhere near a window
// listener calling preventDefault() never produces one, which is why the mode
// button used to work on some taps and not others. Take pointerdown when the
// browser has it and fall back to click when it does not, and never act on both
// — once a pointerdown has been seen, the compatibility click is dead to us.
function bindTap(el, fn) {
  let sawPointer = false;
  const fire = (e) => {
    e.preventDefault();
    e.stopPropagation();
    if (el.blur) el.blur();     // otherwise Space would re-press the focused button
    fn(e);
  };
  el.addEventListener('pointerdown', (e) => { sawPointer = true; fire(e); });
  el.addEventListener('click', (e) => {
    if (sawPointer) { e.preventDefault(); e.stopPropagation(); return; }
    fire(e);
  });
  // Keep the canvas / overlay handlers out of it entirely.
  el.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true });
  el.addEventListener('touchend', (e) => e.stopPropagation(), { passive: true });
}

// ----- on-screen action buttons (first / third person) -----
const btnJump   = document.getElementById('btn-jump');
const btnCrouch = document.getElementById('btn-crouch');
const btnSprint = document.getElementById('btn-sprint');

bindHold(btnJump, () => { state.jumpQueued = true; }, () => {});
function bindToggle(el, get, set) {
  const press = (e) => {
    e.preventDefault();
    e.stopPropagation();
    set(!get());
    el.classList.toggle('down', get());
  };
  el.addEventListener('touchstart', press, { passive: false });
  el.addEventListener('mousedown', press);
}
bindToggle(btnCrouch, () => state.crouchBtn, (v) => state.crouchBtn = v);
bindToggle(btnSprint, () => state.sprintBtn, (v) => state.sprintBtn = v);

const isSprinting = () =>
  state.sprint || state.sprintBtn || keys.has('ShiftLeft') || keys.has('ShiftRight');

// ---------------------------------------------------------------------------
// Character controller — a cannon-es body whose velocity is driven by input
// rather than by forces, so the movement stays crisp and predictable.
// ---------------------------------------------------------------------------
const playerBody = new CANNON.Body({
  // Heavier than the crates on purpose. The controller sets velocity directly so
  // mass never affects how the character itself moves — it only decides how much
  // authority the body has in contact impulses, i.e. whether walking into a crate
  // shoves it or stalls against it.
  mass: 6,
  material: physPlayer,
  fixedRotation: true,
  linearDamping: 0,
  angularDamping: 1,
  allowSleep: false,
  collisionFilterGroup: PLAYER_GROUP,
  collisionFilterMask: DEBRIS_GROUP,
  collisionResponse: false,
});
let crouched = false;

function setPlayerShape(crouch) {
  while (playerBody.shapes.length) playerBody.removeShape(playerBody.shapes[0]);
  const r = PLAYER.radius;
  if (crouch) {
    playerBody.addShape(new CANNON.Sphere(r));                            // 0.8 tall
  } else {
    // Three stacked spheres stand in for a 1.6-tall capsule (cannon has no
    // capsule primitive). Rounded feet ride over kerbs and up ramps without a
    // dedicated step-up hack.
    playerBody.addShape(new CANNON.Sphere(r), new CANNON.Vec3(0, -0.4, 0));
    playerBody.addShape(new CANNON.Sphere(r), new CANNON.Vec3(0,  0.0, 0));
    playerBody.addShape(new CANNON.Sphere(r), new CANNON.Vec3(0,  0.4, 0));
  }
  playerBody.updateBoundingRadius();
  playerBody.updateMassProperties();   // honours fixedRotation, keeps mass = 1
}
setPlayerShape(false);
playerBody.position.set(SPAWN.x, SPAWN.y, SPAWN.z);
playerBody.updateAABB();
world.addBody(playerBody);

// Visible body — hidden in first person, shown everywhere else.
const playerGeoStand  = new THREE.CapsuleGeometry(PLAYER.radius, 0.8, 6, 18);
const playerGeoCrouch = new THREE.CapsuleGeometry(PLAYER.radius, 0.0, 6, 18);
const playerMesh = new THREE.Mesh(
  playerGeoStand,
  mat(0x63b9ff, 0.42, 0.28, { emissive: 0x0d2c4a, emissiveIntensity: 0.55 })
);
playerMesh.castShadow = true;
playerMesh.receiveShadow = true;
const visor = new THREE.Mesh(
  new THREE.BoxGeometry(0.34, 0.12, 0.14),
  mat(0xffe6a8, 0.3, 0.1, { emissive: 0x6a4a10, emissiveIntensity: 0.9 })
);
visor.position.set(0, 0.42, -0.34);
playerMesh.add(visor);
scene.add(playerMesh);

// Steepest-upward contact normal touching the player, refreshed every substep.
// A contact whose normal is within maxSlope of straight up is walkable ground.
let groundNy = 0;
world.addEventListener('postStep', () => {
  let best = 0;
  for (const c of world.contacts) {
    let ny;
    if (c.bi === playerBody) ny = -c.ni.y;        // ni runs from bi to bj
    else if (c.bj === playerBody) ny = c.ni.y;
    else continue;
    if (ny > best) best = ny;
  }
  groundNy = best;
});

let coyote = 0;                       // grace period for late jump presses
let jumpLock = 0;                     // contacts survive a step after take-off
let eyeH = PLAYER.standEye;           // smoothed, so crouching ducks the view
let playerYaw = SPAWN_YAW * DEG;
const wishDir = new THREE.Vector3();

const centerOffset = () => (crouched ? PLAYER.crouchCenter : PLAYER.standCenter);

// Is there room to stand back up, or are we under the crouch tunnel?
function hasHeadroom() {
  const p = playerBody.position;
  const from = new CANNON.Vec3(p.x, p.y, p.z);
  const to   = new CANNON.Vec3(p.x, p.y + 1.35, p.z);
  let blocked = false;
  world.raycastAll(from, to, {}, (res) => { if (res.body !== playerBody) blocked = true; });
  return !blocked;
}

function respawn() {
  playerBody.position.set(SPAWN.x, SPAWN.y, SPAWN.z);
  playerBody.velocity.setZero();
  playerBody.wakeUp();
  state.yaw = SPAWN_YAW * DEG;
  state.pitch = 0;
}

// Block-by-block collision: every solid voxel is a hard cube, so an overhang is
// collided with where it actually is rather than at the top of its column the
// way the heightfield reports it. The player is three stacked spheres standing
// (one crouched); each sphere is pushed along the shortest way out of every
// block it overlaps, walls included. Pushes are combined by keeping the deepest
// one per direction rather than summing them, so resting on the seam between
// four columns doesn't launch anyone.
function voxelCollide(px, py, pz) {
  const r = PLAYER.radius;
  const centers = crouched
    ? [px, py, pz]
    : [px, py - 0.4, pz, px, py, pz, px, py + 0.4, pz];
  let xp = 0, xn = 0, yp = 0, yn = 0, zp = 0, zn = 0;
  for (let c = 0; c < centers.length; c += 3) {
    const cx = centers[c], cy = centers[c + 1], cz = centers[c + 2];
    const mi = colI(cx - r), xi = colI(cx + r);
    const mj = colJ(cz - r), xj = colJ(cz + r);
    const mlvl = Math.floor((cy - r) / BLOCK), xlvl = Math.floor((cy + r) / BLOCK);
    for (let jj = mj; jj <= xj; jj++) {
      for (let ii = mi; ii <= xi; ii++) {
        if (ii < 0 || jj < 0 || ii >= GEN_N || jj >= GEN_N) continue;
        const k = jj * GEN_N + ii;
        const top = sTop[k];
        if (top === NO_COLUMN) continue;
        const o = voxOff[k] - VOX_FLOOR;
        const lo = Math.max(VOX_FLOOR, mlvl), hi = Math.min(top, xlvl);
        const bx = colX(ii), bz = colZ(jj);
        for (let lvl = lo; lvl <= hi; lvl++) {
          const m = voxMat[o + lvl];
          if (m === AIR || m === WATER) continue;
          const bminY = lvl * BLOCK, bmaxY = bminY + BLOCK;
          // Closest point on the block's box to this sphere centre.
          const qx = Math.min(Math.max(cx, bx - HALF_BLOCK), bx + HALF_BLOCK);
          const qy = Math.min(Math.max(cy, bminY), bmaxY);
          const qz = Math.min(Math.max(cz, bz - HALF_BLOCK), bz + HALF_BLOCK);
          const dx = cx - qx, dy = cy - qy, dz = cz - qz;
          const d2 = dx * dx + dy * dy + dz * dz;
          let nx = 0, ny = 0, nz = 0, overlap;
          if (d2 > 1e-12) {
            const d = Math.sqrt(d2);
            if (d >= r) continue;
            overlap = r - d;
            nx = dx / d; ny = dy / d; nz = dz / d;
          } else {
            // Centre is buried in the block — leave through its nearest face.
            const ex = Math.min(cx - bx + HALF_BLOCK, bx + HALF_BLOCK - cx);
            const ey = Math.min(cy - bminY, bmaxY - cy);
            const ez = Math.min(cz - bz + HALF_BLOCK, bz + HALF_BLOCK - cz);
            if (ey <= ex && ey <= ez)  { ny = cy - bminY < bmaxY - cy ? -1 : 1; overlap = ey + r; }
            else if (ex <= ez)         { nx = cx < bx ? -1 : 1;                 overlap = ex + r; }
            else                       { nz = cz < bz ? -1 : 1;                 overlap = ez + r; }
          }
          const ox = nx * overlap, oy = ny * overlap, oz = nz * overlap;
          if (ox > xp) xp = ox; else if (ox < xn) xn = ox;
          if (oy > yp) yp = oy; else if (oy < yn) yn = oy;
          if (oz > zp) zp = oz; else if (oz < zn) zn = oz;
        }
      }
    }
  }
  return { x: xp + xn, y: yp + yn, z: zp + zn };
}

function updatePlayer(dt) {
  const p = playerBody.position, v = playerBody.velocity;

  // Voxel override: the heightfield only knows the column top, so push the
  // player out of whatever solid blocks they are actually inside — sideways as
  // well as up, otherwise an overhang's column reads as a full-height wall.
  const push = voxelCollide(p.x, p.y, p.z);
  p.x += push.x;
  p.y += push.y;
  p.z += push.z;
  if (push.y > 0.001) {
    groundNy = 1.0;
    if (v.y < 0) v.y = 0;
  }
  // Backstop under the open sea, where there are no voxels to stand on.
  if (p.y - centerOffset() < HF_FLOOR) {
    p.y = HF_FLOOR + centerOffset();
    if (v.y < 0) v.y = 0;
    groundNy = 1.0;
  }

  // --- crouch: held on desktop, latched on touch ---
  const wantCrouch = keys.has('KeyC') || state.crouchBtn;
  if (wantCrouch && !crouched) {
    setPlayerShape(true);
    p.y -= PLAYER.standCenter - PLAYER.crouchCenter;   // keep the feet planted
    crouched = true;
  } else if (!wantCrouch && crouched && hasHeadroom()) {
    setPlayerShape(false);
    p.y += PLAYER.standCenter - PLAYER.crouchCenter;
    crouched = false;
  }

  jumpLock = Math.max(0, jumpLock - dt);
  const grounded = groundNy > GROUND_DOT && jumpLock === 0;
  const onSteep  = !grounded && groundNy > 0.05 && groundNy <= GROUND_DOT;
  coyote = grounded ? PLAYER.coyote : Math.max(0, coyote - dt);

  // --- wish direction ---
  const sy = Math.sin(state.yaw), cy = Math.cos(state.yaw);
  wishDir.set(0, 0, 0);
  if (camMode === CAM.TOP) {
    // Top-down drives the world axes directly — the camera has no heading to be
    // relative to, so W is north rather than "forward".
    if (keys.has('KeyW') || keys.has('ArrowUp'))    wishDir.z -= 1;
    if (keys.has('KeyS') || keys.has('ArrowDown'))  wishDir.z += 1;
    if (keys.has('KeyA') || keys.has('ArrowLeft'))  wishDir.x -= 1;
    if (keys.has('KeyD') || keys.has('ArrowRight')) wishDir.x += 1;
    wishDir.x += state.joyX;
    wishDir.z += state.joyY;
  } else {
    let fwd = 0, str = 0;
    if (keys.has('KeyW') || keys.has('ArrowUp'))    fwd += 1;
    if (keys.has('KeyS') || keys.has('ArrowDown'))  fwd -= 1;   // backpedal
    if (keys.has('KeyD') || keys.has('ArrowRight')) str += 1;
    if (keys.has('KeyA') || keys.has('ArrowLeft'))  str -= 1;
    fwd -= state.joyY;                                          // stick up = forward
    str += state.joyX;
    wishDir.set(-sy * fwd + cy * str, 0, -cy * fwd - sy * str);
  }
  const wl = wishDir.length();
  if (wl > 1) wishDir.divideScalar(wl);

  const speed = crouched
    ? PLAYER.crouchSpeed
    : PLAYER.walk * (isSprinting() ? PLAYER.sprintMult : 1);

  // Sprint drives forward and strafe only: whatever part of the target velocity
  // points behind the camera is trimmed back to the walk speed, so you can back
  // up but never backpedal at a sprint. Top-down has no camera heading to be
  // behind, so it keeps driving the world axes as before.
  let tx = wishDir.x * speed, tz = wishDir.z * speed;
  if (camMode !== CAM.TOP) {
    const backCap = Math.min(speed, PLAYER.walk);
    const along = tx * -sy + tz * -cy;      // + ahead of the camera, - behind it
    if (along < -backCap) {
      const over = along + backCap;         // negative — the excess to take out
      tx += sy * over;                      // i.e. t -= over * forward
      tz += cy * over;
    }
  }

  if (grounded) {
    const k = 1 - Math.exp(-PLAYER.groundAccel * dt);
    v.x += (tx - v.x) * k;
    v.z += (tz - v.z) * k;
  } else if (!onSteep) {
    // Reduced authority in the air; never scrubs speed you already carried, so a
    // sprint jump keeps its momentum even if shift is released mid-flight.
    const hs0 = Math.hypot(v.x, v.z);
    v.x += wishDir.x * PLAYER.airAccel * dt;
    v.z += wishDir.z * PLAYER.airAccel * dt;
    const hs = Math.hypot(v.x, v.z);
    const cap = Math.max(hs0, Math.hypot(tx, tz));
    if (hs > cap) { v.x = v.x / hs * cap; v.z = v.z / hs * cap; }
  }
  // Steeper than maxSlope: no input authority at all. Player/level friction is
  // zero, so gravity simply slides you back down — that is the red 55-degree lane.

  // --- jump ---
  if ((state.jumpQueued || keys.has('Space')) && coyote > 0 && !crouched) {
    v.y = PLAYER.jumpSpeed;
    coyote = 0;
    groundNy = 0;
    jumpLock = 0.15;
    playerBody.wakeUp();
  }
  state.jumpQueued = false;

  if (p.y < -25) respawn();

  // --- derived view state ---
  const targetEye = crouched ? PLAYER.crouchEye : PLAYER.standEye;
  eyeH += (targetEye - eyeH) * (1 - Math.exp(-14 * dt));

  if (camMode === CAM.TOP) {
    if (Math.hypot(v.x, v.z) > 0.4) playerYaw = Math.atan2(-v.x, -v.z);
  } else {
    playerYaw = state.yaw;
  }

  // In top-down the fly pad and E/Q become zoom controls.
  if (camMode === CAM.TOP) {
    const out = state.flyUp   || keys.has('KeyE');
    const inn = state.flyDown || keys.has('KeyQ');
    if (out) topZoom = Math.min(90, topZoom + 22 * dt);
    if (inn) topZoom = Math.max(8, topZoom - 22 * dt);
  }
}

// ---------------------------------------------------------------------------
// Camera modes
// ---------------------------------------------------------------------------
const CAM = { FIRST: 0, THIRD: 1, TOP: 2, FREE: 3 };
const CAM_NAMES = ['First Person', 'Third Person', 'Top Down', 'Free Camera'];
let camMode = CAM.FREE;               // start exactly as the old build did
let lastGameCam = CAM.FIRST;
let topZoom = 26;
let blendT = 1;                        // 1 = settled, <1 = mid transition
const BLEND_DUR = 0.42;
const blendPos = new THREE.Vector3();
const blendQuat = new THREE.Quaternion();

function setCamMode(next) {
  if (next === camMode) return;
  let snap = false;

  if (next === CAM.FREE) {
    lastGameCam = camMode;
    // Hand the flying camera the transform we are already looking through so
    // detaching from physics is seamless; yaw/pitch are shared already.
    state.pos.copy(camera.position);
  } else if (camMode === CAM.FREE) {
    snap = true;                       // re-attaching jumps straight to the body
    playerBody.wakeUp();
  }

  camMode = next;
  if (snap) {
    blendT = 1;
  } else {
    blendPos.copy(camera.position);
    blendQuat.copy(camera.quaternion);
    blendT = 0;
  }
  refreshModeUI();
}
function cycleCamera()   { setCamMode((camMode + 1) % 4); }
function toggleGameMode() { setCamMode(camMode === CAM.FREE ? lastGameCam : CAM.FREE); }

const desiredPos  = new THREE.Vector3();
const desiredQuat = new THREE.Quaternion();
const camEuler    = new THREE.Euler(0, 0, 0, 'YXZ');
const camTarget   = new THREE.Vector3();
const camBack     = new THREE.Vector3();
const boomRay     = new THREE.Raycaster();

function updateCamera(dt) {
  const p = playerBody.position;
  const feetY = p.y - centerOffset();

  if (camMode === CAM.FREE) {
    desiredPos.copy(state.pos);
    camEuler.set(state.pitch, state.yaw, 0);
  } else if (camMode === CAM.TOP) {
    desiredPos.set(p.x, feetY + topZoom, p.z);
    camEuler.set(-Math.PI / 2, 0, 0);
  } else {
    camEuler.set(state.pitch, state.yaw, 0);
    if (camMode === CAM.FIRST) {
      desiredPos.set(p.x, feetY + eyeH, p.z);
    } else {
      camTarget.set(p.x, feetY + eyeH * 0.86, p.z);
      camBack.set(0, 0, 1).applyEuler(camEuler);      // straight back along view
      let dist = THIRD_DIST;
      boomRay.set(camTarget, camBack);
      boomRay.far = dist + 0.5;
      const hit = boomRay.intersectObjects(objects.children, false)[0];
      if (hit) dist = Math.max(1.1, hit.distance - 0.35);   // pull in past props
      desiredPos.copy(camTarget).addScaledVector(camBack, dist);
    }
    // The boom ray only knows about the props, so the ground is handled
    // separately: never let the boom drop the camera through the deck. Off the
    // platform the floor is the sea bed. (Top-down needs no such guard — it sits straight
    // above the player, and flat ground has nothing overhead.)
    const floorY = groundHeightAt(desiredPos.x, desiredPos.z) + 0.6;
    if (desiredPos.y < floorY) desiredPos.y = floorY;
  }
  desiredQuat.setFromEuler(camEuler);

  if (blendT < 1) {
    blendT = Math.min(1, blendT + dt / BLEND_DUR);
    const s = blendT * blendT * (3 - 2 * blendT);       // smoothstep
    camera.position.lerpVectors(blendPos, desiredPos, s);
    camera.quaternion.slerpQuaternions(blendQuat, desiredQuat, s);
  } else {
    camera.position.copy(desiredPos);
    camera.quaternion.copy(desiredQuat);
  }

  playerMesh.visible = camMode !== CAM.FIRST;
  playerMesh.geometry = crouched ? playerGeoCrouch : playerGeoStand;
  visor.position.y = crouched ? 0.10 : 0.42;
  playerMesh.position.set(p.x, p.y, p.z);
  playerMesh.rotation.y = playerYaw;
}

window.addEventListener('wheel', (e) => {
  if (camMode !== CAM.TOP) return;
  topZoom = THREE.MathUtils.clamp(topZoom + e.deltaY * 0.03, 8, 90);
  e.preventDefault();
}, { passive: false });

// ---------------------------------------------------------------------------
// The shovel — a temporary tool for picking blocks up and putting them down.
//
// The one rule it enforces is conservation: a block leaves the world only by
// going into your hands and re-enters it only by coming back out of them, so
// `worldBlocks + shovel.held.length` is the same number it was at load, forever.
// That is why the two halves are not symmetrical in the code below — the pick-up
// checks that there is really something there before it pushes, and the place
// checks that the write will really land before it pops. Neither one can leak.
//
// Each block carries its material with it, so a rock you take out of a cliff
// goes back down as rock wherever you put it.
//
// It is meant to be temporary: it edits the store, patches the collider column
// under the block and redraws the mesh chunk around it, and that is the whole of
// it. There is no undo, nothing is saved, and the heightfield collider can only
// follow the *top* of each column — dig sideways into a cliff and you will walk
// through the overhang you left above you.
// ---------------------------------------------------------------------------
const SHOVEL_REACH = 6.0;      // metres of reach from the eye
const SHOVEL_CAP   = 64;       // blocks your hands hold
const MAT_NAMES = [
  'sand', 'dirt', 'rock', 'water',
  'fine dirt', 'mud', 'hard dirt', 'fine mud',
  'stone dust', 'stone mud', 'brittle stone',
  'clay', 'clay mud', 'hard clay',
  'wet sand', 'hard sand',
];

const shovel = {
  on: false,
  held: [],       // materials, last in first out — you put back what you just took
  hit: null,      // {i, j, lvl} the block being looked at, or null
  spot: null,     // {i, j, lvl} the empty cell a placed block would go into
  debris: null,   // {mesh, local, i, j, lvl} a loose fallen piece being looked at instead
};

// The hammer knocks one block out of the world and lets it fall. It carries
// nothing and holds nothing, so all it needs is the cell under the crosshair.
const hammer = {
  on: false,
  hit: null,      // {i, j, lvl} the block a strike would knock loose, or null
};

// ----- the ray -----
// Amanatides & Woo over the column grid. It reports the first solid cell along
// the ray *and* the last empty one before it, which are exactly the two cells a
// pick-up and a place need — a face you can see is a block to take and a gap in
// front of it to fill.
const ddaHit  = { i: 0, j: 0, lvl: 0 };
const ddaPrev = { i: 0, j: 0, lvl: 0 };
function voxelRay(ox, oy, oz, dx, dy, dz, reach) {
  // One grid unit per block, so the DDA is the textbook unit-cell one and the
  // direction carries over unchanged (the scaling is uniform).
  const gx = (ox + GEN_R) / BLOCK, gy = oy / BLOCK, gz = (oz + GEN_R) / BLOCK;
  let i = Math.floor(gx), lvl = Math.floor(gy), j = Math.floor(gz);
  const si = dx > 0 ? 1 : -1, sl = dy > 0 ? 1 : -1, sj = dz > 0 ? 1 : -1;
  const tdI = dx !== 0 ? Math.abs(1 / dx) : Infinity;
  const tdL = dy !== 0 ? Math.abs(1 / dy) : Infinity;
  const tdJ = dz !== 0 ? Math.abs(1 / dz) : Infinity;
  let tI = dx !== 0 ? (dx > 0 ? i + 1 - gx : gx - i) * tdI : Infinity;
  let tL = dy !== 0 ? (dy > 0 ? lvl + 1 - gy : gy - lvl) * tdL : Infinity;
  let tJ = dz !== 0 ? (dz > 0 ? j + 1 - gz : gz - j) * tdJ : Infinity;
  const tMax = reach / BLOCK;

  let pi = i, pj = j, pl = lvl, t = 0;
  for (let step = 0; step < 256; step++) {
    if (voxelAt(i, j, lvl) !== AIR) {
      ddaHit.i = i;   ddaHit.j = j;   ddaHit.lvl = lvl;
      ddaPrev.i = pi; ddaPrev.j = pj; ddaPrev.lvl = pl;
      return true;
    }
    pi = i; pj = j; pl = lvl;
    if (tI <= tL && tI <= tJ)  { t = tI; i   += si; tI += tdI; }
    else if (tL <= tJ)         { t = tL; lvl += sl; tL += tdL; }
    else                       { t = tJ; j   += sj; tJ += tdJ; }
    if (t > tMax) return false;
  }
  return false;
}

// Would a block at this cell be inside the player? Placing one there would leave
