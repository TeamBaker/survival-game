<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tension Sandbox</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#151d2b;color:#c8d0dc;font-family:-apple-system,sans-serif;
  display:flex;flex-direction:column;height:100dvh;overflow:hidden;touch-action:none}

.top-bar{display:flex;align-items:center;gap:6px;padding:6px 8px;flex-wrap:wrap}
.mswatch{width:32px;height:32px;border-radius:8px;border:2px solid transparent;cursor:pointer}
.mswatch.on{border-color:#fff}
.mswatch.ground{border:2px dashed #666}
.btn{padding:4px 12px;border:1px solid rgba(255,255,255,.25);background:rgba(20,34,54,.62);
  color:#c8d0dc;border-radius:999px;cursor:pointer;font-size:12px;-webkit-tap-highlight-color:transparent}
.btn.on{background:rgba(102,181,244,.25);border-color:#66b5f4}
.btn.red{border-color:rgba(255,100,80,.5)}
.stats{padding:4px 8px;font-size:11px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
#cv{flex:1;touch-action:none}
</style>
</head>
<body>

<div class="top-bar" id="toolbar">
  <div class="mswatch ground" id="sw-ground" title="Ground (immune)"></div>
  <div class="mswatch" id="sw-0"></div>
  <div class="mswatch" id="sw-1"></div>
  <div class="mswatch" id="sw-2"></div>
  <div class="mswatch" id="sw-3"></div>
  <div class="mswatch" id="sw-4"></div>
  <div class="mswatch" id="sw-custom" title="Custom"></div>
  <button class="btn" id="btn-place">Place</button>
  <button class="btn" id="btn-remove">Remove</button>
  <button class="btn" id="btn-step">Step</button>
  <button class="btn red" id="btn-sim">Simulate</button>
  <button class="btn red" id="btn-reset">Reset</button>
</div>
<div class="stats" id="stats"></div>
<canvas id="cv"></canvas>

<script>
const GRIDS=[
  {label:'Ground',color:'#444',ground:true},
  {label:'Sand',color:'#c8b464',weight:1.1,strength:0.5},
  {label:'Dirt',color:'#8b6914',weight:1.0,strength:1.0},
  {label:'Rock',color:'#9e9e9e',weight:3.0,strength:7.0},
  {label:'Clay',color:'#cd7f32',weight:1.2,strength:1.2},
  {label:'Iron',color:'#5c7a8a',weight:4.0,strength:5.0},
];
const CUSTOM={label:'Custom',color:'#c080ff',weight:1,strength:1};
const GROUND_COL='#3a3a3a';

const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
let W,H,rows,cols,cell;
let grid=[];
let sel=1,mode='place';
let simming=false,simInterval=null;
let dragging=false,dragErase=false;

function stressColor(ratio){
  ratio=Math.min(1,Math.max(0,ratio));
  if(ratio<0.5){
    const t=ratio*2;
    return `rgb(${Math.round(80+175*t)},${Math.round(200+55*t)},${Math.round(80-80*t)})`;
  } else {
    const t=(ratio-0.5)*2;
    return `rgb(255,${Math.round(255-200*t)},0)`;
  }
}

function resize(){
  const r=cv.getBoundingClientRect();
  cv.width=r.width*devicePixelRatio;
  cv.height=r.height*devicePixelRatio;
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  W=r.width;H=r.height;
  calcGrid();draw();
}
function calcGrid(){
  const availH=H-10;
  cell=Math.floor(Math.min(W/20, availH/14));
  if(cell<16)cell=16;
  cols=Math.floor(W/cell);
  rows=Math.floor(H/cell);
  while(grid.length<rows) grid.push(new Array(cols).fill(null));
  while(grid[0]&&grid[0].length<cols){
    for(let r=0;r<grid.length;r++) grid[r].push(null);
  }
  for(let c=0;c<cols;c++){
    if(!grid[rows-1][c]) grid[rows-1][c]={m:0,ground:true};
  }
  buildStats();
}

function draw(){
  ctx.clearRect(0,0,W,H);

  // Grid lines
  ctx.strokeStyle='rgba(255,255,255,0.07)';
  ctx.lineWidth=1;
  for(let c=0;c<=cols;c++){
    ctx.beginPath();ctx.moveTo(c*cell+0.5,0);ctx.lineTo(c*cell+0.5,rows*cell);ctx.stroke();
  }
  for(let r=0;r<=rows;r++){
    ctx.beginPath();ctx.moveTo(0,r*cell+0.5);ctx.lineTo(cols*cell,r*cell+0.5);ctx.stroke();
  }

  const stress=computeStressEdges();

  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const b=grid[r][c];if(!b)continue;
      const x=c*cell,y=r*cell;

      if(b.ground){
        ctx.fillStyle=GROUND_COL;
        ctx.fillRect(x,y,cell,cell);
        ctx.strokeStyle='#2a2a2a';
        ctx.lineWidth=1;
        ctx.strokeRect(x+.5,y+.5,cell-1,cell-1);
      } else {
        ctx.fillStyle=(GRIDS[b.m]||CUSTOM).color;
        ctx.fillRect(x+1,y+1,cell-2,cell-2);

        const edges=stress[`${r},${c}`];
        if(edges){
          ctx.lineWidth=Math.max(2,cell*0.15);
          ctx.lineCap='round';
          if(edges.top!=null){ctx.strokeStyle=stressColor(edges.top);
            ctx.beginPath();ctx.moveTo(x+2,y+2);ctx.lineTo(x+cell-2,y+2);ctx.stroke();}
          if(edges.bottom!=null){ctx.strokeStyle=stressColor(edges.bottom);
            ctx.beginPath();ctx.moveTo(x+2,y+cell-2);ctx.lineTo(x+cell-2,y+cell-2);ctx.stroke();}
          if(edges.left!=null){ctx.strokeStyle=stressColor(edges.left);
            ctx.beginPath();ctx.moveTo(x+2,y+2);ctx.lineTo(x+2,y+cell-2);ctx.stroke();}
          if(edges.right!=null){ctx.strokeStyle=stressColor(edges.right);
            ctx.beginPath();ctx.moveTo(x+cell-2,y+2);ctx.lineTo(x+cell-2,y+cell-2);ctx.stroke();}
        }
      }
    }
  }
}

/*
 * SEPARATION TENSION — only edges where a block is pulling away from its support.
 *
 * Model:
 *   Each non-ground block's WEIGHT presses down on whatever is below it.
 *   "Separation tension" on an edge = how much weight that edge connection
 *   must hold relative to its strength.
 *
 *   Bottom edge of block (r,c):  tension = (weight of this block + weight above) / strength of connection to (r+1,c)
 *     - If (r+1,c) is ground → infinite strength → no tension
 *     - If (r+1,c) is empty → no support → max tension (the block will fall)
 *     - If (r+1,c) is a block → strength = min(this block's strength, below block's strength)
 *
 *   Side edge of block (r,c):  tension = (weight above block) / side connection strength
 *     - Only relevant if block is overhanging (nothing below, or weak below)
 *     - Side holds = weight that would otherwise fall
 *
 *   Top edge of block (r,c):  tension = 0 (nothing pressing down from above in separation model)
 */
function computeStressEdges(){
  const result={};

  // First: for each block, compute total weight ABOVE it in its column (load it bears)
  // loadAbove[r][c] = sum of weights of non-ground blocks in positions (0..r-1, c)
  const loadAbove=[];
  for(let r=0;r<rows;r++){
    loadAbove[r]=new Float64Array(cols);
  }
  for(let c=0;c<cols;c++){
    let sum=0;
    for(let r=0;r<rows;r++){
      const b=grid[r][c];if(!b||b.ground)continue;
      loadAbove[r][c]=sum;
      const mat=GRIDS[b.m]||CUSTOM;
      sum+=mat.weight||1;
    }
  }

  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const b=grid[r][c];if(!b||b.ground)continue;
      const mat=GRIDS[b.m]||CUSTOM;
      const strength=mat.strength||1;
      const myWeight=mat.weight||1;
      const above=loadAbove[r][c]; // total weight above me

      // Total weight pressing on what's below me = my weight + everything above me
      const totalBelow=myWeight+above;
      // Total weight pressing on me from above = above
      const totalAbove=above;

      const edges={};
      let any=false;

      // --- BOTTOM EDGE: how hard am I pulling on what's below? ---
      const below=grid[r+1]&&grid[r+1][c];
      if(!below){
        // Nothing below — bottom edge is totally unsupported
        // Tension = max (this block is falling)
        edges.bottom=Math.min(1.5,totalBelow/strength);
        any=true;
      } else if(!below.ground){
        // Block below — connection strength
        const belowMat=GRIDS[below.m]||CUSTOM;
        const connStrength=Math.min(strength,belowMat.strength||1);
        const ratio=totalBelow/connStrength;
        if(ratio>0.05){
          edges.bottom=Math.min(1.5,ratio);
          any=true;
        }
      }
      // If below is ground → no bottom tension (infinite support)

      // --- SIDE EDGES: if I'm overhanging, sides hold me up ---
      // A side (left/right) is under tension if this block has weight above it
      // that needs to be held laterally because there's weak/no bottom support.
      const belowSupported=below&&!below.ground?Math.min(strength,(GRIDS[below.m]||CUSTOM).strength||1):below?.ground?9999:0;
      const needsSideHelp=belowSupported<totalBelow;

      if(needsSideHelp&&totalAbove>0.01){
        // Left connection
        if(c>0){
          const left=grid[r][c-1];
          if(left){
            const ls=(GRIDS[left.m]||CUSTOM).strength||1;
            const ratio=totalAbove*0.5/ls; // side shares half the above-weight
            if(ratio>0.05){edges.left=Math.min(1.5,ratio);any=true;}
          }
        }
        // Right connection
        if(c<cols-1){
          const right=grid[r][c+1];
          if(right){
            const rs=(GRIDS[right.m]||CUSTOM).strength||1;
            const ratio=totalAbove*0.5/rs;
            if(ratio>0.05){edges.right=Math.min(1.5,ratio);any=true;}
          }
        }
      }

      // --- TOP EDGE: connection to block above pulling UP ---
      // Only if the block above has weight pressing on me
      if(above>0.01){
        const aboveBlock=grid[r-1]&&grid[r-1][c];
        if(aboveBlock&&!aboveBlock.ground){
          const aboveMat=GRIDS[aboveBlock.m]||CUSTOM;
          const connStrength=Math.min(strength,aboveMat.strength||1);
          const ratio=above/connStrength;
          if(ratio>0.05){edges.top=Math.min(1.5,ratio);any=true;}
        }
      }

      if(any) result[`${r},${c}`]=edges;
    }
  }
  return result;
}

function buildStats(){
  let total=0,ground=0,matCount={};
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const b=grid[r][c];if(!b)continue;total++;
      if(b.ground){ground++;continue;}
      matCount[b.m]=(matCount[b.m]||0)+1;
    }
  }
  const el=document.getElementById('stats');
  let s=`<span>Blocks: <b>${total}</b></span> <span>Ground: <b>${ground}</b></span>`;
  for(let m=1;m<GRIDS.length;m++){
    if(matCount[m]){
      const mat=GRIDS[m];
      s+=`<span style="color:${mat.color}">■</span> ${mat.label}: ${matCount[m]} (w=${mat.weight} s=${mat.strength})`;
    }
  }
  el.innerHTML=s;
}

/* ===== INPUT ===== */
function getCellFromEvent(e){
  const r=cv.getBoundingClientRect();
  const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
  const y=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
  const c=Math.floor(x/cell),row=Math.floor(y/cell);
  if(row>=0&&row<rows&&c>=0&&c<cols) return {r:row,c};
  return null;
}
function placeOrRemove(cl){
  if(!cl)return;
  if(mode==='remove'){
    if(grid[cl.r][cl.c]) grid[cl.r][cl.c]=null;
  } else {
    if(grid[cl.r][cl.c])return;
    if(sel===0) grid[cl.r][cl.c]={m:0,ground:true};
    else grid[cl.r][cl.c]={m:sel,ground:false};
  }
  buildStats();draw();
}
cv.addEventListener('mousedown',e=>{dragging=true;
  const c=getCellFromEvent(e);if(!c)return;
  dragErase=!!grid[c.r][c.c]&&mode==='place';
  if(dragErase){mode='remove';ui_syncMode();}
  placeOrRemove(c);});
cv.addEventListener('mousemove',e=>{if(dragging)placeOrRemove(getCellFromEvent(e));});
cv.addEventListener('mouseup',()=>{if(dragErase){mode='place';ui_syncMode();}dragging=false;});
cv.addEventListener('mouseleave',()=>{if(dragErase){mode='place';ui_syncMode();}dragging=false;});
cv.addEventListener('touchstart',e=>{e.preventDefault();dragging=true;
  const c=getCellFromEvent(e);if(!c)return;
  dragErase=!!grid[c.r][c.c]&&mode==='place';
  if(dragErase){mode='remove';ui_syncMode();}
  placeOrRemove(c);},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();if(dragging)placeOrRemove(getCellFromEvent(e));},{passive:false});
cv.addEventListener('touchend',()=>{if(dragErase){mode='place';ui_syncMode();}dragging=false;});

/* ===== BUTTONS ===== */
function ui_syncMode(){
  document.getElementById('btn-place').classList.toggle('on',mode==='place');
  document.getElementById('btn-remove').classList.toggle('on',mode==='remove');
}
document.getElementById('btn-place').onclick=()=>{mode='place';ui_syncMode();};
document.getElementById('btn-remove').onclick=()=>{mode='remove';ui_syncMode();};
document.getElementById('btn-reset').onclick=()=>{grid=[];simming=false;
  if(simInterval){clearInterval(simInterval);simInterval=null;}
  document.getElementById('btn-sim').classList.remove('on');
  calcGrid();draw();};
document.getElementById('btn-step').onclick=()=>{doStep();draw();};
document.getElementById('btn-sim').onclick=()=>{
  simming=!simming;
  document.getElementById('btn-sim').classList.toggle('on',simming);
  if(simming)simInterval=setInterval(()=>{doStep();draw();},200);
  else if(simInterval){clearInterval(simInterval);simInterval=null;}
};

function doStep(){
  const toRemove=[];
  for(let c=0;c<cols;c++){
    let loadAbove=0;
    for(let r=0;r<rows;r++){
      const b=grid[r][c];if(!b)continue;
      if(b.ground){loadAbove=0;continue;}
      const mat=GRIDS[b.m]||CUSTOM;
      const strength=mat.strength||1;
      const below=grid[r+1]&&grid[r+1][c];
      const supported=below&&(below.ground||(GRIDS[below.m]||CUSTOM).strength>=1);
      if(loadAbove>strength&&!supported) toRemove.push([r,c]);
      loadAbove+=mat.weight||1;
    }
  }
  for(const [r,c] of toRemove) grid[r][c]=null;
  buildStats();
}

function selM(m){sel=m;mode='place';ui_syncMode();
  document.querySelectorAll('.mswatch').forEach((e,i)=>e.classList.toggle('on',i===m));
}
for(let i=0;i<GRIDS.length;i++){
  const el=document.getElementById('sw-'+i);if(!el)continue;
  el.style.background=GRIDS[i].color;el.title=GRIDS[i].label;
  el.onclick=()=>selM(i);
}
document.getElementById('sw-custom').onclick=()=>{
  const w=prompt('Weight:',CUSTOM.weight);if(w===null)return;
  const s=prompt('Strength:',CUSTOM.strength);if(s===null)return;
  const c=prompt('Color:',CUSTOM.color);
  CUSTOM.weight=parseFloat(w)||1;CUSTOM.strength=parseFloat(s)||1;CUSTOM.color=c||CUSTOM.color;
  document.getElementById('sw-custom').style.background=CUSTOM.color;selM(5);
};
selM(1);ui_syncMode();
window.addEventListener('resize',resize);resize();
</script>
</body>
</html>
