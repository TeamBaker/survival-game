<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tension Sandbox</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#151d2b;color:#c8d0dc;font-family:-apple-system,sans-serif;
  display:flex;flex-direction:column;height:100dvh;overflow:hidden;touch-action:none}
.top-bar{display:flex;align-items:center;gap:6px;padding:6px 8px;flex-wrap:wrap}
.mswatch{width:32px;height:32px;border-radius:8px;border:2px solid transparent;cursor:pointer}
.mswatch.on{border-color:#fff}
.mswatch.ground{border:2px dashed #666}
.btn{padding:4px 12px;border:1px solid rgba(255,255,255,.25);background:rgba(20,34,54,.62);
  color:#c8d0dc;border-radius:999px;cursor:pointer;font-size:12px;-webkit-tap-highlight-color:transparent}
.btn.on{background:rgba(102,181,244,.25);border-color:#66b5f4}
.btn.red{border-color:rgba(255,100,80,.5)}
.stats{padding:4px 8px;font-size:11px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
#cv{flex:1;touch-action:none}
</style>
</head>
<body>
<div class="top-bar">
  <div class="mswatch ground" id="sw-ground" title="Ground"></div>
  <div class="mswatch" id="sw-0"></div>
  <div class="mswatch" id="sw-1"></div>
  <div class="mswatch" id="sw-2"></div>
  <div class="mswatch" id="sw-3"></div>
  <div class="mswatch" id="sw-4"></div>
  <div class="mswatch" id="sw-custom" title="Custom"></div>
  <button class="btn" id="btn-place">Place</button>
  <button class="btn" id="btn-remove">Remove</button>
  <button class="btn" id="btn-step">Step</button>
  <button class="btn red" id="btn-sim">Simulate</button>
  <button class="btn red" id="btn-reset">Reset</button>
</div>
<div class="stats" id="stats"></div>
<canvas id="cv"></canvas>
<script>
const GRIDS=[
  {label:'Ground',color:'#444',ground:true},
  {label:'Sand',color:'#c8b464',weight:1.1,strength:0.5},
  {label:'Dirt',color:'#8b6914',weight:1.0,strength:1.0},
  {label:'Rock',color:'#9e9e9e',weight:3.0,strength:7.0},
  {label:'Clay',color:'#cd7f32',weight:1.2,strength:1.2},
  {label:'Iron',color:'#5c7a8a',weight:4.0,strength:5.0},
];
const CUSTOM={label:'Custom',color:'#c080ff',weight:1,strength:1};
const GROUND_COL='#3a3a3a';
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W,H,rows,cols,cell,grid=[],sel=1,mode='place';
let simming=false,simInterval=null,dragging=false,dragErase=false;

function stressColor(r){
  r=Math.min(1,Math.max(0,r));
  if(r<0.5){const t=r*2;return`rgb(${80+175*t|0},${200+55*t|0},${80-80*t|0})`;}
  const t=(r-0.5)*2;return`rgb(255,${255-200*t|0},0)`;
}
function resize(){
  const r=cv.getBoundingClientRect();
  cv.width=r.width*devicePixelRatio;cv.height=r.height*devicePixelRatio;
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  W=r.width;H=r.height;calcGrid();draw();
}
function calcGrid(){
  cell=Math.floor(Math.min(W/20,(H-10)/14));
  if(cell<16)cell=16;
  cols=Math.floor(W/cell);rows=Math.floor(H/cell);
  while(grid.length<rows)grid.push(new Array(cols).fill(null));
  while(grid[0]&&grid[0].length<cols)for(let r=0;r<grid.length;r++)grid[r].push(null);
  for(let c=0;c<cols;c++)if(!grid[rows-1][c])grid[rows-1][c]={m:0,ground:true};
  buildStats();
}

/*
 * ANCHOR MODEL:
 * 1. Ground blocks are anchors — fixed, immovable.
 * 2. Flood-fill from ALL ground blocks through neighbors (up/down/left/right).
 *    Any block reachable = "anchored". No separation tension.
 * 3. Any block NOT reachable = "adrift". Would fall off.
 * 4. Edge tension: only on edges between an anchored block and an adrift block.
 *    The adrift side is pulling away. Color = how hard it's pulling vs strength.
 *
 * For a solid tower on ground: everything is anchored → no tension. ✓
 * For a horizontal beam from ground: everything anchored → no tension. ✓
 * For a floating block: adrift, all edges red. ✓
 * For an overhang: the overhanging part is adrift if no side connection back to anchor. ✓
 */
function computeStress(){
  const R=rows,C=cols;
  const anchored=new Uint8Array(R*C); // 1=anchored
  const queue=[];

  // Seed: all ground blocks
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){
    const b=grid[r];if(!b)continue;const bl=b[c];
    if(bl&&bl.ground){anchored[r*C+c]=1;queue.push(r*C+c);}
  }

  // BFS: spread through neighbors
  const dirs=[[-1,0],[1,0],[0,-1],[0,1]];
  let qi=0;
  while(qi<queue.length){
    const idx=queue[qi++];const r2=idx/C|0,c2=idx%C;
    for(const[dr,dc]of dirs){
      const nr=r2+dr,nc=c2+dc;
      if(nr<0||nr>=R||nc<0||nc>=C)continue;
      const ni=nr*C+nc;if(anchored[ni])continue;
      const bl=grid[nr]&&grid[nr][nc];if(!bl||bl.ground)continue;
      anchored[ni]=1;queue.push(ni);
    }
  }

  // Compute edge tension: only edges between anchored and adrift
  const result={};
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){
    const bl=grid[r]&&grid[r][c];if(!bl||bl.ground)continue;
    const idx=r*C+c;
    if(anchored[idx])continue; // anchored = no tension
    // This block is adrift — all 4 edges connecting to anchored neighbors show tension
    const mat=GRIDS[bl.m]||CUSTOM;const strength=mat.strength||1;
    const edges={};let any=false;
    for(const[dr,dc]of dirs){
      const nr=r+dr,nc=c+dc;
      if(nr<0||nr>=R||nc<0||nc>=C)continue;
      const ni=nr*C+nc;
      if(!anchored[ni])continue; // only anchored neighbors create tension
      const sideName=dr===-1?'top':dr===1?'bottom':dc===-1?'left':'right';
      // Tension = this block's weight / strength (it's falling, pulling on this edge)
      const ratio=mat.weight/strength;
      edges[sideName]=Math.min(1.5,ratio);any=true;
    }
    if(any)result[`${r},${c}`]=edges;
  }
  return{anchored,result};
}

function draw(){
  ctx.clearRect(0,0,W,H);
  // Grid
  ctx.strokeStyle='rgba(255,255,255,0.07)';ctx.lineWidth=1;
  for(let c=0;c<=cols;c++){ctx.beginPath();ctx.moveTo(c*cell+.5,0);ctx.lineTo(c*cell+.5,rows*cell);ctx.stroke();}
  for(let r=0;r<=rows;r++){ctx.beginPath();ctx.moveTo(0,r*cell+.5);ctx.lineTo(cols*cell,r*cell+.5);ctx.stroke();}

  const{anchored,result}=computeStress();

  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const bl=grid[r][c];if(!bl)continue;
    const x=c*cell,y=r*cell,idx=r*cols+c;

    if(bl.ground){
      ctx.fillStyle=GROUND_COL;ctx.fillRect(x,y,cell,cell);
      ctx.strokeStyle='#2a2a2a';ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,cell-1,cell-1);
      continue;
    }

    // Block fill: normal color, or dimmed if adrift
    const mat=GRIDS[bl.m]||CUSTOM;
    if(anchored[idx]){
      ctx.fillStyle=mat.color;
    } else {
      // Adrift: slightly darker/desaturated
      ctx.fillStyle=mat.color;
      ctx.globalAlpha=0.5;
    }
    ctx.fillRect(x+1,y+1,cell-2,cell-2);
    ctx.globalAlpha=1;

    // Edge tension highlights
    const edges=result[`${r},${c}`];
    if(edges){
      const lw=Math.max(2.5,cell*0.15);
      ctx.lineWidth=lw;ctx.lineCap='round';
      if(edges.top!=null){ctx.strokeStyle=stressColor(edges.top);
        ctx.beginPath();ctx.moveTo(x+2,y+2);ctx.lineTo(x+cell-2,y+2);ctx.stroke();}
      if(edges.bottom!=null){ctx.strokeStyle=stressColor(edges.bottom);
        ctx.beginPath();ctx.moveTo(x+2,y+cell-2);ctx.lineTo(x+cell-2,y+cell-2);ctx.stroke();}
      if(edges.left!=null){ctx.strokeStyle=stressColor(edges.left);
        ctx.beginPath();ctx.moveTo(x+2,y+2);ctx.lineTo(x+2,y+cell-2);ctx.stroke();}
      if(edges.right!=null){ctx.strokeStyle=stressColor(edges.right);
        ctx.beginPath();ctx.moveTo(x+cell-2,y+2);ctx.lineTo(x+cell-2,y+cell-2);ctx.stroke();}
    }
  }
}

function buildStats(){
  let total=0,ground=0,matCount={};
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const b=grid[r][c];if(!b)continue;total++;
    if(b.ground){ground++;continue;}matCount[b.m]=(matCount[b.m]||0)+1;
  }
  const el=document.getElementById('stats');
  let s=`<span>Blocks: <b>${total}</b></span> <span>Ground: <b>${ground}</b></span>`;
  for(let m=1;m<GRIDS.length;m++)if(matCount[m]){
    const mat=GRIDS[m];s+=`<span style="color:${mat.color}">■</span> ${mat.label}: ${matCount[m]} (w=${mat.weight} s=${mat.strength})`;
  }
  el.innerHTML=s;
}

/* ===== INPUT ===== */
function getCell(e){
  const r=cv.getBoundingClientRect();
  const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
  const y=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
  const c=Math.floor(x/cell),row=Math.floor(y/cell);
  return(row>=0&&row<rows&&c>=0&&c<cols)?{r:row,c}:null;
}
function placeOrRemove(cl){
  if(!cl)return;
  if(mode==='remove'){if(grid[cl.r][cl.c])grid[cl.r][cl.c]=null;}
  else{if(grid[cl.r][cl.c])return;grid[cl.r][cl.c]=sel===0?{m:0,ground:true}:{m:sel,ground:false};}
  buildStats();draw();
}
cv.addEventListener('mousedown',e=>{dragging=true;const c=getCell(e);if(!c)return;
  dragErase=!!grid[c.r][c.c]&&mode==='place';if(dragErase){mode='remove';ui_syncMode();}placeOrRemove(c);});
cv.addEventListener('mousemove',e=>{if(dragging)placeOrRemove(getCell(e));});
cv.addEventListener('mouseup',()=>{if(dragErase){mode='place';ui_syncMode();}dragging=false;});
cv.addEventListener('mouseleave',()=>{if(dragErase){mode='place';ui_syncMode();}dragging=false;});
cv.addEventListener('touchstart',e=>{e.preventDefault();dragging=true;const c=getCell(e);if(!c)return;
  dragErase=!!grid[c.r][c.c]&&mode==='place';if(dragErase){mode='remove';ui_syncMode();}placeOrRemove(c);},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();if(dragging)placeOrRemove(getCell(e));},{passive:false});
cv.addEventListener('touchend',()=>{if(dragErase){mode='place';ui_syncMode();}dragging=false;});

/* ===== BUTTONS ===== */
function ui_syncMode(){
  document.getElementById('btn-place').classList.toggle('on',mode==='place');
  document.getElementById('btn-remove').classList.toggle('on',mode==='remove');
}
document.getElementById('btn-place').onclick=()=>{mode='place';ui_syncMode();};
document.getElementById('btn-remove').onclick=()=>{mode='remove';ui_syncMode();};
document.getElementById('btn-reset').onclick=()=>{grid=[];simming=false;
  if(simInterval){clearInterval(simInterval);simInterval=null;}
  document.getElementById('btn-sim').classList.remove('on');calcGrid();draw();};
document.getElementById('btn-step').onclick=()=>{doStep();draw();};
document.getElementById('btn-sim').onclick=()=>{
  simming=!simming;document.getElementById('btn-sim').classList.toggle('on',simming);
  if(simming)simInterval=setInterval(()=>{doStep();draw();},200);
  else if(simInterval){clearInterval(simInterval);simInterval=null;}
};

function doStep(){
  // Remove all adrift blocks (blocks not connected to ground)
  const{anchored}=computeStress();
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const bl=grid[r][c];if(!bl||bl.ground)continue;
    if(!anchored[r*cols+c])grid[r][c]=null;
  }
  buildStats();
}

function selM(m){sel=m;mode='place';ui_syncMode();
  document.querySelectorAll('.mswatch').forEach((e,i)=>e.classList.toggle('on',i===m));}
for(let i=0;i<GRIDS.length;i++){
  const el=document.getElementById('sw-'+i);if(!el)continue;
  el.style.background=GRIDS[i].color;el.title=GRIDS[i].label;el.onclick=()=>selM(i);
}
document.getElementById('sw-custom').onclick=()=>{
  const w=prompt('Weight:',CUSTOM.weight);if(w===null)return;
  const s=prompt('Strength:',CUSTOM.strength);if(s===null)return;
  const c=prompt('Color:',CUSTOM.color);
  CUSTOM.weight=parseFloat(w)||1;CUSTOM.strength=parseFloat(s)||1;CUSTOM.color=c||CUSTOM.color;
  document.getElementById('sw-custom').style.background=CUSTOM.color;selM(5);
};
selM(1);ui_syncMode();window.addEventListener('resize',resize);resize();
</script>
</body>
</html>
