<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tension Sandbox</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#151d2b;color:#c8d0dc;font-family:-apple-system,sans-serif;
  display:flex;flex-direction:column;height:100dvh;overflow:hidden;touch-action:none}
.top-bar{display:flex;align-items:center;gap:6px;padding:6px 8px;flex-wrap:wrap}
.mswatch{width:32px;height:32px;border-radius:8px;border:2px solid transparent;cursor:pointer}
.mswatch.on{border-color:#fff}
.mswatch.ground{border:2px dashed #666}
.btn{padding:4px 12px;border:1px solid rgba(255,255,255,.25);background:rgba(20,34,54,.62);
  color:#c8d0dc;border-radius:999px;cursor:pointer;font-size:12px;-webkit-tap-highlight-color:transparent}
.btn.on{background:rgba(102,181,244,.25);border-color:#66b5f4}
.btn.red{border-color:rgba(255,100,80,.5)}
.stats{padding:4px 8px;font-size:11px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
</style>
</head>
<body>
<div class="top-bar">
  <div class="mswatch ground" id="sw-0" title="Ground"></div>
  <div class="mswatch" id="sw-1"></div>
  <div class="mswatch" id="sw-2"></div>
  <div class="mswatch" id="sw-3"></div>
  <div class="mswatch" id="sw-4"></div>
  <div class="mswatch" id="sw-5"></div>
  <div class="mswatch" id="sw-custom" title="Custom"></div>
  <button class="btn" id="btn-place">Place</button>
  <button class="btn" id="btn-remove">Remove</button>
  <button class="btn" id="btn-step">Step</button>
  <button class="btn red" id="btn-sim">Simulate</button>
  <button class="btn red" id="btn-reset">Reset</button>
</div>
<div class="stats" id="stats"></div>
<canvas id="cv" style="width:100%;flex:1;touch-action:none"></canvas>
<script>
const MATERIALS=[
  {name:'Ground',color:'#6a7a6a',weight:0,maxStrength:100,ground:true},
  {name:'Sand',color:'#c8b464',weight:1.1,maxStrength:40},
  {name:'Dirt',color:'#8b6914',weight:1.0,maxStrength:50},
  {name:'Rock',color:'#9e9e9e',weight:3.0,maxStrength:100},
  {name:'Clay',color:'#cd7f32',weight:1.2,maxStrength:30},
  {name:'Iron',color:'#5c7a8a',weight:5.0,maxStrength:120},
];
const CUSTOM={name:'Custom',color:'#c080ff',weight:2.0,maxStrength:60};
const CUSTOM_IDX=MATERIALS.length;
function matOf(idx){return MATERIALS[idx]||CUSTOM;}

const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W,H,rows,cols,cell,grid=[],sel=1,mode='place';
let simming=false,simInterval=null,dragging=false,dragErase=false;

const COLOR_STOPS=[
  [0.0,[70,190,80]],   // green
  [0.3,[230,210,40]],  // yellow
  [0.7,[240,140,30]],  // orange
  [1.5,[220,40,30]],   // red
  [3.0,[255,70,70]],   // bright red
];
function colorScale(v){
  v=Math.max(0,v);
  const lerp=(a,b,t)=>a+(b-a)*t;
  for(let i=0;i<COLOR_STOPS.length-1;i++){
    const[r0,c0]=COLOR_STOPS[i],[r1,c1]=COLOR_STOPS[i+1];
    if(v<=r1||i===COLOR_STOPS.length-2){
      const t=Math.min(1,Math.max(0,(v-r0)/(r1-r0)));
      return`rgb(${lerp(c0[0],c1[0],t)|0},${lerp(c0[1],c1[1],t)|0},${lerp(c0[2],c1[2],t)|0})`;
    }
  }
}
// Maps a maxStress/maxStrength ratio onto the danger color scale:
// 0 stress -> green, stress at the breaking point -> bright red.
function stressColor(stress,maxStrength){
  const ratio=maxStrength>0?Math.min(1,Math.max(0,stress)/maxStrength):0;
  return colorScale(ratio*3);
}

function resize(){
  const par=cv.parentElement;
  const tbar=par.querySelector('.top-bar'),statsEl=par.querySelector('.stats');
  const parR=par.getBoundingClientRect();
  const tH=tbar?tbar.getBoundingClientRect().height:0;
  const sH=statsEl?statsEl.getBoundingClientRect().height:0;
  const cvH=Math.max(100,parR.height-tH-sH);
  cv.style.width=parR.width+'px';cv.style.height=cvH+'px';
  cv.width=parR.width*devicePixelRatio;cv.height=cvH*devicePixelRatio;
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  W=parR.width;H=cvH;calcGrid();draw();
}

function calcGrid(){
  cell=Math.floor(Math.min(W/20,(H-10)/14));
  if(cell<16)cell=16;
  cols=Math.floor(W/cell);rows=Math.floor(H/cell);
  while(grid.length<rows)grid.push(new Array(cols).fill(null));
  if(grid.length>rows)grid.length=rows;
  while(grid[0]&&grid[0].length<cols)for(let r=0;r<grid.length;r++)grid[r].push(null);
  if(grid[0]&&grid[0].length>cols)for(let r=0;r<grid.length;r++)grid[r].length=cols;
  if(!grid[rows-1])grid[rows-1]=new Array(cols).fill(null);
  for(let c=0;c<cols;c++)if(!grid[rows-1][c])grid[rows-1][c]={mat:0};
  recalculate();
  buildStats();
}

/*
 * PER-EDGE OVERHUNG-WEIGHT TENSION MODEL
 *
 * BFS out from the ground to find which blocks are connected. The stress
 * model then looks at every edge between two connected blocks
 * independently: cut that one edge and BFS from the ground again. Whatever
 * stays reachable has another path to the ground, so the edge wasn't load
 * bearing for it. Whatever falls out of reach was depending entirely on
 * that edge — its total weight is "overhung" across the connection, and the
 * edge's stress is that overhung weight divided by the weaker of the two
 * blocks' material strength. A block's displayed stress is the worst edge
 * touching it. This is what lets load spread along an entire beam instead
 * of only showing near the hanging weight: every block between the weight
 * and each pillar has an edge whose cut isolates the weight, so every one
 * of them carries the same overhung weight.
 *
 * Disconnected blocks (nothing BFS-reachable from ground) fall, and any
 * block overloaded past its material's maxStrength breaks — both cascade,
 * so we restart from scratch whenever either happens.
 */
function recalculate(){
  const R=rows,C=cols;
  if(!R||!C)return;
  const bAt=(r,c)=>(r>=0&&r<R&&c>=0&&c<C&&grid[r])?grid[r][c]:null;
  const NB=[[-1,0],[1,0],[0,-1],[0,1]];

  restart:
  while(true){
    for(let r=0;r<R;r++)for(let c=0;c<C;c++){
      const bl=grid[r][c];if(!bl)continue;
      const mat=matOf(bl.mat);
      bl.weight=mat.weight;bl.maxStress=0;
      bl.connected=false;
    }

    // 1. BFS from ground anchors.
    const q=[];
    for(let c=0;c<C;c++){
      const g=bAt(R-1,c);
      if(g&&matOf(g.mat).ground){g.connected=true;q.push([R-1,c]);}
    }
    for(let qi=0;qi<q.length;qi++){
      const[r,c]=q[qi];
      for(const[dr,dc]of NB){
        const nb=bAt(r+dr,c+dc);
        if(nb&&!nb.connected){nb.connected=true;q.push([r+dr,c+dc]);}
      }
    }

    // Anything BFS never reached is floating debris — drop it and restart.
    let collapsed=false;
    for(let r=0;r<R;r++)for(let c=0;c<C;c++){
      const bl=bAt(r,c);
      if(bl&&!matOf(bl.mat).ground&&!bl.connected){grid[r][c]=null;collapsed=true;}
    }
    if(collapsed)continue restart;

    const order=[];
    for(let r=0;r<R;r++)for(let c=0;c<C;c++){
      const bl=bAt(r,c);
      if(bl&&!matOf(bl.mat).ground)order.push([r,c]);
    }

    // 2. Per-edge overhung weight: for every edge between two connected
    // blocks, cut it and re-BFS from the ground. Anything that falls out of
    // reach was hanging entirely off that edge, so its summed weight becomes
    // the leverage on that connection.
    const edgeKey=(r,c,r2,c2)=>(r<r2||(r===r2&&c<c2))?`${r},${c}-${r2},${c2}`:`${r2},${c2}-${r},${c}`;
    const edgeStress=new Map();
    for(const[r,c]of order){
      const me=bAt(r,c),matMe=matOf(me.mat);
      for(const[dr,dc]of NB){
        const nr=r+dr,nc=c+dc,nb=bAt(nr,nc);
        if(!nb||!nb.connected)continue;
        const ek=edgeKey(r,c,nr,nc);
        if(edgeStress.has(ek)){
          const s=edgeStress.get(ek);
          if(s>me.maxStress)me.maxStress=s;
          continue;
        }

        // BFS from every ground anchor, skipping just this one edge.
        const reach=new Set();
        const gq=[];
        for(let cc=0;cc<C;cc++){
          const g=bAt(R-1,cc);
          if(g&&matOf(g.mat).ground){const gk=(R-1)+','+cc;reach.add(gk);gq.push([R-1,cc]);}
        }
        for(let qi=0;qi<gq.length;qi++){
          const[qr,qc]=gq[qi];
          for(const[ddr,ddc]of NB){
            const tr=qr+ddr,tc=qc+ddc;
            if(edgeKey(qr,qc,tr,tc)===ek)continue;
            const tb=bAt(tr,tc);
            if(!tb||!tb.connected)continue;
            const tk=tr+','+tc;
            if(reach.has(tk))continue;
            reach.add(tk);gq.push([tr,tc]);
          }
        }

        // Cutting one edge can only strand one side (a bridge splits a
        // connected graph in two; a redundant edge strands nobody), so
        // summing every still-connected block that fell out of reach gives
        // exactly the weight hanging off this edge.
        let overhung=0;
        if(!reach.has(r+','+c)||!reach.has(nr+','+nc)){
          for(const[or,oc]of order){
            if(!reach.has(or+','+oc))overhung+=bAt(or,oc).weight;
          }
        }

        const connStrength=Math.min(matMe.maxStrength,matOf(nb.mat).maxStrength);
        const stress=connStrength>0?overhung/connStrength:0;
        edgeStress.set(ek,stress);
        if(stress>me.maxStress)me.maxStress=stress;
        if(stress>nb.maxStress)nb.maxStress=stress;
      }
    }

    // 3. Break anything overloaded past its own material, then restart.
    let broke=false;
    for(const[r,c]of order){
      const me=bAt(r,c);
      if(me.maxStress>matOf(me.mat).maxStrength){grid[r][c]=null;broke=true;}
    }
    if(broke)continue restart;

    break;
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,0.07)';ctx.lineWidth=1;
  for(let c=0;c<=cols;c++){ctx.beginPath();ctx.moveTo(c*cell+.5,0);ctx.lineTo(c*cell+.5,rows*cell);ctx.stroke();}
  for(let r=0;r<=rows;r++){ctx.beginPath();ctx.moveTo(0,r*cell+.5);ctx.lineTo(cols*cell,r*cell+.5);ctx.stroke();}

  const edgeW=Math.max(2.5,cell*0.15);
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const bl=grid[r][c]; if(!bl) continue;
    const mat=matOf(bl.mat);
    const x=c*cell,y=r*cell;
    if(mat.ground){
      ctx.fillStyle=mat.color;ctx.fillRect(x,y,cell,cell);
      ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,cell-1,cell-1);
      continue;
    }
    ctx.fillStyle=mat.color;ctx.fillRect(x+1,y+1,cell-2,cell-2);
    ctx.lineWidth=edgeW;ctx.strokeStyle=stressColor(bl.maxStress,mat.maxStrength);
    ctx.strokeRect(x+edgeW/2,y+edgeW/2,cell-edgeW,cell-edgeW);
  }
}

function buildStats(){
  let total=0,ground=0,matCount={};
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const b=grid[r][c];if(!b)continue;total++;
    const mat=matOf(b.mat);
    if(mat.ground){ground++;continue;}matCount[b.mat]=(matCount[b.mat]||0)+1;
  }
  document.getElementById('stats').innerHTML=
    `<span>Blocks: <b>${total}</b></span> <span>Ground: <b>${ground}</b></span>`+
    Object.entries(matCount).map(([m,n])=>{
      const mat=matOf(m);return`<span style=\"color:${mat.color}\">■</span> ${mat.name}: ${n}`;
    }).join(' ');
}

/* ===== INPUT ===== */
function getCell(e){
  const r=cv.getBoundingClientRect();
  const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
  const y=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
  const c=Math.floor(x/cell),row=Math.floor(y/cell);
  return(row>=0&&row<rows&&c>=0&&c<cols)?{r:row,c}:null;
}
function placeOrRemove(cl){
  if(!cl)return;
  if(mode==='remove'){if(grid[cl.r][cl.c])grid[cl.r][cl.c]=null;}
  else{if(grid[cl.r][cl.c])return;grid[cl.r][cl.c]={mat:sel};}
  recalculate();buildStats();draw();
}
cv.addEventListener('mousedown',e=>{dragging=true;const c=getCell(e);if(!c)return;
  dragErase=!!grid[c.r][c.c]&&mode==='place';if(dragErase){mode='remove';ui_syncMode();}placeOrRemove(c);});
cv.addEventListener('mousemove',e=>{if(dragging)placeOrRemove(getCell(e));});
cv.addEventListener('mouseup',()=>{if(dragErase){mode='place';ui_syncMode();}dragging=false;});
cv.addEventListener('mouseleave',()=>{if(dragErase){mode='place';ui_syncMode();}dragging=false;});
cv.addEventListener('touchstart',e=>{e.preventDefault();dragging=true;const c=getCell(e);if(!c)return;
  dragErase=!!grid[c.r][c.c]&&mode==='place';if(dragErase){mode='remove';ui_syncMode();}placeOrRemove(c);},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();if(dragging)placeOrRemove(getCell(e));},{passive:false});
cv.addEventListener('touchend',()=>{if(dragErase){mode='place';ui_syncMode();}dragging=false;});

/* ===== BUTTONS ===== */
function ui_syncMode(){
  document.getElementById('btn-place').classList.toggle('on',mode==='place');
  document.getElementById('btn-remove').classList.toggle('on',mode==='remove');
}
document.getElementById('btn-place').onclick=()=>{mode='place';ui_syncMode();};
document.getElementById('btn-remove').onclick=()=>{mode='remove';ui_syncMode();};
document.getElementById('btn-reset').onclick=()=>{grid=[];simming=false;
  if(simInterval){clearInterval(simInterval);simInterval=null;}
  document.getElementById('btn-sim').classList.remove('on');calcGrid();draw();};
document.getElementById('btn-step').onclick=()=>{recalculate();buildStats();draw();};
document.getElementById('btn-sim').onclick=()=>{
  simming=!simming;document.getElementById('btn-sim').classList.toggle('on',simming);
  if(simming)simInterval=setInterval(()=>{recalculate();buildStats();draw();},200);
  else if(simInterval){clearInterval(simInterval);simInterval=null;}
};

function selM(m){sel=m;mode='place';ui_syncMode();
  document.querySelectorAll('.mswatch').forEach((e,i)=>e.classList.toggle('on',i===m));}
for(let i=0;i<MATERIALS.length;i++){
  const el=document.getElementById('sw-'+i);if(!el)continue;
  el.style.background=MATERIALS[i].color;el.title=MATERIALS[i].name;el.onclick=()=>selM(i);
}
document.getElementById('sw-custom').onclick=()=>{
  const s=prompt('Max strength:',CUSTOM.maxStrength);if(s===null)return;
  const c=prompt('Color:',CUSTOM.color);
  CUSTOM.maxStrength=parseFloat(s)||1;CUSTOM.color=c||CUSTOM.color;
  document.getElementById('sw-custom').style.background=CUSTOM.color;selM(CUSTOM_IDX);
};
selM(1);ui_syncMode();window.addEventListener('resize',resize);resize();
</script>
</body>
</html>
